# XcodeGen spec - the single source of truth for the native iOS project.
# Regenerate the .xcodeproj at any time with: xcodegen generate

name: Thingtime

options:
  bundleIdPrefix: com.thingtime
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "15"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Distribution"

configFiles:
  Debug: config/Debug.xcconfig
  Release: config/Release.xcconfig

targets:
  Thingtime:
    type: application
    platform: iOS
    sources:
      - path: Thingtime
      - path: Shared
    info:
      path: Thingtime/Resources/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ThingtimeWebURL: $(THINGTIME_WEB_URL)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Thingtime uses the camera so you can take photos and videos to share.
        NSMicrophoneUsageDescription: Thingtime uses the microphone when you record a video to share.
        NSPhotoLibraryUsageDescription: Thingtime uses your photo library so you can choose photos and videos to share.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_IOS_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Thingtime/Resources/Thingtime.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    dependencies:
      - target: ThingtimeWatch
        embed: true
        codeSign: true
        copy:
          destination: plugins

  ThingtimeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ThingtimeWatch
      - path: Shared
      - path: Thingtime/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: ThingtimeWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(THINGTIME_IOS_BUNDLE_IDENTIFIER)
    entitlements:
      path: ThingtimeWatch/Resources/ThingtimeWatch.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_WATCH_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
        SUPPORTS_MACCATALYST: false
    dependencies: []

  ThingtimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThingtimeTests
    dependencies:
      - target: Thingtime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Thingtime:
    build:
      targets:
        Thingtime: all
        ThingtimeWatch: all
        ThingtimeTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ThingtimeTests
    run:
      config: Debug
    archive:
      config: Release

  ThingtimeWatch:
    build:
      targets:
        ThingtimeWatch: all
    run:
      config: Debug
    archive:
      config: Release
