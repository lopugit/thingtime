# XcodeGen spec - the single source of truth for the native iOS project.
# Regenerate the .xcodeproj at any time with: xcodegen generate

name: Thingtime

options:
  bundleIdPrefix: com.thingtime
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ThingtimePasswordCore:
    path: ../apple/Passwords
  AppleFileSync:
    path: ../apple/FileSync

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "33"
    SWIFT_VERSION: "5.9"
    THINGTIME_PASSWORD_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.thingtime.passwords
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Distribution"

configFiles:
  Debug: config/Debug.xcconfig
  Release: config/Release.xcconfig

targets:
  Thingtime:
    type: application
    platform: iOS
    sources:
      - path: Thingtime
      - path: ../apple/Passwords/Host/AuthenticatorSetupBridge.swift
      - path: ShareSupport
      - path: ../apple/Shared
      - path: ../apple/Widgets
      - path: Shared
    info:
      path: Thingtime/Resources/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ThingtimeWidgetGroup: $(THINGTIME_WIDGET_GROUP)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [thingtime]
          - CFBundleURLName: com.thingtime.authenticator
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [otpauth]
        ThingtimeWebURL: $(THINGTIME_WEB_URL)
        ThingtimePasswordKeychainGroup: $(THINGTIME_PASSWORD_KEYCHAIN_GROUP)
        NSFaceIDUsageDescription: Thingtime verifies you before filling saved passwords or using a passkey.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Thingtime uses the camera so you can take photos and videos to share.
        NSMicrophoneUsageDescription: Thingtime uses the microphone for Lopu voice conversations and when you record a video to share.
        NSSpeechRecognitionUsageDescription: Thingtime transcribes your speech so Lopu can respond or save private transcription pages.
        NSPhotoLibraryUsageDescription: Thingtime uses your photo library so you can choose photos and videos to share or back up original files with their embedded metadata.
        UILaunchScreen: {}
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).file-upload
        UIBackgroundModes:
          - audio
          - processing
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_IOS_BUNDLE_IDENTIFIER)
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_IOS_PROVISIONING_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ShareSupport/ShareItemProviderBridge.h
    entitlements:
      path: Thingtime/Resources/Thingtime.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups: [$(THINGTIME_PASSWORD_KEYCHAIN_GROUP)]
        com.apple.security.application-groups: [$(THINGTIME_WIDGET_GROUP)]
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.associated-domains:
          - webcredentials:thingtime.com
    dependencies:
      - package: ThingtimePasswordCore
      - target: ThingtimePasswordProvider
      - package: AppleFileSync
      - target: ThingtimeWatch
        embed: true
        codeSign: true
      - target: ThingtimeLopuWidget
      - target: ThingtimeShare
        embed: true
        codeSign: true

  ThingtimePasswordProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: ../apple/PasswordProvider/CredentialProviderViewController.swift
    dependencies:
      - package: ThingtimePasswordCore
    info:
      path: PasswordProvider/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        ThingtimePasswordKeychainGroup: $(THINGTIME_PASSWORD_KEYCHAIN_GROUP)
        NSFaceIDUsageDescription: Thingtime verifies you before filling saved passwords or using a passkey.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
    entitlements:
      path: PasswordProvider/PasswordProvider.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups: [$(THINGTIME_PASSWORD_KEYCHAIN_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_IOS_BUNDLE_IDENTIFIER).password-provider
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_PASSWORD_PROVIDER_PROVISIONING_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  ThingtimeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ThingtimeWatch
      - path: Shared
        excludes:
          - LopuVoiceActivityAttributes.swift
          - LopuChatActivityAttributes.swift
      - path: Thingtime/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: ThingtimeWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ThingtimeWebURL: $(THINGTIME_WEB_URL)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(THINGTIME_IOS_BUNDLE_IDENTIFIER)
        NSMicrophoneUsageDescription: Thingtime uses the microphone so you can record audio as a private Thing.
    entitlements:
      path: ThingtimeWatch/Resources/ThingtimeWatch.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_WATCH_BUNDLE_IDENTIFIER)
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_WATCH_PROVISIONING_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
    dependencies: []

  ThingtimeLopuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../apple/Shared
      - path: ../apple/Widgets
      - path: LopuVoiceWidget
      - path: Shared
    info:
      path: LopuVoiceWidget/Info.plist
      properties:
        ThingtimeWidgetGroup: $(THINGTIME_WIDGET_GROUP)
        CFBundleDisplayName: Thingtime Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LopuVoiceWidget/ThingtimeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(THINGTIME_WIDGET_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_IOS_BUNDLE_IDENTIFIER).lopu-widget
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_LOPU_WIDGET_PROVISIONING_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true

  ThingtimeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: ShareSupport
      - path: Thingtime/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Thingtime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ThingtimeWidgetGroup: $(THINGTIME_WIDGET_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, $item.attachments.@count > 0 OR $item.attributedContentText.length > 0).@count > 0'
    entitlements:
      path: ShareExtension/ThingtimeShare.entitlements
      properties:
        com.apple.security.application-groups: [$(THINGTIME_WIDGET_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_IOS_BUNDLE_IDENTIFIER).share
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_SHARE_PROVISIONING_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ShareSupport/ShareItemProviderBridge.h

  ThingtimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThingtimeTests
      - path: ../apple/FileSync/Tests/AppleFileSyncTests
      - path: ../apple/FileSync/Tests/RecoverySupport
    dependencies:
      - target: Thingtime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Thingtime:
    build:
      targets:
        Thingtime: all
        ThingtimeWatch: all
        ThingtimeTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ThingtimeTests
    run:
      config: Debug
    archive:
      config: Release

  ThingtimeWatch:
    build:
      targets:
        ThingtimeWatch: all
    run:
      config: Debug
    archive:
      config: Release
