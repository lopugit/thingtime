# Cloudflare API Worker. See README.md and PLAN/cloudflare-workers-migration.md.
# Reached only through the router's service binding (no public route).
name = "thingtime-api"
main = "src/index.ts"
# Keep at or below the runtime bundled with the pinned wrangler so `wrangler dev` matches production.
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]
account_id = "c4c10efa6c608143e219a875305aa82c"
workers_dev = false

[vars]
API_WORKER_VERSION = "1.0.0"
# MongoDB connection-pool shards (Durable Objects). Total connections are about
# shards × (pool size + monitoring sockets), independent of traffic.
POOL_SHARDS = "2"

# Secrets (wrangler secret put): MONGODB_CONNECTION_STRING, MONGO_PASS.

[[durable_objects.bindings]]
name = "MONGO_POOL"
class_name = "MongoPoolShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoPoolShard"]

[observability]
enabled = true
head_sampling_rate = 0.1
