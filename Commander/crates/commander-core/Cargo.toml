[package]
name = "commander-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic cross-platform search core for Thingtime Commander"
license = "ISC"
publish = false

[lib]
name = "commander_core"
path = "src/lib.rs"

[[bin]]
name = "commander-search"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
