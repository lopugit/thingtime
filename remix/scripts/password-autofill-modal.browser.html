<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[LC] Autofill modal regression</title>
<style>body{font:16px system-ui;margin:24px;background:#f8f6fc;color:#322846}button,input{font:inherit;padding:10px}dialog{width:min(420px,calc(100vw - 64px));border:1px solid #d9d0ef;border-radius:16px;transform:translateY(8px);overflow:auto}dialog::backdrop{background:#221e3566}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%}output{display:block;margin:12px 0}#fixture-result{white-space:pre-wrap}</style>
<h1>Autofill modal regression</h1><p>Disposable browser-only fixture. No network credential operations or saved accounts.</p>
<button id="open">Open verification modal</button><label><input type="checkbox" id="stale"> Simulate an extension reload</label>
<dialog aria-modal="true" aria-labelledby="title"><h2 id="title">Verify synthetic account</h2><form><label>Current password<input name="password" type="password" autocomplete="current-password"></label><button type="submit">Verify fixture</button><button type="button" id="close">Close modal</button></form><output id="fixture-result">Open the modal, then choose a Thingtime account.</output></dialog>
<script>
const modal=document.querySelector('dialog'),result=document.getElementById('fixture-result');
document.getElementById('open').onclick=()=>modal.showModal();document.getElementById('close').onclick=()=>modal.close();
document.querySelector('form').onsubmit=e=>{e.preventDefault();result.textContent='FAIL: The extension must never submit the form.';};
window.chrome={runtime:{getURL:()=>window.fixtureIcon,onMessage:{addListener(){}},sendMessage:async m=>{if(m.action==='state')return{autofillEnabled:true};if(m.action==='vault-cached'){if(document.getElementById('stale').checked)throw Error('Extension context invalidated.');return{ok:true,catalog:[{id:'synthetic',title:'Synthetic account',username:'fixture@example.test',hasPassword:true,domains:[location.hostname]}]};}if(m.action==='vault-fill')return{ok:true};return{ok:true};}},storage:{onChanged:{addListener(){}}}};
let watched=null;
function report(){const host=document.querySelector('[data-thingtime-autofill]');if(host?.shadowRoot&&watched!==host){watched=host;new MutationObserver(report).observe(host.shadowRoot,{subtree:true,childList:true,characterData:true});}const panel=host?.shadowRoot.querySelector('[role=dialog]');if(!panel)return;const box=panel.getBoundingClientRect();const text=JSON.stringify({insideActiveModal:modal.contains(host),viewportAligned:Math.abs(box.top-60)<2,noHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth,chooserText:panel.textContent},null,2);if(result.textContent!==text)result.textContent=text;}
new MutationObserver(report).observe(document.documentElement,{subtree:true,childList:true});
</script><script type="module">import source from "../../browser-extension/content-vault.js?raw";import icon from "../../browser-extension/thingtime-icon-32.png?inline";window.fixtureIcon=icon;const script=document.createElement("script");script.textContent=source;document.body.append(script);</script></html>
