<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs;
    since iOS 10 Safari ignores the cap for user pinch-zoom, so accessibility
    zooming still works -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>Thingtime - Your Home for Everything</title>
    <!-- Feed-reader auto-discovery for the public posts Atom feed
         (GET /api/v1/things/rss — app/api/utils/things/rss.ts). Deliberately
         OUTSIDE the tt-social-meta marker block below: that block is swapped
         per-request and this link must survive on every page. -->
    <link rel="alternate" type="application/atom+xml" title="Thingtime — public posts" href="/api/v1/things/rss" />
    <!-- tt-social-meta:start — static site-wide defaults. The Nitro page
         catch-all (server/routes/[...].ts) swaps this whole block per-request
         with page-specific Open Graph / Twitter tags and absolute URLs
         (app/api/utils/meta/socialMeta.ts). -->
    <meta
      name="description"
      content="Thingtime is where everything is a thing — share posts, run polls, and build a home for the things you care about."
    />
    <meta property="og:site_name" content="Thingtime" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thingtime - Your Home for Everything" />
    <meta
      property="og:description"
      content="Thingtime is where everything is a thing — share posts, run polls, and build a home for the things you care about."
    />
    <meta property="og:image" content="/branding/presskit/thingtime-og-card-1200x630.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thingtime - Your Home for Everything" />
    <meta name="twitter:image" content="/branding/presskit/thingtime-og-card-1200x630.png" />
    <!-- tt-social-meta:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Early boot (theme snapshot, tab title and guarded module recovery). External file
         so the CSP can stay `script-src 'self'` with no inline-script hashes. -->
    <script src="/tt-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/entry.client.tsx"></script>
  </body>
</html>
