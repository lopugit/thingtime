<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs;
    since iOS 10 Safari ignores the cap for user pinch-zoom, so accessibility
    zooming still works -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>Thingtime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-paint theme snapshot: apply the last computed --tt-* variables
      // before React loads so custom themes never flash the defaults.
      (() => {
        try {
          const raw = window.localStorage.getItem('tt-theme-vars');
          if (!raw) return;
          const vars = JSON.parse(raw);
          if (!vars || typeof vars !== 'object') return;
          for (const key in vars) {
            if (/^--tt-[\w-]+$/.test(key) && typeof vars[key] === 'string') {
              document.documentElement.style.setProperty(key, vars[key]);
            }
          }
        } catch (error) {
          // ignore — defaults from the stylesheet apply
        }
      })();
    </script>
    <script>
      (() => {
        const host = window.location.hostname;
        const prefix = host === 'localhost' || host === '127.0.0.1'
          ? '[LC]'
          : host.endsWith('.vercel.app')
            ? '[VC]'
            : host.endsWith('.ts.net')
              ? '[TS]'
              : '';

        if (prefix) {
          document.title = `${prefix} Thingtime`;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/entry.client.tsx"></script>
  </body>
</html>
