<svg width="1920" height="1080"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(-45, 0.5, 0.5)">
      <stop offset="0%" stop-color="rgba(0, 190, 0, 0.5)"></stop>
      <stop offset="70%" stop-color="rgba(0, 190, 0, 0.5)"></stop>
      <stop offset="100%" stop-color="rgba(0, 190, 0, 1)"></stop>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#lg)"></rect>
</svg>
