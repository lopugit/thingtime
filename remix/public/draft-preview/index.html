<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Thingtime draft preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#302b29;font:16px system-ui,sans-serif}#editor{max-width:920px;margin:32px auto;padding:0 24px}h1{font-size:24px}textarea{display:block;width:100%;min-height:220px;margin:12px 0;font:13px monospace}button,input{font:inherit;padding:8px;margin:6px 8px 6px 0}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}#native-preview{padding:24px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}body[data-capture] #editor{display:none}
</style></head><body><section id="editor"><h1>Draft preview</h1><p>Paste a portable Thing or Thingtime transfer. Edit, render and export without an account. This draft lives only in this tab; download it before closing.</p><label for="content">Thing / transfer JSON</label><textarea id="content" maxlength="262144" spellcheck="false"></textarea><label for="root-ref">Root reference (optional)</label><input id="root-ref" maxlength="200"><div><button id="render">Render draft</button><button id="export">Download JSON</button></div><p>Text and CSS only. Include component dependencies in your bundle. Actions, account data and external assets are unavailable.</p><output id="diagnostics" aria-live="polite"></output></section><main id="preview-mount"></main><script src="./runner.js"></script></body></html>
