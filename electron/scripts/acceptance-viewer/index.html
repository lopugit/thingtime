<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Thingtime isolated acceptance viewer</title><link rel="stylesheet" href="viewer.css"><script defer src="viewer.js"></script></head>
<body><main><header><h1>Isolated test browser</h1><p>Only http://127.0.0.1:28671 · existing task container</p></header>
<p>Click a field in the live frame, enter text below, then choose Type into selected field. Credentials remain masked; the input clears on submission.</p>
<div class="row"><label for="url">Test page</label><input id="url" type="url" value="http://127.0.0.1:28671/register"><button id="go">Go</button><button id="refresh">Refresh frame</button></div>
<p id="current">Connecting to bound tab…</p>
<div class="row"><label for="text">Text or test password</label><input id="text" type="password" autocomplete="off" spellcheck="false"><button id="type">Type into selected field</button></div>
<div class="row"><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button data-key="Backspace">Backspace</button><button data-key="Control+A">Select all</button><button data-key="Escape">Escape</button><button id="up">Scroll up</button><button id="down">Scroll down</button><button id="mobile">Mobile</button><button id="desktop">Desktop</button></div>
<p id="status" role="status" aria-live="assertive" aria-atomic="true"></p>
<div class="frame"><img id="frame" alt="Current frame of the isolated task browser" tabindex="0" hidden></div>
</main></body></html>
