    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

        s.textContent = await r.text();
        s.removeAttribute('src');
      }

      old.replaceWith(s);

    // which fired before we swapped the document. Trigger manually if present.

      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

:0;z-index:9000;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px clamp(16px,4vw,40px);background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #f0f0f2\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:1.6px;padding:6px;background:#fff;border:1px solid #ececef;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)\">\n        <i style=\"border-radius:1.5px;background:transparent\"><\u002Fi><i style=\"border-radius:1.5px;background:#47b5e6\"><\u002Fi><i style=\"border-radius:1.5px;background:transparent\"><\u002Fi>\n        <i style=\"border-radius:1.5px;background:#58ca70\"><\u002Fi><i style=\"border-radius:1.5px;background:#ffbc48\"><\u002Fi><i style=\"border-radius:1.5px;background:#a555e8\"><\u002Fi>\n        <i style=\"border-radius:1.5px;background:transparent\"><\u002Fi><i style=\"border-radius:1.5px;background:#f34a4a\"><\u002Fi><i style=\"border-radius:1.5px;background:transparent\"><\u002Fi>\n      <\u002Fspan>\n      <span style=\"font:600 18px 'Space Grotesk',sans-serif;letter-spacing:-.02em\">thingtime<\u002Fspan>\n    <\u002Fa>\n\n    <button type=\"button\" onclick=\"{{ openCmd }}\" aria-label=\"Open command palette\" style=\"flex:1;max-width:300px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f5f5f7;border:1px solid #ececef;border-radius:10px;cursor:text;color:#9a9aa6;font-size:14px;transition:all 140ms ease\">\n      <span style=\"font-size:13px\">🔍<\u002Fspan>\n      <span style=\"font-family:'Hanken Grotesk',sans-serif\">Imagine…<\u002Fspan>\n      <span style=\"margin-left:auto;font:600 11px 'JetBrains Mono',monospace;color:#b6b6c0;background:#fff;border:1px solid #ececef;border-radius:6px;padding:2px 6px\">⌘P<\u002Fspan>\n    <\u002Fbutton>\n\n    <div style=\"display:flex;align-items:center;gap:clamp(10px,2vw,22px)\">\n      <a href=\"#developers\" style=\"font-size:13.5px;font-weight:500;color:#5a5a66;display:none\">Developers<\u002Fa>\n      <a href=\"#back\" style=\"display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600\">Login <span style=\"font-size:13px\">🌈<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px clamp(20px,5vw,40px) 60px\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid #ececef;border-radius:999px;background:#fff;font:500 12.5px 'JetBrains Mono',monospace;color:#6b6b76;margin-bottom:34px;box-shadow:0 1px 2px rgba(0,0,0,.04)\">\n      <span style=\"width:7px;height:7px;border-radius:999px;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70)\"><\u002Fspan>\n      a GUI for the internet\n    <\u002Fdiv>\n\n    <div style=\"min-height:1.02em;display:flex;align-items:center;justify-content:center;margin-bottom:6px\">\n      <span style=\"font:700 clamp(46px,9.2vw,128px) 'Space Grotesk',sans-serif;letter-spacing:-.035em;line-height:.95;background:linear-gradient(90deg,#f34a4a,#ffbc48,#58ca70,#47b5e6,#a555e8,#f34a4a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:tt-pan 7s linear infinite\">{{ heroWord }}<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font:600 clamp(22px,3.2vw,40px) 'Space Grotesk',sans-serif;letter-spacing:-.02em;color:#16161a\">A home for everything, in any shape.<\u002Fh1>\n\n    <p style=\"max-width:640px;margin:22px auto 0;font-size:clamp(16px,1.7vw,19px);line-height:1.6;color:#5a5a66\">\n      Store, shape, and share any data on Earth — notes, records, listings, whole apps — and let people and machines use it equally. Your data, your schema, yours to share. <strong style=\"color:#16161a;font-weight:600\">That's freedom.<\u002Fstrong>\n    <\u002Fp>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px\">\n      <button type=\"button\" onclick=\"{{ scrollToDemo }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border:none;border-radius:11px;background:#16161a;color:#fff;font:600 15px 'Space Grotesk',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.16)\">Try the live demo ↓<\u002Fbutton>\n      <button type=\"button\" onclick=\"{{ openCmd }}\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border:1px solid #e2e2e6;border-radius:11px;background:#fff;color:#16161a;font:600 15px 'Space Grotesk',sans-serif;cursor:pointer\">Imagine anything <span style=\"font:600 11px 'JetBrains Mono',monospace;color:#9a9aa6;background:#f5f5f7;border-radius:5px;padding:2px 6px\">⌘P<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:74px;font-size:22px;color:#c8c8d0;animation:tt-bob 2.4s ease-in-out infinite\">↓<\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tt-demo\" data-screen-label=\"Live demo\" style=\"background:#fafafb;border-top:1px solid #f0f0f2;border-bottom:1px solid #f0f0f2;padding:clamp(56px,8vw,104px) clamp(16px,5vw,40px)\">\n    <div style=\"max-width:1080px;margin:0 auto\">\n      <div style=\"text-align:center;margin-bottom:38px\">\n        <div style=\"font:600 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#9a9aa6;margin-bottom:14px\">LIVE · NOT A SCREENSHOT<\u002Fdiv>\n        <h2 style=\"margin:0;font:600 clamp(28px,4vw,46px) 'Space Grotesk',sans-serif;letter-spacing:-.025em\">This is Thingtime.<\u002Fh2>\n        <p style=\"max-width:560px;margin:16px auto 0;font-size:16px;line-height:1.6;color:#5a5a66\">Every value is editable, addressable, and shareable. Switch the schema, hit <span style=\"font:600 12px 'JetBrains Mono',monospace;background:#fff;border:1px solid #ececef;border-radius:5px;padding:1px 6px\">🎨 Edit<\u002Fspan>, or press <span style=\"font:600 12px 'JetBrains Mono',monospace;background:#fff;border:1px solid #ececef;border-radius:5px;padding:1px 6px\">⌘P<\u002Fspan> to imagine.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"max-width:780px;margin:0 auto;background:#fff;border:1px solid #ececef;border-radius:20px;box-shadow:0 24px 60px -28px rgba(20,20,40,.28);overflow:hidden\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f1f1f3;background:#fcfcfd\">\n          <div style=\"display:inline-flex;gap:4px;padding:4px;background:#f1f1f3;border-radius:11px\">\n            <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button type=\"button\" onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><span>{{ t.emoji }}<\u002Fspan><span>{{ t.label }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:inline-flex;gap:4px;padding:4px;background:#f1f1f3;border-radius:11px\">\n            <button type=\"button\" onclick=\"{{ setReader }}\" title=\"Reader view — just words and nesting\" style=\"{{ readerBtnStyle }}\">Aa<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ setDev }}\" title=\"Developer view — types and machinery\" style=\"{{ devBtnStyle }}\">{ }<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-left:auto\">\n            <button type=\"button\" onclick=\"{{ toggleEdit }}\" style=\"{{ editBtnStyle }}\">{{ editBtnLabel }}<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ expandAll }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #ececef;border-radius:9px;background:#fff;color:#5a5a66;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer\">Expand<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ collapseAll }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #ececef;border-radius:9px;background:#fff;color:#5a5a66;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer\">Collapse<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ share }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #ececef;border-radius:9px;background:#fff;color:#5a5a66;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer\">🔗 Share<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:18px clamp(14px,3vw,26px) 24px;min-height:340px\">\n          {{ treeEl }}\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 18px;border-top:1px solid #f1f1f3;background:#fcfcfd;font-size:12.5px;color:#9a9aa6\">\n          <span>Hover a value for ✨ options · Aa / { } switch views<\u002Fspan><span style=\"color:#dcdce2\">·<\u002Fspan><span>{{ thingMeta }}<\u002Fspan>\n          <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#58ca70;font-weight:600\">● <span style=\"color:#9a9aa6;font-weight:500\">synced to your space<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Big idea\" style=\"padding:clamp(64px,9vw,120px) clamp(20px,5vw,40px);max-width:1080px;margin:0 auto\">\n    <div style=\"font:600 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#9a9aa6;margin-bottom:16px\">THE BIG IDEA<\u002Fdiv>\n    <h2 style=\"margin:0;max-width:760px;font:600 clamp(30px,4.6vw,54px) 'Space Grotesk',sans-serif;letter-spacing:-.03em;line-height:1.04\">One GUI for everything.<\u002Fh2>\n    <p style=\"max-width:620px;margin:22px 0 0;font-size:18px;line-height:1.6;color:#5a5a66\">Social feeds, spreadsheets, notes, listings — they're all just data wearing different clothes. Thingtime gives every kind of data one home you fully control.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:50px\">\n      <div style=\"padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff\">\n        <div style=\"font-size:30px;margin-bottom:16px\">📦<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">Any shape<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#6b6b76\">Objects, lists, numbers, switches, even whole layouts. If you can imagine it, you can store it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff\">\n        <div style=\"font-size:30px;margin-bottom:16px\">🎨<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">Your schema<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#6b6b76\">No fixed forms. Bend any record into the shape that fits your life — not someone else's product.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff\">\n        <div style=\"font-size:30px;margin-bottom:16px\">🌍<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">Shareable by a path<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#6b6b76\">Every value has an address — ready for people and machines to read, borrow, and build on.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:48px;padding:34px clamp(24px,4vw,48px);border-radius:20px;background:#fafafb;border:1px solid #f0f0f2;text-align:center\">\n      <p style=\"margin:0;font:600 clamp(20px,2.8vw,30px) 'Space Grotesk',sans-serif;letter-spacing:-.02em;line-height:1.3\">Your data, your shape, yours to share.<br><span style=\"background:linear-gradient(90deg,#f34a4a,#ffbc48,#58ca70,#47b5e6,#a555e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">That's freedom.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Use cases\" style=\"padding:clamp(56px,8vw,104px) clamp(20px,5vw,40px);background:#fafafb;border-top:1px solid #f0f0f2;border-bottom:1px solid #f0f0f2\">\n    <div style=\"max-width:1080px;margin:0 auto\">\n      <div style=\"font:600 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#9a9aa6;margin-bottom:16px\">IN THE WILD<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 clamp(28px,4vw,46px) 'Space Grotesk',sans-serif;letter-spacing:-.025em\">A few things people keep in Thingtime.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:42px\">\n        <button type=\"button\" onclick=\"{{ loadCar }}\" style=\"text-align:left;cursor:pointer;padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff;transition:all 160ms ease\">\n          <div style=\"font-size:30px;margin-bottom:16px\">🚗<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">A car's whole life<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:15px;line-height:1.55;color:#6b6b76\">Every oil change, rotation, and repair with dates and costs. Sell with a verified history buyers can trust.<\u002Fp>\n          <span style=\"font:600 13.5px 'Space Grotesk',sans-serif;color:#a555e8\">Open in demo →<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" onclick=\"{{ loadTools }}\" style=\"text-align:left;cursor:pointer;padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff;transition:all 160ms ease\">\n          <div style=\"font-size:30px;margin-bottom:16px\">🔧<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">Tools worth sharing<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:15px;line-height:1.55;color:#6b6b76\">Lend the drill you use twice a year. Track condition, availability, borrowers, and rent — a tiny sharing economy.<\u002Fp>\n          <span style=\"font:600 13.5px 'Space Grotesk',sans-serif;color:#47b5e6\">Open in demo →<\u002Fspan>\n        <\u002Fbutton>\n        <button type=\"button\" onclick=\"{{ loadNotes }}\" style=\"text-align:left;cursor:pointer;padding:28px;border:1px solid #ececef;border-radius:18px;background:#fff;transition:all 160ms ease\">\n          <div style=\"font-size:30px;margin-bottom:16px\">🪄<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px;font:600 19px 'Space Grotesk',sans-serif\">A feed you own<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:15px;line-height:1.55;color:#6b6b76\">Notes, links, todos, pins — one personal feed with the schema you choose, shared only with who you pick.<\u002Fp>\n          <span style=\"font:600 13.5px 'Space Grotesk',sans-serif;color:#58ca70\">Open in demo →<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"developers\" data-screen-label=\"For developers\" style=\"padding:clamp(64px,9vw,120px) clamp(20px,5vw,40px);max-width:1080px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,72px);align-items:center\">\n      <div>\n        <div style=\"font:600 12px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#9a9aa6;margin-bottom:16px\">FOR DEVELOPERS<\u002Fdiv>\n        <h2 style=\"margin:0;font:600 clamp(28px,4vw,46px) 'Space Grotesk',sans-serif;letter-spacing:-.025em;line-height:1.05\">Every thing is an API.<\u002Fh2>\n        <p style=\"max-width:520px;margin:22px 0 0;font-size:17px;line-height:1.6;color:#5a5a66\">Read and write any path over HTTP. Browser sessions and API clients share one revocable, ES256-signed token — and other platforms can verify Thingtime-issued tokens offline via JWKS.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:26px\">\n          <span style=\"font:600 12.5px 'JetBrains Mono',monospace;color:#5a5a66;background:#f5f5f7;border:1px solid #ececef;border-radius:999px;padding:6px 13px\">ES256<\u002Fspan>\n          <span style=\"font:600 12.5px 'JetBrains Mono',monospace;color:#5a5a66;background:#f5f5f7;border:1px solid #ececef;border-radius:999px;padding:6px 13px\">JWKS<\u002Fspan>\n          <span style=\"font:600 12.5px 'JetBrains Mono',monospace;color:#5a5a66;background:#f5f5f7;border:1px solid #ececef;border-radius:999px;padding:6px 13px\">httpOnly cookie + Bearer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:16px;overflow:hidden;border:1px solid #23232b;box-shadow:0 24px 60px -30px rgba(20,20,40,.5)\">\n        <div style=\"display:flex;align-items:center;gap:7px;padding:12px 16px;background:#1c1c22\">\n          <span style=\"width:11px;height:11px;border-radius:999px;background:#f34a4a\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:999px;background:#ffbc48\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:999px;background:#58ca70\"><\u002Fspan>\n          <span style=\"margin-left:8px;font:500 12px 'JetBrains Mono',monospace;color:#7a7a88\">thingtime · api<\u002Fspan>\n        <\u002Fdiv>\n        <pre style=\"margin:0;padding:22px;background:#16161c;color:#e6e6ee;font:500 13.5px/1.7 'JetBrains Mono',monospace;overflow-x:auto\"><span style=\"color:#58ca70\">GET<\u002Fspan> /api/v1/things/car/Maintenance\n<span style=\"color:#7a7a88\">Authorization:<\u002Fspan> Bearer &lt;jwt&gt;\n\n<span style=\"color:#7a7a88\">→ 200 OK<\u002Fspan>\n[ { <span style=\"color:#47b5e6\">\"Service\"<\u002Fspan>: <span style=\"color:#ffbc48\">\"Oil &amp; filter change\"<\u002Fspan>,\n    <span style=\"color:#47b5e6\">\"Cost\"<\u002Fspan>: <span style=\"color:#a555e8\">89<\u002Fspan> }, … ]<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"back\" data-screen-label=\"Back the launch\" style=\"padding:clamp(40px,6vw,80px) clamp(20px,5vw,40px) clamp(64px,9vw,110px)\">\n    <div style=\"max-width:880px;margin:0 auto;padding:3px;border-radius:26px;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70,#47b5e6);box-shadow:0 30px 70px -34px rgba(60,40,120,.45)\">\n      <div style=\"background:#fff;border-radius:23px;padding:clamp(32px,5vw,60px);text-align:center\">\n        <div style=\"font-size:42px;margin-bottom:18px\">🦄<\u002Fdiv>\n        <h2 style=\"margin:0;font:600 clamp(26px,3.6vw,42px) 'Space Grotesk',sans-serif;letter-spacing:-.025em;line-height:1.1\">Help build a GUI for the internet.<\u002Fh2>\n        <p style=\"max-width:520px;margin:18px auto 0;font-size:16.5px;line-height:1.6;color:#5a5a66\">Thingtime is independent and built in the open. Back the campaign, grab merch, and help keep data free for everyone.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px\">\n          <a href=\"https://www.indiegogo.com/projects/thingtime-a-gui-for-the-internet/coming_soon\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:12px;color:#fff;font:600 15px 'Space Grotesk',sans-serif;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70,#47b5e6);background-size:180% auto;box-shadow:0 10px 26px -8px rgba(120,60,200,.5)\">Back on Indiegogo 🌈<\u002Fa>\n          <a href=\"https://www.gofundme.com/f/thingtime\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:12px;color:#16161a;font:600 15px 'Space Grotesk',sans-serif;background:#fff;border:1px solid #e2e2e6\">Donate on GoFundMe 💖<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"margin:22px 0 0;font:500 13px 'JetBrains Mono',monospace;color:#9a9aa6\">🌈 merch + perks for backers<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer data-screen-label=\"Footer\" style=\"border-top:1px solid #f0f0f2;padding:clamp(48px,6vw,72px) clamp(20px,5vw,40px) 48px\">\n    <div style=\"max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"display:grid;grid-template-columns:repeat(3,5px);grid-template-rows:repeat(3,5px);gap:1.4px;padding:5px;background:#fff;border:1px solid #ececef;border-radius:7px\">\n            <i style=\"background:transparent\"><\u002Fi><i style=\"background:#47b5e6\"><\u002Fi><i style=\"background:transparent\"><\u002Fi>\n            <i style=\"background:#58ca70\"><\u002Fi><i style=\"background:#ffbc48\"><\u002Fi><i style=\"background:#a555e8\"><\u002Fi>\n            <i style=\"background:transparent\"><\u002Fi><i style=\"background:#f34a4a\"><\u002Fi><i style=\"background:transparent\"><\u002Fi>\n          <\u002Fspan>\n          <span style=\"font:600 17px 'Space Grotesk',sans-serif;letter-spacing:-.02em\">thingtime<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#9a9aa6\">A GUI for the internet.<br>© {{ year }} Thingtime<\u002Fp>\n        <div style=\"margin-top:14px;font:500 11px 'JetBrains Mono',monospace;color:#b6b6c0\">🌱 git/main<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#9a9aa6;margin-bottom:14px\">Product<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;color:#5a5a66\">\n          <a href=\"#tt-demo\">Live demo<\u002Fa><a href=\"#developers\">For developers<\u002Fa><a href=\"#back\">Back the launch<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#9a9aa6;margin-bottom:14px\">Connect<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px;color:#5a5a66\">\n          <a href=\"mailto:connect@thingtime.com\">connect@thingtime.com<\u002Fa>\n          <a href=\"mailto:invest@thingtime.com\">invest@thingtime.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#9a9aa6;margin-bottom:14px\">Status<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:#5a5a66\">\n          <span style=\"display:inline-flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#58ca70\"><\u002Fspan>MongoDB · live<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#58ca70\"><\u002Fspan>Vercel · ready<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;font-size:13px;color:#9a9aa6\">Notifications by Lopu 🦄<\u002Fdiv>\n        <div style=\"margin-top:8px;font-size:15px;letter-spacing:3px\">🌈🦄🧙‍♂️<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ cmdOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeCmd }}\" style=\"position:fixed;inset:0;z-index:10000;background:rgba(18,18,28,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:14vh 20px 20px\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(560px,94vw);background:#fff;border-radius:16px;box-shadow:0 30px 80px -20px rgba(20,20,40,.5);overflow:hidden;animation:tt-pop 180ms ease\">\n        <div style=\"padding:3px;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70,#47b5e6)\">\n          <div style=\"display:flex;align-items:center;gap:12px;background:#fff;padding:15px 18px\">\n            <span style=\"font-size:17px\">🔮<\u002Fspan>\n            <input id=\"tt-cmd-input\" autocomplete=\"off\" spellcheck=\"false\" value=\"{{ cmdQuery }}\" oninput=\"{{ onCmdInput }}\" onkeydown=\"{{ onCmdKey }}\" placeholder=\"Imagine… search a path, or type  Total spent = 600\" style=\"flex:1;border:none;outline:none;font-size:16.5px;color:#16161a;background:transparent\">\n            <span style=\"font:600 11px 'JetBrains Mono',monospace;color:#b6b6c0;border:1px solid #ececef;border-radius:6px;padding:3px 7px\">esc<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"max-height:46vh;overflow-y:auto;padding:8px\">\n          <sc-for list=\"{{ cmdResults }}\" as=\"r\" hint-placeholder-count=\"0\">\n            <button type=\"button\" onclick=\"{{ r.onClick }}\" onmouseenter=\"{{ r.onHover }}\" style=\"{{ r.style }}\">\n              <span style=\"font-size:15px\">{{ r.emoji }}<\u002Fspan>\n              <span style=\"font:600 13.5px 'JetBrains Mono',monospace;color:#16161a\">{{ r.disp }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;color:#9a9aa6;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.preview }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <div style=\"padding:11px 14px;font-size:12.5px;color:#b6b6c0\">{{ cmdHint }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position:fixed;top:0;left:0;right:0;z-index:10001;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:74px;pointer-events:none\">\n    <sc-for list=\"{{ toasts }}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div style=\"pointer-events:auto;width:360px;max-width:calc(100vw - 24px);padding:2px;border-radius:18px;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70,#47b5e6);box-shadow:0 14px 38px rgba(20,20,40,.18);animation:tt-toast-in 260ms cubic-bezier(.2,.9,.3,1)\">\n        <div style=\"background:#fff;border-radius:16px;padding:13px 15px;position:relative\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\">\n            <span style=\"font-size:15px\">🦄<\u002Fspan>\n            <span style=\"font:800 13px 'Space Grotesk',sans-serif;background:linear-gradient(120deg,#47b5e6,#a555e8,#f34a4a,#ffbc48,#58ca70);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">Lopu<\u002Fspan>\n            <span style=\"font-size:10px;opacity:.4;font-weight:500\">Thingtime AI<\u002Fspan>\n            <button type=\"button\" onclick=\"{{ t.onClose }}\" aria-label=\"Close\" style=\"margin-left:auto;width:20px;height:20px;border:none;background:transparent;border-radius:999px;color:#b6b6c0;cursor:pointer;font-size:11px\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:600;color:#16161a\">{{ t.title }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#9a9aa6;margin-top:2px\">{{ t.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Reader&quot;,&quot;Developer&quot;],&quot;default&quot;:&quot;Reader&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;startExample&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Car&quot;,&quot;Tools&quot;,&quot;Notes&quot;],&quot;default&quot;:&quot;Car&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;editByDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;default&quot;:&quot;Comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Developer view&quot;},&quot;guides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Developer view&quot;},&quot;rainbow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Subtle&quot;,&quot;Balanced&quot;,&quot;Vivid&quot;],&quot;default&quot;:&quot;Balanced&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  EXAMPLES = {\n    car: {\n      Vehicle: { Make: 'Subaru', Model: 'Outback', Year: 2019, VIN: '4S4BSANCXK3245517', Odometer: 78450 },\n      'Verified history': true,\n      Maintenance: [\n        { Service: 'Oil & filter change', Date: '2025-11-04', Mileage: 74900, Cost: 89, Shop: 'Northside Auto' },\n        { Service: 'Tire rotation', Date: '2026-02-18', Mileage: 77100, Cost: 40, Shop: 'Northside Auto' },\n        { Service: 'Brake pads (front)', Date: '2026-05-30', Mileage: 78200, Cost: 320, Shop: 'Subaru of Eastgate' }\n      ],\n      'Total spent': 449,\n      Owner: '@nikolaj'\n    },\n    tools: {\n      Item: 'Cordless power drill',\n      'Make / model': 'Makita XFD10',\n      Condition: 'Excellent',\n      Available: true,\n      'Rental / day': 8,\n      'Safety notes': 'Two charged batteries included. Wear eye protection.',\n      Availability: ['2026-07-02', '2026-07-03', '2026-07-09'],\n      Borrowers: [\n        { Name: '@mara', From: '2026-06-10', To: '2026-06-12', Returned: true, Paid: true },\n        { Name: '@dev_sam', From: '2026-06-24', To: '2026-06-25', Returned: true, Paid: false }\n      ]\n    },\n    notes: {\n      Feed: [\n        { Type: 'note', Text: 'Thingtime is a GUI for the internet.', Pinned: true },\n        { Type: 'link', Title: 'Save humanity', URL: 'indiegogo.com/thingtime', Tags: ['thingtime', 'launch'] },\n        { Type: 'todo', Text: 'Ship the launch', Done: false }\n      ],\n      Tags: ['ideas', 'launch', 'freedom'],\n      'Shared with': ['@everyone'],\n      Count: 3\n    }\n  };\n\n  TABS = [['car', '🚗', 'Car history'], ['tools', '🔧', 'Tool lending'], ['notes', '🪄', 'Notes & feed']];\n  TYPES = [['string', '💬'], ['number', '💯'], ['boolean', '🌗'], ['object', '📦'], ['array', '📚'], ['any', '🪄']];\n  PALETTE = ['#47b5e6', '#a555e8', '#f34a4a', '#ffbc48', '#58ca70'];\n\n  state = {\n    example: 'car',\n    datas: { car: this.clone(this.EXAMPLES.car), tools: this.clone(this.EXAMPLES.tools), notes: this.clone(this.EXAMPLES.notes) },\n    editMode: false,\n    viewMode: 'reader',\n    collapsed: {},\n    hoverPath: null,\n    menuPath: null,\n    menuHover: -1,\n    highlight: null,\n    cmdOpen: false,\n    cmdQuery: '',\n    cmdSel: 0,\n    toasts: []\n  };\n\n  _toastId = 0;\n  _hlTimer = null;\n\n  // ---------- lifecycle ----------\n  componentDidMount() {\n    const start = (this.props.startExample || 'Car').toLowerCase();\n    const patch = {};\n    if (this.EXAMPLES[start]) patch.example = start;\n    if (this.props.editByDefault) patch.editMode = true;\n    if ((this.props.defaultView || '').toLowerCase() === 'developer') patch.viewMode = 'developer';\n    if (Object.keys(patch).length) this.setState(patch);\n    this._onKey = (e) => {\n      const k = (e.key || '').toLowerCase();\n      if ((e.metaKey || e.ctrlKey) && (k === 'p' || k === 'k')) {\n        e.preventDefault();\n        this.setState((s) => ({ cmdOpen: !s.cmdOpen, cmdQuery: '', cmdSel: 0 }));\n      } else if (e.key === 'Escape') {\n        this.setState({ cmdOpen: false, menuPath: null });\n      }\n    };\n    window.addEventListener('keydown', this._onKey);\n    this._wordTimer = setInterval(() => {\n      this.setState((s) => ({ _w: ((s._w || 0) + 1) % this.WORDS.length }));\n    }, 2600);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this._onKey);\n    clearInterval(this._wordTimer);\n    clearTimeout(this._hlTimer);\n  }\n  componentDidUpdate(prev) {\n    if (prev.startExample !== this.props.startExample && this.props.startExample) {\n      const k = this.props.startExample.toLowerCase();\n      if (this.EXAMPLES[k]) this.setState({ example: k });\n    }\n    if (prev.editByDefault !== this.props.editByDefault) this.setState({ editMode: !!this.props.editByDefault });\n    if (prev.defaultView !== this.props.defaultView) this.setState({ viewMode: (this.props.defaultView || 'Reader').toLowerCase() === 'developer' ? 'developer' : 'reader' });\n  }\n\n  WORDS = ['Thingtime', 'Freedom', 'Anything', 'Infinite', 'Yours', 'Shared', 'Magic', 'Love'];\n\n  // ---------- data helpers ----------\n  clone(v) { return JSON.parse(JSON.stringify(v)); }\n  current() { return this.state.datas[this.state.example]; }\n  ttype(v) { if (v === null || v === undefined) return 'null'; if (Array.isArray(v)) return 'array'; return typeof v; }\n  icon(t) { return { object: '📦', array: '📚', string: '💬', number: '💯', boolean: '🌗', null: '❓', function: '📐' }[t] || '📦'; }\n  pkey(arr) { return arr.map((k) => (typeof k === 'number' ? '#' + k : k)).join('/'); }\n  disp(arr) { let s = ''; for (const k of arr) { if (typeof k === 'number') s += '[' + k + ']'; else s += s ? '.' + k : k; } return s; }\n  defaultFor(t) { return { string: '', number: 0, boolean: false, object: {}, array: [], any: null }[t]; }\n\n  getIn(node, arr) { return arr.reduce((n, k) => (n == null ? n : n[k]), node); }\n  setIn(node, arr, val) {\n    if (arr.length === 0) return val;\n    const [k, ...rest] = arr;\n    if (Array.isArray(node)) { const c = node.slice(); c[k] = this.setIn(node[k], rest, val); return c; }\n    const c = { ...node }; c[k] = this.setIn(node[k], rest, val); return c;\n  }\n  deleteIn(node, arr) {\n    if (arr.length === 1) {\n      const k = arr[0];\n      if (Array.isArray(node)) { const c = node.slice(); c.splice(k, 1); return c; }\n      const c = { ...node }; delete c[k]; return c;\n    }\n    const [k, ...rest] = arr;\n    if (Array.isArray(node)) { const c = node.slice(); c[k] = this.deleteIn(node[k], rest); return c; }\n    const c = { ...node }; c[k] = this.deleteIn(node[k], rest); return c;\n  }\n  flatten(node, arr, out) {\n    const t = this.ttype(node);\n    if (arr.length) out.push({ arr: arr.slice(), disp: this.disp(arr), value: node, t });\n    if (t === 'object') for (const k of Object.keys(node)) this.flatten(node[k], [...arr, k], out);\n    else if (t === 'array') node.forEach((v, i) => this.flatten(v, [...arr, i], out));\n    return out;\n  }\n\n  // ---------- mutations ----------\n  setRoot(root) { this.setState((s) => ({ datas: { ...s.datas, [s.example]: root } })); }\n  setValueAt(arr, val) { this.setRoot(this.setIn(this.current(), arr, val)); }\n  toggleBool(arr) { const v = !this.getIn(this.current(), arr); this.setValueAt(arr, v); this.toast('🌗 Toggled ' + this.disp(arr), 'Now ' + v + '.'); }\n  changeType(arr, t) { this.setValueAt(arr, this.defaultFor(t)); this.setState({ menuPath: null }); this.toast('🎨 Changed to ' + t, this.disp(arr) + ' is now a ' + t + '.'); }\n  recycle(arr) { this.setRoot(this.deleteIn(this.current(), arr)); this.setState({ menuPath: null }); this.toast('🗑️ Recycled ' + this.disp(arr), 'Gone — but never truly lost.'); }\n  addChild(arr) {\n    const node = this.getIn(this.current(), arr);\n    let next;\n    if (Array.isArray(node)) next = [...node, ''];\n    else { next = { ...node }; let n = 1, key = 'new key'; while (key in next) key = 'new key ' + ++n; next[key] = ''; }\n    this.setRoot(this.setIn(this.current(), arr, next));\n    if (!this.state.editMode) this.setState({ editMode: true });\n    this.toast('✨ Added a value', 'Give it a name and a shape.');\n  }\n\n  // ---------- toasts ----------\n  toast(title, desc) {\n    const id = ++this._toastId;\n    this.setState((s) => ({ toasts: [...s.toasts, { id, title, desc, onClose: () => this.removeToast(id) }] }));\n    setTimeout(() => this.removeToast(id), 5200);\n  }\n  removeToast(id) { this.setState((s) => ({ toasts: s.toasts.filter((t) => t.id !== id) })); }\n\n  // ---------- view controls ----------\n  selectExample(k) { this.setState({ example: k, menuPath: null, highlight: null }); const lbl = this.TABS.find((t) => t[0] === k); this.toast('🪄 Loaded ' + (lbl ? lbl[2] : k), 'A different schema, same Thingtime.'); }\n  setViewMode(m) {\n    if (this.state.viewMode === m) return;\n    this.setState({ viewMode: m, menuPath: null }, () => this.toast(m === 'reader' ? '📖 Reader view' : '🛠️ Developer view', m === 'reader' ? 'Just words and nesting — like a page.' : 'Types, chips, and full control.'));\n  }\n  viewBtnStyle(on) {\n    return { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 36, padding: '7px 10px', borderRadius: 9, cursor: 'pointer', font: \"600 13px 'Space Grotesk',sans-serif\", border: on ? '1px solid #ececef' : '1px solid transparent', color: on ? '#16161a' : '#9a9aa6', background: on ? '#fff' : 'transparent', boxShadow: on ? '0 1px 2px rgba(0,0,0,.05)' : 'none', transition: 'all 140ms ease' };\n  }\n  toggleEdit() { this.setState((s) => ({ editMode: !s.editMode, menuPath: null }), () => this.toast(this.state.editMode ? '🎨 Edit mode on' : '👀 View mode', this.state.editMode ? 'Click any value to reshape it.' : 'Looking good.')); }\n  collapseAll() { const out = {}; this.flatten(this.current(), [], []).forEach((r) => { if (r.t === 'object' || r.t === 'array') out[this.pkey(r.arr)] = true; }); this.setState({ collapsed: out }); }\n  expandAll() { this.setState({ collapsed: {} }); }\n  toggleCollapse(pk) { this.setState((s) => ({ collapsed: { ...s.collapsed, [pk]: !s.collapsed[pk] } })); }\n  share() {\n    try { navigator.clipboard && navigator.clipboard.writeText('https://thingtime.com/share/' + this.state.example); } catch (e) {}\n    this.toast('🔗 Share link copied', 'Anyone with the lin
