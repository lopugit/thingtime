name: Lopu PR lifecycle
on:
  workflow_call:
permissions:
  contents: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lopu-pr-lifecycle-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: github-actions
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Apply exact-snapshot lifecycle decisions
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.CONFLICT_RESOLVER_PAT || github.token }}
        run: node .github/scripts/lopu-pr-lifecycle.mjs --apply
