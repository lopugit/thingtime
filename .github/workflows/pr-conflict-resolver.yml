name: PR Conflict Resolver

# When any branch is pushed, find every open PR (drafts included) that
# TARGETS the pushed branch, and for each one that now has merge conflicts,
# run an AI agent that merges the base branch in, resolves the conflicts,
# pushes the merge commit to the PR head branch, and comments a summary.
#
# Loop safety: pushes made with the default GITHUB_TOKEN never trigger
# workflows, so the resolver's own pushes cannot re-trigger this workflow.
#
# Requires one repo secret for the AI step: ANTHROPIC_API_KEY or
# CLAUDE_CODE_OAUTH_TOKEN (run /install-github-app from the claude CLI,
# or gh secret set ANTHROPIC_API_KEY).

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      base:
        description: 'Base branch to scan for conflicting PRs (defaults to the branch this run is dispatched from)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pr-conflict-resolver-${{ inputs.base || github.ref_name }}
  cancel-in-progress: false

jobs:
  find-conflicting-prs:
    name: Find conflicting PRs targeting ${{ inputs.base || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prs: ${{ steps.scan.outputs.prs }}
    steps:
      - name: Scan open + draft PRs whose base is the pushed branch
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Open PRs (drafts included) targeting the pushed branch.
          # Fork PRs are skipped: this token cannot push a resolution to a fork.
          mapfile -t candidates < <(gh pr list --repo "$REPO" --base "$BASE_BRANCH" \
            --state open --limit 100 \
            --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number')

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No open PRs target $BASE_BRANCH."
            echo "prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub recomputes mergeability lazily after the base moves; poll
          # each PR until the state settles instead of trusting the first read.
          conflicting=()
          for pr in "${candidates[@]}"; do
            state="UNKNOWN"
            for attempt in $(seq 1 10); do
              state=$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq .mergeable)
              [ "$state" != "UNKNOWN" ] && break
              sleep 15
            done
            echo "PR #$pr mergeable=$state"
            if [ "$state" = "CONFLICTING" ]; then
              conflicting+=("$pr")
            fi
          done

          prs=$(printf '%s\n' "${conflicting[@]:-}" | jq -R 'select(length > 0) | tonumber' | jq -sc .)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  resolve:
    name: 'Resolve conflicts in PR #${{ matrix.pr }}'
    needs: find-conflicting-prs
    if: needs.find-conflicting-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJson(needs.find-conflicting-prs.outputs.prs) }}
    steps:
      - name: Ensure an Anthropic credential secret exists
        env:
          HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CREDENTIAL" != "true" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repo secret to enable the AI conflict resolver (claude CLI: /install-github-app)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PR head branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ matrix.pr }}

      - name: Resolve conflicts with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are resolving merge conflicts for PR #${{ matrix.pr }} in ${{ github.repository }}.

            The base branch `${{ inputs.base || github.ref_name }}` just moved and this PR now
            conflicts with it. You are already on the PR head branch in a full clone.

            Steps:
            1. Run: git fetch origin && git merge origin/${{ inputs.base || github.ref_name }} --no-edit
               (it will stop on conflicts).
            2. Resolve every conflict thoughtfully, preserving the intent of BOTH the PR's
               changes and the new base-branch changes. Read the surrounding code as needed.
               Never discard either side's work just to make a conflict disappear.
            3. Repo rule for graphify-out/: never hand-merge those generated files. Take the
               base branch's side for the ENTIRE directory:
               git checkout --theirs -- graphify-out/ && git add -A graphify-out/
               (for delete/modify conflicts in that directory, resolve wholesale toward the
               base side with git rm / git add as git status indicates).
            4. Stage the resolved files and complete the merge commit. Keep the default merge
               commit message, appending a one-line summary of the notable resolution choices.
            5. Push to the PR head branch: git push origin HEAD.
            6. Comment on PR #${{ matrix.pr }} (gh pr comment) with a concise summary of what
               conflicted and how each conflict was resolved, so the author can review the calls.

            If a conflict is genuinely ambiguous — both sides changed the same behavior in
            incompatible ways and the correct combined behavior cannot be determined from the
            code — do NOT push a guess. Run git merge --abort and instead comment on the PR
            listing exactly which files/hunks need a human decision and why.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh:*),Read,Edit,MultiEdit,Write,Grep,Glob,LS"
