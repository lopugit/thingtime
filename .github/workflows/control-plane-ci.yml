name: Workflow control-plane CI

on:
  push:
    branches: [github-actions]
    paths:
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/**
      - vercel.json
  pull_request:
    branches: [github-actions]
    paths:
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/**
      - vercel.json
  workflow_dispatch:

permissions:
  contents: read

# Supersede only runs that share a subject. A constant group made every new
# control-plane run cancel the in-flight run of an unrelated PR: the older run
# finished every step successfully and was still reported `cancelled`, which
# `gh pr checks` renders as `fail`. PRs then showed a red control-plane check
# for work they had not broken. Keep `cancel-in-progress` — superseding an
# earlier push on the same PR or branch is the intended behavior.
concurrency:
  group: workflow-control-plane-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out github-actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github
            vercel.json

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            node --check "$script"
          done < <(find .github/scripts -type f -name '*.mjs' -print | sort)

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find .github/scripts -type f -name '*.sh' -print | sort)

      - name: Verify patch hygiene
        run: git diff --check

      - name: Validate content-addressed Graphify snapshots
        run: |
          node --test .github/scripts/graphify-cas.test.mjs
          node .github/scripts/stage-graphify-snapshots.mjs --self-test

      - name: Validate rebase index integrity fingerprint
        run: |
          node --test .github/scripts/rebase-index-fingerprint.test.mjs
          node --test .github/scripts/rebase-related-edits.test.mjs
          node --test .github/scripts/resolve-canonical-instruction-type-conflicts.test.mjs

      - name: Validate Lopu PR status rendering and classification
        run: node --test .github/scripts/lopu-pr-status.test.mjs

      - name: Validate Lopu review queue coalescing
        run: node --test .github/scripts/lopu-review-queue.test.mjs .github/scripts/lopu-cooperative-review.test.mjs

      # The routing contract itself runs in the advisory lane, but the step
      # window its credential-probe exemption is scoped to is pure and cheap to
      # pin, and a wrong window there misreports rather than under-reports.
      - name: Validate the conflict-resolver routing step window
        run: node --test .github/scripts/resolve-pr-conflicts-routing-contract.test.mjs

      - name: Validate event admission, CI isolation, and preview writes
        run: node --test .github/scripts/control-plane-events.test.mjs .github/scripts/preview-comments.test.mjs

      - name: Validate all-branch event and doctor contracts
        run: node .github/scripts/build-all-branch.mjs --self-test

      - name: Validate main/develop sync merger
        run: node .github/scripts/merge-main-develop-sync-pr.mjs --self-test

      - name: Validate Claude credential failover classification
        run: node .github/scripts/classify-claude-credential-failure.mjs --self-test

      - name: Validate signed Electron PR release contract
        run: |
          node .github/scripts/electron-pr-release-contract.mjs
          node --test .github/scripts/electron-release-gates.test.mjs

  contract-advisories:
    name: Contract advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      warnings: ${{ steps.contracts.outputs.warnings }}
      report_b64: ${{ steps.contracts.outputs.report_b64 }}
    steps:
      - name: Check out github-actions for read-only advisory checks
        id: contract_checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github
            vercel.json

      - name: Collect contract advisory results
        id: contracts
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.contract_checkout.outcome }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/contract-advisories.md"
          warnings=false
          : >"$report"

          escape_log() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }
          run_contract() {
            local label="$1"
            shift
            local log status=0
            log="$(mktemp "$RUNNER_TEMP/contract.XXXXXX")"
            timeout 300 "$@" >"$log" 2>&1 || status=$?
            if (( status == 0 )); then
              printf -- '- ✅ %s\n' "$label" >>"$report"
            else
              warnings=true
              printf -- '- ⚠️ %s (exit %s)\n' "$label" "$status" >>"$report"
              {
                echo '<details><summary>Sanitized tail</summary>'
                echo
                echo '<pre>'
                tail -n 30 "$log" | head -c 12000 | escape_log
                echo '</pre>'
                echo '</details>'
              } >>"$report"
            fi
            rm -f -- "$log"
          }

          if [ "$CHECKOUT_OUTCOME" != success ]; then
            warnings=true
            echo '- ⚠️ The advisory checkout was unavailable; no contract examples ran.' >>"$report"
          else
            run_contract 'Develop-preview controller examples' \
              node .github/scripts/deploy-develop-pr-preview.mjs --self-test
            run_contract 'Admin multi-environment preview controller examples' \
              node .github/scripts/deploy-admin-pr-previews.mjs --self-test
            run_contract 'Vercel prebuilt archive safety examples' \
              python3 .github/scripts/extract-vercel-prebuilt.py --self-test
            run_contract 'Workflow control-plane examples' \
              node .github/scripts/workflow-control-plane-contract.mjs --self-test
            run_contract 'Signed Electron PR release examples' \
              node .github/scripts/electron-pr-release-contract.mjs
            run_contract 'Conflict-resolver routing examples' \
              node .github/scripts/resolve-pr-conflicts-routing-contract.mjs --self-test
            run_contract 'Rebase ownership routing examples' \
              bash .github/scripts/rebase-ownership-routing-contract.sh
            run_contract 'Promotion-worker routing examples' \
              node .github/scripts/promotion-worker-routing-contract.mjs
            run_contract 'Promotion-worker behavior examples' \
              bash .github/scripts/promotion-worker-contract.sh
            run_contract 'Promotion changelog examples' \
              node .github/scripts/promotion-pr-changelog.mjs --self-test
            run_contract 'Feature promoter examples' \
              node .github/scripts/promote-features-to-main.mjs --self-test
            run_contract 'All-branch builder examples' \
              node .github/scripts/build-all-branch.mjs --self-test
          fi

          echo "warnings=$warnings" >>"$GITHUB_OUTPUT"
          printf 'report_b64=' >>"$GITHUB_OUTPUT"
          base64 -w0 <"$report" >>"$GITHUB_OUTPUT"
          echo >>"$GITHUB_OUTPUT"
          if [ "$warnings" = true ]; then
            echo '::warning::One or more deterministic contract advisories need review; required CI remains unaffected.'
          fi
          {
            echo '## Deterministic contract advisories'
            echo
            cat "$report"
          } >>"$GITHUB_STEP_SUMMARY"

  comment-contract-advisories:
    name: Comment contract advisories (non-blocking)
    needs: contract-advisories
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert or clear the advisory comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_WARNINGS: ${{ needs.contract-advisories.outputs.warnings }}
          REPORT_B64: ${{ needs.contract-advisories.outputs.report_b64 }}
        with:
          script: |
            const marker = '<!-- thingtime-control-plane-contract-advisories:v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              ({ body, user }) => user?.login === 'github-actions[bot]' && body?.includes(marker)
            );
            if (process.env.HAS_WARNINGS !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            let report = '';
            try {
              report = Buffer.from(process.env.REPORT_B64 || '', 'base64').toString('utf8');
            } catch {
              report = '- ⚠️ The advisory report could not be decoded.';
            }
            report = report.slice(0, 50000);
            const body = [
              '⚠️ **Deterministic CI contract advisory**',
              '',
              'These examples are warning-only. They do not fail a required check or block this PR.',
              '',
              report,
              '',
              marker,
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
