name: Electron App Release

# The main and PR entrypoints share one tested packaging/signing pipeline.
# Reusable workflows retain the caller event; source validation pins main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/electron-pr-release.yml
    with:
      release_kind: main
      triggering_event: ${{ github.event_name }}
    secrets: inherit
