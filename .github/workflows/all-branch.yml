# Stable event listener only. The wildcard `all` branch builder (PR discovery,
# stack ordering, merge/conflict policy, and push handling) is versioned on the
# protected github-actions branch; this caller carries triggers and
# permissions only. Concurrency dedup lives in the implementation — a caller
# sharing the called workflow's group deadlocks the pair, which is why no
# listener in this repo declares one.

name: Build all branch

on:
  push:
    branches: [develop, main]
  pull_request_target:
    # Any open-PR lifecycle change can alter what belongs on `all`: content
    # (synchronize), membership (opened/reopened/closed/drafts), and stack
    # topology or base retargets (edited).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  control-plane:
    uses: lopugit/thingtime/.github/workflows/all-branch.yml@github-actions
    secrets: inherit
