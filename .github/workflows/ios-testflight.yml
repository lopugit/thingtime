name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'apple/Shared/**'
      - 'apple/FileSync/**'
      - 'filesystem-indexer/**'
      - 'apple/Widgets/**'
      - 'apple/Passwords/**'
      - 'apple/PasswordProvider/**'
      - '.github/workflows/ios-testflight.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'apple/Shared/**'
      - 'apple/FileSync/**'
      - 'filesystem-indexer/**'
      - 'apple/Widgets/**'
      - 'apple/Passwords/**'
      - 'apple/PasswordProvider/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Publish, inspect, export for a registered iPhone and Watch, or migrate existing Apple secrets
        required: true
        type: choice
        options: [upload, status, release-testing, migrate-secrets]
        default: upload
      expected_build_number:
        description: Optional build number to inspect (status only)
        required: false
      web_url:
        description: Public Thingtime URL embedded in a manually published build
        required: false
        default: https://thingtime.com
      source_sha:
        description: Exact main commit expected for release-testing
        required: false
      iphone_udid_sha256:
        description: SHA-256 of the lowercased hardware UDID (release-testing only)
        required: false
      watch_udid_sha256:
        description: SHA-256 of the lowercased paired Apple Watch hardware UDID (release-testing only)
        required: false
      recipient_certificate:
        description: Base64 DER of the recipient's RSA encryption certificate (release-testing only)
        required: false

permissions:
  contents: read

# All releases for this app share a build-number and upload lock, including reruns.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-native-compile-{0}', github.event.pull_request.number) || 'ios-testflight-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-pr-compile:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile iOS with the exact TestFlight toolchain
        working-directory: iOS
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          export THINGTIME_RUST_CARGO="$(rustup which --toolchain stable cargo)"
          export RUSTUP_TOOLCHAIN=stable
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          test_device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d["udid"] for runtime,rows in sorted(data.items(),reverse=True) if ".iOS-" in runtime for d in rows if d.get("isAvailable") and "iPhone" in d["name"]]; assert devices, "No iPhone simulator is available"; print(devices[0])')
          xcodebuild -project Thingtime.xcodeproj -scheme Thingtime \
            -destination "platform=iOS Simulator,id=$test_device" \
            -derivedDataPath "$RUNNER_TEMP/thingtime-native-pr" \
            -jobs 2 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_OPERATION: ${{ github.event.inputs.operation || 'upload' }}
      CREDENTIAL_SOURCE: ${{ vars.THINGTIME_IOS_CREDENTIAL_SOURCE || 'github' }}
      THINGTIME_RELEASE_ORIGIN: ${{ vars.THINGTIME_RELEASE_ORIGIN || 'https://thingtime.com' }}
      THINGTIME_WEB_URL: ${{ github.event.inputs.web_url || 'https://thingtime.com' }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      EXPECTED_BUILD_NUMBER: ${{ github.event.inputs.expected_build_number }}
      IOS_RELEASE_TESTING_DEVICE_SHA256: ${{ github.event.inputs.operation == 'release-testing' && inputs.iphone_udid_sha256 || '' }}
      WATCH_RELEASE_TESTING_DEVICE_SHA256: ${{ github.event.inputs.operation == 'release-testing' && inputs.watch_udid_sha256 || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release request
        run: |
          node -e 'if (!["github", "vault"].includes(process.env.CREDENTIAL_SOURCE)) process.exit(1); const u = new URL(process.env.THINGTIME_WEB_URL); if (u.protocol !== "https:" || u.username || u.password) process.exit(1)'

      - name: Validate registered-device export request
        if: env.RELEASE_OPERATION == 'release-testing'
        env:
          RECIPIENT_CERTIFICATE: ${{ inputs.recipient_certificate }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$THINGTIME_WEB_URL" = 'https://thingtime.com'
          [[ "$IOS_RELEASE_TESTING_DEVICE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WATCH_RELEASE_TESTING_DEVICE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$IOS_RELEASE_TESTING_DEVICE_SHA256" != "$WATCH_RELEASE_TESTING_DEVICE_SHA256"
          umask 077
          ruby -rbase64 -ropenssl -e '
            certificate = OpenSSL::X509::Certificate.new(Base64.strict_decode64(ENV.fetch("RECIPIENT_CERTIFICATE")))
            key = certificate.public_key
            abort "A valid RSA encryption certificate of at least 2048 bits is required" unless
              key.is_a?(OpenSSL::PKey::RSA) && key.n.num_bits >= 2048 &&
              certificate.not_before <= Time.now && certificate.not_after > Time.now
            File.write(ARGV.fetch(0), certificate.to_pem)
          ' "$RUNNER_TEMP/thingtime-release-recipient.pem"

      - name: Select release Xcode
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'

      - name: Set up shared Rust indexer toolchain
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          cargo_bin="$(rustup which --toolchain stable cargo)"
          test -x "$cargo_bin"
          echo "THINGTIME_RUST_CARGO=$cargo_bin" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: iOS

      - name: Validate release packaging and version allocation
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        run: |
          node --test iOS/scripts/tests/*.test.mjs
          python3 iOS/scripts/test_verify_release.py
          ruby iOS/fastlane/lib/release_version_test.rb

      - name: Install XcodeGen
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Run native regression tests before loading Apple credentials
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        working-directory: iOS
        run: |
          xcodegen generate
          test_device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d["udid"] for runtime,rows in sorted(data.items(),reverse=True) if ".iOS-" in runtime for d in rows if d.get("isAvailable") and "iPhone" in d["name"]]; assert devices, "No iPhone simulator is available"; print(devices[0])')
          xcodebuild -project Thingtime.xcodeproj -scheme Thingtime \
            -destination "platform=iOS Simulator,id=$test_device" \
            -derivedDataPath "$RUNNER_TEMP/thingtime-native-tests" \
            -resultBundlePath "$RUNNER_TEMP/ThingtimeNativeTests.xcresult" \
            -jobs 2 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test

      - name: Preserve native test results
        if: always() && env.RELEASE_OPERATION == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: thingtime-native-test-results
          path: ${{ runner.temp }}/ThingtimeNativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Load existing GitHub credentials or explicitly migrate them
        if: env.CREDENTIAL_SOURCE == 'github' || env.RELEASE_OPERATION == 'migrate-secrets'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ vars.THINGTIME_APPLE_TEAM_ID || '6DQQ9V7C84' }}
          PRODUCT_BUNDLE_IDENTIFIER: ${{ vars.THINGTIME_IOS_BUNDLE_ID || 'com.thingtime.appletime' }}
          IOS_DISTRIBUTION_CERTIFICATE_ID: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_ID }}
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_PASSWORD }}
        run: |
          export WATCH_BUNDLE_IDENTIFIER="$PRODUCT_BUNDLE_IDENTIFIER.watchkitapp"
          if [[ "$RELEASE_OPERATION" == 'migrate-secrets' ]]; then
            node iOS/scripts/vault-credentials.mjs
          else
            node iOS/scripts/github-credentials.mjs
          fi

      - name: Load Apple credentials from the Thingtime vault
        if: env.CREDENTIAL_SOURCE == 'vault' && env.RELEASE_OPERATION != 'migrate-secrets'
        run: node iOS/scripts/vault-credentials.mjs

      - name: Prepare distribution identity
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        run: |
          umask 077
          ruby -rbase64 -e 'File.binwrite(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch("IOS_DISTRIBUTION_CERT_P12")))' "$RUNNER_TEMP/thingtime-distribution.p12"
          echo "IOS_DISTRIBUTION_CERTIFICATE_PATH=$RUNNER_TEMP/thingtime-distribution.p12" >> "$GITHUB_ENV"

      - name: Allocate a build number newer than current TestFlight
        if: env.RELEASE_OPERATION == 'upload' || env.RELEASE_OPERATION == 'release-testing'
        working-directory: iOS
        run: bundle exec fastlane prepare_release

      - name: Build, verify phone/Watch/widget/share extension and upload
        if: env.RELEASE_OPERATION == 'upload'
        working-directory: iOS
        run: bundle exec fastlane beta

      - name: Verify Apple processing and internal tester availability
        if: env.RELEASE_OPERATION == 'upload'
        working-directory: iOS
        run: bundle exec fastlane verify_release

      - name: Verify and encrypt the registered-device IPA
        if: env.RELEASE_OPERATION == 'release-testing'
        working-directory: iOS
        run: |
          bundle exec fastlane release_testing
          umask 077
          openssl cms -encrypt -aes256 -binary -outform DER \
            -in build/Thingtime.ipa -out "$RUNNER_TEMP/Thingtime.ipa.cms" \
            "$RUNNER_TEMP/thingtime-release-recipient.pem"

      - name: Preserve encrypted registered-device IPA
        if: env.RELEASE_OPERATION == 'release-testing'
        uses: actions/upload-artifact@v4
        with:
          name: thingtime-release-testing-${{ github.sha }}-build-${{ env.EXPECTED_BUILD_NUMBER }}
          path: ${{ runner.temp }}/Thingtime.ipa.cms
          if-no-files-found: error
          retention-days: 1

      - name: Inspect TestFlight build state
        if: env.RELEASE_OPERATION == 'status'
        working-directory: iOS
        run: bundle exec fastlane testflight_status

      - name: Remove ephemeral signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/thingtime-distribution.p12" \
            "$RUNNER_TEMP/thingtime-release-recipient.pem" "$RUNNER_TEMP/Thingtime.ipa.cms"
          rm -rf iOS/build "$RUNNER_TEMP/thingtime-ipa"
