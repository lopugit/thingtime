# Keep a standing promotion PR open from develop into main.
#
# On every push to develop (or manual dispatch):
# - An open PR (base main, head develop) already exists → do nothing. Its head
#   is the moving develop ref, so it picks up new pushes/merges by itself.
# - No open PR and develop has commits main lacks → open a fresh promotion PR.
# - develop and main are level → skip quietly. That is the normal state right
#   after a promotion merges and "Sync main into develop" levels develop with
#   main again, so this pair of workflows never ping-pongs.
#
# Token notes (same trade-off documented in sync-main-into-develop.yml):
# - A PR opened with GITHUB_TOKEN gets no pull_request workflow runs for the
#   opening event (recursion guard), so Web CI would sit blank until the next
#   push to develop. When SYNC_BRANCHES_PAT (or CONFLICT_RESOLVER_PAT) is
#   configured we open the PR with it so CI runs on the PR immediately.

name: Promote develop to main

on:
  workflow_call:
    inputs:
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: string
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: choice
        options: [github-actions, vercel-sandbox]
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/ci-provider-router.yml
    with:
      workflow: promote-develop
      execution_provider: ${{ inputs.execution_provider || 'github-actions' }}
      runner_label: ${{ inputs.runner_label || '' }}
      control_dispatch_id: ${{ inputs.control_dispatch_id || '' }}
    secrets: inherit

  promotion-pr:
    needs: route
    if: needs.route.outputs.execute == 'true'
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    steps:
      - name: Check out develop with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out trusted automation support
        uses: actions/checkout@v4
        with:
          ref: github-actions
          path: workflow-control
          fetch-depth: 1
          persist-credentials: false

      - name: Open or refresh the promotion PR (changelog + delta comments)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_CREATE: ${{ secrets.SYNC_BRANCHES_PAT || secrets.CONFLICT_RESOLVER_PAT || github.token }}
          PROMOTION_PR_LABELS: no-ai-rebase
        run: node workflow-control/.github/scripts/promotion-pr-changelog.mjs
