name: Native password bridge

on:
  pull_request:
    paths: [electron/**, remix/app/passwords/**, remix/app/components/Passwords/**, .github/workflows/native-passwords-ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-passwords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            electron
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.12.1
      - run: pnpm --dir electron install --frozen-lockfile
      - run: node electron/node_modules/electron/install.js
      - name: Inspect synthetic Windows runner profile permissions
        if: runner.os == 'Windows'
        run: |
          $current = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          (Get-Acl -LiteralPath $env:USERPROFILE).Access | ForEach-Object {
            $sid = $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            $principal = if ($sid -eq $current) { 'current-user' } elseif ($sid -match '^S-1-5-21-') { 'other-user' } else { $sid }
            [pscustomobject]@{ Principal = $principal; Rights = $_.FileSystemRights.ToString(); Type = $_.AccessControlType.ToString(); Inheritance = $_.InheritanceFlags.ToString(); Propagation = $_.PropagationFlags.ToString() } | ConvertTo-Json -Compress
          }
      - name: Broker, transport and operating-system path contracts
        run: node --test electron/test/native-password-*.test.cjs
      - name: Install isolated Linux desktop test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 xvfb
          # Use the vendor-installed path covered by Ubuntu's Chrome sandbox
          # policy. Runner-provided developer Chromium builds may lack it.
          chrome_package="$RUNNER_TEMP/google-chrome-stable.deb"
          curl --fail --location --retry 2 --output "$chrome_package" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          test "$(dpkg-deb -f "$chrome_package" Package)" = google-chrome-stable
          test "$(dpkg-deb -f "$chrome_package" Architecture)" = amd64
          sudo apt-get install -y "$chrome_package"
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Verify installed Linux Chrome launches with its sandbox
        if: runner.os == 'Linux'
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf -- "$profile"' EXIT
          browser=$(node -e 'require("./electron/lib/native-passwords/consumers.cjs").browserExecutable().then(value => console.log(value))')
          "$browser" --version
          timeout 35s "$browser" --headless --user-data-dir="$profile" --no-proxy-server --dump-dom about:blank
      - name: Linux Electron keyring and browser delivery
        if: runner.os == 'Linux'
        run: xvfb-run -a node electron/scripts/test-native-password-session.cjs
      - name: Linux existing keyring locked-to-unlocked delivery
        if: runner.os == 'Linux'
        env:
          THINGTIME_TEST_NATIVE_KEYRING: '1'
        run: node --test electron/test/native-password-keyring.test.cjs
      - name: Windows Electron DPAPI and browser delivery
        if: runner.os == 'Windows'
        run: node electron/scripts/test-native-password-session.cjs
      - name: Retain synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-passwords-${{ runner.os }}
          path: ~/.thingtime-native-password-tests/**/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  package-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            electron
            remix
            MCP
            scripts
            docs/design
            browser-extension
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.12.1
      - run: pnpm --dir remix install --frozen-lockfile
      - run: pnpm --dir electron install --frozen-lockfile
      - run: node electron/node_modules/electron/install.js
      - name: Build the native Windows app and current renderer
        run: pnpm --dir electron run build:portable
      - name: Verify the packaged Windows app reports its installed CLI
        run: |
          $app = Resolve-Path 'electron/release-win32-x64/win-unpacked/Thingtime.exe'
          $report = Join-Path $env:RUNNER_TEMP 'thingtime-password-agent-info.json'
          $process = Start-Process -FilePath $app -ArgumentList '--password-agent-info' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $report
          if ($process.ExitCode -ne 0) { throw 'The packaged app could not report its CLI.' }
          $info = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $expectedCli = Join-Path (Split-Path $app) 'resources/password-agent.mjs'
          if (!$info.supported -or ![IO.Path]::IsPathFullyQualified($info.profile) -or !(Test-Path -LiteralPath $expectedCli) -or $info.cli -ne [IO.Path]::GetFullPath($expectedCli)) { throw 'The packaged app reported an invalid profile or CLI path.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Thingtime-Windows-x64-unsigned
          path: electron/release-win32-x64/win-unpacked
          if-no-files-found: error
          retention-days: 7
