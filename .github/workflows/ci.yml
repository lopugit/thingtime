name: CI

# Baseline quality gate for the remix/ app: unit tests + client build must pass
# on every PR and on pushes to main. Typecheck runs but is non-blocking for now
# — tsc --noEmit currently reports a known backlog of ~121 errors (strict mode
# is off); the step surfaces the count so it can be ratcheted down over time
# (TODO 15). The headless API runner (npm run test:api) is intentionally NOT run
# here: it needs a live server + MongoDB. Run it locally against a dev server.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remix
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 23.6 runs the repo's `node --test *.test.ts` suites
          # directly (TypeScript type-stripping on by default).
          node-version: 24
          cache: pnpm
          cache-dependency-path: remix/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: npm run test

      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: npm run typecheck

      - name: Build client shell
        run: npm run build:client
