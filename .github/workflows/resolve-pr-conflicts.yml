name: Lopu PR manager

run-name: >-
  ${{ inputs.feature_stack_run_id && format('Lopu merges Feature Stack run {0}', inputs.feature_stack_run_id) || format('Lopu manages PRs{0}', inputs.pr_number && format(' for #{0}', inputs.pr_number) || inputs.branch && format(' under {0}', inputs.branch) || format(' after {0}', github.event_name)) }}

on:
  push:
    branches: ["**"]
  pull_request_target:
    # This default-branch signal is independent of whether an old PR head or
    # non-default target already carries a current push listener. The protected
    # controller deduplicates exact snapshots before queueing model work.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  # GitHub evaluates these PR-target, issue/review-comment, and check-run event
  # workflows from the default branch. Keep the public file metadata-only and
  # forward each signal to the protected Lopu controller pinned at
  # @github-actions below.
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  check_run:
    types: [completed]
  # check_run/check_suite events are suppressed for checks created by GitHub
  # Actions itself. workflow_run closes that blind spot for first-party PR CI;
  # the protected controller admits only PR-associated non-success conclusions
  # and does not listen to Lopu PR manager, so review failures cannot recurse.
  workflow_run:
    workflows:
      - API tests
      - CI
      - Lopu CodeQL all branches
      - Workflow control-plane CI
      - Develop S3 PR preview
      - Signed Electron PR Release
      - Electron App Release
      - Web CI
      - Build all branch
    types: [completed]
  schedule:
    - cron: "2,32 * * * *"
    - cron: "43 */6 * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Exact PR to scan (takes precedence over branch); leave blank for a branch/all scan"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan; leave blank with no PR number to scan all"
        required: false
        default: ""
        type: string
      maintenance_operation:
        description: "Choose PR management or one explicit repository-maintenance operation"
        required: false
        default: "manage-prs"
        type: choice
        options: [manage-prs, promote-develop, promote-features, sync-main-develop, build-all, backfill-codeql, merge-feature-stack]
      promotion_dry_run:
        description: "Plan feature promotion only — do not create or update repository state"
        required: false
        default: false
        type: boolean
      promotion_lookback:
        description: "Recently merged source PRs to inspect during feature promotion (max 100)"
        required: false
        default: "50"
        type: string
      promotion_source_branch:
        description: "Optional feature-promotion source branch (default develop)"
        required: false
        default: ""
        type: string
      promotion_target_branch:
        description: "Optional feature-promotion target branch (default main)"
        required: false
        default: ""
        type: string
      promotion_path_prefix:
        description: "Optional comma-separated allowed path prefixes for feature promotion"
        required: false
        default: ""
        type: string
      rebase_cascade:
        description: "Continue through PRs stacked on an updated branch"
        required: false
        default: true
        type: boolean
      detector_handoff:
        description: "Internal trusted worker routing flag (leave false)"
        required: false
        default: false
        type: boolean
      manual_retry:
        description: "Internal explicit-retry routing flag (leave false)"
        required: false
        default: false
        type: boolean
      depth:
        description: "Internal stacked-PR cascade depth (leave at 0)"
        required: false
        default: "0"
        type: string
      feature_stack_plan_b64:
        description: "Internal: canonical-base64 immutable Feature Stack plan"
        required: false
        default: ""
        type: string
      feature_stack_run_id:
        description: "Internal: durable Thingtime Feature Stack run id"
        required: false
        default: ""
        type: string
  repository_dispatch:
    # Both internal stack events enter through the same public Lopu listener;
    # the protected controller assigns exactly one merge or rebase owner.
    types: [resolve-conflicts-cascade, rebase-pr-stack-ai]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  # The called controller narrows this per job: CodeQL inspection stays
  # read-only in its model job and only the separately fenced disposition job
  # may close or dismiss alerts. Reusable workflows still cannot request either
  # permission unless the thin caller grants the maximum required level up
  # front.
  security-events: write

jobs:
  control-plane:
    uses: lopugit/thingtime/.github/workflows/resolve-pr-conflicts.yml@github-actions
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      branch: ${{ inputs.branch || '' }}
      maintenance_operation: ${{ inputs.maintenance_operation || 'manage-prs' }}
      promotion_dry_run: ${{ inputs.promotion_dry_run || false }}
      promotion_lookback: ${{ inputs.promotion_lookback || '50' }}
      promotion_source_branch: ${{ inputs.promotion_source_branch || '' }}
      promotion_target_branch: ${{ inputs.promotion_target_branch || '' }}
      promotion_path_prefix: ${{ inputs.promotion_path_prefix || '' }}
      rebase_cascade: ${{ github.event_name != 'workflow_dispatch' || inputs.rebase_cascade }}
      detector_handoff: ${{ inputs.detector_handoff || false }}
      manual_retry: ${{ inputs.manual_retry || false }}
      depth: ${{ inputs.depth || '0' }}
      feature_stack_plan_b64: ${{ inputs.feature_stack_plan_b64 || '' }}
      feature_stack_run_id: ${{ inputs.feature_stack_run_id || '' }}
    secrets: inherit
