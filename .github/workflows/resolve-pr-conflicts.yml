# AI-powered PR conflict resolution.
#
# Supersedes .github/workflows/pr-conflict-resolver.yml (PR #81), which gave
# the model unrestricted Bash(git:*)/Bash(gh:*); exactly one push-triggered
# resolver may exist or they race each other's pushes.
#
# When any branch is pushed, every open PR (drafts included) that TARGETS that
# branch — and the open PR FROM it, whose conflict may have been created by
# that very head push during a quiet stretch on the base — is checked for
# merge conflicts. A twice-hourly repository-wide sweep catches old conflicts
# whose original event predated or otherwise missed the resolver, and a push to
# the `github-actions` control-plane branch itself sweeps every open PR at once
# — landing a resolver change is precisely when every conflicting PR deserves
# an immediate retry under the new revision instead of waiting for the clock.
#
# OPT-OUT: a PR labelled `no-ai-merge` is dropped by the detector before any
# comment, dispatch, or AI spend, on every trigger including the sweeps. Remove
# the label to hand the PR back to the resolver. (`no-ai-rebase` is narrower —
# it declines history rewriting only, and such a PR still uses this resolver.)
#
# CONTROL-PLANE IDENTITY (load-bearing): the product branches carry thin
# listeners — one `uses:` of this file pinned at `@github-actions`, no runners,
# no steps, no shell (enforced by remix/scripts/workflow-caller-contract.mjs) —
# and every trigger they receive reaches this implementation through
# `workflow_call`. In a called workflow `github.ref_name` is the CALLER's ref,
# so a bare `github.ref_name == 'github-actions'` test rejects the entire
# listener path: `develop`'s listener failed 100% of the time, in `detect`, on
# every push, schedule and handoff it received, including the worker
# handoffs that older branch copies still aim at the retired ref. That was red
# noise rather than lost resolutions, because the detectors that run directly on
# this branch cover the same work. Each gate below therefore asks:
#
#   github.ref_name == 'github-actions'                       (direct run)
#   || github.workflow_ref == '<repo>/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop'
#   || github.workflow_ref == '<repo>/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main'
#
# The caller contract is what makes the second and third clauses safe: a file
# matching those names on a product branch cannot contain executable behavior
# and cannot call anything but this implementation at this ref. `main` is listed
# ahead of its own conversion to a listener; its current full copy has no
# `uses:` and so can never satisfy the test. `github.job_workflow_ref` would
# name the called file directly and be the tighter check, but it exists only as
# an OIDC claim, not in the expression context.
#
# TRIGGER SHAPE (load-bearing): claude-code-action@v1 rejects the `push` event
# ("Unsupported event type: push"), so a push-triggered run can only DETECT and
# then hand off — the `handoff` job dispatches one exact PR selection to this
# workflow at the protected `github-actions` control-plane ref. That internal
# workflow_dispatch (a supported event) performs the resolution. Do not move the
# resolve job back onto `push`; the AI step fails there every time, after the
# merge has already been computed. pull_request_target and legacy
# repository_dispatch runs take the same detector-only handoff hop — the action
# rejects target-context events too, and PR code must never run there anyway.
# Conflicting same-repo PRs get the base
# branch merged into their head, with Claude resolving the conflicted files,
# and the merge commit pushed back to the PR branch.
#
# Secrets:
# - ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (one required): powers the
#   resolution agent (OAuth token via `/install-github-app` in the claude CLI),
#   and, when present, LLM semantic extraction in the post-merge graphify
#   refresh (ANTHROPIC_API_KEY selects graphify's claude API backend;
#   CLAUDE_CODE_OAUTH_TOKEN its claude-cli backend).
# - CONFLICT_RESOLVER_PAT (optional): a PAT with repo + workflow scope. Without
#   it, pushes use GITHUB_TOKEN, which GitHub rejects whenever the merge brings
#   ANY change under .github/workflows/ (workflow runs are then skipped early,
#   before AI spend, with a comment explaining the manual step). With it, those
#   merges push fine AND the pushed merge commit retriggers CI + this workflow
#   (natural stacked-PR cascade).
#
# Security model (the AI is treated as untrusted — conflicted file content can
# prompt-inject it):
# - The model has NO shell and NO git access — it ONLY edits files in the
#   working tree (Read/Grep/Glob/Edit/Write). All git operations (staging,
#   commit, push) are deterministic workflow steps. This removes the entire
#   git-flag exec surface (e.g. `git grep -O<cmd>`, `git diff --output`,
#   inline-env prefixes) that a git-subcommand allowlist could never fully
#   close for untrusted input.
# - The scope invariant is ENFORCED from git's object store alone: the verify
#   step recomputes the auto-merge with `git merge-tree --write-tree` (HEAD is
#   still the pre-merge commit mid-merge), stages ONLY the recomputed
#   conflicted paths, and diffs the staged index tree against the auto-merge
#   tree — every changed path must be a recomputed conflicted path (or
#   graphify-out/**, reset deterministically before the model runs, with its
#   staged subtree OID checked to equal the base side). Nothing the verify
#   step trusts lives anywhere the model could write; RUNNER_TEMP files are
#   informational only.
# - No network (WebFetch/WebSearch disallowed). .git/**, /proc/**, RUNNER_TEMP,
#   and $HOME git config are denied to the file tools as defense-in-depth, and
#   user/system git config is pinned to /dev/null (GIT_CONFIG_GLOBAL/SYSTEM) so
#   a stray write can't reconfigure git; enforcement does not rely on these
#   holding.
# - persist-credentials: false — no token in .git/config for the model to
#   read; the push step injects auth via GIT_CONFIG_* env at push time only,
#   and pushes to an explicit https URL (immune to remote-URL tampering).
# - If the model deliberately leaves exactly one pnpm-lock.yaml marker-bearing
#   after resolving every other conflict, a separate trusted step regenerates
#   it from the base-side lockfile with the adjacent package.json and pinned
#   pnpm@10.12.1. That subprocess receives an empty environment, no AI or
#   repository-write credentials, and disables lifecycle scripts + pnpmfile
#   hooks. The step proves every non-lockfile worktree byte stayed unchanged;
#   the existing verifier still independently re-derives/stages/commits it.
# - All deterministic git steps run hook-proof (core.hooksPath=/dev/null,
#   core.fsmonitor=false via job-level GIT_CONFIG_* env), so a planted
#   .git/hooks script can never execute.
# - Detection snapshots the exact live head/base refs. Checkout and merge use
#   those immutable SHAs; immediately before publication the workflow repeats
#   the PR, repository, ref, ownership-label, stack-topology, default/protected
#   branch, and live-SHA checks. An exact head lease preserves any concurrent
#   push, and a post-push live-ref query classifies ambiguous transport errors.
# - Staged conflicted files are scanned for the raw/base64 ANTHROPIC_API_KEY
#   before commit. This scan is BEST-EFFORT, not a boundary: a determined
#   injection could smuggle an exotic encoding past it. The actual boundary
#   for same-repo collaborators (the only principals who can reach this code
#   path) is that the commit lands on a reviewable PR branch, plus
#   GitGuardian's push protection. ANTHROPIC_API_KEY necessarily sits in the
#   model's own process env; treat it as exposed to same-repo collaborators
#   who can engineer a conflict, and scope/rotate it accordingly.
# - Fork PRs, protected heads, and the default branch are skipped: we can't
#   safely push to them, and running the model when publication is forbidden
#   would expose content to secrets and spend AI budget for no useful result.
# - GITHUB_TOKEN pushes don't retrigger `push` workflows (no self-loops);
#   direct stacked children are dispatched individually to the fixed `github-actions`
#   control plane, with a depth cap as a loop guard. No secret-bearing resolver
#   YAML is loaded from an arbitrary PR base or head ref.
# - An unchanged, still-eligible PR is labelled ai-merge-paused after a failed
#   run, so the global sweep cannot spend AI budget every 30 minutes forever.
#   The pause is bound to one strict bot-authored owner/ref/SHA/topology marker;
#   changed snapshots recover automatically, while an explicit human PR/base/
#   head selector carries a manual-retry intent through the trusted handoff and
#   deliberately clears and retries an unchanged hold.
#
# graphify-out/** is never given to the AI. The repo's merge driver for
# graph.json is not configured in CI, so git would silently text-merge it into
# a mixed base+head union (the poisoned-pair state CLAUDE.md forbids). Instead,
# when BOTH sides touched graphify-out since the merge base, the whole
# directory is deterministically reset to the base side before anything else.
# AFTER the resolution is verified and committed, the graph is refreshed on a
# pristine reset tree and committed separately, so the pushed graph reflects
# the merged code. That ordering is required: the verify step asserts the
# staged graphify-out subtree still equals the base side, so refreshing
# earlier would fail its own check.
#
# The refresh includes LLM SEMANTIC extraction when a Claude credential
# exists: `graphify extract` + `graphify cluster-only` with whichever backend
# the repo's secret supports (ANTHROPIC_API_KEY → claude API backend;
# CLAUDE_CODE_OAUTH_TOKEN → claude-cli backend, the same credential the
# resolver itself runs on). extract is manifest-incremental, and unchanged
# content is served from the tracked content-addressed semantic cache
# (graphify-out/cache/semantic/), so only content genuinely new to the merge
# reaches the LLM — a typical conflict merge costs a handful of calls, often
# zero. `extract --no-cluster` must NEVER be used here: it writes only the
# newly-extracted nodes (verified: it reduces a 24k-node graph to 1 node),
# and as a mechanical backstop for that whole failure class, a semantic
# result whose node count halved is refused before staging.
# With no credential, or when extraction fails, the step falls back to the
# old AST-only `graphify update`. Handing this step a credential exposes it
# to the pinned graphifyy package and the claude CLI (no NEW principals —
# the resolve step already runs on the same secret); in exchange, the staged
# refresh outputs get the same best-effort secret scan as resolved files
# before committing, and the step still runs only after verification, on a
# tree the model never influenced.

name: Resolve PR conflicts (AI)

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && github.actor == 'github-actions[bot]'
      && github.ref_name == 'github-actions'
      && inputs.promotion_source_pr != ''
      && inputs.promotion_plan_b64 != ''
      && inputs.detector_handoff != true
      && inputs.manual_retry != true
      && inputs.depth == '0'
      && inputs.pr_number == ''
      && inputs.branch == ''
      && format('AI-resolve promotion for source PR #{0}', inputs.promotion_source_pr)
      || github.event_name == 'workflow_dispatch'
      && inputs.detector_handoff == true
      && github.actor == 'github-actions[bot]'
      && github.ref_name == 'github-actions'
      && inputs.pr_number != ''
      && inputs.branch == ''
      && format('Resolve PR #{0} from github-actions control plane', inputs.pr_number)
      || github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
      && format('Detect conflicts for PR #{0}', inputs.pr_number)
      || github.event_name == 'workflow_dispatch' && inputs.branch != ''
      && format('Detect conflicts matching PR base/head {0}', inputs.branch)
      || github.event_name == 'push' && github.ref_name == 'github-actions'
      && 'Detect conflicts across all open PRs (control-plane push)'
      || (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch'
              && inputs.pr_number == '' && inputs.branch == ''))
      && 'Detect conflicts across all open PRs'
      || format('Detect conflicts under {0}',
          github.event.client_payload.branch
          || github.event.pull_request.base.ref
          || github.ref_name) }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Exact PR to scan (takes precedence over branch); leave blank for a branch/all scan"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan; leave blank with no PR number to scan all"
        required: false
        default: ""
        type: string
      detector_handoff:
        description: "Internal: exact-PR handoff to the github-actions resolver control plane (leave false)"
        required: false
        default: false
        type: boolean
      manual_retry:
        description: "Internal: carry a human explicit-selector retry through the trusted handoff"
        required: false
        default: false
        type: boolean
      depth:
        description: "Internal: stacked-PR cascade depth (leave at 0)"
        required: false
        default: "0"
        type: string
      promotion_source_pr:
        description: "Internal: merged develop source PR"
        required: false
        default: ""
        type: string
      promotion_plan_b64:
        description: "Internal: canonical-base64 immutable promotion routing plan"
        required: false
        default: ""
        type: string
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: string
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string
      routing_proof:
        description: "Internal: signed proof for an already-validated provider route"
        required: false
        default: ""
        type: string
      routing_proof_issued_at:
        description: "Internal: Unix timestamp bound into routing_proof"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "**"
  # A PR branched off a STALE base can be born conflicting, and no push to the
  # base follows it — so without this it would sit unresolved until the next
  # unrelated base push. This MUST be pull_request_target, not pull_request:
  # GitHub creates NO pull_request run for a PR that opens CONFLICTING (there
  # is no merge ref to build one from — verified empirically on canary PR
  # #176, where zero runs appeared while mergeable PRs did get runs), so a
  # plain pull_request trigger is a no-op for exactly the case it exists to
  # catch. pull_request_target fires from the base-branch context regardless
  # of mergeability. SECURITY: target-context runs never check out or execute
  # PR code here — the detect job is API-only, the resolve job is excluded
  # for this event, and resolution happens only after an exact-PR selection is
  # handed off to the fixed `github-actions` control-plane revision, the same hop every
  # detector takes.
  # Deliberately NOT `synchronize`: that fires on every push to a PR head,
  # including this workflow's own resolution pushes. Head pushes are covered
  # by the plain `push` trigger instead — its detect run also scans the PR
  # FROM the pushed branch (see the scan step), which catches conflicts a
  # head push itself creates, without adding a per-PR target-context event.
  pull_request_target:
    types: [opened, reopened]
  schedule:
    # Event triggers already cover every branch. This global backstop catches
    # open conflicts whose creating event was missed or predates the workflow.
    # It is offset from the rebase-only sweep to keep API and runner bursts
    # separate while preserving deterministic merge-vs-rebase ownership.
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Exact PR to scan (takes precedence over branch); leave blank for a branch/all scan"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan; leave blank with no PR number to scan all"
        required: false
        default: ""
        type: string
      detector_handoff:
        description: "Internal: exact-PR handoff to the github-actions resolver control plane (leave false)"
        required: false
        default: false
        type: boolean
      manual_retry:
        description: "Internal: carry a human explicit-selector retry through the trusted handoff"
        required: false
        default: false
        type: boolean
      depth:
        description: "Internal: stacked-PR cascade depth (leave at 0)"
        required: false
        default: "0"
        type: string
      promotion_source_pr:
        description: "Internal: merged develop source PR"
        required: false
        default: ""
        type: string
      promotion_plan_b64:
        description: "Internal: canonical-base64 immutable promotion routing plan"
        required: false
        default: ""
        type: string
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: choice
        options: [github-actions, vercel-sandbox]
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string
      routing_proof:
        description: "Internal: signed proof for an already-validated provider route"
        required: false
        default: ""
        type: string
      routing_proof_issued_at:
        description: "Internal: Unix timestamp bound into routing_proof"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [resolve-conflicts-cascade]

# Detector runs are disposable; internal per-PR workers are not. A detector and
# the worker it spawns must never share a cancellation namespace.
concurrency:
  # Distinct namespaces are load-bearing:
  #   resolve-detect-*   external/event/API-only detectors
  #   resolve-pr<N>      one internal github-actions-control-plane worker per PR
  # A human exact-PR detector therefore cannot cancel the worker it creates.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && github.actor == 'github-actions[bot]'
        && (github.ref_name == 'github-actions'
           || github.workflow_ref
           == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
           || github.workflow_ref
           == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository))
        && inputs.promotion_source_pr != ''
        && inputs.promotion_plan_b64 != ''
        && inputs.detector_handoff != true
        && inputs.manual_retry != true
        && inputs.depth == '0'
        && inputs.pr_number == ''
        && inputs.branch == ''
        && format('resolve-promotion-pr{0}', inputs.promotion_source_pr)
        || (inputs.promotion_source_pr != '' || inputs.promotion_plan_b64 != '')
        && format('resolve-invalid-promotion-{0}', github.run_id)
        || github.event_name == 'workflow_dispatch'
        && inputs.detector_handoff == true
        && github.actor == 'github-actions[bot]'
        && (github.ref_name == 'github-actions'
           || github.workflow_ref
           == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
           || github.workflow_ref
           == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository))
        && inputs.pr_number != ''
        && inputs.branch == ''
        && format('resolve-pr{0}', inputs.pr_number)
        || github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        && format('resolve-detect-pr{0}', inputs.pr_number)
        || github.event_name == 'workflow_dispatch' && inputs.branch != ''
        && format('resolve-detect-selector-{0}', inputs.branch)
        || (github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch')
        && 'resolve-detect-all-open'
        || github.event_name == 'push'
        && format('resolve-detect-{0}', github.ref_name)
        || (github.event.pull_request.number
            && format('resolve-detect-pr{0}', github.event.pull_request.number))
        || github.event_name == 'repository_dispatch'
        && format('resolve-detect-legacy-{0}',
             github.event.client_payload.branch || github.run_id)
        || format('resolve-detect-{0}-{1}',
             github.event_name, github.ref_name || github.run_id) }}
  # Every external detector is safe to supersede. A validated internal worker
  # must finish or fail coherently; never cancel it halfway through a merge.
  cancel-in-progress: >-
    ${{ !(github.event_name == 'workflow_dispatch'
          && (github.ref_name == 'github-actions'
             || github.workflow_ref
             == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
             || github.workflow_ref
             == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository))
          && (((github.actor == 'github-actions[bot]')
               && inputs.promotion_source_pr != ''
               && inputs.promotion_plan_b64 != ''
               && inputs.detector_handoff != true
               && inputs.manual_retry != true
               && inputs.depth == '0'
               && inputs.pr_number == ''
               && inputs.branch == '')
              || (github.actor == 'github-actions[bot]'
                  && inputs.promotion_source_pr == ''
                  && inputs.promotion_plan_b64 == ''
                  && inputs.detector_handoff == true
                  && inputs.pr_number != ''
                  && inputs.branch == ''))) }}

permissions:
  contents: read

jobs:
  route:
    if: inputs.promotion_source_pr == '' && inputs.promotion_plan_b64 == ''
    uses: ./.github/workflows/ci-provider-router.yml
    with:
      workflow: resolve-conflicts
      execution_provider: ${{ inputs.execution_provider || github.event.client_payload.execution_provider || 'github-actions' }}
      runner_label: ${{ inputs.runner_label || github.event.client_payload.runner_label || '' }}
      control_dispatch_id: ${{ inputs.control_dispatch_id || github.event.client_payload.control_dispatch_id || '' }}
      routing_proof: ${{ inputs.routing_proof || github.event.client_payload.routing_proof || '' }}
      routing_proof_issued_at: ${{ inputs.routing_proof_issued_at || github.event.client_payload.routing_proof_issued_at || '' }}
      internal_worker: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.detector_handoff == true
            && inputs.pr_number != ''
            && inputs.branch == ''
            && inputs.promotion_source_pr == ''
            && inputs.promotion_plan_b64 == '' }}
      pr_number: ${{ inputs.pr_number || github.event.client_payload.pr_number || github.event.pull_request.number || '' }}
      branch: ${{ inputs.branch || (github.event_name == 'push' && github.ref_name) || '' }}
    secrets: inherit

  detect:
    name: Find merge-conflicting PRs
    needs: route
    # Branch deletions also fire `push`; there is nothing to scan then.
    if: >-
      needs.route.outputs.execute == 'true'
      && inputs.promotion_source_pr == ''
      && inputs.promotion_plan_b64 == ''
      && (github.event_name != 'push' || github.event.deleted == false)
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    # Mergeability polling alone may legitimately spend MERGEABLE_POLL_SECONDS
    # (~8 minutes) before classification starts; keep headroom for sweeps.
    timeout-minutes: 15
    permissions:
      contents: read
      # Still an API-only detector: nothing is checked out and no code from
      # scanned PRs runs here. Write access exists solely to upsert the
      # detect-status comment on PRs the detector must leave alone (fork
      # conflicts, verdicts that never settle) so silence is never ambiguous.
      pull-requests: write
      issues: write
    outputs:
      prs: ${{ steps.scan.outputs.prs }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Scan open PRs and assign deterministic resolver ownership
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          # Identity of the workflow that STARTED the run. Under
          # workflow_call that is the thin product-branch listener, not
          # this file; see CONTROL-PLANE IDENTITY at the top.
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_ACTOR: ${{ github.actor }}
          TARGET: ${{ github.event.client_payload.branch || inputs.branch || github.event.pull_request.base.ref || github.ref_name }}
          SELECTED_PR: ${{ inputs.pr_number }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEPTH: ${{ github.event.client_payload.depth || inputs.depth || '0' }}
          DETECTOR_HANDOFF: ${{ inputs.detector_handoff && 'true' || 'false' }}
          ROUTED_MANUAL_RETRY: ${{ inputs.manual_retry && 'true' || 'false' }}
          # Set only on pull_request_target events: narrows the scan to the
          # triggering PR instead of every PR sharing its base. TARGET reads
          # base.ref from the PR record rather than event ref context, which
          # stays correct regardless of which ref the event ran from.
          ONLY_PR: ${{ github.event.pull_request.number }}
          # Pushes and explicit human branch selectors match either PR base or
          # PR head. A head push can CREATE a conflict (`synchronize` is
          # deliberately not a trigger, and the next base push may be days
          # away — observed on PR #173, which made itself conflicted and sat
          # unresolved). The exact PR-number selector takes precedence below.
          # Costs nothing: this run exists for every push anyway. Cannot
          # loop: the resolver's own resolution push makes its PR mergeable,
          # so that push's detect run finds nothing to do.
          SCAN_HEAD: >-
            ${{ github.event_name == 'push'
                || (github.event_name == 'workflow_dispatch'
                    && inputs.detector_handoff != true
                    && inputs.pr_number == ''
                    && inputs.branch != '') }}
          # Scheduled sweeps and external blank manual runs cover every open PR.
          # Internal workers always carry an exact PR number and never scan all.
          # A push to the control-plane branch ITSELF sweeps everything too: no
          # PR targets `github-actions`, so the ordinary base/head match would
          # find nothing, yet a control-plane push is exactly when every open
          # PR deserves a fresh attempt under the new resolver revision (a
          # resolver bug fix should not wait up to 30 minutes for the next
          # scheduled sweep). PRs labelled no-ai-merge are excluded below.
          SCAN_ALL: >-
            ${{ github.event_name == 'schedule'
                || (github.event_name == 'push'
                    && github.ref_name == 'github-actions')
                || (github.event_name == 'workflow_dispatch'
                    && inputs.detector_handoff != true
                    && inputs.pr_number == ''
                    && inputs.branch == '') }}
          HUMAN_EXPLICIT: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.detector_handoff != true
                && (inputs.pr_number != '' || inputs.branch != '') }}
          # An explicit human PR/base/head detector is the deliberate recovery
          # path for ai-merge-paused PRs. The detector passes that intent to the
          # internal worker; ordinary events and machine handoffs never invent it.
          MANUAL_RETRY: >-
            ${{ github.event_name == 'workflow_dispatch'
                && ((inputs.detector_handoff == true
                     && inputs.manual_retry == true)
                    || (inputs.detector_handoff != true
                        && (inputs.pr_number != '' || inputs.branch != ''))) }}
          # GitHub computes a PR's mergeability lazily after its base moves,
          # and verdicts can take several minutes to settle on a busy base
          # (observed ~6 minutes on PR #190, where the old 80-second poll gave
          # up and the conflict sat undetected until the scheduled sweep).
          # Total time budget for verdicts, and the pause between re-queries.
          MERGEABLE_POLL_SECONDS: "500"
          MERGEABLE_POLL_INTERVAL: "15"
        run: |
          set -euo pipefail

          # "Am I the control-plane revision?" — see CONTROL-PLANE IDENTITY
          # at the top of this file. Either this run started on github-actions,
          # or a thin product-branch listener for this same workflow called us,
          # and the caller contract guarantees such a listener can only call
          # this file pinned at @github-actions.
          control_plane_revision() {
            local self="$REPO/.github/workflows/resolve-pr-conflicts.yml"
            if [ "$EVENT_REF" = github-actions ]; then
              return 0
            fi
            if [ "$CALLER_WORKFLOW_REF" = "$self@refs/heads/develop" ] \
               || [ "$CALLER_WORKFLOW_REF" = "$self@refs/heads/main" ]; then
              return 0
            fi
            return 1
          }
          echo "Control plane entered via: ${CALLER_WORKFLOW_REF:-<none>} (ref $EVENT_REF)"

          case "$DEPTH" in
            ''|*[!0-9]*)
              echo "::error::depth must be a decimal integer from 0 through 3."
              exit 1
              ;;
          esac
          if [ "$DEPTH" -gt 3 ]; then
            echo "::error::depth must not exceed the cascade cap of 3."
            exit 1
          fi
          if [ -n "$SELECTED_PR" ]; then
            if ! [[ "$SELECTED_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive decimal PR number."
              exit 1
            fi
          fi
          if [ "$ROUTED_MANUAL_RETRY" = true ]; then
            if [ "$DETECTOR_HANDOFF" != true ]; then
              echo "::error::manual_retry is internal routing state and requires detector_handoff."
              exit 1
            fi
          fi
          if [ "$DETECTOR_HANDOFF" = true ]; then
            # detector_handoff/manual_retry are routing metadata, not authority.
            # Fixed develop YAML plus exact live PR/ref revalidation are the
            # substantive controls; the bot actor check is provenance
            # defense-in-depth and still permits re-runs of bot-originated work.
            invalid_handoff=false
            [ "$EVENT_NAME" = workflow_dispatch ] || invalid_handoff=true
            control_plane_revision || invalid_handoff=true
            [ "$EVENT_ACTOR" = "github-actions[bot]" ] || invalid_handoff=true
            [ -n "$SELECTED_PR" ] || invalid_handoff=true
            [ -z "$INPUT_BRANCH" ] || invalid_handoff=true
            if [ "$invalid_handoff" = true ]; then
              echo "::error::Invalid internal resolver handoff: require a bot-authored workflow_dispatch of the github-actions revision (directly, or through the develop/main listener) with a positive pr_number and empty branch."
              exit 1
            fi
          fi

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          decode_base64url() {
            local value="$1"
            value="$(tr '_-' '/+' <<<"$value" | tr -d '\n')"
            case $((${#value} % 4)) in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$value" | base64 --decode
          }

          # Detection visibility: reviewers otherwise see only GitHub's
          # conflict banner plus this workflow's always-skipped push-run check
          # stubs, so a detector that stands aside must say so ON the PR.
          # Upserted via hidden marker: repeat runs edit one status comment
          # instead of stacking new ones, and a comment failure never blocks
          # detection. Handed-off conflicts announce themselves through the
          # resolve job's "Auto-resolve running" comment instead.
          upsert_detect_comment() {
            local number="$1" text="$2"
            local marker='<!-- thingtime-merge-detect-status:v1 -->'
            local body comment_id
            body="$RUNNER_TEMP/detect-status-$number.md"
            {
              printf '%s\n\n' "$text"
              printf '_Posted by the conflict detector at %s; this notice is edited in place on re-checks._\n\n%s\n' \
                "$(date -u '+%H:%M UTC, %Y-%m-%d')" "$marker"
            } > "$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp \
              | jq -r '
                  add // []
                  | [.[]
                      | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("thingtime-merge-detect-status:v1"))
                      | .id]
                  | last // empty
                ')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$number/comments" -F "body=@$body" >/dev/null
            fi
          }

          all_open_prs() {
            local owner name
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            # GraphQL variable names must remain literal for gh to bind them.
            # shellcheck disable=SC2016
            gh api graphql --paginate --slurp \
              -f owner="$owner" \
              -f name="$name" \
              -f query='query($owner: String!, $name: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(
                    first: 100,
                    states: OPEN,
                    after: $endCursor,
                    orderBy: {field: CREATED_AT, direction: ASC}
                  ) {
                    nodes {
                      number
                      headRefName
                      baseRefName
                      isCrossRepository
                      isDraft
                      mergeable
                      labels(first: 100) { nodes { name } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }' \
              | jq -c '[.[].data.repository.pullRequests.nodes[]
                  | {number, headRefName, baseRefName, isCrossRepository,
                     isDraft, mergeable, labels:(.labels.nodes // [])}]'
          }

          query() {
            local open
            open="$(all_open_prs)"
            if [ -n "$SELECTED_PR" ]; then
              jq -c --argjson number "$SELECTED_PR" '[.[] | select(.number == $number)]' <<<"$open"
              return
            fi
            if [ "$SCAN_ALL" = "true" ]; then
              printf '%s\n' "$open"
              return
            fi
            jq -c \
              --arg target "$TARGET" \
              --argjson scan_head "$SCAN_HEAD" '
                [.[]
                  | select(.baseRefName == $target
                      or ($scan_head and .headRefName == $target))]
                | unique_by(.number)
              ' <<<"$open"
          }

          # GitHub computes mergeability lazily after a base push; poll until
          # every PR has a verdict (querying is itself what triggers compute).
          # Verdicts routinely take minutes to settle after a busy base push —
          # the old fixed eight-attempt/80-second loop gave up too early
          # (observed on PR #190) — so the wait is a time budget that exits
          # the moment every scanned PR has a verdict.
          prs="$(query)"
          if [ "$HUMAN_EXPLICIT" = true ]; then
            if [ "$(jq 'length' <<<"$prs")" -eq 0 ]; then
              if [ -n "$SELECTED_PR" ]; then
                selector="PR #$SELECTED_PR"
                guidance="Enter an open PR number, or clear it and enter that PR's exact base/head branch."
              else
                selector="branch $TARGET"
                guidance="Enter an exact open PR base or head branch, or leave branch blank to scan every open PR."
              fi
              echo "::error::No open PR matched the manual selector: $selector. $guidance"
              {
                echo "## No open PR matched the manual selector"
                echo
                printf -- '- Selector: `%s`\n' "$selector"
                printf -- '- %s\n' "$guidance"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          poll_started="$SECONDS"
          attempt=0
          while :; do
            unknown="$(jq '[.[] | select(.mergeable == "UNKNOWN")] | length' <<<"$prs")"
            [ "$unknown" -eq 0 ] && break
            elapsed="$(( SECONDS - poll_started ))"
            if [ "$elapsed" -ge "$MERGEABLE_POLL_SECONDS" ]; then
              echo "$unknown PR(s) still lack a mergeability verdict after ${elapsed}s; deferring them to the next event or scheduled sweep."
              break
            fi
            attempt="$(( attempt + 1 ))"
            echo "attempt $attempt (${elapsed}s elapsed): $unknown PR(s) still computing mergeability; retrying in ${MERGEABLE_POLL_INTERVAL}s..."
            sleep "$MERGEABLE_POLL_INTERVAL"
            prs="$(query)"
          done

          if [ "$SCAN_ALL" = "true" ]; then
            echo "Open PRs in repository-wide scan:"
          elif [ -n "$SELECTED_PR" ]; then
            echo "Open PR selected exactly as #$SELECTED_PR:"
          elif [ "$SCAN_HEAD" = "true" ]; then
            echo "Open PRs whose base or head matches $TARGET:"
          else
            echo "Open PRs based on $TARGET:"
          fi
          jq -r '.[] | "  #\(.number) \(.headRefName) draft=\(.isDraft) mergeable=\(.mergeable) fork=\(.isCrossRepository)"' <<<"$prs"

          # Resolver ownership must not depend on which detector wins a race.
          # Build the full open same-repo PR graph so stack members go to the
          # rebase workflow before either workflow has had time to add labels.
          # A no-ai-rebase PR is a topology boundary as well as an opt-out:
          # long-lived integration branches use that label on their promotion
          # PR, and must not make every feature PR targeting the integration
          # branch look like one enormous stack.
          all_open="$(all_open_prs)"
          # A reverse synchronization/promotion PR headed by the default branch
          # is not a stack parent for ordinary PRs based on that branch.
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"

          # A pause belongs to one exact failed snapshot, recorded in a strict
          # hidden marker in the github-actions bot's failure comment. Ref or
          # topology changes make it stale and eligible again. Missing or
          # malformed legacy metadata fails closed until a named manual retry.
          recover_merge_paused='[]'
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            paused_pr="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$paused_pr")"
            head="$(jq -r '.headRefName' <<<"$paused_pr")"
            base="$(jq -r '.baseRefName' <<<"$paused_pr")"
            if [ "$MANUAL_RETRY" = true ]; then
              recover_merge_paused="$(jq -c --argjson n "$number" '. + [$n] | unique' \
                <<<"$recover_merge_paused")"
              continue
            fi

            stack_member="$(jq -r --argjson n "$number" --arg head "$head" --arg base "$base" --arg default_ref "$default_ref" '
              any(.[];
                .number != $n
                and (.isCrossRepository | not)
                and ([.labels[].name] | index("no-ai-rebase") == null)
                and ((.headRefName == $base and $base != $default_ref)
                     or (.baseRefName == $head and $head != $default_ref)))
            ' <<<"$all_open")"
            no_ai="$(jq -r '[.labels[].name] | index("no-ai-rebase") != null' <<<"$paused_pr")"
            if [ "$stack_member" = true ] && [ "$no_ai" != true ]; then
              # Rebase ownership now applies. That workflow clears this
              # opposing pause after independently proving its ownership.
              continue
            fi
            topology=standalone
            [ "$stack_member" != true ] || topology=no-ai-stack

            token="$(
              gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp 2>/dev/null \
                | jq -r '
                    add // []
                    | [.[]
                        | select(.user.login == "github-actions[bot]")
                        | .body
                        | capture("<!-- thingtime-ai-conflict-pause:v1 (?<token>[A-Za-z0-9_-]+) -->")?
                        | .token]
                    | last // empty
                  ' 2>/dev/null || true
            )"
            payload=''
            if [ -n "$token" ]; then
              decoded="$(decode_base64url "$token" 2>/dev/null || true)"
              payload="$(jq -ce \
                --argjson number "$number" '
                  select(type == "object")
                  | select(.v == 1 and .owner == "merge" and .pr == $number)
                  | select(.head_ref | type == "string" and length > 0)
                  | select(.base_ref | type == "string" and length > 0)
                  | select(.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  | select(.base_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  | select(.topology == "standalone" or .topology == "no-ai-stack")
                ' <<<"$decoded" 2>/dev/null || true)"
            fi
            if [ -z "$payload" ]; then
              echo "::notice::#$number remains ai-merge-paused: exact bot snapshot metadata is unavailable; use an explicit PR/base/head manual retry."
              continue
            fi

            live_head="$(live_ref_sha "$head" 2>/dev/null || true)"
            live_base="$(live_ref_sha "$base" 2>/dev/null || true)"
            if [ "$head" = "$(jq -r '.head_ref' <<<"$payload")" ] \
               && [ "$base" = "$(jq -r '.base_ref' <<<"$payload")" ] \
               && [ "$live_head" = "$(jq -r '.head_sha' <<<"$payload")" ] \
               && [ "$live_base" = "$(jq -r '.base_sha' <<<"$payload")" ] \
               && [ "$topology" = "$(jq -r '.topology' <<<"$payload")" ]; then
              echo "::notice::#$number remains ai-merge-paused at its exact failed snapshot."
              continue
            fi
            echo "#$number: ai-merge-paused snapshot is stale; routing the current state again."
            recover_merge_paused="$(jq -c --argjson n "$number" '. + [$n] | unique' \
              <<<"$recover_merge_paused")"
          done < <(jq -r '
            .[]
            | select([.labels[].name] | index("ai-merge-paused") != null)
            | @base64
          ' <<<"$prs")

          # The owner opt-out. `no-ai-rebase` only declines history rewriting;
          # `no-ai-merge` declines automatic conflict resolution outright, so
          # these PRs are dropped before any comment, dispatch, or AI spend —
          # including in the repository-wide sweeps.
          opted_out="$(jq -r '[.[] | select(.mergeable == "CONFLICTING") | select([.labels[].name] | index("no-ai-merge") != null) | .number] | join(", ")' <<<"$prs")"
          [ -n "$opted_out" ] && echo "::notice::Skipping PR(s) #$opted_out — labelled no-ai-merge; this PR is opted out of automatic conflict resolution."
          # Retained for the manual-selector summary below, which must still
          # report "matched, nothing to do" rather than falling silent when the
          # only match is opted out.
          matched_open="$(jq 'length' <<<"$prs")"
          prs="$(jq -c '[.[] | select([.labels[].name] | index("no-ai-merge") == null)]' <<<"$prs")"

          skipped="$(jq -r '[.[] | select(.isCrossRepository) | select(.mergeable == "CONFLICTING") | .number] | join(", ")' <<<"$prs")"
          [ -n "$skipped" ] && echo "::warning::Skipping conflicting fork PR(s) #$skipped — cannot push to fork branches."
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            fork_pr="$(base64 --decode <<<"$encoded")"
            fork_number="$(jq -r '.number' <<<"$fork_pr")"
            fork_base="$(jq -r '.baseRefName' <<<"$fork_pr")"
            upsert_detect_comment "$fork_number" \
              "🤖 **Conflict seen — cannot auto-resolve a fork PR.** This PR conflicts with \`$fork_base\`, and the resolver cannot push to branches in a fork. Please resolve the conflicts manually (merge \`$fork_base\` into your branch, or rebase onto it)." \
              || echo "::warning::Could not post the detect-status comment on #$fork_number."
          done < <(jq -r '.[] | select(.isCrossRepository) | select(.mergeable == "CONFLICTING") | @base64' <<<"$prs")
          rebase_active="$(jq -r '[.[] | select(.mergeable == "CONFLICTING") | select([.labels[].name] | index("ai-rebase-in-progress") != null) | .number] | join(", ")' <<<"$prs")"
          [ -n "$rebase_active" ] && echo "::notice::Skipping PR(s) #$rebase_active — the AI PR/stack rebase workflow is actively rewriting them."
          merge_paused="$(jq -r '[.[] | select(.mergeable == "CONFLICTING") | select([.labels[].name] | index("ai-merge-paused") != null) | .number] | join(", ")' <<<"$prs")"
          if [ -n "$merge_paused" ] && [ "$MANUAL_RETRY" != true ]; then
            echo "::notice::Skipping PR(s) #$merge_paused — automatic merge resolution is paused; use an explicit PR/base/head manual run to retry."
          fi
          stacked_owned="$(jq -r --argjson all "$all_open" --arg default_ref "$default_ref" '
            [.[] as $pr
              | $pr
              | select(.isCrossRepository | not)
              | select(.mergeable == "CONFLICTING")
              | select([.labels[].name] | index("no-ai-rebase") == null)
              | select(any($all[];
                  .number != $pr.number
                  and (.isCrossRepository | not)
                  and ([.labels[].name] | index("no-ai-rebase") == null)
                  and ((.headRefName == $pr.baseRefName
                        and $pr.baseRefName != $default_ref)
                       or (.baseRefName == $pr.headRefName
                           and $pr.headRefName != $default_ref))))
              | .number]
            | join(", ")
          ' <<<"$prs")"
          [ -n "$stacked_owned" ] && echo "::notice::Skipping stacked PR(s) #$stacked_owned — the AI PR/stack rebase workflow owns stack history."
          still_unknown="$(jq -r '[.[] | select(.mergeable == "UNKNOWN") | .number] | join(", ")' <<<"$prs")"
          [ -n "$still_unknown" ] && echo "::warning::PR(s) #$still_unknown still UNKNOWN after polling; they will be re-checked by the next event or scheduled sweep."
          while IFS= read -r unknown_number; do
            [ -n "$unknown_number" ] || continue
            upsert_detect_comment "$unknown_number" \
              "🤖 **Mergeability still computing.** The base branch moved, and GitHub had not finished recomputing whether this PR conflicts after the detector waited ${MERGEABLE_POLL_SECONDS}s — so no resolution was started this round. The next push or the twice-hourly scheduled sweep (minutes :02/:32) re-checks automatically; if a conflict is found then, resolution starts and announces itself here." \
              || echo "::warning::Could not post the detect-status comment on #$unknown_number."
          done < <(jq -r '.[] | select(.mergeable == "UNKNOWN") | .number' <<<"$prs")

          # On a pull_request_target event, scan ONLY the triggering PR — the
          # other PRs sharing this base are not this event's business and are
          # already covered by base pushes.
          # `base` comes from the API record of the PR itself, so the resolve
          # job never re-derives it from event context — deriving branch names
          # from event refs is how "<N>/merge"-style ref spoofing and wrong-ref
          # merges happen; the PR record is the single source of truth.
          # Stack membership makes initial ownership disjoint before labels
          # exist. The labels remain the second boundary during a live cascade.
          # `no-ai-rebase` opts only out of history rewriting, so a stack member
          # carrying it may still use this merge-based resolver.
          conflicting="$(jq -c \
            --arg only "${ONLY_PR:-}" \
            --argjson manual_retry "$MANUAL_RETRY" \
            --argjson recover "$recover_merge_paused" \
            --argjson all "$all_open" \
            --arg default_ref "$default_ref" '
            [.[] as $pr
              | $pr
              | select(.isCrossRepository | not)
              | select(.mergeable == "CONFLICTING")
              | select([.labels[].name]
                  | all(. != "ai-rebase-in-progress"))
              | select(([.labels[].name] | index("ai-merge-paused") == null)
                  or any($recover[]; . == $pr.number))
              | select(
                  ([.labels[].name] | index("no-ai-rebase") != null)
                  or (any($all[];
                      .number != $pr.number
                      and (.isCrossRepository | not)
                      and ([.labels[].name] | index("no-ai-rebase") == null)
                      and ((.headRefName == $pr.baseRefName
                            and $pr.baseRefName != $default_ref)
                           or (.baseRefName == $pr.headRefName
                               and $pr.headRefName != $default_ref))) | not))
              | select($only == "" or (.number | tostring) == $only)
              | {number: .number, head: .headRefName, base: .baseRefName,
                  manual_retry: $manual_retry,
                  recover_merge_pause: any($recover[]; . == $pr.number),
                  recover_rebase_pause:
                    ([.labels[].name] | index("ai-rebase-paused") != null)}]
          ' <<<"$prs")"

          # Snapshot the exact live refs rather than trusting PR base/head SHA
          # fields, which GitHub can leave stale for stacked PRs. The actual
          # merge and the push lease both use these immutable snapshots.
          branch_protected() {
            gh api "repos/$REPO/branches/$(encode_ref "$1")" --jq '.protected'
          }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          snapshots='[]'
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            candidate="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$candidate")"
            head="$(jq -r '.head' <<<"$candidate")"
            base="$(jq -r '.base' <<<"$candidate")"
            if [ "$head" = "$default_ref" ]; then
              echo "::warning::Skipping #$number: the repository default branch is never a resolver push target."
              continue
            fi
            if ! protected="$(branch_protected "$head")"; then
              echo "::warning::Skipping #$number for now: head-branch protection could not be verified."
              continue
            fi
            if [ "$protected" = true ]; then
              echo "::warning::Skipping #$number: protected head branch $head cannot be updated automatically."
              continue
            fi
            if ! head_sha="$(live_ref_sha "$head")" \
               || ! base_sha="$(live_ref_sha "$base")"; then
              echo "::warning::Skipping #$number for now: a live branch ref could not be snapshotted."
              continue
            fi
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] \
               || ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::Skipping #$number for now: a live branch ref returned an invalid SHA."
              continue
            fi
            candidate="$(jq -c \
              --arg head_sha "$head_sha" \
              --arg base_sha "$base_sha" \
              '. + {head_sha:$head_sha, base_sha:$base_sha}' \
              <<<"$candidate")"
            snapshots="$(jq -c --argjson item "$candidate" '. + [$item]' <<<"$snapshots")"
          done < <(jq -r '.[] | @base64' <<<"$conflicting")
          conflicting="$snapshots"
          if [ "$HUMAN_EXPLICIT" = true ] \
             && [ "${matched_open:-0}" -gt 0 ] \
             && [ "$(jq 'length' <<<"$conflicting")" -eq 0 ]; then
            matched="$matched_open"
            echo "::warning::The manual selector matched $matched open PR(s), but none is currently eligible for merge-conflict resolution."
            {
              echo "## Manual selector matched, but no merge worker is needed"
              echo
              echo "$matched open PR(s) matched. None is currently eligible for this merge resolver."
              echo
              echo "Mergeable/UNKNOWN PRs, no-ai-merge opt-outs, fork or protected/default heads, paused snapshots, and stack/rebase-owned PRs are intentionally excluded."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "prs=$conflicting" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$conflicting")" >> "$GITHUB_OUTPUT"

  # Creation-time promotion conflicts do not have a PR yet, so the ordinary
  # detector cannot own them. The promoter first creates an immutable empty
  # reservation commit, then dispatches this fixed github-actions revision. Validate
  # that routing and every live GitHub object before any secret-bearing job.
  promotion_validate:
    name: Validate trusted promotion handoff
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.promotion_source_pr != '' || inputs.promotion_plan_b64 != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      noop: ${{ steps.validate.outputs.noop }}
      base_ref: ${{ steps.validate.outputs.base_ref }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      promotion_branch: ${{ steps.validate.outputs.promotion_branch }}
      reservation_sha: ${{ steps.validate.outputs.reservation_sha }}
      source_tip_sha: ${{ steps.validate.outputs.source_tip_sha }}
      source_start_sha: ${{ steps.validate.outputs.source_start_sha }}
      source_end_sha: ${{ steps.validate.outputs.source_end_sha }}
      source_lineage_status: ${{ steps.validate.outputs.source_lineage_status }}
      source_ref: ${{ steps.validate.outputs.source_ref }}
      plan_hash: ${{ steps.validate.outputs.plan_hash }}
      title_b64: ${{ steps.validate.outputs.title_b64 }}
      body_b64: ${{ steps.validate.outputs.body_b64 }}
    steps:
      - name: Validate routing, snapshots, reservation, and review labels
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          # Identity of the workflow that STARTED the run. Under
          # workflow_call that is the thin product-branch listener, not
          # this file; see CONTROL-PLANE IDENTITY at the top.
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_ACTOR: ${{ github.actor }}
          ORDINARY_PR: ${{ inputs.pr_number }}
          ORDINARY_BRANCH: ${{ inputs.branch }}
          DETECTOR_HANDOFF: ${{ inputs.detector_handoff && 'true' || 'false' }}
          MANUAL_RETRY: ${{ inputs.manual_retry && 'true' || 'false' }}
          DEPTH: ${{ inputs.depth }}
          SOURCE_PR: ${{ inputs.promotion_source_pr }}
          PLAN_B64: ${{ inputs.promotion_plan_b64 }}
          EXECUTION_PROVIDER: ${{ inputs.execution_provider }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          CONTROL_DISPATCH_ID: ${{ inputs.control_dispatch_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$*"; exit 1; }
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          safe_ref() {
            local ref="$1"
            [ -n "$ref" ] && [ "${#ref}" -le 240 ] \
              && git check-ref-format "refs/heads/$ref" >/dev/null 2>&1 \
              && [[ "$ref" != refs/* ]]
          }
          require_trailer() {
            local message="$1" expected="$2" count
            count="$(grep -Fxc -- "$expected" <<<"$message" || true)"
            [ "$count" = 1 ] || fail "Reservation commit must contain exactly one '$expected' trailer."
          }
          upsert_source_status() {
            local text="$1" marker='<!-- thingtime-ai-promotion-status:v1 -->'
            local body="$RUNNER_TEMP/promotion-status.md" comment_id
            {
              printf '%s\n\n' "$text"
              printf 'Immutable plan: `%s` · [workflow run](%s)\n\n%s\n' "$PLAN_HASH" "$RUN_URL" "$marker"
            } >"$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$SOURCE_PR/comments?per_page=100" --slurp \
              | jq -r 'add // [] | [.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("thingtime-ai-promotion-status:v1")) | .id] | last // empty')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$SOURCE_PR/comments" -F "body=@$body" >/dev/null
            fi
          }

          # "Am I the control-plane revision?" — see CONTROL-PLANE IDENTITY
          # at the top of this file. Either this run started on github-actions,
          # or a thin product-branch listener for this same workflow called us,
          # and the caller contract guarantees such a listener can only call
          # this file pinned at @github-actions.
          control_plane_revision() {
            local self="$REPO/.github/workflows/resolve-pr-conflicts.yml"
            if [ "$EVENT_REF" = github-actions ]; then
              return 0
            fi
            if [ "$CALLER_WORKFLOW_REF" = "$self@refs/heads/develop" ] \
               || [ "$CALLER_WORKFLOW_REF" = "$self@refs/heads/main" ]; then
              return 0
            fi
            return 1
          }
          echo "Control plane entered via: ${CALLER_WORKFLOW_REF:-<none>} (ref $EVENT_REF)"

          [ "$EVENT_NAME" = workflow_dispatch ] || fail "Promotion handoff requires workflow_dispatch."
          control_plane_revision || fail "Promotion handoff must run the github-actions revision (directly, or through the develop/main listener)."
          [ "$EVENT_ACTOR" = 'github-actions[bot]' ] || fail "Promotion handoff must be bot-authored."
          [ "$EXECUTION_PROVIDER" = github-actions ] \
            || fail "Promotion handoff cannot use external compute routing."
          [ -z "$RUNNER_LABEL" ] && [ -z "$CONTROL_DISPATCH_ID" ] \
            || fail "Promotion handoff cannot carry external runner metadata."
          [ -z "$ORDINARY_PR" ] && [ -z "$ORDINARY_BRANCH" ] \
            || fail "Promotion and ordinary PR selectors are mutually exclusive."
          [ "$DETECTOR_HANDOFF" = false ] && [ "$MANUAL_RETRY" = false ] \
            || fail "Promotion and ordinary detector routing flags are mutually exclusive."
          [ "${DEPTH:-0}" = 0 ] || fail "Promotion handoff depth must remain zero."
          [[ "$SOURCE_PR" =~ ^[1-9][0-9]*$ ]] || fail "promotion_source_pr must be a positive decimal number."

          # Keep the dispatch surface small and stable: all non-routing
          # promotion values travel in one canonical, bounded JSON envelope
          # and reach the secret-bearing job only after validation.
          export PLAN_B64
          node <<'NODE'
          const fs = require('node:fs');
          const { TextDecoder } = require('node:util');
          const encoded = process.env.PLAN_B64 || '';
          if (encoded.length > 60000 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
            throw new Error('promotion_plan_b64 is oversized or non-canonical');
          }
          const bytes = Buffer.from(encoded, 'base64');
          if (!bytes.length || bytes.length > 45000 || bytes.toString('base64') !== encoded) {
            throw new Error('promotion plan envelope is empty, oversized, or non-canonical');
          }
          const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
          if (text.includes('\0')) throw new Error('promotion plan contains NUL');
          const value = JSON.parse(text);
          const keys = ['base_ref','base_sha','source_ref','branch','reservation_sha','source_tip_sha','source_start_sha','source_end_sha','source_lineage_status','plan_hash','title_b64','body_b64'];
          if (!value || Array.isArray(value) || Object.keys(value).join(',') !== keys.join(',') || JSON.stringify(value) !== text) {
            throw new Error('promotion plan must be canonical JSON with the exact trusted schema');
          }
          if (!keys.every((key) => typeof value[key] === 'string' && value[key].length > 0)) {
            throw new Error('promotion plan fields must be non-empty strings');
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/promotion-plan.json`, text, { mode: 0o600 });
          NODE
          plan_file="$RUNNER_TEMP/promotion-plan.json"
          BASE_REF="$(jq -r '.base_ref' "$plan_file")"
          BASE_SHA="$(jq -r '.base_sha' "$plan_file")"
          SOURCE_REF="$(jq -r '.source_ref' "$plan_file")"
          PROMOTION_BRANCH="$(jq -r '.branch' "$plan_file")"
          RESERVATION_SHA="$(jq -r '.reservation_sha' "$plan_file")"
          SOURCE_TIP_SHA="$(jq -r '.source_tip_sha' "$plan_file")"
          SOURCE_START_SHA="$(jq -r '.source_start_sha' "$plan_file")"
          SOURCE_END_SHA="$(jq -r '.source_end_sha' "$plan_file")"
          SOURCE_LINEAGE_STATUS="$(jq -r '.source_lineage_status' "$plan_file")"
          PLAN_HASH="$(jq -r '.plan_hash' "$plan_file")"
          TITLE_B64="$(jq -r '.title_b64' "$plan_file")"
          BODY_B64="$(jq -r '.body_b64' "$plan_file")"
          export BASE_REF BASE_SHA SOURCE_REF PROMOTION_BRANCH RESERVATION_SHA SOURCE_TIP_SHA \
            SOURCE_START_SHA SOURCE_END_SHA SOURCE_LINEAGE_STATUS PLAN_HASH TITLE_B64 BODY_B64

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "promotion_base_sha must be a full SHA-1."
          [[ "$RESERVATION_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "promotion_reservation_sha must be a full SHA-1."
          [[ "$SOURCE_START_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "promotion_source_start_sha must be a full SHA-1."
          [[ "$SOURCE_TIP_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "promotion_source_tip_sha must be a full SHA-1."
          [[ "$SOURCE_END_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "promotion_source_end_sha must be a full SHA-1."
          # NEVER CANCEL (owner decision, 2026-08-12): a non-verified source
          # lineage is a review question, not a refusal. Everything downstream
          # is already built for it — the promotion PR is labelled
          # `source-lineage-unverified`, its review comment explains the exact
          # replay and the release decision it needs, the source PR's status
          # comment mirrors that warning, and the worker review-gates the
          # content commits ([skip ci] + approval-required checkpoint) exactly
          # as it does for CI-sensitive paths. Refusing here meant the promoter
          # queued work this job then threw away: #211, #215 and #223 each
          # produced a failed run and no promotion PR. The set stays closed so
          # an unknown classification still fails instead of being reviewable.
          case "$SOURCE_LINEAGE_STATUS" in
            verified|review-required-removed|review-required-ambiguous) ;;
            *) fail "source_lineage_status must be verified, review-required-removed, or review-required-ambiguous; got '$SOURCE_LINEAGE_STATUS'." ;;
          esac
          [[ "$PLAN_HASH" =~ ^[0-9a-f]{64}$ ]] || fail "promotion_plan_hash must be a SHA-256."
          safe_ref "$BASE_REF" || fail "Unsafe promotion base ref."
          safe_ref "$SOURCE_REF" || fail "Unsafe promotion source ref."
          # Lane sources are a closed set: the standing develop lane plus the
          # main reverse lane. Anything else fails before any secret use.
          [[ "$SOURCE_REF" = develop || "$SOURCE_REF" = main ]] \
            || fail "Promotion source must be develop or main; got '$SOURCE_REF'."
          safe_ref "$PROMOTION_BRANCH" || fail "Unsafe promotion branch ref."
          # github-actions joined the allowlist for the reverse lane (owner
          # request, 2026-08-12): main-only CI work promotes onto the control
          # plane through this same trusted worker chain.
          [[ "$BASE_REF" = main || "$BASE_REF" = github-actions || "$BASE_REF" = promote/pr-* ]] \
            || fail "Promotion base must be main, github-actions, or a prior promotion branch."

          # Decode only to bounded runner-temp files. Canonical re-encoding
          # rejects whitespace, alternate alphabets, truncated padding, and
          # other ambiguous base64 forms before they reach gh.
          export TITLE_B64 BODY_B64
          node <<'NODE'
          const fs = require('node:fs');
          const { TextDecoder } = require('node:util');
          const decode = (name, max, singleLine, out) => {
            const encoded = process.env[name] || '';
            if (!encoded || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
              throw new Error(`${name} is not canonical RFC4648 base64`);
            }
            const bytes = Buffer.from(encoded, 'base64');
            if (bytes.toString('base64') !== encoded || bytes.length === 0 || bytes.length > max) {
              throw new Error(`${name} is empty, oversized, or non-canonical`);
            }
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            if (text.includes('\0') || (singleLine && /[\x00-\x1f\x7f]/.test(text))) {
              throw new Error(`${name} contains forbidden control structure`);
            }
            fs.writeFileSync(out, bytes, { mode: 0o600 });
          };
          decode('TITLE_B64', 256, true, `${process.env.RUNNER_TEMP}/promotion-title.txt`);
          decode('BODY_B64', 24000, false, `${process.env.RUNNER_TEMP}/promotion-body.md`);
          NODE

          pr="$(gh api "repos/$REPO/pulls/$SOURCE_PR")"
          [ "$(jq -r '.state' <<<"$pr")" = closed ] && [ "$(jq -r '.merged_at // empty' <<<"$pr")" != '' ] \
            || fail "Source PR is not merged."
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$SOURCE_REF" ] \
            || fail "Source PR was not merged to $SOURCE_REF."
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            && [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || fail "Source PR must be wholly inside this repository."
          [ "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$SOURCE_END_SHA" ] \
            || fail "Source PR merge SHA no longer matches the promotion source endpoint."

          # Branch naming is re-derived from immutable source PR metadata; a
          # caller cannot route the secret worker to an arbitrary ref.
          source_head="$(jq -r '.head.ref' <<<"$pr")"
          source_title="$(jq -r '.title' <<<"$pr")"
          expected_branch="$(SOURCE_HEAD="$source_head" SOURCE_TITLE="$source_title" SOURCE_PR="$SOURCE_PR" node <<'NODE'
          const prefixes = new Set(['claude','codex','feature','feat','fix','chore','promote']);
          const segments = (process.env.SOURCE_HEAD || '').split('/').filter(Boolean);
          while (segments.length > 1 && prefixes.has(segments[0].toLowerCase())) segments.shift();
          const raw = segments.join('-') || process.env.SOURCE_TITLE || `pr-${process.env.SOURCE_PR}`;
          const slug = raw.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
            .slice(0, 40).replace(/-+$/g, '') || 'change';
          process.stdout.write(`promote/pr-${process.env.SOURCE_PR}-${slug}`);
          NODE
          )"
          target_slug="$(printf '%s' "$BASE_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          # Uniform lane naming appends --to-<target>; legacy pre-uniform
          # branches (no marker) stay valid for in-flight main-lane
          # reservations. Both shapes derive purely from immutable source-PR
          # metadata, so a caller still cannot route the secret worker to an
          # arbitrary ref.
          [ "$PROMOTION_BRANCH" = "${expected_branch}--to-${target_slug}" ] \
            || [ "$PROMOTION_BRANCH" = "$expected_branch" ] \
            || fail "Promotion branch does not match the deterministic source-PR branch."

          [ "$(live_ref_sha "$BASE_REF")" = "$BASE_SHA" ] \
            || fail "Promotion base moved after the plan was created; the promoter must re-plan."
          [ "$(live_ref_sha "$SOURCE_REF")" = "$SOURCE_TIP_SHA" ] \
            || fail "Source branch $SOURCE_REF moved after the source plan was created; the promoter must re-plan."
          [ "$(live_ref_sha "$PROMOTION_BRANCH")" = "$RESERVATION_SHA" ] \
            || fail "Reservation branch moved; refusing to overwrite newer work."
          reservation="$(gh api "repos/$REPO/git/commits/$RESERVATION_SHA")"
          [ "$(jq -r '.parents | length' <<<"$reservation")" = 1 ] \
            && [ "$(jq -r '.parents[0].sha' <<<"$reservation")" = "$BASE_SHA" ] \
            || fail "Reservation must be an empty single-parent child of the exact base."
          base_commit="$(gh api "repos/$REPO/git/commits/$BASE_SHA")"
          [ "$(jq -r '.tree.sha' <<<"$reservation")" = "$(jq -r '.tree.sha' <<<"$base_commit")" ] \
            || fail "Reservation tree differs from the promotion base."
          message="$(jq -r '.message' <<<"$reservation")"
          require_trailer "$message" 'Thingtime-Promotion-Reservation: v1'
          require_trailer "$message" "Thingtime-Promotion-Source-PR: $SOURCE_PR"
          require_trailer "$message" "Thingtime-Promotion-Base-Ref: $BASE_REF"
          require_trailer "$message" "Thingtime-Promotion-Base-SHA: $BASE_SHA"
          require_trailer "$message" "Thingtime-Promotion-Branch: $PROMOTION_BRANCH"
          require_trailer "$message" "Thingtime-Promotion-Source-Start-SHA: $SOURCE_START_SHA"
          require_trailer "$message" "Thingtime-Promotion-Source-End-SHA: $SOURCE_END_SHA"
          require_trailer "$message" "Thingtime-Promotion-Source-Lineage: $SOURCE_LINEAGE_STATUS"
          require_trailer "$message" "Thingtime-Promotion-Plan-Hash: $PLAN_HASH"

          for spec in \
            'promotion:5319e7:Automated develop to main promotion PR' \
            'ai-conflict-resolved:1d76db:Promotion conflict resolved by the isolated AI worker' \
            'review-ai-resolution:fbca04:Review the AI-resolved promotion conflict paths' \
            'source-lineage-unverified:b60205:Historical source intent must be reviewed before promotion' \
            'ai-promotion-paused:d93f0b:Automatic promotion resolution paused for this exact snapshot'; do
            IFS=: read -r name color description <<<"$spec"
            gh label create "$name" --repo "$REPO" --color "$color" --description "$description" --force >/dev/null
          done

          paused="$(gh api --paginate "repos/$REPO/issues/$SOURCE_PR/comments?per_page=100" --slurp \
            | jq -r --arg hash "$PLAN_HASH" 'add // [] | any(.[]; .user.login == "github-actions[bot]" and (.body | contains("thingtime-ai-promotion-paused:v1 " + $hash)))')"
          paused_label="$(jq -r 'any(.labels[]?; .name == "ai-promotion-paused")' <<<"$pr")"
          if [ "$paused" = true ] && [ "$paused_label" = true ]; then
            echo "Exact promotion snapshot is already paused after an automatic attempt; no AI spend repeated."
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "noop=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method DELETE "repos/$REPO/issues/$SOURCE_PR/labels/ai-promotion-paused" >/dev/null 2>&1 || true
          if [ "$SOURCE_LINEAGE_STATUS" = verified ]; then
            upsert_source_status "🤖 Automatic promotion conflict resolution is running for \`$PROMOTION_BRANCH\`."
          else
            upsert_source_status "⚠️ A review-required historical promotion is running for \`$PROMOTION_BRANCH\`. The exact patch is recoverable, but current \`$SOURCE_REF\` does not prove that it remains intended (\`$SOURCE_LINEAGE_STATUS\`). The resulting PR must be reviewed before merge."
          fi
          {
            echo "base_ref=$BASE_REF"
            echo "base_sha=$BASE_SHA"
            echo "promotion_branch=$PROMOTION_BRANCH"
            echo "reservation_sha=$RESERVATION_SHA"
            echo "source_tip_sha=$SOURCE_TIP_SHA"
            echo "source_start_sha=$SOURCE_START_SHA"
            echo "source_end_sha=$SOURCE_END_SHA"
            echo "source_lineage_status=$SOURCE_LINEAGE_STATUS"
            echo "source_ref=$SOURCE_REF"
            echo "plan_hash=$PLAN_HASH"
            echo "title_b64=$TITLE_B64"
            echo "body_b64=$BODY_B64"
          } >>"$GITHUB_OUTPUT"
          echo "ready=true" >>"$GITHUB_OUTPUT"
          echo "noop=false" >>"$GITHUB_OUTPUT"

  # anthropics/claude-code-action@v1 REJECTS the `push` event outright
  # ("Unsupported event type: push"). Its supported set is issues,
  # issue_comment, pull_request, pull_request_review,
  # pull_request_review_comment, workflow_dispatch, repository_dispatch,
  # schedule, workflow_run. All external events — including human
  # workflow_dispatch and legacy repository_dispatch — are detector-only.
  # Eligible PR selections are handed off one-by-one through the Actions API to
  # this workflow at the hard-coded `github-actions` control-plane ref. The worker
  # re-detects and snapshots the selected PR's live refs before any checkout.
  # Product branches only host thin listeners. Every secret-bearing worker is
  # dispatched directly to this protected github-actions implementation.
  handoff:
    name: Hand off each selected PR to the github-actions resolver control plane
    needs: [route, detect]
    if: >-
      needs.detect.outputs.any == 'true'
      && (github.event_name != 'workflow_dispatch'
          || inputs.detector_handoff != true
          || github.actor != 'github-actions[bot]'
          || !(github.ref_name == 'github-actions'
               || github.workflow_ref
               == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
               || github.workflow_ref
               == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository)))
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch one trusted github-actions worker per selected PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ needs.detect.outputs.prs }}
          DEPTH: ${{ github.event.client_payload.depth || inputs.depth || '0' }}
          EXECUTION_PROVIDER: ${{ needs.route.outputs.execution_provider || 'github-actions' }}
          RUNNER_LABEL: ${{ needs.route.outputs.runner_label || '' }}
          CONTROL_DISPATCH_ID: ${{ needs.route.outputs.control_dispatch_id || '' }}
          ROUTING_PROOF: ${{ needs.route.outputs.routing_proof || '' }}
          ROUTING_PROOF_ISSUED_AT: ${{ needs.route.outputs.routing_proof_issued_at || '' }}
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            selected="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$selected")"
            manual_retry="$(jq -r '.manual_retry' <<<"$selected")"
            echo "Dispatching selected PR #$number to the fixed github-actions resolver control plane."
            jq -n \
              --arg pr_number "$number" \
              --arg depth "$DEPTH" \
              --arg execution_provider "$EXECUTION_PROVIDER" \
              --arg runner_label "$RUNNER_LABEL" \
              --arg control_dispatch_id "$CONTROL_DISPATCH_ID" \
              --arg routing_proof "$ROUTING_PROOF" \
              --arg routing_proof_issued_at "$ROUTING_PROOF_ISSUED_AT" \
              --argjson manual_retry "$manual_retry" '
                {
                  ref:"github-actions",
                  inputs:{
                    pr_number:$pr_number,
                    branch:"",
                    detector_handoff:true,
                    manual_retry:$manual_retry,
                    depth:$depth,
                    execution_provider:$execution_provider,
                    runner_label:$runner_label,
                    control_dispatch_id:$control_dispatch_id,
                    routing_proof:$routing_proof,
                    routing_proof_issued_at:$routing_proof_issued_at
                  }
                }
              ' \
              | gh api --method POST \
                  "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
                  --input -
          done < <(jq -r '.[] | @base64' <<<"$PRS")

  model_config:
    name: Load the conflict-resolver model waterfall
    needs: [route, detect, promotion_validate]
    # Only a bot-originated internal worker running the fixed github-actions revision
    # may load resolver configuration. Ordinary PR and pre-PR promotion modes
    # are mutually exclusive; skipped sibling validation is expected.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && (github.ref_name == 'github-actions'
         || github.workflow_ref
         == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
         || github.workflow_ref
         == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository))
      && ((needs.detect.result == 'success'
           && needs.detect.outputs.any == 'true'
           && github.actor == 'github-actions[bot]'
           && inputs.promotion_source_pr == ''
           && inputs.promotion_plan_b64 == ''
           && inputs.detector_handoff == true
           && inputs.pr_number != ''
           && inputs.branch == '')
          || (needs.promotion_validate.result == 'success'
              && needs.promotion_validate.outputs.ready == 'true'
              && github.actor == 'github-actions[bot]'
              && inputs.detector_handoff != true
              && inputs.pr_number == ''
              && inputs.branch == ''
              && inputs.promotion_source_pr != ''
              && inputs.promotion_plan_b64 != ''))
    runs-on: ${{ (inputs.promotion_source_pr != '' || inputs.promotion_plan_b64 != '') && 'ubuntu-latest' || needs.route.outputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 2
    # This job deliberately has no checkout and no repository permissions. It
    # reads one public, non-secret setting and turns it into a closed set of
    # Claude CLI values; repository or PR code can never execute here.
    permissions: {}
    outputs:
      model_args: ${{ steps.waterfall.outputs.model_args }}
      primary_model: ${{ steps.waterfall.outputs.primary_model }}
    steps:
      - name: Fetch and validate the configured waterfall
        id: waterfall
        shell: bash
        run: |
          set -euo pipefail

          endpoint="https://thingtime.com/api/v1/settings/pr-conflict-auto-resolver-model-waterfall"
          response_file="$RUNNER_TEMP/pr-conflict-model-waterfall.json"

          # The resolver must remain usable when Thingtime is unavailable or a
          # deployment predates this endpoint. Its hard fail-safe is exactly the
          # Claude Code `default` model, with no configured fallback.
          waterfall='["default"]'
          source="built-in default"

          if curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 12 \
            --retry 2 \
            --retry-delay 1 \
            --retry-max-time 30 \
            --max-filesize 65536 \
            --output "$response_file" \
            "$endpoint"; then
            # Slurp first so a response containing multiple top-level JSON
            # values is malformed too. Only the exact public setting key and a
            # unique 1..3 item array from the closed model allowlist is valid.
            if configured="$(jq -cse '
              select(length == 1)
              | .[0]
              | select(type == "object")
              | select(.ok == true)
              | select(.key == "Thingtime.PRConflictAutoResolverModelWaterfall")
              | .waterfall
              | select(type == "array")
              | select(length >= 1 and length <= 3)
              | select(all(.[]; type == "string"))
              | select(all(.[];
                  . == "default"
                  or . == "claude-fable-5"
                  or . == "claude-opus-5"))
              | select(length == (unique | length))
            ' "$response_file" 2>/dev/null)"; then
              waterfall="$configured"
              source="Thingtime admin setting"
              # The API normalizes this already; keep the workflow safe if an
              # older valid deployment omitted the final default entry.
              if ! jq -e 'index("default") != null' >/dev/null <<<"$waterfall"; then
                waterfall="$(jq -c '. + ["default"]' <<<"$waterfall")"
              fi
            else
              echo "::warning::Thingtime returned a malformed conflict-resolver model waterfall; using [default]."
            fi
          else
            echo "::warning::Thingtime conflict-resolver model waterfall is unavailable; using [default]."
          fi

          # Never interpolate API strings into claude_args. Rebuild the entire
          # ordered chain from fixed literals after validation, so even a
          # compromised response cannot inject another CLI flag or model name.
          mapfile -t configured_ids < <(jq -r '.[]' <<<"$waterfall")
          models=()
          for id in "${configured_ids[@]}"; do
            case "$id" in
              default) models+=("default") ;;
              claude-fable-5) models+=("claude-fable-5") ;;
              claude-opus-5) models+=("claude-opus-5") ;;
              *)
                echo "::warning::Validated waterfall mapping failed closed; using [default]."
                models=("default")
                source="built-in default"
                break
                ;;
            esac
          done

          primary="${models[0]}"
          model_args="--model $primary"
          if [ "${#models[@]}" -gt 1 ]; then
            fallbacks="$(IFS=,; echo "${models[*]:1}")"
            model_args="$model_args --fallback-model $fallbacks"
          fi

          echo "Model waterfall source: $source"
          echo "Claude Code model waterfall: $(IFS=,; echo "${models[*]}")"
          echo "Fallbacks apply only to model overload, unavailability, or eligible server errors."
          echo "A model that completes but leaves conflict markers does not mechanically trigger the next model."
          echo "model_args=$model_args" >> "$GITHUB_OUTPUT"
          echo "primary_model=$primary" >> "$GITHUB_OUTPUT"
  resolve_promotion:
    name: "Resolve promotion for source PR #${{ inputs.promotion_source_pr }}"
    needs: [promotion_validate, model_config]
    # `!cancelled()` for the same reason as the ordinary resolve job below:
    # route and detect are skipped in promotion mode, and that skip would
    # otherwise propagate through model_config's always() and silently skip
    # this worker too. The per-need result checks stay exhaustive.
    if: >-
      !cancelled()
      && needs.promotion_validate.result == 'success'
      && needs.promotion_validate.outputs.ready == 'true'
      && needs.model_config.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.detector_handoff != true
      && github.actor == 'github-actions[bot]'
      && (github.ref_name == 'github-actions'
         || github.workflow_ref
         == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/develop', github.repository)
         || github.workflow_ref
         == format('{0}/.github/workflows/resolve-pr-conflicts.yml@refs/heads/main', github.repository))
      && inputs.promotion_source_pr != ''
      && inputs.promotion_plan_b64 != ''
      && inputs.manual_retry != true
      && inputs.depth == '0'
      && inputs.pr_number == ''
      && inputs.branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      SOURCE_PR: ${{ inputs.promotion_source_pr }}
      BASE_REF: ${{ needs.promotion_validate.outputs.base_ref }}
      BASE_SHA: ${{ needs.promotion_validate.outputs.base_sha }}
      PROMOTION_BRANCH: ${{ needs.promotion_validate.outputs.promotion_branch }}
      RESERVATION_SHA: ${{ needs.promotion_validate.outputs.reservation_sha }}
      SOURCE_START_SHA: ${{ needs.promotion_validate.outputs.source_start_sha }}
      SOURCE_TIP_SHA: ${{ needs.promotion_validate.outputs.source_tip_sha }}
      SOURCE_END_SHA: ${{ needs.promotion_validate.outputs.source_end_sha }}
      SOURCE_LINEAGE_STATUS: ${{ needs.promotion_validate.outputs.source_lineage_status }}
      SOURCE_REF: ${{ needs.promotion_validate.outputs.source_ref }}
      PLAN_HASH: ${{ needs.promotion_validate.outputs.plan_hash }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - name: Check out the fixed trusted github-actions control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: github-actions
          fetch-depth: 0
          persist-credentials: false
          path: trusted
          # This job intentionally points GIT_CONFIG_GLOBAL at /dev/null.
          # The checkout is owned by the runner, so its otherwise-default
          # global safe.directory write is unnecessary and only emits a
          # misleading "could not lock config file /dev/null" annotation.
          set-safe-directory: false

      - name: Create an isolated, credential-free real checkout
        id: repo
        shell: bash
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_path="$(mktemp -d "$RUNNER_TEMP/promotion-repo.XXXXXX")"
          # --dissociate copies every required object out of the workspace;
          # the repo-less AI action later wipes GITHUB_WORKSPACE completely.
          git clone -q --no-checkout --dissociate "$GITHUB_WORKSPACE/trusted" "$repo_path"
          git -C "$repo_path" remote remove origin
          # Never inherit a checkout credential header into later canonical
          # publication. The isolated clone should not copy local config, but
          # remove the key explicitly and verify it again immediately pre-push.
          git -C "$repo_path" config --local --unset-all 'http.https://github.com/.extraheader' \
            >/dev/null 2>&1 || true
          # Full-history checkout does not guarantee unreachable historical
          # PR merge objects (the regression that previously stopped the
          # promoter batch). Fetch every immutable endpoint explicitly from
          # the canonical repository before the model can run.
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          for sha in "$SOURCE_START_SHA" "$SOURCE_END_SHA" "$SOURCE_TIP_SHA" "$BASE_SHA" "$RESERVATION_SHA"; do
            if ! git -C "$repo_path" cat-file -e "$sha^{commit}" 2>/dev/null; then
              GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null \
              GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false \
              GIT_CONFIG_KEY_2=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $basic" \
                git -C "$repo_path" fetch -q --no-tags --force \
                  "https://github.com/$REPO.git" "$sha"
            fi
            git -C "$repo_path" cat-file -e "$sha^{commit}" \
              || { echo "::error::Exact fetch did not materialize required commit $sha."; exit 1; }
          done
          unset basic FETCH_TOKEN
          echo "repo_path=$repo_path" >>"$GITHUB_OUTPUT"

      - name: Independently re-derive the source patch boundary
        id: source_authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commits="$RUNNER_TEMP/promotion-source-pr-commits.json"
          files="$RUNNER_TEMP/promotion-source-pr-files.json"
          repo_path="${{ steps.repo.outputs.repo_path }}"
          printf '[]\n' >"$commits"
          printf '[]\n' >"$files"

          # Mirror computePicks: a true merge endpoint authorizes exactly its
          # first-parent aggregate and needs no live PR diff. Besides being
          # redundant, asking GitHub to regenerate a large merged PR's file
          # list can return HTTP 422 ("diff is taking too long") indefinitely.
          # Single-parent squash/rebase endpoints still reload the metadata
          # that distinguishes one commit from a verified multi-commit range.
          parent_record="$(git -C "$repo_path" rev-list --parents -n 1 "$SOURCE_END_SHA")"
          parent_count="$(awk '{ print NF - 1 }' <<<"$parent_record")"
          (( parent_count >= 1 )) \
            || { echo "::error::Source endpoint has no parent and cannot authorize a promotion patch."; exit 1; }
          if (( parent_count == 1 )); then
            commit_pages="$RUNNER_TEMP/promotion-source-pr-commit-pages.json"
            if ! gh api --paginate "repos/$REPO/pulls/$SOURCE_PR/commits?per_page=100" --slurp \
              >"$commit_pages"; then
              echo "::error::Could not independently reload source PR commit metadata; retrying the immutable snapshot is safe."
              exit 1
            fi
            if ! jq -ce '
              if type != "array" then error("commit pages must be an array")
              else (add // [])
              end
              | if type == "array" then . else error("commits must be an array") end
            ' "$commit_pages" >"$commits"; then
              echo "::error::Source PR commit metadata was malformed."
              exit 1
            fi
            commit_count="$(jq -r 'length' "$commits")"
            if (( commit_count > 1 )); then
              file_pages="$RUNNER_TEMP/promotion-source-pr-file-pages.json"
              if ! gh api --paginate "repos/$REPO/pulls/$SOURCE_PR/files?per_page=100" --slurp \
                >"$file_pages"; then
                echo "::error::Could not independently reload source PR file metadata required to verify its multi-commit range; retrying the immutable snapshot is safe."
                exit 1
              fi
              if ! jq -ce '
                if type != "array" then error("file pages must be an array")
                else [add // [] | .[].filename]
                end
              ' "$file_pages" >"$files"; then
                echo "::error::Source PR file metadata was malformed."
                exit 1
              fi
            fi
          fi
          authority_status=0
          bash "$GITHUB_WORKSPACE/trusted/.github/scripts/rebase-stack/verify-promotion-source-authority.sh" \
            "$repo_path" "$commits" "$files" || authority_status=$?
          if (( authority_status != 0 )); then
            echo "terminal_review_needed=true" >>"$GITHUB_OUTPUT"
            exit "$authority_status"
          fi
          echo "terminal_review_needed=false" >>"$GITHUB_OUTPUT"

      - name: Reconstruct the exact plan and start its synthetic rebase
        id: prepare_promotion
        shell: bash
        run: |
          set -euo pipefail
          prepare_status=0
          bash "$GITHUB_WORKSPACE/trusted/.github/scripts/rebase-stack/promotion-worker.sh" \
            prepare "${{ steps.repo.outputs.repo_path }}" || prepare_status=$?
          if (( prepare_status != 0 )); then
            echo "terminal_review_needed=true" >>"$GITHUB_OUTPUT"
            exit "$prepare_status"
          fi
          echo "terminal_review_needed=false" >>"$GITHUB_OUTPUT"

      - name: Gate publication of AI-resolved workflow files before model spend
        id: promotion_publication_policy
        shell: bash
        env:
          HAS_WORKFLOW_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT != '' }}
          WORKFLOW_PATHS: ${{ steps.prepare_promotion.outputs.workflow_paths }}
        run: |
          set -euo pipefail
          echo "terminal_review_needed=false" >>"$GITHUB_OUTPUT"
          if [ "$WORKFLOW_PATHS" = true ] && [ "$HAS_WORKFLOW_PAT" != true ]; then
            echo "terminal_review_needed=true" >>"$GITHUB_OUTPUT"
            echo "::error::Workflow-file promotion requires the review-gated publication token; stopping before AI spend."
            exit 78
          fi

      - name: Revalidate immutable refs immediately before AI spend
        if: steps.prepare_promotion.outputs.conflicted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          [ "$(live_ref_sha "$SOURCE_REF")" = "$SOURCE_TIP_SHA" ] \
            || { echo "::error::Source branch $SOURCE_REF moved before AI started; the promoter must re-plan."; exit 1; }
          [ "$(live_ref_sha "$BASE_REF")" = "$BASE_SHA" ] \
            || { echo "::error::Promotion base moved before AI started; the promoter must re-plan."; exit 1; }
          [ "$(live_ref_sha "$PROMOTION_BRANCH")" = "$RESERVATION_SHA" ] \
            || { echo "::error::Reservation branch moved before AI started; refusing to overwrite it."; exit 1; }

      # The first invocation plus 499 YAML-alias retries expand to 500
      # sequential promotion-resolution rounds. The shared composite action
      # records its round number and completion state through GITHUB_ENV.
      - name: Resolve synthetic promotion conflicts (round 1 of up to 500)
        if: steps.prepare_promotion.outputs.conflicted == 'true'
        uses: &thingtime_promotion_conflict_round_action ./trusted/.github/actions/rebase-conflict-round
        with: &thingtime_promotion_conflict_round_inputs
          repo-path: ${{ steps.repo.outputs.repo_path }}
          deterministic-conflict-paths: ${{ steps.prepare_promotion.outputs.deterministic_conflict_paths }}
          pr-number: ${{ inputs.promotion_source_pr }}
          base-ref: ${{ needs.promotion_validate.outputs.base_ref }}
          head-ref: ${{ needs.promotion_validate.outputs.promotion_branch }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          conflict-policy: promotion
          allow-unresolved: "true"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          allowed-bots: github-actions
          model-args: ${{ needs.model_config.outputs.model_args }}

      - &thingtime_promotion_conflict_retry
        name: Continue synthetic promotion conflict resolution (up to round 500)
        if: steps.prepare_promotion.outputs.conflicted == 'true' && env.THINGTIME_AI_REBASE_COMPLETE != 'true' && success()
        uses: *thingtime_promotion_conflict_round_action
        with: *thingtime_promotion_conflict_round_inputs
      - *thingtime_promotion_conflict_retry
