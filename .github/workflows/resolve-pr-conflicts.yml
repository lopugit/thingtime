# AI-powered PR conflict resolution.
#
# Supersedes .github/workflows/pr-conflict-resolver.yml (PR #81), which gave
# the model unrestricted Bash(git:*)/Bash(gh:*); exactly one push-triggered
# resolver may exist or they race each other's pushes.
#
# When any branch is pushed, every open PR (drafts included) that TARGETS that
# branch — and the open PR FROM it, whose conflict may have been created by
# that very head push during a quiet stretch on the base — is checked for
# merge conflicts. A twice-hourly repository-wide sweep catches old conflicts
# whose original event predated or otherwise missed the resolver.
#
# TRIGGER SHAPE (load-bearing): claude-code-action@v1 rejects the `push` event
# ("Unsupported event type: push"), so a push-triggered run can only DETECT and
# then hand off — the `handoff` job dispatches one exact PR selection to this
# workflow at the repo-designated `develop` control-plane ref. That internal
# workflow_dispatch (a supported event) performs the resolution. Do not move the
# resolve job back onto `push`; the AI step fails there every time, after the
# merge has already been computed. pull_request_target and legacy
# repository_dispatch runs take the same detector-only handoff hop — the action
# rejects target-context events too, and PR code must never run there anyway.
# Conflicting same-repo PRs get the base
# branch merged into their head, with Claude resolving the conflicted files,
# and the merge commit pushed back to the PR branch.
#
# Secrets:
# - ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (one required): powers the
#   resolution agent (OAuth token via `/install-github-app` in the claude CLI),
#   and, when present, LLM semantic extraction in the post-merge graphify
#   refresh (ANTHROPIC_API_KEY selects graphify's claude API backend;
#   CLAUDE_CODE_OAUTH_TOKEN its claude-cli backend).
# - CONFLICT_RESOLVER_PAT (optional): a PAT with repo + workflow scope. Without
#   it, pushes use GITHUB_TOKEN, which GitHub rejects whenever the merge brings
#   ANY change under .github/workflows/ (workflow runs are then skipped early,
#   before AI spend, with a comment explaining the manual step). With it, those
#   merges push fine AND the pushed merge commit retriggers CI + this workflow
#   (natural stacked-PR cascade).
#
# Security model (the AI is treated as untrusted — conflicted file content can
# prompt-inject it):
# - The model has NO shell and NO git access — it ONLY edits files in the
#   working tree (Read/Grep/Glob/Edit/Write). All git operations (staging,
#   commit, push) are deterministic workflow steps. This removes the entire
#   git-flag exec surface (e.g. `git grep -O<cmd>`, `git diff --output`,
#   inline-env prefixes) that a git-subcommand allowlist could never fully
#   close for untrusted input.
# - The scope invariant is ENFORCED from git's object store alone: the verify
#   step recomputes the auto-merge with `git merge-tree --write-tree` (HEAD is
#   still the pre-merge commit mid-merge), stages ONLY the recomputed
#   conflicted paths, and diffs the staged index tree against the auto-merge
#   tree — every changed path must be a recomputed conflicted path (or
#   graphify-out/**, reset deterministically before the model runs, with its
#   staged subtree OID checked to equal the base side). Nothing the verify
#   step trusts lives anywhere the model could write; RUNNER_TEMP files are
#   informational only.
# - No network (WebFetch/WebSearch disallowed). .git/**, /proc/**, RUNNER_TEMP,
#   and $HOME git config are denied to the file tools as defense-in-depth, and
#   user/system git config is pinned to /dev/null (GIT_CONFIG_GLOBAL/SYSTEM) so
#   a stray write can't reconfigure git; enforcement does not rely on these
#   holding.
# - persist-credentials: false — no token in .git/config for the model to
#   read; the push step injects auth via GIT_CONFIG_* env at push time only,
#   and pushes to an explicit https URL (immune to remote-URL tampering).
# - All deterministic git steps run hook-proof (core.hooksPath=/dev/null,
#   core.fsmonitor=false via job-level GIT_CONFIG_* env), so a planted
#   .git/hooks script can never execute.
# - Detection snapshots the exact live head/base refs. Checkout and merge use
#   those immutable SHAs; immediately before publication the workflow repeats
#   the PR, repository, ref, ownership-label, stack-topology, default/protected
#   branch, and live-SHA checks. An exact head lease preserves any concurrent
#   push, and a post-push live-ref query classifies ambiguous transport errors.
# - Staged conflicted files are scanned for the raw/base64 ANTHROPIC_API_KEY
#   before commit. This scan is BEST-EFFORT, not a boundary: a determined
#   injection could smuggle an exotic encoding past it. The actual boundary
#   for same-repo collaborators (the only principals who can reach this code
#   path) is that the commit lands on a reviewable PR branch, plus
#   GitGuardian's push protection. ANTHROPIC_API_KEY necessarily sits in the
#   model's own process env; treat it as exposed to same-repo collaborators
#   who can engineer a conflict, and scope/rotate it accordingly.
# - Fork PRs, protected heads, and the default branch are skipped: we can't
#   safely push to them, and running the model when publication is forbidden
#   would expose content to secrets and spend AI budget for no useful result.
# - GITHUB_TOKEN pushes don't retrigger `push` workflows (no self-loops);
#   direct stacked children are dispatched individually to the fixed `github-actions`
#   control plane, with a depth cap as a loop guard. No secret-bearing resolver
#   YAML is loaded from an arbitrary PR base or head ref.
# - An unchanged, still-eligible PR is labelled ai-merge-paused after a failed
#   run, so the global sweep cannot spend AI budget every 30 minutes forever.
#   The pause is bound to one strict bot-authored owner/ref/SHA/topology marker;
#   changed snapshots recover automatically, while an explicit human PR/base/
#   head selector carries a manual-retry intent through the trusted handoff and
#   deliberately clears and retries an unchanged hold.
#
# graphify-out/** is never given to the AI. The repo's merge driver for
# graph.json is not configured in CI, so git would silently text-merge it into
# a mixed base+head union (the poisoned-pair state CLAUDE.md forbids). Instead,
# when BOTH sides touched graphify-out since the merge base, the whole
# directory is deterministically reset to the base side before anything else.
# AFTER the resolution is verified and committed, the graph is refreshed on a
# pristine reset tree and committed separately, so the pushed graph reflects
# the merged code. That ordering is required: the verify step asserts the
# staged graphify-out subtree still equals the base side, so refreshing
# earlier would fail its own check.
#
# The refresh includes LLM SEMANTIC extraction when a Claude credential
# exists: `graphify extract` + `graphify cluster-only` with whichever backend
# the repo's secret supports (ANTHROPIC_API_KEY → claude API backend;
# CLAUDE_CODE_OAUTH_TOKEN → claude-cli backend, the same credential the
# resolver itself runs on). extract is manifest-incremental, and unchanged
# content is served from the tracked content-addressed semantic cache
# (graphify-out/cache/semantic/), so only content genuinely new to the merge
# reaches the LLM — a typical conflict merge costs a handful of calls, often
# zero. `extract --no-cluster` must NEVER be used here: it writes only the
# newly-extracted nodes (verified: it reduces a 24k-node graph to 1 node),
# and as a mechanical backstop for that whole failure class, a semantic
# result whose node count halved is refused before staging.
# With no credential, or when extraction fails, the step falls back to the
# old AST-only `graphify update`. Handing this step a credential exposes it
# to the pinned graphifyy package and the claude CLI (no NEW principals —
# the resolve step already runs on the same secret); in exchange, the staged
# refresh outputs get the same best-effort secret scan as resolved files
# before committing, and the step still runs only after verification, on a
# tree the model never influenced.

name: Resolve PR conflicts (AI)

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && inputs.detector_handoff == true
      && github.actor == 'github-actions[bot]'
      && github.ref_name == 'github-actions'
      && inputs.pr_number != ''
      && inputs.branch == ''
      && format('Resolve PR #{0} from develop control plane', inputs.pr_number)
      || github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
      && format('Detect conflicts for PR #{0}', inputs.pr_number)
      || github.event_name == 'workflow_dispatch' && inputs.branch != ''
      && format('Detect conflicts matching PR base/head {0}', inputs.branch)
      || (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch'
              && inputs.pr_number == '' && inputs.branch == ''))
      && 'Detect conflicts across all open PRs'
      || format('Detect conflicts under {0}',
          github.event.client_payload.branch
          || github.event.pull_request.base.ref
          || github.ref_name) }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Exact PR to scan (takes precedence over branch); leave blank for a branch/all scan"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan; leave blank with no PR number to scan all"
        required: false
        default: ""
        type: string
      detector_handoff:
        description: "Internal: exact-PR handoff to the github-actions resolver control plane (leave false)"
        required: false
        default: false
        type: boolean
      manual_retry:
        description: "Internal: carry a human explicit-selector retry through the trusted handoff"
        required: false
        default: false
        type: boolean
      depth:
        description: "Internal: stacked-PR cascade depth (leave at 0)"
        required: false
        default: "0"
        type: string
  push:
    branches:
      - "**"
  # A PR branched off a STALE base can be born conflicting, and no push to the
  # base follows it — so without this it would sit unresolved until the next
  # unrelated base push. This MUST be pull_request_target, not pull_request:
  # GitHub creates NO pull_request run for a PR that opens CONFLICTING (there
  # is no merge ref to build one from — verified empirically on canary PR
  # #176, where zero runs appeared while mergeable PRs did get runs), so a
  # plain pull_request trigger is a no-op for exactly the case it exists to
  # catch. pull_request_target fires from the base-branch context regardless
  # of mergeability. SECURITY: target-context runs never check out or execute
  # PR code here — the detect job is API-only, the resolve job is excluded
  # for this event, and resolution happens only after an exact-PR selection is
  # handed off to the fixed `github-actions` control-plane revision, the same hop every
  # detector takes.
  # Deliberately NOT `synchronize`: that fires on every push to a PR head,
  # including this workflow's own resolution pushes. Head pushes are covered
  # by the plain `push` trigger instead — its detect run also scans the PR
  # FROM the pushed branch (see the scan step), which catches conflicts a
  # head push itself creates, without adding a per-PR target-context event.
  pull_request_target:
    types: [opened, reopened]
  schedule:
    # Event triggers already cover every branch. This global backstop catches
    # open conflicts whose creating event was missed or predates the workflow.
    # It is offset from the rebase-only sweep to keep API and runner bursts
    # separate while preserving deterministic merge-vs-rebase ownership.
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Exact PR to scan (takes precedence over branch); leave blank for a branch/all scan"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan; leave blank with no PR number to scan all"
        required: false
        default: ""
        type: string
      detector_handoff:
        description: "Internal: exact-PR handoff to the github-actions resolver control plane (leave false)"
        required: false
        default: false
        type: boolean
      manual_retry:
        description: "Internal: carry a human explicit-selector retry through the trusted handoff"
        required: false
        default: false
        type: boolean
      depth:
        description: "Internal: stacked-PR cascade depth (leave at 0)"
        required: false
        default: "0"
        type: string
  repository_dispatch:
    types: [resolve-conflicts-cascade]

# Detector runs are disposable; internal per-PR workers are not. A detector and
# the worker it spawns must never share a cancellation namespace.
concurrency:
  # Distinct namespaces are load-bearing:
  #   resolve-detect-*   external/event/API-only detectors
  #   resolve-pr<N>      one internal github-actions control-plane worker per PR
  # A human exact-PR detector therefore cannot cancel the worker it creates.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && inputs.detector_handoff == true
        && github.actor == 'github-actions[bot]'
        && github.ref_name == 'github-actions'
        && inputs.pr_number != ''
        && inputs.branch == ''
        && format('resolve-pr{0}', inputs.pr_number)
        || github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        && format('resolve-detect-pr{0}', inputs.pr_number)
        || github.event_name == 'workflow_dispatch' && inputs.branch != ''
        && format('resolve-detect-selector-{0}', inputs.branch)
        || (github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch')
        && 'resolve-detect-all-open'
        || github.event_name == 'push'
        && format('resolve-detect-{0}', github.ref_name)
        || (github.event.pull_request.number
            && format('resolve-detect-pr{0}', github.event.pull_request.number))
        || github.event_name == 'repository_dispatch'
        && format('resolve-detect-legacy-{0}',
             github.event.client_payload.branch || github.run_id)
        || format('resolve-detect-{0}-{1}',
             github.event_name, github.ref_name || github.run_id) }}
  # Every external detector is safe to supersede. A validated internal worker
  # must finish or fail coherently; never cancel it halfway through a merge.
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch'
        || inputs.detector_handoff != true
        || github.actor != 'github-actions[bot]'
        || github.ref_name != 'github-actions'
        || inputs.pr_number == ''
        || inputs.branch != '' }}

permissions:
  contents: read

jobs:
  detect:
    name: Find merge-conflicting PRs
    # Branch deletions also fire `push`; there is nothing to scan then.
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    # Mergeability polling alone may legitimately spend MERGEABLE_POLL_SECONDS
    # (~8 minutes) before classification starts; keep headroom for sweeps.
    timeout-minutes: 15
    permissions:
      contents: read
      # Still an API-only detector: nothing is checked out and no code from
      # scanned PRs runs here. Write access exists solely to upsert the
      # detect-status comment on PRs the detector must leave alone (fork
      # conflicts, verdicts that never settle) so silence is never ambiguous.
      pull-requests: write
      issues: write
    outputs:
      prs: ${{ steps.scan.outputs.prs }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Scan open PRs and assign deterministic resolver ownership
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          EVENT_ACTOR: ${{ github.actor }}
          TARGET: ${{ github.event.client_payload.branch || inputs.branch || github.event.pull_request.base.ref || github.ref_name }}
          SELECTED_PR: ${{ inputs.pr_number }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DEPTH: ${{ github.event.client_payload.depth || inputs.depth || '0' }}
          DETECTOR_HANDOFF: ${{ inputs.detector_handoff && 'true' || 'false' }}
          ROUTED_MANUAL_RETRY: ${{ inputs.manual_retry && 'true' || 'false' }}
          # Set only on pull_request_target events: narrows the scan to the
          # triggering PR instead of every PR sharing its base. TARGET reads
          # base.ref from the PR record rather than event ref context, which
          # stays correct regardless of which ref the event ran from.
          ONLY_PR: ${{ github.event.pull_request.number }}
          # Pushes and explicit human branch selectors match either PR base or
          # PR head. A head push can CREATE a conflict (`synchronize` is
          # deliberately not a trigger, and the next base push may be days
          # away — observed on PR #173, which made itself conflicted and sat
          # unresolved). The exact PR-number selector takes precedence below.
          # Costs nothing: this run exists for every push anyway. Cannot
          # loop: the resolver's own resolution push makes its PR mergeable,
          # so that push's detect run finds nothing to do.
          SCAN_HEAD: >-
            ${{ github.event_name == 'push'
                || (github.event_name == 'workflow_dispatch'
                    && inputs.detector_handoff != true
                    && inputs.pr_number == ''
                    && inputs.branch != '') }}
          # Scheduled sweeps and external blank manual runs cover every open PR.
          # Internal workers always carry an exact PR number and never scan all.
          SCAN_ALL: >-
            ${{ github.event_name == 'schedule'
                || (github.event_name == 'workflow_dispatch'
                    && inputs.detector_handoff != true
                    && inputs.pr_number == ''
                    && inputs.branch == '') }}
          HUMAN_EXPLICIT: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.detector_handoff != true
                && (inputs.pr_number != '' || inputs.branch != '') }}
          # An explicit human PR/base/head detector is the deliberate recovery
          # path for ai-merge-paused PRs. The detector passes that intent to the
          # internal worker; ordinary events and machine handoffs never invent it.
          MANUAL_RETRY: >-
            ${{ github.event_name == 'workflow_dispatch'
                && ((inputs.detector_handoff == true
                     && inputs.manual_retry == true)
                    || (inputs.detector_handoff != true
                        && (inputs.pr_number != '' || inputs.branch != ''))) }}
          # GitHub computes a PR's mergeability lazily after its base moves,
          # and verdicts can take several minutes to settle on a busy base
          # (observed ~6 minutes on PR #190, where the old 80-second poll gave
          # up and the conflict sat undetected until the scheduled sweep).
          # Total time budget for verdicts, and the pause between re-queries.
          MERGEABLE_POLL_SECONDS: "500"
          MERGEABLE_POLL_INTERVAL: "15"
        run: |
          set -euo pipefail

          case "$DEPTH" in
            ''|*[!0-9]*)
              echo "::error::depth must be a decimal integer from 0 through 3."
              exit 1
              ;;
          esac
          if [ "$DEPTH" -gt 3 ]; then
            echo "::error::depth must not exceed the cascade cap of 3."
            exit 1
          fi
          if [ -n "$SELECTED_PR" ]; then
            if ! [[ "$SELECTED_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive decimal PR number."
              exit 1
            fi
          fi
          if [ "$ROUTED_MANUAL_RETRY" = true ]; then
            if [ "$DETECTOR_HANDOFF" != true ]; then
              echo "::error::manual_retry is internal routing state and requires detector_handoff."
              exit 1
            fi
          fi
          if [ "$DETECTOR_HANDOFF" = true ]; then
            # detector_handoff/manual_retry are routing metadata, not authority.
            # Fixed develop YAML plus exact live PR/ref revalidation are the
            # substantive controls; the bot actor check is provenance
            # defense-in-depth and still permits re-runs of bot-originated work.
            invalid_handoff=false
            [ "$EVENT_NAME" = workflow_dispatch ] || invalid_handoff=true
            [ "$EVENT_REF" = develop ] || invalid_handoff=true
            [ "$EVENT_ACTOR" = "github-actions[bot]" ] || invalid_handoff=true
            [ -n "$SELECTED_PR" ] || invalid_handoff=true
            [ -z "$INPUT_BRANCH" ] || invalid_handoff=true
            if [ "$invalid_handoff" = true ]; then
              echo "::error::Invalid internal resolver handoff: require bot-authored workflow_dispatch on github-actions with a positive pr_number and empty branch."
              exit 1
            fi
          fi

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          decode_base64url() {
            local value="$1"
            value="$(tr '_-' '/+' <<<"$value" | tr -d '\n')"
            case $((${#value} % 4)) in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$value" | base64 --decode
          }

          # Detection visibility: reviewers otherwise see only GitHub's
          # conflict banner plus this workflow's always-skipped push-run check
          # stubs, so a detector that stands aside must say so ON the PR.
          # Upserted via hidden marker: repeat runs edit one status comment
          # instead of stacking new ones, and a comment failure never blocks
          # detection. Handed-off conflicts announce themselves through the
          # resolve job's "Auto-resolve running" comment instead.
          upsert_detect_comment() {
            local number="$1" text="$2"
            local marker='<!-- thingtime-merge-detect-status:v1 -->'
            local body comment_id
            body="$RUNNER_TEMP/detect-status-$number.md"
            {
              printf '%s\n\n' "$text"
              printf '_Posted by the conflict detector at %s; this notice is edited in place on re-checks._\n\n%s\n' \
                "$(date -u '+%H:%M UTC, %Y-%m-%d')" "$marker"
            } > "$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp \
              | jq -r '
                  add // []
                  | [.[]
                      | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("thingtime-merge-detect-status:v1"))
                      | .id]
                  | last // empty
                ')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$number/comments" -F "body=@$body" >/dev/null
            fi
          }

          all_open_prs() {
            local owner name
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            # GraphQL variable names must remain literal for gh to bind them.
            # shellcheck disable=SC2016
            gh api graphql --paginate --slurp \
              -f owner="$owner" \
              -f name="$name" \
              -f query='query($owner: String!, $name: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(
                    first: 100,
                    states: OPEN,
                    after: $endCursor,
                    orderBy: {field: CREATED_AT, direction: ASC}
                  ) {
                    nodes {
                      number
                      headRefName
                      baseRefName
                      isCrossRepository
                      isDraft
                      mergeable
                      labels(first: 100) { nodes { name } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }' \
              | jq -c '[.[].data.repository.pullRequests.nodes[]
                  | {number, headRefName, baseRefName, isCrossRepository,
                     isDraft, mergeable, labels:(.labels.nodes // [])}]'
          }

          query() {
            local open
            open="$(all_open_prs)"
            if [ -n "$SELECTED_PR" ]; then
              jq -c --argjson number "$SELECTED_PR" '[.[] | select(.number == $number)]' <<<"$open"
              return
            fi
            if [ "$SCAN_ALL" = "true" ]; then
              printf '%s\n' "$open"
              return
            fi
            jq -c \
              --arg target "$TARGET" \
              --argjson scan_head "$SCAN_HEAD" '
                [.[]
                  | select(.baseRefName == $target
                      or ($scan_head and .headRefName == $target))]
                | unique_by(.number)
              ' <<<"$open"
          }

          # GitHub computes mergeability lazily after a base push; poll until
          # every PR has a verdict (querying is itself what triggers compute).
          # Verdicts routinely take minutes to settle after a busy base push —
          # the old fixed eight-attempt/80-second loop gave up too early
          # (observed on PR #190) — so the wait is a time budget that exits
          # the moment every scanned PR has a verdict.
          prs="$(query)"
          if [ "$HUMAN_EXPLICIT" = true ]; then
            if [ "$(jq 'length' <<<"$prs")" -eq 0 ]; then
              if [ -n "$SELECTED_PR" ]; then
                selector="PR #$SELECTED_PR"
                guidance="Enter an open PR number, or clear it and enter that PR's exact base/head branch."
              else
                selector="branch $TARGET"
                guidance="Enter an exact open PR base or head branch, or leave branch blank to scan every open PR."
              fi
              echo "::error::No open PR matched the manual selector: $selector. $guidance"
              {
                echo "## No open PR matched the manual selector"
                echo
                printf -- '- Selector: `%s`\n' "$selector"
                printf -- '- %s\n' "$guidance"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          poll_started="$SECONDS"
          attempt=0
          while :; do
            unknown="$(jq '[.[] | select(.mergeable == "UNKNOWN")] | length' <<<"$prs")"
            [ "$unknown" -eq 0 ] && break
            elapsed="$(( SECONDS - poll_started ))"
            if [ "$elapsed" -ge "$MERGEABLE_POLL_SECONDS" ]; then
              echo "$unknown PR(s) still lack a mergeability verdict after ${elapsed}s; deferring them to the next event or scheduled sweep."
              break
            fi
            attempt="$(( attempt + 1 ))"
            echo "attempt $attempt (${elapsed}s elapsed): $unknown PR(s) still computing mergeability; retrying in ${MERGEABLE_POLL_INTERVAL}s..."
            sleep "$MERGEABLE_POLL_INTERVAL"
            prs="$(query)"
          done

          if [ "$SCAN_ALL" = "true" ]; then
            echo "Open PRs in repository-wide scan:"
          elif [ -n "$SELECTED_PR" ]; then
            echo "Open PR selected exactly as #$SELECTED_PR:"
          elif [ "$SCAN_HEAD" = "true" ]; then
            echo "Open PRs whose base or head matches $TARGET:"
          else
            echo "Open PRs based on $TARGET:"
          fi
          jq -r '.[] | "  #\(.number) \(.headRefName) draft=\(.isDraft) mergeable=\(.mergeable) fork=\(.isCrossRepository)"' <<<"$prs"

          # Resolver ownership must not depend on which detector wins a race.
          # Build the full open same-repo PR graph so stack members go to the
          # rebase workflow before either workflow has had time to add labels.
          # A no-ai-rebase PR is a topology boundary as well as an opt-out:
          # long-lived integration branches use that label on their promotion
          # PR, and must not make every feature PR targeting the integration
          # branch look like one enormous stack.
          all_open="$(all_open_prs)"

          # A pause belongs to one exact failed snapshot, recorded in a strict
          # hidden marker in the github-actions bot's failure comment. Ref or
          # topology changes make it stale and eligible again. Missing or
          # malformed legacy metadata fails closed until a named manual retry.
          recover_merge_paused='[]'
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            paused_pr="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$paused_pr")"
            head="$(jq -r '.headRefName' <<<"$paused_pr")"
            base="$(jq -r '.baseRefName' <<<"$paused_pr")"
            if [ "$MANUAL_RETRY" = true ]; then
              recover_merge_paused="$(jq -c --argjson n "$number" '. + [$n] | unique' \
                <<<"$recover_merge_paused")"
              continue
            fi

            stack_member="$(jq -r --argjson n "$number" --arg head "$head" --arg base "$base" '
              any(.[];
                .number != $n
                and (.isCrossRepository | not)
                and ([.labels[].name] | index("no-ai-rebase") == null)
                and (.headRefName == $base or .baseRefName == $head))
            ' <<<"$all_open")"
            no_ai="$(jq -r '[.labels[].name] | index("no-ai-rebase") != null' <<<"$paused_pr")"
            if [ "$stack_member" = true ] && [ "$no_ai" != true ]; then
              # Rebase ownership now applies. That workflow clears this
              # opposing pause after independently proving its ownership.
              continue
            fi
            topology=standalone
            [ "$stack_member" != true ] || topology=no-ai-stack

            token="$(
              gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp 2>/dev/null \
                | jq -r '
                    add // []
                    | [.[]
                        | select(.user.login == "github-actions[bot]")
                        | .body
                        | capture("<!-- thingtime-ai-conflict-pause:v1 (?<token>[A-Za-z0-9_-]+) -->")?
                        | .token]
                    | last // empty
                  ' 2>/dev/null || true
            )"
            payload=''
            if [ -n "$token" ]; then
              decoded="$(decode_base64url "$token" 2>/dev/null || true)"
              payload="$(jq -ce \
                --argjson number "$number" '
                  select(type == "object")
                  | select(.v == 1 and .owner == "merge" and .pr == $number)
                  | select(.head_ref | type == "string" and length > 0)
                  | select(.base_ref | type == "string" and length > 0)
                  | select(.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  | select(.base_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  | select(.topology == "standalone" or .topology == "no-ai-stack")
                ' <<<"$decoded" 2>/dev/null || true)"
            fi
            if [ -z "$payload" ]; then
              echo "::notice::#$number remains ai-merge-paused: exact bot snapshot metadata is unavailable; use an explicit PR/base/head manual retry."
              continue
            fi

            live_head="$(live_ref_sha "$head" 2>/dev/null || true)"
            live_base="$(live_ref_sha "$base" 2>/dev/null || true)"
            if [ "$head" = "$(jq -r '.head_ref' <<<"$payload")" ] \
               && [ "$base" = "$(jq -r '.base_ref' <<<"$payload")" ] \
               && [ "$live_head" = "$(jq -r '.head_sha' <<<"$payload")" ] \
               && [ "$live_base" = "$(jq -r '.base_sha' <<<"$payload")" ] \
               && [ "$topology" = "$(jq -r '.topology' <<<"$payload")" ]; then
              echo "::notice::#$number remains ai-merge-paused at its exact failed snapshot."
              continue
            fi
            echo "#$number: ai-merge-paused snapshot is stale; routing the current state again."
            recover_merge_paused="$(jq -c --argjson n "$number" '. + [$n] | unique' \
              <<<"$recover_merge_paused")"
          done < <(jq -r '
            .[]
            | select([.labels[].name] | index("ai-merge-paused") != null)
            | @base64
          ' <<<"$prs")

          skipped="$(jq -r '[.[] | select(.isCrossRepository) | select(.mergeable == "CONFLICTING") | .number] | join(", ")' <<<"$prs")"
          [ -n "$skipped" ] && echo "::warning::Skipping conflicting fork PR(s) #$skipped — cannot push to fork branches."
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            fork_pr="$(base64 --decode <<<"$encoded")"
            fork_number="$(jq -r '.number' <<<"$fork_pr")"
            fork_base="$(jq -r '.baseRefName' <<<"$fork_pr")"
            upsert_detect_comment "$fork_number" \
              "🤖 **Conflict seen — cannot auto-resolve a fork PR.** This PR conflicts with \`$fork_base\`, and the resolver cannot push to branches in a fork. Please resolve the conflicts manually (merge \`$fork_base\` into your branch, or rebase onto it)." \
              || echo "::warning::Could not post the detect-status comment on #$fork_number."
          done < <(jq -r '.[] | select(.isCrossRepository) | select(.mergeable == "CONFLICTING") | @base64' <<<"$prs")
          rebase_active="$(jq -r '[.[] | select(.mergeable == "CONFLICTING") | select([.labels[].name] | index("ai-rebase-in-progress") != null) | .number] | join(", ")' <<<"$prs")"
          [ -n "$rebase_active" ] && echo "::notice::Skipping PR(s) #$rebase_active — the AI PR/stack rebase workflow is actively rewriting them."
          merge_paused="$(jq -r '[.[] | select(.mergeable == "CONFLICTING") | select([.labels[].name] | index("ai-merge-paused") != null) | .number] | join(", ")' <<<"$prs")"
          if [ -n "$merge_paused" ] && [ "$MANUAL_RETRY" != true ]; then
            echo "::notice::Skipping PR(s) #$merge_paused — automatic merge resolution is paused; use an explicit PR/base/head manual run to retry."
          fi
          stacked_owned="$(jq -r --argjson all "$all_open" '
            [.[] as $pr
              | $pr
              | select(.isCrossRepository | not)
              | select(.mergeable == "CONFLICTING")
              | select([.labels[].name] | index("no-ai-rebase") == null)
              | select(any($all[];
                  .number != $pr.number
                  and (.isCrossRepository | not)
                  and ([.labels[].name] | index("no-ai-rebase") == null)
                  and (.headRefName == $pr.baseRefName
                       or .baseRefName == $pr.headRefName)))
              | .number]
            | join(", ")
          ' <<<"$prs")"
          [ -n "$stacked_owned" ] && echo "::notice::Skipping stacked PR(s) #$stacked_owned — the AI PR/stack rebase workflow owns stack history."
          still_unknown="$(jq -r '[.[] | select(.mergeable == "UNKNOWN") | .number] | join(", ")' <<<"$prs")"
          [ -n "$still_unknown" ] && echo "::warning::PR(s) #$still_unknown still UNKNOWN after polling; they will be re-checked by the next event or scheduled sweep."
          while IFS= read -r unknown_number; do
            [ -n "$unknown_number" ] || continue
            upsert_detect_comment "$unknown_number" \
              "🤖 **Mergeability still computing.** The base branch moved, and GitHub had not finished recomputing whether this PR conflicts after the detector waited ${MERGEABLE_POLL_SECONDS}s — so no resolution was started this round. The next push or the twice-hourly scheduled sweep (minutes :02/:32) re-checks automatically; if a conflict is found then, resolution starts and announces itself here." \
              || echo "::warning::Could not post the detect-status comment on #$unknown_number."
          done < <(jq -r '.[] | select(.mergeable == "UNKNOWN") | .number' <<<"$prs")

          # On a pull_request_target event, scan ONLY the triggering PR — the
          # other PRs sharing this base are not this event's business and are
          # already covered by base pushes.
          # `base` comes from the API record of the PR itself, so the resolve
          # job never re-derives it from event context — deriving branch names
          # from event refs is how "<N>/merge"-style ref spoofing and wrong-ref
          # merges happen; the PR record is the single source of truth.
          # Stack membership makes initial ownership disjoint before labels
          # exist. The labels remain the second boundary during a live cascade.
          # `no-ai-rebase` opts only out of history rewriting, so a stack member
          # carrying it may still use this merge-based resolver.
          conflicting="$(jq -c \
            --arg only "${ONLY_PR:-}" \
            --argjson manual_retry "$MANUAL_RETRY" \
            --argjson recover "$recover_merge_paused" \
            --argjson all "$all_open" '
            [.[] as $pr
              | $pr
              | select(.isCrossRepository | not)
              | select(.mergeable == "CONFLICTING")
              | select([.labels[].name]
                  | all(. != "ai-rebase-in-progress"))
              | select(([.labels[].name] | index("ai-merge-paused") == null)
                  or any($recover[]; . == $pr.number))
              | select(
                  ([.labels[].name] | index("no-ai-rebase") != null)
                  or (any($all[];
                      .number != $pr.number
                      and (.isCrossRepository | not)
                      and ([.labels[].name] | index("no-ai-rebase") == null)
                      and (.headRefName == $pr.baseRefName
                           or .baseRefName == $pr.headRefName)) | not))
              | select($only == "" or (.number | tostring) == $only)
              | {number: .number, head: .headRefName, base: .baseRefName,
                  manual_retry: $manual_retry,
                  recover_merge_pause: any($recover[]; . == $pr.number),
                  recover_rebase_pause:
                    ([.labels[].name] | index("ai-rebase-paused") != null)}]
          ' <<<"$prs")"

          # Snapshot the exact live refs rather than trusting PR base/head SHA
          # fields, which GitHub can leave stale for stacked PRs. The actual
          # merge and the push lease both use these immutable snapshots.
          branch_protected() {
            gh api "repos/$REPO/branches/$(encode_ref "$1")" --jq '.protected'
          }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          snapshots='[]'
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            candidate="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$candidate")"
            head="$(jq -r '.head' <<<"$candidate")"
            base="$(jq -r '.base' <<<"$candidate")"
            if [ "$head" = "$default_ref" ]; then
              echo "::warning::Skipping #$number: the repository default branch is never a resolver push target."
              continue
            fi
            if ! protected="$(branch_protected "$head")"; then
              echo "::warning::Skipping #$number for now: head-branch protection could not be verified."
              continue
            fi
            if [ "$protected" = true ]; then
              echo "::warning::Skipping #$number: protected head branch $head cannot be updated automatically."
              continue
            fi
            if ! head_sha="$(live_ref_sha "$head")" \
               || ! base_sha="$(live_ref_sha "$base")"; then
              echo "::warning::Skipping #$number for now: a live branch ref could not be snapshotted."
              continue
            fi
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] \
               || ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::Skipping #$number for now: a live branch ref returned an invalid SHA."
              continue
            fi
            candidate="$(jq -c \
              --arg head_sha "$head_sha" \
              --arg base_sha "$base_sha" \
              '. + {head_sha:$head_sha, base_sha:$base_sha}' \
              <<<"$candidate")"
            snapshots="$(jq -c --argjson item "$candidate" '. + [$item]' <<<"$snapshots")"
          done < <(jq -r '.[] | @base64' <<<"$conflicting")
          conflicting="$snapshots"
          if [ "$HUMAN_EXPLICIT" = true ] \
             && [ "$(jq 'length' <<<"$prs")" -gt 0 ] \
             && [ "$(jq 'length' <<<"$conflicting")" -eq 0 ]; then
            matched="$(jq 'length' <<<"$prs")"
            echo "::warning::The manual selector matched $matched open PR(s), but none is currently eligible for merge-conflict resolution."
            {
              echo "## Manual selector matched, but no merge worker is needed"
              echo
              echo "$matched open PR(s) matched. None is currently eligible for this merge resolver."
              echo
              echo "Mergeable/UNKNOWN PRs, fork or protected/default heads, paused snapshots, and stack/rebase-owned PRs are intentionally excluded."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "prs=$conflicting" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$conflicting")" >> "$GITHUB_OUTPUT"

  # anthropics/claude-code-action@v1 REJECTS the `push` event outright
  # ("Unsupported event type: push"). Its supported set is issues,
  # issue_comment, pull_request, pull_request_review,
  # pull_request_review_comment, workflow_dispatch, repository_dispatch,
  # schedule, workflow_run. All external events — including human
  # workflow_dispatch and legacy repository_dispatch — are detector-only.
  # Eligible PR selections are handed off one-by-one through the Actions API to
  # this workflow at the hard-coded `develop` control-plane ref. The worker
  # re-detects and snapshots the selected PR's live refs before any checkout.
  # Until this revision reaches the default branch, old default-branch
  # repository_dispatch/scheduled runs remain a one-time bootstrap limitation.
  handoff:
    name: Hand off each selected PR to the github-actions resolver control plane
    needs: detect
    if: >-
      needs.detect.outputs.any == 'true'
      && (github.event_name != 'workflow_dispatch'
          || inputs.detector_handoff != true
          || github.actor != 'github-actions[bot]'
          || github.ref_name != 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch one trusted develop worker per selected PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ needs.detect.outputs.prs }}
          DEPTH: ${{ github.event.client_payload.depth || inputs.depth || '0' }}
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            selected="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$selected")"
            manual_retry="$(jq -r '.manual_retry' <<<"$selected")"
            echo "Dispatching selected PR #$number to the fixed github-actions resolver control plane."
            jq -n \
              --arg pr_number "$number" \
              --arg depth "$DEPTH" \
              --argjson manual_retry "$manual_retry" '
                {
                  ref:"github-actions",
                  inputs:{
                    pr_number:$pr_number,
                    branch:"",
                    detector_handoff:true,
                    manual_retry:$manual_retry,
                    depth:$depth
                  }
                }
              ' \
              | gh api --method POST \
                  "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
                  --input -
          done < <(jq -r '.[] | @base64' <<<"$PRS")

  model_config:
    name: Load the conflict-resolver model waterfall
    needs: detect
    # Only a bot-originated internal worker running the fixed github-actions revision
    # may load resolver configuration. Human/API/event runs remain detectors.
    if: >-
      needs.detect.outputs.any == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.detector_handoff == true
      && github.actor == 'github-actions[bot]'
      && github.ref_name == 'github-actions'
      && inputs.pr_number != ''
      && inputs.branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # This job deliberately has no checkout and no repository permissions. It
    # reads one public, non-secret setting and turns it into a closed set of
    # Claude CLI values; repository or PR code can never execute here.
    permissions: {}
    outputs:
      model_args: ${{ steps.waterfall.outputs.model_args }}
      primary_model: ${{ steps.waterfall.outputs.primary_model }}
    steps:
      - name: Fetch and validate the configured waterfall
        id: waterfall
        shell: bash
        run: |
          set -euo pipefail

          endpoint="https://thingtime.com/api/v1/settings/pr-conflict-auto-resolver-model-waterfall"
          response_file="$RUNNER_TEMP/pr-conflict-model-waterfall.json"

          # The resolver must remain usable when Thingtime is unavailable or a
          # deployment predates this endpoint. Its hard fail-safe is exactly the
          # Claude Code `default` model, with no configured fallback.
          waterfall='["default"]'
          source="built-in default"

          if curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 12 \
            --retry 2 \
            --retry-delay 1 \
            --retry-max-time 30 \
            --max-filesize 65536 \
            --output "$response_file" \
            "$endpoint"; then
            # Slurp first so a response containing multiple top-level JSON
            # values is malformed too. Only the exact public setting key and a
            # unique 1..3 item array from the closed model allowlist is valid.
            if configured="$(jq -cse '
              select(length == 1)
              | .[0]
              | select(type == "object")
              | select(.ok == true)
              | select(.key == "Thingtime.PRConflictAutoResolverModelWaterfall")
              | .waterfall
              | select(type == "array")
              | select(length >= 1 and length <= 3)
              | select(all(.[]; type == "string"))
              | select(all(.[];
                  . == "default"
                  or . == "claude-fable-5"
                  or . == "claude-opus-5"))
              | select(length == (unique | length))
            ' "$response_file" 2>/dev/null)"; then
              waterfall="$configured"
              source="Thingtime admin setting"
              # The API normalizes this already; keep the workflow safe if an
              # older valid deployment omitted the final default entry.
              if ! jq -e 'index("default") != null' >/dev/null <<<"$waterfall"; then
                waterfall="$(jq -c '. + ["default"]' <<<"$waterfall")"
              fi
            else
              echo "::warning::Thingtime returned a malformed conflict-resolver model waterfall; using [default]."
            fi
          else
            echo "::warning::Thingtime conflict-resolver model waterfall is unavailable; using [default]."
          fi

          # Never interpolate API strings into claude_args. Rebuild the entire
          # ordered chain from fixed literals after validation, so even a
          # compromised response cannot inject another CLI flag or model name.
          mapfile -t configured_ids < <(jq -r '.[]' <<<"$waterfall")
          models=()
          for id in "${configured_ids[@]}"; do
            case "$id" in
              default) models+=("default") ;;
              claude-fable-5) models+=("claude-fable-5") ;;
              claude-opus-5) models+=("claude-opus-5") ;;
              *)
                echo "::warning::Validated waterfall mapping failed closed; using [default]."
                models=("default")
                source="built-in default"
                break
                ;;
            esac
          done

          primary="${models[0]}"
          model_args="--model $primary"
          if [ "${#models[@]}" -gt 1 ]; then
            fallbacks="$(IFS=,; echo "${models[*]:1}")"
            model_args="$model_args --fallback-model $fallbacks"
          fi

          echo "Model waterfall source: $source"
          echo "Claude Code model waterfall: $(IFS=,; echo "${models[*]}")"
          echo "Fallbacks apply only to model overload, unavailability, or eligible server errors."
          echo "A model that completes but leaves conflict markers does not mechanically trigger the next model."
          echo "model_args=$model_args" >> "$GITHUB_OUTPUT"
          echo "primary_model=$primary" >> "$GITHUB_OUTPUT"

  resolve:
    name: "Resolve PR #${{ matrix.pr.number }}"
    needs: [detect, model_config]
    # Secret-bearing resolution runs only from the fixed github-actions control-plane
    # revision after a bot-originated exact-PR selection handoff. The detect step has
    # already validated the routing shape and re-snapshotted live PR refs.
    if: >-
      needs.detect.outputs.any == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.detector_handoff == true
      && github.actor == 'github-actions[bot]'
      && github.ref_name == 'github-actions'
      && inputs.pr_number != ''
      && inputs.branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.detect.outputs.prs) }}
    env:
      REPO: ${{ github.repository }}
      # From the PR's own API record (see the scan step) — never re-derived from
      # event context, which is wrong on pull_request events.
      BASE_REF: ${{ matrix.pr.base }}
      HEAD_REF: ${{ matrix.pr.head }}
      EXPECTED_BASE_SHA: ${{ matrix.pr.base_sha }}
      EXPECTED_HEAD_SHA: ${{ matrix.pr.head_sha }}
      RECOVER_MERGE_PAUSE: ${{ matrix.pr.recover_merge_pause }}
      RECOVER_REBASE_PAUSE: ${{ matrix.pr.recover_rebase_pause }}
      PR_NUMBER: ${{ matrix.pr.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # True when CONFLICT_RESOLVER_PAT exists (a boolean, never the secret
      # itself — the secret is scoped to the push step only, so it is not in
      # the environment while the model runs).
      HAS_WORKFLOW_PUSH: ${{ secrets.CONFLICT_RESOLVER_PAT != '' }}
      # Hook-proof every git invocation in this job (including the model's):
      # a planted .git/hooks script or fsmonitor command must never execute.
      # GIT_CONFIG_* env has higher precedence than anything in .git/config.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      # Never read user/system git config: a model-written ~/.gitconfig could
      # otherwise define external diff/merge drivers (arbitrary exec via
      # allowlisted git commands), url.insteadOf push redirects, or custom
      # merge drivers that skew the verify step's merge-tree re-derivation.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      # Reviewers who open a conflicted PR mid-resolution see GitHub's bare
      # conflict banner plus this workflow's (by design, always-skipped)
      # push-run check stubs — which reads as "the resolver is broken"
      # (observed on PR #183, resolved within ~6 minutes of the banner
      # appearing). Say a resolution attempt is underway BEFORE anything slow
      # (the full-history checkout alone takes a while on this repository).
      # Upserted via hidden marker so retried attempts edit one status comment
      # instead of stacking new ones; a comment failure never blocks the
      # resolution itself.
      - name: Comment on PR (resolution starting)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post_start_comment() {
            local marker='<!-- thingtime-ai-resolve-start:v1 -->'
            local started eta body comment_id
            started="$(date -u '+%H:%M UTC')"
            eta="$(date -u -d '+8 minutes' '+%H:%M UTC')"
            body="$RUNNER_TEMP/resolve-start-comment.md"
            {
              printf '🤖 **Auto-resolve running** — the conflict resolver started working on this PR at %s.\n\n' "$started"
              printf 'Expected to finish around **%s** (resolutions typically land in 3-8 minutes; the job times out at 30). ' "$eta"
              printf 'On success a merge commit resolving the conflicts is pushed to this branch and a result comment follows — no manual action is needed meanwhile.\n\n'
              printf '[Live status](%s)\n\n%s\n' "$RUN_URL" "$marker"
            } > "$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --slurp \
              | jq -r '
                  add // []
                  | [.[]
                      | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("thingtime-ai-resolve-start:v1"))
                      | .id]
                  | last // empty
                ')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
            fi
          }
          post_start_comment || echo "::warning::Could not post the resolution-start comment; continuing with the resolution."

      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.pr.head_sha }}
          # Fetch every branch so the exact snapshotted base commit is local;
          # no authenticated fetch is needed later.
          fetch-depth: 0
          # Keep the token out of .git/config: the model has Read access to
          # the workspace, and the push step supplies its own auth.
          persist-credentials: false
          # This job intentionally points GIT_CONFIG_GLOBAL at /dev/null.
          # Avoid checkout's otherwise harmless global safe.directory write,
          # which produced the misleading "could not lock /dev/null" error
          # annotation even though conflict resolution succeeded.
          set-safe-directory: false

      - name: Clear stale or deliberately retried ownership pauses
        if: >-
          env.RECOVER_MERGE_PAUSE == 'true'
          || env.RECOVER_REBASE_PAUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RETRY: ${{ inputs.manual_retry && 'true' || 'false' }}
        run: |
          set -euo pipefail
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          decode_base64url() {
            local value="$1"
            value="$(tr '_-' '/+' <<<"$value" | tr -d '\n')"
            case $((${#value} % 4)) in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$value" | base64 --decode
          }
          remove_label_verified() {
            local label="$1"
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/$label" \
              >/dev/null 2>&1 || true
            absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
              --jq "[.labels[].name] | index(\"$label\") == null")"
            [ "$absent" = true ] || {
              echo "::error::Could not clear proven stale $label."
              return 1
            }
          }

          # Recovery booleans were computed by an earlier detector. Re-prove
          # the exact ref snapshot and current merge ownership before deleting
          # either label, so a queued run cannot erase a newly valid rebase hold.
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed before pause recovery."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            && [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR repositories changed before pause recovery."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            && [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR refs changed before pause recovery."; exit 1; }
          [ "$(live_ref_sha "$HEAD_REF")" = "$EXPECTED_HEAD_SHA" ] \
            && [ "$(live_ref_sha "$BASE_REF")" = "$EXPECTED_BASE_SHA" ] \
            || { echo "::error::PR SHAs changed before pause recovery."; exit 1; }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$HEAD_REF" != "$default_ref" ] \
            && [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::PR head is no longer an eligible write target."; exit 1; }

          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          all_open="$(gh api --paginate \
            "repos/$REPO/pulls?state=open&per_page=100" --slurp \
            | jq -c 'add // []')"
          stack_member="$(jq -r \
            --arg repo "$REPO" \
            --argjson number "$PR_NUMBER" \
            --arg head "$HEAD_REF" \
            --arg base "$BASE_REF" '
              any(.[];
                .number != $number
                and .head.repo.full_name == $repo
                and .base.repo.full_name == $repo
                and ([.labels[].name] | index("no-ai-rebase") == null)
                and (.head.ref == $base or .base.ref == $head))
            ' <<<"$all_open")"
          merge_owned=false
          topology=standalone
          if [ "$(jq -r '.mergeable' <<<"$pr")" = false ]; then
            if [ "$stack_member" != true ]; then
              merge_owned=true
            elif jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
              merge_owned=true
              topology=no-ai-stack
            fi
          fi
          [ "$merge_owned" = true ] \
            || { echo "::error::Resolver ownership changed before pause recovery."; exit 1; }
          if jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
            echo "::error::The rebase ownership mutex appeared before pause recovery."
            exit 1
          fi

          if [ "$RECOVER_MERGE_PAUSE" = true ] \
             && jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels" \
             && [ "$MANUAL_RETRY" != true ]; then
            token="$(
              gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --slurp \
                | jq -r '
                    add // []
                    | [.[]
                        | select(.user.login == "github-actions[bot]")
                        | .body
                        | capture("<!-- thingtime-ai-conflict-pause:v1 (?<token>[A-Za-z0-9_-]+) -->")?
                        | .token]
                    | last // empty
                  '
            )"
            [ -n "$token" ] \
              || { echo "::error::Merge pause metadata changed before recovery."; exit 1; }
            decoded="$(decode_base64url "$token" 2>/dev/null || true)"
            payload="$(jq -ce \
              --argjson number "$PR_NUMBER" '
                select(type == "object")
                | select(.v == 1 and .owner == "merge" and .pr == $number)
                | select(.head_ref | type == "string" and length > 0)
                | select(.base_ref | type == "string" and length > 0)
                | select(.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.base_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.topology == "standalone" or .topology == "no-ai-stack")
              ' <<<"$decoded" 2>/dev/null || true)"
            [ -n "$payload" ] \
              || { echo "::error::Merge pause metadata changed before recovery."; exit 1; }
            if [ "$HEAD_REF" = "$(jq -r '.head_ref' <<<"$payload")" ] \
               && [ "$BASE_REF" = "$(jq -r '.base_ref' <<<"$payload")" ] \
               && [ "$EXPECTED_HEAD_SHA" = "$(jq -r '.head_sha' <<<"$payload")" ] \
               && [ "$EXPECTED_BASE_SHA" = "$(jq -r '.base_sha' <<<"$payload")" ] \
               && [ "$topology" = "$(jq -r '.topology' <<<"$payload")" ]; then
              echo "::error::A fresh exact-snapshot merge pause superseded this queued retry."
              exit 1
            fi
          fi

          if [ "$RECOVER_MERGE_PAUSE" = true ]; then
            remove_label_verified ai-merge-paused
          fi
          if [ "$RECOVER_REBASE_PAUSE" = true ]; then
            remove_label_verified ai-rebase-paused
          fi

      - name: Merge base into head
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # zdiff3 markers show ours + BASE + theirs, so the model can infer
          # each side's intent from the file alone (it has no git access).
          git config merge.conflictStyle zdiff3

          for sha_name in EXPECTED_HEAD_SHA EXPECTED_BASE_SHA; do
            sha="${!sha_name}"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$sha_name must be an exact 40-character commit SHA."
              exit 1
            fi
          done
          base="$EXPECTED_BASE_SHA"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null
          pre_merge="$(git rev-parse HEAD)"
          [ "$pre_merge" = "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Checkout does not match the snapshotted PR head."; exit 1; }
          echo "$pre_merge" > "$RUNNER_TEMP/pre_merge_sha.txt"

          clean=true
          git merge --no-edit \
            -m "Merge branch '$BASE_REF' into $HEAD_REF" \
            "$base" || clean=false

          # graphify-out determinism: the repo's graph.json merge driver is not
          # configured in CI, so git text-merges it — producing a mixed
          # base+head graph/manifest pair that CLAUDE.md explicitly forbids.
          # When BOTH sides touched graphify-out since the merge base, reset
          # the WHOLE directory to the base side (one side, never mixed).
          # One-sided changes are left alone: git already took that side
          # uniformly.
          graphify_reset=false
          mb="$(git merge-base "$pre_merge" "$base")"
          if ! git diff --quiet "$mb" "$pre_merge" -- graphify-out/ 2>/dev/null \
             && ! git diff --quiet "$mb" "$base" -- graphify-out/ 2>/dev/null; then
            graphify_reset=true
            git rm -rfq --ignore-unmatch -- graphify-out/
            # rev-parse on <rev>:<path> is the reliable existence test for a
            # tree path (ls-tree -d with a trailing-slash pathspec lists the
            # directory's children, not the directory, and can be empty).
            if git rev-parse --verify --quiet "$base:graphify-out" >/dev/null; then
              git checkout "$base" -- graphify-out/
            fi
            if [ "$clean" = true ]; then
              # merge auto-committed; fold the reset in (amend keeps both parents)
              git commit --amend --no-edit
            fi
          fi
          echo "graphify_reset=$graphify_reset" >> "$GITHUB_OUTPUT"

          if [ "$clean" = false ]; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicted.txt"
            if [ ! -s "$RUNNER_TEMP/conflicted.txt" ]; then
              # the graphify reset was the only conflict — finish the merge
              # deterministically, zero AI spend
              git commit --no-edit
              clean=true
            fi
          fi

          if [ "$clean" = false ]; then
            echo "Conflicted paths:"
            cat "$RUNNER_TEMP/conflicted.txt"
          fi
          echo "conflicted=$([ "$clean" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

          # Workflow-file guard: GITHUB_TOKEN pushes are rejected if the merge
          # introduces ANY change under .github/workflows/ relative to the head
          # we push to — including cleanly-merged ones (e.g. a workflow newly
          # added on the base). Detect that here, BEFORE any AI spend. A PAT
          # with workflow scope lifts this.
          # (`git diff --cached $pre_merge` compares the index — which equals
          # HEAD after a clean merge — against the pre-merge head, so it works
          # for both the clean and the mid-merge state.)
          if [ "$HAS_WORKFLOW_PUSH" != "true" ] \
             && git diff --cached --name-only "$pre_merge" -- .github/workflows/ | grep -q .; then
            echo "workflows_blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::This merge changes .github/workflows/**, which GITHUB_TOKEN cannot push. Merge the base manually, or add a CONFLICT_RESOLVER_PAT secret with workflow scope."
            exit 1
          fi

          # No pre-AI snapshot is taken: the verify step re-derives both the
          # conflicted set and the auto-merge baseline from git's object store
          # (`git merge-tree --write-tree`), so there is nothing here for the
          # model to tamper with. conflicted.txt above is informational only.

      - name: Require an AI credential
        if: steps.merge.outputs.conflicted == 'true'
        env:
          HAS_AI_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_AI_CREDENTIAL" != "true" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repo secret to enable the AI conflict resolver (claude CLI: /install-github-app)."
            exit 1
          fi

      - name: Resolve conflicts with Claude
        if: steps.merge.outputs.conflicted == 'true'
        uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The trusted Actions workflow dispatch uses GITHUB_TOKEN, so its
          # develop worker is attributed to github-actions[bot]. The action
          # refuses non-human actors by default ("Workflow initiated by non-human
          # actor: github-actions (type: Bot)"), which silently broke the whole
          # push -> handoff -> dispatch -> resolve chain: only runs a human
          # dispatched ever reached the model. Allow exactly this bot, not '*'.
          allowed_bots: "github-actions"
          prompt: |
            You are resolving git merge conflicts inside a GitHub Actions runner by
            EDITING FILES ONLY. You have NO shell and NO git access — that is
            intentional. A later deterministic step stages, verifies, commits, and
            pushes what you leave in the working tree. Do not attempt to run git or
            any command; just edit the conflicted files in place.

            Situation: base branch "${{ matrix.pr.base }}"
            was merged into "${{ matrix.pr.head }}" (the head of PR #${{ matrix.pr.number }}),
            and the merge stopped on conflicts. Conflicted files currently contain
            zdiff3 conflict markers:

                <<<<<<< (ours = the PR head branch)
                ...head side...
                ||||||| (the common ancestor / base of the two sides)
                ...original...
                =======
                ...base-branch side...
                >>>>>>> (theirs = the branch being merged in)

            Method:
            1. Use the Grep tool to find every file containing a line that starts with
               "<<<<<<<" — those are your conflicts (search the whole workspace).
            2. For each conflicted file, read it in full. The three-way markers show
               both sides AND their common ancestor, so you can tell what each side
               changed and why. Rewrite the conflicted region to the semantic UNION —
               preserve BOTH sides' intent unless they are genuinely mutually
               exclusive; when they are, prefer the base-branch (theirs) side and
               re-apply the head (ours) intent adapted on top of it. Remove ALL
               conflict markers (the <<<<<<<, |||||||, =======, and >>>>>>> lines).
            3. Rules:
               - graphify-out/** has ALREADY been handled deterministically before you
                 ran. Never touch anything under graphify-out/.
               - pnpm-lock.yaml / package-lock.json: only take one side wholesale, and
                 only if the corresponding package.json resolved fully to that SAME
                 side. If package.json needed a true union of dependency changes,
                 LEAVE THE LOCKFILE'S MARKERS IN PLACE and say why — a human must
                 regenerate it (the run will then stop for manual resolution).
               - Edit ONLY files that contain conflict markers. Do not create, rename,
                 or delete files, and do not edit non-conflicted files. (Only the
                 conflicted files are staged afterward; anything else you change is
                 ignored, and out-of-scope edits are rejected mechanically.)
            4. If a conflict cannot be resolved with high confidence, LEAVE its markers
               in place rather than guessing — the workflow then stops and asks a human.

            When you are done, every file you could confidently resolve should have no
            conflict markers left, and you should have touched nothing else.
          # The first admin-ordered model is primary; the rest are Claude
          # Code's native availability fallbacks. This does not retry a
          # completed-but-unresolved edit with another model.
          claude_args: |
            ${{ needs.model_config.outputs.model_args }}
            --effort max
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write"
            --disallowedTools "WebFetch,WebSearch,Bash,Edit(.gitattributes),Write(.gitattributes),Edit(**/.gitattributes),Write(**/.gitattributes),Read(./.git/**),Edit(./.git/**),Write(./.git/**),Read(**/.git/**),Edit(**/.git/**),Write(**/.git/**),Read(/proc/**),Edit(/proc/**),Write(/proc/**),Read(/home/runner/work/_temp/**),Edit(/home/runner/work/_temp/**),Write(/home/runner/work/_temp/**),Read(/home/runner/.gitconfig*),Edit(/home/runner/.gitconfig*),Write(/home/runner/.gitconfig*),Edit(/home/runner/.config/git/**),Write(/home/runner/.config/git/**)"

      - name: Verify resolution and commit
        if: steps.merge.outputs.conflicted == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GRAPHIFY_RESET: ${{ steps.merge.outputs.graphify_reset }}
        run: |
          set -euo pipefail

          # The merge must still be in progress (the model must not have
          # committed or aborted it).
          if [ ! -f .git/MERGE_HEAD ]; then
            echo "::error::Merge is no longer in progress — refusing to continue."
            exit 1
          fi

          # Belt to the .git/** write-deny: a merge/clean/smudge/textconv driver
          # defined in local .git/config would be EXECUTED by the git add /
          # merge-tree below if an attribute referenced it (arbitrary code exec).
          # A normal CI checkout configures none; if one appears, .git was
          # tampered with — abort rather than rely solely on the file-tool deny.
          if git config --local --list --name-only 2>/dev/null \
             | grep -qiE '^(merge|filter|diff)\.[^.]+\.(driver|clean|smudge|process|textconv|command)$'; then
            echo "::error::Unexpected local git driver configured — refusing (possible .git tampering):"
            git config --local --list --name-only | grep -iE '^(merge|filter|diff)\.[^.]+\.(driver|clean|smudge|process|textconv|command)$' || true
            exit 1
          fi

          # Everything this step trusts is RE-DERIVED from git's object store.
          # The model has NO git access at all — it only edited files in the
          # working tree — so nothing it can do influences this recomputation.
          # RUNNER_TEMP files from earlier steps are NOT trusted here.
          #
          # HEAD is still the pre-merge head commit during a merge, so
          # merge-tree recomputes the exact auto-merge baseline and the exact
          # conflicted set the merge step saw.
          #
          # CRITICAL: run merge-tree from an EMPTY cwd with GIT_DIR set, so no
          # in-tree .gitattributes is consulted. A model-planted working-tree
          # .gitattributes (e.g. "clean.txt merge=binary") would otherwise make
          # merge-tree reclassify a cleanly-auto-merged file as conflicted,
          # smuggling it into the allowed set. Attributes here come only from
          # .git/info/attributes (model can't write it) + builtin; the sole
          # merge= attribute the repo actually uses targets graphify-out/,
          # which is validated separately (subtree OID), so ignoring in-tree
          # attributes is safe. SHAs are resolved before the cd.
          merge_head="$(git rev-parse MERGE_HEAD)"
          head_sha="$(git rev-parse HEAD)"
          git_dir="$(git rev-parse --absolute-git-dir)"
          # --no-messages: output is exactly <tree-oid>\n<conflicted names...>
          # (verified empirically; without it an informational section follows
          # after a blank line). The sed stop-at-blank is belt-and-braces.
          attic="$(mktemp -d)"
          merge_out="$(cd "$attic" && GIT_DIR="$git_dir" GIT_ATTR_NOSYSTEM=1 \
            git -c core.attributesFile=/dev/null merge-tree --write-tree --no-messages --name-only "$head_sha" "$merge_head")" || true
          rmdir "$attic" 2>/dev/null || true
          automerge_tree="$(printf '%s\n' "$merge_out" | head -1)"
          git rev-parse --verify --quiet "$automerge_tree^{tree}" >/dev/null || {
            echo "::error::Could not recompute the auto-merge tree."; exit 1;
          }
          printf '%s\n' "$merge_out" | tail -n +2 | sed -n '/^$/q;p' | sort -u > "$RUNNER_TEMP/conflicted-derived.txt"

          # DETERMINISTIC STAGING: the model only edited the working tree; we
          # stage its resolutions ourselves, and ONLY for the recomputed
          # conflicted paths (never a path the model might have invented). A
          # file that still carries markers is left UNMERGED on purpose so the
          # ls-files -u guard below catches it. A file the model deleted while
          # resolving a modify/delete is staged as a deletion.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ ! -e "$path" ]; then
              git rm -q --ignore-unmatch -- "$path" || true
            elif grep -qE '^(<{7}|\|{7}|>{7})( |$)' "$path"; then
              echo "::warning::$path still has conflict markers — leaving it unmerged."
            else
              git add -- "$path"
            fi
          done < "$RUNNER_TEMP/conflicted-derived.txt"

          # Any unmerged path left now is an unresolved conflict.
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Unresolved paths remain:"
            git ls-files -u | awk -F'\t' '{print $2}' | sort -u
            exit 1
          fi

          # ENFORCE the scope invariant: diff the staged index tree against the
          # recomputed auto-merge tree; every changed path must be a recomputed
          # conflicted path. graphify-out/** is NOT blanket-allowed — when the
          # merge step reset it, the staged subtree must equal the base side
          # EXACTLY (subtree OID compare), so the model cannot smuggle content
          # under the reset's cover; when no reset ran, graphify-out paths are
          # held to the same conflicted-set rule as everything else.
          index_tree="$(git write-tree)"
          changed="$(git diff-tree -r --name-only "$automerge_tree" "$index_tree")"
          graphify_changed=false
          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              case "$path" in graphify-out/*) graphify_changed=true; continue ;; esac
              if ! grep -qxF "$path" "$RUNNER_TEMP/conflicted-derived.txt"; then
                echo "::error::Staged change outside the recomputed conflicted set: $path — refusing to commit."
                exit 1
              fi
            done <<<"$changed"
          fi
          if [ "$graphify_changed" = true ]; then
            if [ "$GRAPHIFY_RESET" = "true" ]; then
              staged_sub="$(git rev-parse --verify --quiet "$index_tree:graphify-out" || echo missing)"
              base_sub="$(git rev-parse --verify --quiet "origin/$BASE_REF:graphify-out" || echo missing)"
              if [ "$staged_sub" != "$base_sub" ]; then
                echo "::error::graphify-out was reset to the base side, but the staged subtree no longer matches it — refusing to commit."
                exit 1
              fi
            else
              # no reset ran, so graphify-out paths must individually be
              # recomputed conflicts (same rule as everything else)
              while IFS= read -r path; do
                case "$path" in
                  graphify-out/*)
                    if ! grep -qxF "$path" "$RUNNER_TEMP/conflicted-derived.txt"; then
                      echo "::error::Staged graphify-out change outside the recomputed conflicted set: $path — refusing to commit."
                      exit 1
                    fi
                    ;;
                esac
              done <<<"$changed"
            fi
          fi

          # Leftover-marker + secret scan, against STAGED content (what ships),
          # scoped to the recomputed conflicted set. '=======' alone is
          # skipped: legit in markdown setext underlines. Best-effort backstop,
          # not a boundary (see header).
          keyfile="$RUNNER_TEMP/scan-needles.txt"
          : > "$keyfile"
          for secret in "${ANTHROPIC_API_KEY:-}" "${CLAUDE_CODE_OAUTH_TOKEN:-}"; do
            [ -n "$secret" ] || continue
            printf '%s\n' "$secret" >> "$keyfile"
            printf '%s' "$secret" | base64 -w0 >> "$keyfile"
            printf '\n' >> "$keyfile"
          done
          # Materialize each staged blob to a temp file and grep the FILE (not
          # a pipe): a pipe would let grep -q's early exit kill `git show` with
          # SIGPIPE, which under pipefail surfaces as exit 141 that the `if`
          # reads as "no match" — a secret near the top of a large staged file
          # would then slip past. (Process substitution avoids the pipe but is
          # unreliable on older bash; a temp file is unambiguous everywhere.)
          blob="$RUNNER_TEMP/staged-blob"
          while IFS= read -r path; do
            git show ":$path" > "$blob" 2>/dev/null || true
            if grep -qE '^(<{7}|>{7})( |$)' "$blob"; then
              echo "::error::Conflict markers left in staged $path"
              rm -f "$blob"; exit 1
            fi
            if [ -s "$keyfile" ] && grep -qFf "$keyfile" "$blob"; then
              echo "::error::Staged $path contains secret material — refusing to commit."
              rm -f "$blob"; exit 1
            fi
          done < "$RUNNER_TEMP/conflicted-derived.txt"
          rm -f "$keyfile" "$blob"

          if [ -n "$(git diff --name-only)" ]; then
            echo "::warning::Unstaged edits left behind (not committed):"
            git diff --name-only
          fi

          # ', '-joined list (paste -sd would CYCLE the two delimiter chars)
          conflicted_list="$(sed '$!s/$/,/' "$RUNNER_TEMP/conflicted-derived.txt" | tr '\n' ' ' | sed 's/ $//')"
          git commit \
            -m "Merge $BASE_REF into $HEAD_REF (AI-resolved conflicts)" \
            -m "Conflicted paths: $conflicted_list" \
            -m "Resolved by the resolve-pr-conflicts workflow: $RUN_URL" \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"

      # Runs ONLY after the resolution has been verified and committed, so the
      # verify step's "staged graphify-out subtree == base side" assertion is
      # evaluated against the untouched base tree (refreshing before it would
      # make that check fail by design). The tree is reset to the commit first,
      # so a stray model edit left unstaged can never end up indexed here, and
      # the model has no influence over this step at all.
      - name: Refresh graphify outputs (LLM semantic when a credential exists)
        id: graphify
        if: steps.merge.outputs.graphify_reset == 'true'
        # This refresh is a nicety, never worth losing a verified resolution:
        # any failure here must not skip the push step below, which is what
        # actually publishes the merge commit.
        continue-on-error: true
        timeout-minutes: 25
        env:
          # Pinned: the AST cache is version-namespaced and untracked, so CI
          # always re-extracts. An unpinned upgrade whose output format drifted
          # would rewrite graph.json/GRAPH_REPORT.md wholesale (~37k lines) and
          # guarantee a graphify-out conflict on the NEXT merge — i.e. the step
          # would manufacture the condition it exists to resolve.
          GRAPHIFY_VERSION: "0.9.4"
          # Semantic-extraction credentials (either may be absent; see the
          # header). Same secrets the resolve step runs on, so no NEW
          # principals see them beyond the pinned graphifyy package and the
          # claude CLI it shells out to.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Keep the post-resolution semantic refresh on the same trusted,
          # administrator-selected primary model as the conflict edit itself.
          PREFERRED_MODEL: ${{ needs.model_config.outputs.primary_model }}
        run: |
          set -euo pipefail
          # An empty env var and an unset one look the same to `[ -n ]` but
          # not necessarily to child processes (the claude CLI); normalize.
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN

          # `default` deliberately leaves each Graphify backend on its own
          # default. Every named value is a literal emitted by model_config's
          # closed allowlist: the API backend consumes --model, while the
          # claude-cli backend consumes GRAPHIFY_CLAUDE_CLI_MODEL.
          graphify_model_args=()
          case "${PREFERRED_MODEL:-default}" in
            default)
              unset GRAPHIFY_CLAUDE_CLI_MODEL
              ;;
            claude-fable-5|claude-opus-5)
              graphify_model_args=(--model "$PREFERRED_MODEL")
              export GRAPHIFY_CLAUDE_CLI_MODEL="$PREFERRED_MODEL"
              ;;
            *)
              echo "::warning::Unexpected preferred model output; Graphify will use its built-in default."
              unset GRAPHIFY_CLAUDE_CLI_MODEL
              ;;
          esac

          # Index exactly what was committed, and nothing the model left behind.
          # -x is REQUIRED: without it, ignored paths survive, and the model can
          # write ignored files that graphify reads and folds into TRACKED output
          # (graphify-out/.graphify_labels.json becomes community labels in
          # GRAPH_REPORT.md; graphify-out/cache/ast/** is keyed by a hash the
          # model can enumerate and would inject nodes/edges into graph.json).
          # That would smuggle model-authored content past the verify step.
          git reset -q --hard HEAD
          git clean -qffdx
          # Belt: restore graphify-out from the commit outright.
          rm -rf graphify-out
          git checkout -q HEAD -- graphify-out/ 2>/dev/null || true

          if ! (pipx install "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1 \
                || pip install --user "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1); then
            echo "::warning::graphify $GRAPHIFY_VERSION could not be installed in CI — keeping the base branch's graph as-is."
            echo "refreshed=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PATH="$HOME/.local/bin:$PATH"

          # Pick a semantic backend from whichever Claude credential exists.
          backend=""
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            backend="claude"
          elif [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            # graphify's claude-cli backend shells out to `claude -p`, which
            # authenticates from CLAUDE_CODE_OAUTH_TOKEN — the same mechanism
            # claude-code-action uses. The resolve step may have left the CLI
            # installed already; install it if not.
            if command -v claude >/dev/null 2>&1; then
              backend="claude-cli"
            elif npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
                 && command -v claude >/dev/null 2>&1; then
              backend="claude-cli"
            else
              echo "::warning::claude CLI unavailable and could not be installed — semantic extraction skipped (AST-only refresh)."
            fi
          fi

          # Semantic path: `extract` is manifest-incremental (only files the
          # merge changed are re-extracted; unchanged docs are served from the
          # tracked cache — zero LLM calls when nothing semantic changed), then
          # `cluster-only` regenerates GRAPH_REPORT.md. --no-label matches the
          # repo's current placeholder community names without spending LLM
          # calls on naming; --api-timeout bounds each request so one
          # pathological doc can't eat the step timeout. NEVER add
          # --no-cluster to the extract: it writes ONLY the newly-extracted
          # nodes and destroys the rest of the graph.

          # Mechanical guard for that whole failure class: refuse a semantic
          # result whose node count halved. `graphify update` has a built-in
          # fewer-nodes guard, `graphify extract` does not — without this, a
          # collapsed graph would be committed to the PR branch. A legitimate
          # >50% shrink (mass code deletion) lands on the AST fallback, whose
          # own guard then decides; resolve that rare case locally with
          # `graphify update --force`.
          graph_not_collapsed() {
            old_n="$(git show HEAD:graphify-out/graph.json 2>/dev/null | jq '.nodes | length' 2>/dev/null || echo 0)"
            new_n="$(jq '.nodes | length' graphify-out/graph.json 2>/dev/null || echo 0)"
            case "$old_n" in ''|*[!0-9]*) old_n=0 ;; esac
            case "$new_n" in ''|*[!0-9]*) new_n=0 ;; esac
            if [ "$old_n" -gt 0 ] && [ "$new_n" -lt $(( old_n / 2 )) ]; then
              echo "::warning::Semantic refresh shrank the graph ($old_n -> $new_n nodes) — refusing it."
              return 1
            fi
            return 0
          }

          semantic="none"
          if [ -n "$backend" ]; then
            conc=4
            if [ "$backend" = "claude-cli" ]; then conc=1; fi
            if graphify extract . --backend "$backend" "${graphify_model_args[@]}" \
                 --max-concurrency "$conc" --api-timeout 240 \
               && graphify cluster-only . --no-viz --no-label \
               && graph_not_collapsed; then
              semantic="$backend"
            else
              semantic="failed"
              echo "::warning::Semantic \`graphify extract\` via $backend failed — falling back to the AST-only refresh."
              # The failed run may have half-written outputs (including a
              # dated backup dir); restore the committed state before the
              # fallback so it starts from the same tree the extract did.
              git checkout -q HEAD -- graphify-out/ 2>/dev/null || true
              git clean -qffdx -- graphify-out/
            fi
          fi
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"

          # AST/text-only fallback (and the no-credential path): no LLM.
          if [ "$semantic" = "none" ] || [ "$semantic" = "failed" ]; then
            if ! graphify update .; then
              echo "::warning::\`graphify update\` failed in CI — keeping the base branch's graph as-is."
              echo "refreshed=failed" >> "$GITHUB_OUTPUT"
              git reset -q --hard HEAD
              exit 0
            fi
          fi

          # Stage ONLY the portable outputs the repo tracks — never the whole
          # subtree, which would sweep in graphify's leftovers (.graph.tmp.json,
          # needs_update, dated backup dirs) and the untracked derived viz.
          for f in graph.json GRAPH_REPORT.md manifest.json cost.json; do
            p="graphify-out/$f"
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
              git add -A -- "$p"
            fi
          done
          # The content-addressed semantic cache is tracked by repo policy:
          # blobs paid for in CI must be committed so no local run ever
          # re-pays the same extraction.
          if [ -d graphify-out/cache/semantic ] \
             || [ -n "$(git ls-files -- 'graphify-out/cache/semantic/')" ]; then
            git add -A -- graphify-out/cache/semantic/
          fi

          # Anything changed outside graphify-out/ means the CLI touched source.
          if [ -n "$(git status --porcelain --untracked-files=no -- . ':(exclude)graphify-out/')" ]; then
            echo "::error::graphify update modified files outside graphify-out/ — refusing to commit the refresh."
            git reset -q --hard HEAD
            echo "refreshed=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same best-effort secret scan the verify step runs on resolved
          # files, here for the refresh commit: this step holds live
          # credentials and commits LLM-influenced output (a prompt-injected
          # doc could steer extraction), so staged content must never carry
          # them. Best-effort backstop, not a boundary (see header).
          keyfile="$RUNNER_TEMP/graphify-needles.txt"
          : > "$keyfile"
          for secret in "${ANTHROPIC_API_KEY:-}" "${CLAUDE_CODE_OAUTH_TOKEN:-}"; do
            [ -n "$secret" ] || continue
            printf '%s\n' "$secret" >> "$keyfile"
            printf '%s' "$secret" | base64 -w0 >> "$keyfile"
            printf '\n' >> "$keyfile"
          done
          if [ -s "$keyfile" ]; then
            git diff --cached --name-only > "$RUNNER_TEMP/graphify-staged.txt"
            blob="$RUNNER_TEMP/graphify-staged-blob"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git show ":$path" > "$blob" 2>/dev/null || true
              if grep -qFf "$keyfile" "$blob"; then
                echo "::error::Staged $path contains secret material — dropping the graphify refresh."
                rm -f "$blob" "$keyfile"
                git reset -q --hard HEAD
                echo "refreshed=failed" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < "$RUNNER_TEMP/graphify-staged.txt"
            rm -f "$blob"
          fi
          rm -f "$keyfile"

          if git diff --cached --quiet; then
            echo "Graph already current; nothing to refresh."
            echo "refreshed=nochange" >> "$GITHUB_OUTPUT"
          else
            case "$semantic" in
              claude|claude-cli)
                detail="\`graphify extract\` with LLM semantic extraction (graphify $GRAPHIFY_VERSION, $semantic backend); unchanged content served from the tracked semantic cache." ;;
              *)
                detail="AST/text-only \`graphify update\` (graphify $GRAPHIFY_VERSION, no semantic extraction); run graphify locally with an LLM backend if semantic data is needed." ;;
            esac
            git commit -q \
              -m "chore: refresh graphify outputs after conflict merge" \
              -m "$detail" \
              -m "Refreshed by the resolve-pr-conflicts workflow: $RUN_URL"
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merge commit
        id: push
        env:
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          # Revalidate immediately beside the write. The scheduled detector
          # deliberately widens availability, so publication must fail closed
          # if a human, another resolver, or the PR topology changed meanwhile.
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed while the resolver was running."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR head repository changed while resolving."; exit 1; }
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR base repository changed while resolving."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            || { echo "::error::PR head ref changed while resolving."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR base ref changed while resolving."; exit 1; }

          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels"; then
            echo "::error::ai-merge-paused was added or could not be cleared while this run was active."
            exit 1
          fi
          if jq -e 'any(. == "ai-rebase-in-progress" or . == "ai-rebase-paused")' \
               >/dev/null <<<"$labels"; then
            echo "::error::The rebase workflow acquired or paused this PR while merge resolution was running."
            exit 1
          fi

          # Stack ownership is structural, not timing-dependent. A newly
          # opened parent/child makes this merge run abstain unless the PR is
          # explicitly labelled no-ai-rebase.
          if ! jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            all_open="$(
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp \
                | jq -c 'add // []'
            )"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$HEAD_REF" \
              --arg base "$BASE_REF" '
                any(.[];
                  .number != $number
                  and .head.repo.full_name == $repo
                  and .base.repo.full_name == $repo
                  and ([.labels[].name] | index("no-ai-rebase") == null)
                  and (.head.ref == $base or .base.ref == $head))
              ' <<<"$all_open")"
            [ "$stack_member" != true ] \
              || { echo "::error::PR became a stack member; rebase workflow now owns it."; exit 1; }
          fi

          [ "$(live_ref_sha "$HEAD_REF")" = "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Head moved immediately before push; exact lease preserved the newer work."; exit 1; }
          [ "$(live_ref_sha "$BASE_REF")" = "$EXPECTED_BASE_SHA" ] \
            || { echo "::error::Base moved immediately before push; rerun against the new base."; exit 1; }
          [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::Head branch became protected while resolving."; exit 1; }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$HEAD_REF" != "$default_ref" ] \
            || { echo "::error::The repository default branch is never a resolver push target."; exit 1; }

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Local checkout is not pristine before push."
            git status --short
            exit 1
          fi
          new_head="$(git rev-parse HEAD)"
          [ "$new_head" != "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Merge produced no new commit."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" "$new_head" \
            || { echo "::error::Final history does not descend from the exact snapshotted head."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$new_head" \
            || { echo "::error::Final history does not contain the exact snapshotted base."; exit 1; }

          token="${PUSH_PAT:-$DEFAULT_TOKEN}"
          # Auth via GIT_CONFIG_* env (never argv, never .git/config), pushing
          # to the explicit canonical URL so a tampered remote can't redirect.
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_2="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth"

          set +e
          git push \
            --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_HEAD_SHA" \
            "https://github.com/$REPO.git" \
            "HEAD:refs/heads/$HEAD_REF"
          transport_rc=$?
          set -e

          # A transport error can arrive after GitHub accepted the update.
          # Query the authoritative live ref before deciding whether retrying
          # would be safe; never infer publication from the git exit code.
          remote_sha=''
          for attempt in 1 2 3 4 5; do
            remote_sha="$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)"
            [ "$remote_sha" != "$new_head" ] || break
            [ "$attempt" -eq 5 ] || sleep 2
          done
          if [ "$remote_sha" = "$new_head" ]; then
            {
              echo "remote_state=published"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            if [ "$transport_rc" -ne 0 ]; then
              echo "::warning::git push returned $transport_rc, but the live ref proves the exact merge commit was published."
            fi
            exit 0
          fi
          if [ "$remote_sha" = "$EXPECTED_HEAD_SHA" ]; then
            {
              echo "remote_state=unchanged"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::The live ref proves the remote branch is unchanged after push."
            exit 1
          fi
          if [ -z "$remote_sha" ]; then
            {
              echo "remote_state=unverifiable"
              echo "remote_sha=unavailable"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Push outcome is unverifiable because the live ref could not be queried."
            exit 1
          fi
          {
            echo "remote_state=unexpected"
            echo "remote_sha=$remote_sha"
            echo "transport_rc=$transport_rc"
          } >> "$GITHUB_OUTPUT"
          echo "::error::Ambiguous push outcome: live head is unexpected ($remote_sha)."
          exit 1

      - name: Comment on PR (resolved)
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPHIFY_RESET: ${{ steps.merge.outputs.graphify_reset }}
          GRAPHIFY_REFRESHED: ${{ steps.graphify.outputs.refreshed }}
          GRAPHIFY_SEMANTIC: ${{ steps.graphify.outputs.semantic }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo "🤝 Merged \`$BASE_REF\` into \`$HEAD_REF\` — conflicts auto-resolved by the [resolve-pr-conflicts workflow]($RUN_URL)."
            echo
            # conflicted-derived.txt is written by the verify step AFTER the
            # model finished (recomputed from git), so it is the trustworthy
            # list; plain conflicted.txt only exists on non-AI paths.
            if [ -s "$RUNNER_TEMP/conflicted-derived.txt" ]; then
              echo "Conflicted files:"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicted-derived.txt"
            else
              echo "No AI resolution was needed by merge time; the branch was updated with a plain merge commit."
            fi
            if [ "$GRAPHIFY_RESET" = "true" ]; then
              echo
              echo "> graphify-out/ was reset wholesale to the \`$BASE_REF\` side (repo rule: one side, never mixed — the graph merge driver is unavailable in CI)."
              case "$GRAPHIFY_REFRESHED" in
                true)
                  case "$GRAPHIFY_SEMANTIC" in
                    claude|claude-cli)
                      echo "> Then re-ran graphify on the merged code WITH LLM semantic extraction (\`graphify extract\`, $GRAPHIFY_SEMANTIC backend) and committed the result — content new to this merge is semantically indexed; unchanged content came from the tracked cache." ;;
                    failed)
                      echo "> Then re-ran \`graphify update\` (AST/text-only — the semantic extraction attempt failed this run; see the workflow log) and committed the result. Run graphify locally with an LLM backend if fresh semantic data is needed." ;;
                    *)
                      echo "> Then re-ran \`graphify update\` (AST/text-only — no Claude credential available to the refresh step for semantic extraction) and committed the result." ;;
                  esac ;;
                nochange) echo "> Re-ran the graphify refresh; the graph was already current." ;;
                *)        echo "> ⚠️ The in-CI graphify refresh did not run successfully, so the graph is the base branch's — please run \`graphify update .\` locally." ;;
              esac
            fi
            if [ "$HAS_WORKFLOW_PUSH" != "true" ]; then
              echo
              echo "> Note: this push used \`GITHUB_TOKEN\`, so GitHub Actions checks did not re-run on the merge commit (Vercel and other app-based checks did)."
            fi
            echo
            echo "Please review the merge commit before relying on it."
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"

      - name: Cascade to PRs stacked on this head
        # Always dispatch exact child PR selections, even when a PAT-backed
        # push also creates a detector run. Duplicate discovery is harmless:
        # trusted workers serialize per PR without cancellation and re-detect
        # the live mergeability/ref snapshot before doing secret-bearing work.
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ github.event.client_payload.depth || inputs.depth || '0' }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/$REPO/issues/$PR_NUMBER" --jq '[.labels[].name]')"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            echo "PR #$PR_NUMBER is a no-ai-rebase topology boundary — not cascading through $HEAD_REF."
            exit 0
          fi
          case "$DEPTH" in (*[!0-9]*) DEPTH=99 ;; esac
          if [ "$DEPTH" -ge 3 ]; then
            echo "Cascade depth cap reached ($DEPTH) — not dispatching further."
            exit 0
          fi
          children="$(gh pr list --repo "$REPO" --base "$HEAD_REF" --state open --limit 1000 --json number --jq '.[].number')"
          if [ -z "$children" ]; then
            echo "No PRs are stacked on $HEAD_REF."
            exit 0
          fi

          count="$(wc -l <<<"$children" | tr -d ' ')"
          next_depth="$((DEPTH + 1))"
          echo "$count open PR(s) are based on $HEAD_REF — dispatching each exact PR selection to the fixed github-actions control plane."
          while IFS= read -r child_number; do
            [ -n "$child_number" ] || continue
            if ! jq -n \
              --arg pr_number "$child_number" \
              --arg depth "$next_depth" '
                {
                  ref:"github-actions",
                  inputs:{
                    pr_number:$pr_number,
                    branch:"",
                    detector_handoff:true,
                    manual_retry:false,
                    depth:$depth
                  }
                }
              ' \
              | gh api --method POST \
                  "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
                  --input -; then
              echo "::warning::Cascade dispatch for child PR #$child_number failed — the next real push or scheduled sweep re-covers it."
            fi
          done <<<"$children"

      - name: Comment on PR (needs attention)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUSH_STATE: ${{ steps.push.outputs.remote_state }}
          MERGE_CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          WF_BLOCKED: ${{ steps.merge.outputs.workflows_blocked }}
        run: |
          set -euo pipefail
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          # Pause only when the exact failed snapshot is still open, writable,
          # and merge-owned. A head/base/topology/label/protection race should
          # simply be rediscovered under its new state, not leave a stale hold.
          paused=false
          pause_marker=''
          protected_state="$(gh api \
            "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" \
            --jq '.protected' 2>/dev/null || true)"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch' 2>/dev/null || true)"
          if { [ "$MERGE_CONFLICTED" = true ] || [ "$WF_BLOCKED" = true ]; } \
             && [ "$PUSH_STATE" != published ] \
             && pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null)" \
             && [ "$(jq -r '.state' <<<"$pr")" = open ] \
             && [ "$(jq -r '.mergeable' <<<"$pr")" = false ] \
             && [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
             && [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
             && [ "$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)" = "$EXPECTED_HEAD_SHA" ] \
             && [ "$(live_ref_sha "$BASE_REF" 2>/dev/null || true)" = "$EXPECTED_BASE_SHA" ] \
             && [ "$protected_state" = false ] \
             && [ -n "$default_ref" ] \
             && [ "$HEAD_REF" != "$default_ref" ]; then
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            merge_owned=true
            topology=standalone
            if jq -e 'index("ai-rebase-in-progress") != null' \
                 >/dev/null <<<"$labels"; then
              merge_owned=false
            else
              all_open="$(
                gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp 2>/dev/null \
                  | jq -c 'add // []' || true
              )"
              stack_member=false
              if [ -z "$all_open" ]; then
                merge_owned=false
              elif jq -e \
                --arg repo "$REPO" \
                --argjson number "$PR_NUMBER" \
                --arg head "$HEAD_REF" \
                --arg base "$BASE_REF" '
                  any(.[];
                    .number != $number
                    and .head.repo.full_name == $repo
                    and .base.repo.full_name == $repo
                    and ([.labels[].name] | index("no-ai-rebase") == null)
                    and (.head.ref == $base or .base.ref == $head))
                ' >/dev/null <<<"$all_open"; then
                stack_member=true
              fi
              if [ "$stack_member" = true ]; then
                if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
                  topology=no-ai-stack
                else
                  merge_owned=false
                fi
              fi
            fi
            if [ "$merge_owned" = true ]; then
              # Current ownership is proven and no active rebase mutex exists;
              # remove an opposing stale pause before recording this one.
              gh api --method DELETE \
                "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-paused" \
                >/dev/null 2>&1 || true
              rebase_pause_absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
                --jq '[.labels[].name] | index("ai-rebase-paused") == null' \
                2>/dev/null || true)"
              if [ "$rebase_pause_absent" = true ]; then
                pause_payload="$(jq -cn \
                --argjson pr "$PR_NUMBER" \
                --arg head_ref "$HEAD_REF" \
                --arg head_sha "$EXPECTED_HEAD_SHA" \
                --arg base_ref "$BASE_REF" \
                --arg base_sha "$EXPECTED_BASE_SHA" \
                --arg topology "$topology" \
                --arg run_id "${GITHUB_RUN_ID:-}" \
                '{v:1,owner:"merge",pr:$pr,head_ref:$head_ref,head_sha:$head_sha,
                  base_ref:$base_ref,base_sha:$base_sha,topology:$topology,run_id:$run_id}')"
                pause_token="$(printf '%s' "$pause_payload" | base64 -w0 \
                  | tr '+/' '-_' | tr -d '=')"
                pause_marker="<!-- thingtime-ai-conflict-pause:v1 $pause_token -->"
                if gh label create ai-merge-paused --repo "$REPO" --force \
                     --color d93f0b \
                     --description "AI merge-conflict resolution failed; manual retry required" \
                     >/dev/null \
                   && gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
                     --input <(jq -cn '{labels:["ai-merge-paused"]}') >/dev/null; then
                  paused=true
                else
                  echo "::warning::Could not apply ai-merge-paused; the next global sweep may retry this PR."
                fi
              else
                echo "::warning::Could not clear opposing ai-rebase-paused, so no merge pause was applied."
              fi
            fi
          fi

          body="$RUNNER_TEMP/comment.md"
          {
            if [ "$PUSH_OUTCOME" = "success" ]; then
              echo "⚠️ Conflicts with \`$BASE_REF\` were resolved and pushed, but a follow-up step failed — see the [workflow run]($RUN_URL). The merge commit itself is on the branch."
            elif [ "$WF_BLOCKED" = "true" ]; then
              echo "⚠️ Merging \`$BASE_REF\` into this branch changes \`.github/workflows/\`, which the default token cannot push. Merge the base branch manually (\`git merge $BASE_REF\`), or add a \`CONFLICT_RESOLVER_PAT\` secret (repo + workflow scope) so this workflow can handle it. [Workflow run]($RUN_URL)"
            else
              echo "⚠️ Could not auto-resolve conflicts with \`$BASE_REF\` — manual resolution needed. See the [workflow run]($RUN_URL)."
              # prefer the verify step's recomputed list when it exists; the
              # merge step's list is informational (pre-AI)
              list="$RUNNER_TEMP/conflicted-derived.txt"
              [ -s "$list" ] || list="$RUNNER_TEMP/conflicted.txt"
              if [ -s "$list" ]; then
                echo
                echo "Conflicted files (as recorded by the merge step):"
                sed 's/^/- `/; s/$/`/' "$list"
              fi
            fi
            if [ "$paused" = true ]; then
              echo
              echo "Automatic retries are paused with \`ai-merge-paused\` so the scheduled sweep cannot repeat the same failed AI run forever. After review, run this action manually with PR \`$PR_NUMBER\` (or its exact base/head branch) to clear the hold and retry."
              echo
              echo "$pause_marker"
            fi
          } > "$body"
          if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"; then
            if [ "$paused" = true ]; then
              gh api --method DELETE \
                "repos/$REPO/issues/$PR_NUMBER/labels/ai-merge-paused" \
                >/dev/null 2>&1 || true
              echo "::warning::Pause comment failed, so ai-merge-paused was removed rather than leaving metadata-free state."
            fi
          fi
