# AI-assisted rebase support for same-repository pull requests and stacks.
#
# GitHub's `mergeable` and `rebaseable` answers describe different operations:
# a PR can merge cleanly while replaying one of its commits still conflicts.
# The merge resolver intentionally handles only the former operation. This
# workflow handles the latter by replaying standalone PRs or whole stacks
# bottom-up and force-pushing each rewritten branch exactly once with an exact
# force-with-lease. Automatic ownership stays disjoint from the merge resolver:
# standalone merge conflicts stay merge-owned, while standalone PRs that merge
# cleanly but cannot rebase and stack members needing a history update are
# rebase-owned.
#
# Security and race invariants:
# - push and pull_request_target runs are API-only detectors. Actual work is
#   handed to repository_dispatch. The real run checks out its exact default-
#   branch workflow SHA and invokes that immutable local composite action.
# - fork PRs, the default branch, protected head branches, opted-out PRs, and
#   stale ref snapshots are rejected before checkout or Claude.
# - The real Git checkout moves under RUNNER_TEMP before Claude. The model gets
#   file tools over a repo-less scratch containing only exact conflict copies;
#   the trusted composite validates bytes back into the real index and
#   continues each rebase round deterministically.
# - no remote ref changes until every commit has replayed and graphify has
#   refreshed. The sole push uses
#   --force-with-lease=refs/heads/<head>:<original-sha>.
# - direct children are labelled `ai-rebase-in-progress` before the parent
#   push. This keeps the merge resolver and scheduled detector from racing the
#   explicit old-parent -> new-parent cascade.
#
# Secrets are shared with the merge resolver:
# - ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN powers Claude (one required
#   only when a non-graphify conflict actually reaches the AI).
# - CONFLICT_RESOLVER_PAT is optional. GITHUB_TOKEN is sufficient unless the
#   rewritten history changes .github/workflows/. A PAT used here needs
#   contents/pull-request/workflow access appropriate to this repository.

name: Rebase PRs and stacks (AI)

run-name: >-
  Rebase PR history${{ github.event.client_payload.pr_number && format(' at #{0}', github.event.client_payload.pr_number) || inputs.pr_number && format(' at #{0}', inputs.pr_number) || '' }}

on:
  push:
    branches:
      - "**"
  pull_request_target:
    types: [opened, reopened]
  schedule:
    # GitHub emits no event when its "Rebase stack" operation stops on a
    # conflict. The bounded sweep catches that state without relying on a UI
    # event that does not exist.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to rebase; leave blank to scan all same-repo PRs"
        required: false
        default: ""
        type: string
      cascade:
        description: "Continue through PRs stacked on the rebased branch"
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [rebase-pr-stack-ai]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'repository_dispatch'
        && format('ai-rebase-pr-{0}', github.event.client_payload.pr_number)
        || format('ai-rebase-detect-{0}-{1}', github.event_name,
             github.event.pull_request.number || github.ref_name || github.run_id) }}
  # Never cancel a history rewrite. Detector runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  detect:
    name: Find PRs whose commits cannot be rebased
    if: >-
      github.event_name != 'repository_dispatch'
      && (github.event_name != 'push' || github.event.deleted == false)
    runs-on: ubuntu-latest
    # A scheduled/manual sweep may evaluate every open same-repo PR. Most
    # mergeability answers are cached, but the API can require one or more
    # bounded polling rounds across a large open-PR set.
    timeout-minutes: 20
    permissions:
      pull-requests: read
      issues: write
      contents: read
    outputs:
      targets: ${{ steps.scan.outputs.targets }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Scan open same-repository PRs via the API
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          MANUAL_PR: ${{ inputs.pr_number }}
          CASCADE: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.cascade == false && 'false' || 'true' }}
          LOCK_TTL_SECONDS: "5400"
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_PR:-}" ] \
             && ! [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive decimal PR number."
            exit 1
          fi

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }

          live_ref_sha() {
            local encoded
            encoded="$(encode_ref "$1")"
            gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha'
          }

          branch_protected() {
            local encoded
            encoded="$(encode_ref "$1")"
            gh api "repos/$REPO/branches/$encoded" --jq '.protected'
          }

          all="$(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []'
          )"

          # A stack member either targets another open PR's head branch or is
          # itself the base of another open PR. Compare only same-repo PRs;
          # neither secrets nor force-pushes may ever cross a fork boundary.
          same_repo="$(jq -c --arg repo "$REPO" '
            [.[]
              | select(.head.repo.full_name == $repo)
              | select(.base.repo.full_name == $repo)]
          ' <<<"$all")"
          stacked="$(jq -c '
            . as $all
            | [$all[] as $pr
                | select(any($all[];
                    .number != $pr.number
                    and (.head.ref == $pr.base.ref
                         or .base.ref == $pr.head.ref)))
                | $pr]
          ' <<<"$same_repo")"

          explicit=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ -n "${MANUAL_PR:-}" ]; then
                explicit=true
                candidates="$(jq -c --argjson n "$MANUAL_PR" '[.[] | select(.number == $n)]' <<<"$same_repo")"
              else
                candidates="$same_repo"
              fi
              ;;
            push)
              # A head push can make its own replay fail; a base push can make
              # each direct child fail. The later root filter keeps a blocked
              # parent ahead of a blocked child.
              candidates="$(jq -c --arg ref "$PUSHED_REF" '
                [.[] | select(.head.ref == $ref or .base.ref == $ref)]
              ' <<<"$same_repo")"
              ;;
            pull_request_target)
              # A fork user must never turn an opened PR into a repository-
              # wide AI scan. Start only from the triggering same-repo PR,
              # then walk any same-repo ancestors (bounded and cycle-checked)
              # so an opened child cannot jump ahead of its parent.
              candidates="$(jq -c --argjson n "$EVENT_PR" \
                '[.[] | select(.number == $n)]' <<<"$same_repo")"
              if [ "$(jq 'length' <<<"$candidates")" -eq 1 ]; then
                cursor="$(jq -r '.[0].base.ref' <<<"$candidates")"
                for ((ancestor_depth = 0; ancestor_depth < 64; ancestor_depth++)); do
                  parents="$(jq -c --arg base "$cursor" \
                    '[.[] | select(.head.ref == $base)]' <<<"$same_repo")"
                  count="$(jq 'length' <<<"$parents")"
                  [ "$count" -gt 0 ] || break
                  if [ "$count" -ne 1 ]; then
                    echo "::warning::Ambiguous stack parent branch $cursor; stopping ancestor walk."
                    break
                  fi
                  parent="$(jq -c '.[0]' <<<"$parents")"
                  parent_number="$(jq -r '.number' <<<"$parent")"
                  if jq -e --argjson n "$parent_number" \
                       'any(.[]; .number == $n)' >/dev/null <<<"$candidates"; then
                    echo "::warning::Cycle detected while walking stack ancestors; stopping."
                    break
                  fi
                  candidates="$(jq -c --argjson parent "$parent" '. + [$parent]' <<<"$candidates")"
                  cursor="$(jq -r '.base.ref' <<<"$parent")"
                done
              else
                # Includes fork PRs. The global schedule remains the backstop
                # for unrelated same-repository PRs and stacks.
                candidates='[]'
              fi
              ;;
            schedule)
              candidates="$same_repo"
              ;;
            *)
              candidates='[]'
              ;;
          esac

          if [ "$EVENT_NAME" = push ]; then
            # The pushed ref can be a child head. Include that candidate's
            # ancestors before checking rebaseability, otherwise a blocked
            # child could be dispatched ahead of its blocked parent.
            seeds="$candidates"
            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              seed="$(base64 --decode <<<"$encoded")"
              cursor="$(jq -r '.base.ref' <<<"$seed")"
              for ((ancestor_depth = 0; ancestor_depth < 64; ancestor_depth++)); do
                parents="$(jq -c --arg base "$cursor" \
                  '[.[] | select(.head.ref == $base)]' <<<"$same_repo")"
                count="$(jq 'length' <<<"$parents")"
                [ "$count" -gt 0 ] || break
                if [ "$count" -ne 1 ]; then
                  echo "::warning::Ambiguous stack parent branch $cursor; stopping ancestor walk."
                  break
                fi
                parent="$(jq -c '.[0]' <<<"$parents")"
                parent_number="$(jq -r '.number' <<<"$parent")"
                if jq -e --argjson n "$parent_number" \
                     'any(.[]; .number == $n)' >/dev/null <<<"$candidates"; then
                  break
                fi
                candidates="$(jq -c --argjson parent "$parent" '. + [$parent]' <<<"$candidates")"
                cursor="$(jq -r '.base.ref' <<<"$parent")"
              done
            done < <(jq -r '.[] | @base64' <<<"$seeds")
          fi

          if [ "$explicit" = true ] && [ "$(jq 'length' <<<"$candidates")" -eq 0 ]; then
            echo "::error::Open same-repository PR #$MANUAL_PR was not found."
            exit 1
          fi

          # GitHub computes mergeability and rebaseability lazily. Poll every
          # still-unknown candidate once per round rather than sleeping eight
          # times for one PR before looking at the next; a repository-wide scan
          # therefore gives every open PR a verdict opportunity within the
          # bounded detector window.
          verdicts='{}'
          pending="$(jq -c '[.[].number]' <<<"$candidates")"
          for attempt in 1 2 3 4 5 6 7 8; do
            next_pending='[]'
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              detail="$(gh api "repos/$REPO/pulls/$number")"
              rebaseable="$(jq -r '.rebaseable' <<<"$detail")"
              mergeable="$(jq -r '.mergeable' <<<"$detail")"
              if [ "$rebaseable" != null ] && [ "$mergeable" != null ]; then
                verdicts="$(jq -c \
                  --arg key "$number" \
                  --argjson mergeable "$mergeable" \
                  --argjson rebaseable "$rebaseable" '
                    . + {($key): {
                      mergeable:$mergeable,
                      rebaseable:$rebaseable
                    }}
                  ' <<<"$verdicts")"
              else
                next_pending="$(jq -c --argjson n "$number" '. + [$n]' \
                  <<<"$next_pending")"
              fi
            done < <(jq -r '.[]' <<<"$pending")
            pending="$next_pending"
            unknown_count="$(jq 'length' <<<"$pending")"
            [ "$unknown_count" -gt 0 ] || break
            echo "attempt $attempt/8: $unknown_count PR(s) still computing merge/rebaseability."
            [ "$attempt" -eq 8 ] || sleep 8
          done

          blocked='[]'
          barriers='[]'
          add_barrier() {
            local barrier
            barrier="$(jq -cn \
              --argjson number "$number" \
              --arg head "$head" \
              --arg base "$base" \
              '{number:$number,head:$head,base:$base}')"
            barriers="$(jq -c --argjson barrier "$barrier" \
              '. + [$barrier]' <<<"$barriers")"
          }
          release_recovered_lock() {
            [ "${stale_lock:-false}" = true ] || return 0
            if ! gh api --method DELETE \
                   "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                   >/dev/null 2>&1; then
              lock_gone="$(gh api "repos/$REPO/issues/$number" \
                --jq '[.labels[].name] | index("ai-rebase-in-progress") == null')"
              [ "$lock_gone" = true ] || {
                echo "::error::Could not release stale AI rebase lock on #$number."
                return 1
              }
            fi
            echo "Released recovered ai-rebase-in-progress lock on #$number."
          }
          remove_label_verified() {
            local label="$1"
            gh api --method DELETE \
              "repos/$REPO/issues/$number/labels/$label" \
              >/dev/null 2>&1 || true
            absent="$(gh api "repos/$REPO/issues/$number" \
              --jq "[.labels[].name] | index(\"$label\") == null")"
            if [ "$absent" != true ]; then
              echo "::error::Could not remove stale $label from #$number."
              return 1
            fi
          }
          decode_base64url() {
            local value="$1"
            value="$(tr '_-' '/+' <<<"$value" | tr -d '\n')"
            case $((${#value} % 4)) in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$value" | base64 --decode
          }
          rebase_pause_matches() {
            local token decoded payload topology
            topology="$1"
            token="$(
              gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp 2>/dev/null \
                | jq -r '
                    add // []
                    | [.[]
                        | select(.user.login == "github-actions[bot]")
                        | .body
                        | capture("<!-- thingtime-ai-conflict-pause:v1 (?<token>[A-Za-z0-9_-]+) -->")?
                        | .token]
                    | last // empty
                  ' 2>/dev/null || true
            )"
            [ -n "$token" ] || return 2
            decoded="$(decode_base64url "$token" 2>/dev/null || true)"
            payload="$(jq -ce \
              --argjson expected_number "$number" '
                select(type == "object")
                | select(.v == 1 and .owner == "rebase" and .pr == $expected_number)
                | select(.head_ref | type == "string" and length > 0)
                | select(.base_ref | type == "string" and length > 0)
                | select(.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.base_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.topology == "standalone" or .topology == "stack")
              ' <<<"$decoded" 2>/dev/null || true)"
            [ -n "$payload" ] || return 2
            if [ "$head" = "$(jq -r '.head_ref' <<<"$payload")" ] \
              && [ "$base" = "$(jq -r '.base_ref' <<<"$payload")" ] \
              && [ "$head_sha" = "$(jq -r '.head_sha' <<<"$payload")" ] \
              && [ "$base_sha" = "$(jq -r '.base_sha' <<<"$payload")" ] \
              && [ "$topology" = "$(jq -r '.topology' <<<"$payload")" ]; then
              return 0
            fi
            return 1
          }
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            pr="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$pr")"
            head="$(jq -r '.head.ref' <<<"$pr")"
            base="$(jq -r '.base.ref' <<<"$pr")"
            stack_member="$(jq -r --argjson n "$number" \
              'any(.[]; .number == $n)' <<<"$stacked")"
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            stale_lock=false
            if jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
              stale_lock=true
              if [ "$explicit" = true ]; then
                echo "Manual run will recover the existing ai-rebase-in-progress lock on #$number."
              else
                labelled_at="$(
                  gh api --paginate "repos/$REPO/issues/$number/events?per_page=100" --slurp \
                    | jq -r 'add // []
                        | map(select(.event == "labeled"
                                     and .label.name == "ai-rebase-in-progress"))
                        | sort_by(.created_at) | last | .created_at // empty'
                )"
                if [ -z "$labelled_at" ]; then
                  echo "Skipping #$number: in-progress label age could not be established."
                  add_barrier
                  continue
                fi
                labelled_epoch="$(date -u -d "$labelled_at" +%s)"
                now_epoch="$(date -u +%s)"
                age=$((now_epoch - labelled_epoch))
                if [ "$age" -lt "$LOCK_TTL_SECONDS" ]; then
                  echo "Skipping #$number: an AI rebase is in progress (${age}s old)."
                  add_barrier
                  continue
                fi
                echo "::warning::Recovering stale ai-rebase-in-progress lock on #$number (${age}s old)."
              fi
            fi
            no_ai_rebase=false
            if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
              no_ai_rebase=true
            fi
            rebase_paused=false
            jq -e 'index("ai-rebase-paused") != null' >/dev/null <<<"$labels" \
              && rebase_paused=true
            merge_paused=false
            jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels" \
              && merge_paused=true

            # Both answers are required for every candidate: a stack with
            # M=false/R=true still belongs to this workflow and needs a clean
            # history replay.
            verdict_known="$(jq -r --arg key "$number" 'has($key)' <<<"$verdicts")"
            if [ "$verdict_known" != true ]; then
              echo "::warning::Skipping #$number for now: merge/rebaseability stayed unknown."
              release_recovered_lock
              [ "$stack_member" != true ] || add_barrier
              continue
            fi
            mergeable="$(jq -r --arg key "$number" '.[$key].mergeable' <<<"$verdicts")"
            rebaseable="$(jq -r --arg key "$number" '.[$key].rebaseable' <<<"$verdicts")"

            # Current ownership is a pure function of topology, opt-out, and
            # the two live GitHub verdicts. Pauses are consulted only AFTER
            # this decision, so an old owner can never strand a new state.
            merge_owned=false
            rebase_owned=false
            if [ "$mergeable" = false ] \
               && { [ "$no_ai_rebase" = true ] || [ "$stack_member" != true ]; }; then
              merge_owned=true
            elif [ "$no_ai_rebase" != true ] \
              && { { [ "$stack_member" = true ] \
                     && { [ "$mergeable" = false ] || [ "$rebaseable" = false ]; }; } \
                   || { [ "$stack_member" != true ] \
                        && [ "$mergeable" = true ] \
                        && [ "$rebaseable" = false ]; }; }; then
              rebase_owned=true
            fi

            if [ "$merge_owned" = true ]; then
              echo "#$number: current state is owned by Resolve PR conflicts (AI)."
              release_recovered_lock
              if [ "$rebase_paused" = true ] \
                 && ! remove_label_verified ai-rebase-paused; then
                [ "$stack_member" != true ] || add_barrier
                continue
              fi
              # A no-ai stack parent must finish its merge before descendants
              # can be safely replayed onto the updated branch.
              [ "$stack_member" != true ] || add_barrier
              continue
            fi

            if [ "$rebase_owned" != true ]; then
              echo "#$number: no automatic merge or rebase operation is needed."
              release_recovered_lock
              [ "$rebase_paused" != true ] || remove_label_verified ai-rebase-paused || true
              [ "$merge_paused" != true ] || remove_label_verified ai-merge-paused || true
              if [ "$stack_member" = true ] && [ "$no_ai_rebase" = true ] \
                 && [ "$rebaseable" = false ]; then
                add_barrier
              fi
              continue
            fi

            # Rebase ownership supersedes only the opposing PAUSE, never a
            # fresh in-progress mutex (handled above). Verify its removal so
            # a stale merge hold cannot survive a successful rebase.
            if [ "$merge_paused" = true ] \
               && ! remove_label_verified ai-merge-paused; then
              add_barrier
              continue
            fi

            if ! protected="$(branch_protected "$head")"; then
              echo "::warning::Skipping #$number: branch protection could not be verified."
              release_recovered_lock
              add_barrier
              continue
            fi
            if [ "$protected" = true ]; then
              echo "::warning::Skipping #$number: protected head branch $head still requires a history rewrite."
              release_recovered_lock
              add_barrier
              continue
            fi

            # Do not use `.base.sha`: GitHub can leave it stale on stacked PR
            # records after a parent rewrite. Snapshot both live branch refs.
            if ! head_sha="$(live_ref_sha "$head")" \
               || ! base_sha="$(live_ref_sha "$base")"; then
              echo "::warning::Skipping #$number: live branch refs could not be snapshotted."
              release_recovered_lock
              add_barrier
              continue
            fi

            if [ "$rebase_paused" = true ] && [ "$explicit" != true ]; then
              topology=standalone
              [ "$stack_member" != true ] || topology=stack
              if rebase_pause_matches "$topology"; then
                echo "Skipping #$number: ai-rebase-paused still matches the exact failed snapshot."
                release_recovered_lock
                add_barrier
                continue
              else
                pause_state=$?
              fi
              if [ "$pause_state" -eq 2 ]; then
                echo "::notice::Skipping #$number: ai-rebase-paused lacks valid exact bot snapshot metadata; use a manual PR-number retry."
                release_recovered_lock
                add_barrier
                continue
              fi
              echo "#$number: ai-rebase-paused snapshot is stale; retrying the current rebase-owned state."
              if ! remove_label_verified ai-rebase-paused; then
                release_recovered_lock
                add_barrier
                continue
              fi
              rebase_paused=false
            fi
            target="$(jq -cn \
              --argjson number "$number" \
              --arg head "$head" \
              --arg base "$base" \
              --arg head_sha "$head_sha" \
              --arg base_sha "$base_sha" \
              --argjson cascade "$CASCADE" \
              --argjson manual "$explicit" \
              --argjson stale_lock "$stale_lock" \
              '{number:$number, head:$head, base:$base,
                head_sha:$head_sha, base_sha:$base_sha,
                cascade:$cascade, manual:$manual, stale_lock:$stale_lock}')"
            blocked="$(jq -c --argjson target "$target" '. + [$target]' <<<"$blocked")"
          done < <(jq -r '.[] | @base64' <<<"$candidates")

          # Bottom-up ordering: dispatch a blocked PR only when it has no
          # blocked or temporarily non-runnable ancestor. The recursive walk
          # deliberately crosses clean intermediate stack members: after the
          # oldest blocked ancestor is rewritten, the cascade must transplant
          # each of those intermediates before it reaches the blocked leaf.
          # A clean parent is not itself a barrier, so a genuinely root-most
          # blocked child can still run. Manual targeting remains deliberate
          # and bypasses this automatic ordering filter.
          if [ "$explicit" = true ]; then
            roots="$blocked"
          else
            roots="$(jq -cn \
              --argjson blocked "$blocked" \
              --argjson barriers "$barriers" \
              --argjson candidates "$candidates" '
              def head_ref:
                if (.head | type) == "object" then .head.ref else .head end;
              def base_ref:
                if (.base | type) == "object" then .base.ref else .base end;
              def has_ordering_ancestor($pr; $all; $ordered; $depth):
                if any($ordered[];
                    .number != $pr.number
                    and (head_ref == ($pr | base_ref))) then
                  true
                else
                  [$all[] | select(head_ref == ($pr | base_ref))] as $parents
                  | if ($parents | length) == 0 then
                      false
                    elif ($parents | length) > 1 or $depth >= 64 then
                      true
                    else
                      has_ordering_ancestor($parents[0]; $all; $ordered; $depth + 1)
                    end
                end;
              ($blocked + $barriers) as $ordered
              | [$blocked[] as $pr
                  | select(has_ordering_ancestor(
                      $pr; $candidates; $ordered; 0) | not)
                  | $pr]
            ')"
          fi

          echo "AI-rebase roots:"
          jq -r '.[] | "  #\(.number) \(.head) onto \(.base) (\(.head_sha[0:8]) -> base \(.base_sha[0:8]))"' <<<"$roots"
          echo "targets=$roots" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$roots")" >> "$GITHUB_OUTPUT"

  handoff:
    name: Hand off to trusted default-branch runs
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Dispatch one exact ref snapshot per root PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            target="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$target")"
            echo "Dispatching trusted AI rebase for #$number."
            gh api "repos/$REPO/dispatches" \
              -f event_type=rebase-pr-stack-ai \
              -f "client_payload[pr_number]=$number" \
              -f "client_payload[expected_head_sha]=$(jq -r '.head_sha' <<<"$target")" \
              -f "client_payload[expected_base_sha]=$(jq -r '.base_sha' <<<"$target")" \
              -f "client_payload[cascade]=$(jq -r '.cascade' <<<"$target")" \
              -f "client_payload[manual]=$(jq -r '.manual' <<<"$target")" \
              -f "client_payload[recover_stale_lock]=$(jq -r '.stale_lock' <<<"$target")" \
              -f "client_payload[depth]=0" \
              -f "client_payload[visited]="
          done < <(jq -r '.[] | @base64' <<<"$TARGETS")

  rebase:
    name: "Rebase PR #${{ github.event.client_payload.pr_number }}"
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
      EXPECTED_BASE_SHA: ${{ github.event.client_payload.expected_base_sha }}
      OLD_BASE_SHA: ${{ github.event.client_payload.old_base_sha }}
      NEW_BASE_SHA: ${{ github.event.client_payload.new_base_sha }}
      CASCADE: ${{ github.event.client_payload.cascade || 'true' }}
      MANUAL: ${{ github.event.client_payload.manual || 'false' }}
      DEPTH: ${{ github.event.client_payload.depth || '0' }}
      VISITED: ${{ github.event.client_payload.visited || '' }}
      RECOVER_STALE_LOCK: ${{ github.event.client_payload.recover_stale_lock || 'false' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Every trusted git operation is hook- and fsmonitor-proof, including
      # commands launched inside the exact-SHA local composite action.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CEILING_DIRECTORIES: ${{ github.workspace }}
    steps:
      - name: Validate dispatch against live PR and branch refs
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid repository_dispatch PR number."
            exit 1
          fi
          for sha_name in EXPECTED_HEAD_SHA EXPECTED_BASE_SHA; do
            sha="${!sha_name}"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$sha_name must be an exact 40-character commit SHA."
              exit 1
            fi
          done
          if ! [[ "$DEPTH" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid cascade depth."
            exit 1
          fi
          if [ "$DEPTH" -gt 64 ]; then
            echo "::error::Cascade depth cap exceeded ($DEPTH > 64)."
            exit 1
          fi
          if ! [[ "$VISITED" =~ ^([0-9]+,)*[0-9]*$ ]]; then
            echo "::error::Invalid cascade visited list."
            exit 1
          fi
          if [[ ",$VISITED," == *",$PR_NUMBER,"* ]]; then
            echo "::error::Cascade cycle detected at PR #$PR_NUMBER."
            exit 1
          fi
          case "$CASCADE" in true|false) ;; *) echo "::error::Invalid cascade flag."; exit 1 ;; esac
          case "$MANUAL" in true|false) ;; *) echo "::error::Invalid manual flag."; exit 1 ;; esac
          case "$RECOVER_STALE_LOCK" in true|false) ;; *) echo "::error::Invalid stale-lock flag."; exit 1 ;; esac

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          remove_label() {
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/$1" >/dev/null 2>&1 || true
            absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
              --jq "[.labels[].name] | index(\"$1\") == null")"
            [ "$absent" = true ]
          }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skip: $1"
            # A parent may have held this child before dispatch. Once this run
            # owns the per-PR concurrency slot it is safe to release that hold.
            if [ -n "${OLD_BASE_SHA:-}" ] || [ "$RECOVER_STALE_LOCK" = true ]; then
              remove_label ai-rebase-in-progress || \
                echo "::warning::Could not verify release of ai-rebase-in-progress while skipping."
            fi
            exit 0
          }

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] || skip "PR #$PR_NUMBER is no longer open."
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || skip "fork PRs are never rewritten or exposed to resolver secrets."
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || skip "the PR base is outside this repository."

          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$head_ref" != "$default_ref" ] \
            || skip "the remote default branch is never a rewrite target."

          head_branch="$(gh api "repos/$REPO/branches/$(encode_ref "$head_ref")")"
          [ "$(jq -r '.protected' <<<"$head_branch")" != true ] \
            || skip "head branch $head_ref is protected."

          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            skip "PR #$PR_NUMBER is labelled no-ai-rebase."
          fi
          if jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels" \
             && [ -z "${OLD_BASE_SHA:-}" ] \
             && [ "$RECOVER_STALE_LOCK" != true ]; then
            skip "another AI rebase acquired the in-progress mutex after detection."
          fi

          live_head_sha="$(live_ref_sha "$head_ref")"
          live_base_sha="$(live_ref_sha "$base_ref")"
          [ "$live_head_sha" = "$EXPECTED_HEAD_SHA" ] \
            || skip "head moved after detection ($EXPECTED_HEAD_SHA -> $live_head_sha)."
          [ "$live_base_sha" = "$EXPECTED_BASE_SHA" ] \
            || skip "base moved after detection ($EXPECTED_BASE_SHA -> $live_base_sha)."

          mode=root
          topology=standalone
          if [ -n "${OLD_BASE_SHA:-}" ] || [ -n "${NEW_BASE_SHA:-}" ]; then
            if ! [[ "${OLD_BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] \
               || ! [[ "${NEW_BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::A cascade requires exact old_base_sha and new_base_sha values."
              exit 1
            fi
            [ "$OLD_BASE_SHA" != "$NEW_BASE_SHA" ] \
              || { echo "::error::Cascade old/new parent SHAs are identical."; exit 1; }
            [ "$NEW_BASE_SHA" = "$live_base_sha" ] \
              || skip "the child's live base no longer equals the cascaded parent SHA."
            mode=onto
            topology=stack
          else
            # Recompute the same ownership predicate as detection. A stack
            # with mergeable=false/rebaseable=true still needs a clean rebase;
            # a standalone merge conflict remains merge-owned.
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$head_ref" \
              --arg base "$base_ref" '
                any(.[];
                  .number != $number
                  and .head.repo.full_name == $repo
                  and .base.repo.full_name == $repo
                  and (.head.ref == $base or .base.ref == $head))
              ' <<<"$all_open")"
            [ "$stack_member" != true ] || topology=stack

            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            for _ in 1 2 3 4 5; do
              [ "$rebaseable" = null ] || [ "$mergeable" = null ] || break
              sleep 5
              pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
              rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
              mergeable="$(jq -r '.mergeable' <<<"$pr")"
            done
            [ "$rebaseable" != null ] && [ "$mergeable" != null ] \
              || skip "merge/rebaseability is still unknown."

            rebase_owned=false
            if { [ "$stack_member" = true ] \
                 && { [ "$mergeable" = false ] || [ "$rebaseable" = false ]; }; } \
               || { [ "$stack_member" != true ] \
                    && [ "$mergeable" = true ] \
                    && [ "$rebaseable" = false ]; }; then
              rebase_owned=true
            fi
            [ "$rebase_owned" = true ] \
              || skip "the current PR state is no longer owned by the rebase workflow."
          fi

          if jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels"; then
            remove_label ai-merge-paused \
              || { echo "::error::Could not clear stale ai-merge-paused after proving rebase ownership."; exit 1; }
          fi
          if jq -e 'index("ai-rebase-paused") != null' >/dev/null <<<"$labels"; then
            if [ "$MANUAL" = true ]; then
              remove_label ai-rebase-paused \
                || { echo "::error::Could not clear ai-rebase-paused for manual retry."; exit 1; }
            else
              skip "ai-rebase-paused was re-applied after detection; use a manual PR-number retry."
            fi
          fi

          # Create operational labels if this is the first run in a fork of
          # the repository. Label creation is idempotent and trusted-input only.
          gh label create ai-rebase-in-progress --repo "$REPO" --force \
            --color 1d76db --description "AI stack rebase currently owns this PR branch" >/dev/null
          gh label create ai-rebase-paused --repo "$REPO" --force \
            --color d93f0b --description "AI stack rebase failed; manual retry or review required" >/dev/null
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
            --input <(jq -cn '{labels:["ai-rebase-in-progress"]}') >/dev/null

          visited_next="${VISITED:+$VISITED,}$PR_NUMBER"
          {
            echo "skip=false"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "head_sha=$live_head_sha"
            echo "base_sha=$live_base_sha"
            echo "mode=$mode"
            echo "topology=$topology"
            echo "visited=$visited_next"
          } >> "$GITHUB_OUTPUT"

      # Same reviewer-visibility contract as resolve-pr-conflicts.yml's
      # "Comment on PR (resolution starting)": once validation commits this
      # run to the rebase (skip=false, ownership label taken), say so on the
      # PR before the slow checkouts and replay rounds, so a reviewer opening
      # the PR mid-rebase is not left guessing. Upserted via hidden marker so
      # cascades and retries edit one status comment; a comment failure never
      # blocks the rebase itself.
      - name: Comment on PR (rebase starting)
        if: steps.context.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          post_start_comment() {
            local marker='<!-- thingtime-ai-rebase-start:v1 -->'
            local started eta body comment_id
            started="$(date -u '+%H:%M UTC')"
            eta="$(date -u -d '+15 minutes' '+%H:%M UTC')"
            body="$RUNNER_TEMP/rebase-start-comment.md"
            {
              printf '🤖 **Auto-rebase running** — the stack rebase started working on this PR at %s.\n\n' "$started"
              printf 'Expected to finish around **%s** (rebases typically land in 5-15 minutes; the job times out at 55). ' "$eta"
              printf 'On success this branch is force-pushed onto its new base and a result comment follows — no manual action is needed meanwhile.\n\n'
              printf '[Live status](%s)\n\n%s\n' "$RUN_URL" "$marker"
            } > "$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --slurp \
              | jq -r '
                  add // []
                  | [.[]
                      | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("thingtime-ai-rebase-start:v1"))
                      | .id]
                  | last // empty
                ')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
            fi
          }
          post_start_comment || echo "::warning::Could not post the rebase-start comment; continuing with the rebase."

      - name: Define the isolated real-repository path
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          printf 'REBASE_REPO=%s\n' "$RUNNER_TEMP/ai-rebase-repo" >> "$GITHUB_ENV"

      - name: Check out the exact trusted workflow revision
        if: steps.context.outputs.skip == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Verify the immutable trusted action snapshot
        if: steps.context.outputs.skip == 'false'
        env:
          TRUSTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA" ] \
            || { echo "::error::Trusted checkout does not match the workflow event SHA."; exit 1; }
          for path in \
            .github/actions/rebase-conflict-round/action.yml \
            .github/scripts/rebase-stack/start.sh \
            .github/scripts/rebase-stack/prepare-round.sh; do
            git -C trusted ls-files --error-unmatch -- "$path" >/dev/null
            [ -f "trusted/$path" ] && [ ! -L "trusted/$path" ] \
              || { echo "::error::Trusted action path is not a regular tracked file: $path"; exit 1; }
          done

      - name: Check out the exact PR head
        if: steps.context.outputs.skip == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      - name: Configure and begin the rebase
        id: start
        if: steps.context.outputs.skip == 'false'
        env:
          MODE: ${{ steps.context.outputs.mode }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo_path="$GITHUB_WORKSPACE/repo"
          start_script="$GITHUB_WORKSPACE/trusted/.github/scripts/rebase-stack/start.sh"
          git -C "$repo_path" config user.name "github-actions[bot]"
          git -C "$repo_path" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = onto ]; then
            "$start_script" "$repo_path" onto "$BASE_SHA" \
              "$OLD_BASE_SHA" "$NEW_BASE_SHA"
          else
            "$start_script" "$repo_path" root "$BASE_SHA"
          fi

      - name: Load the conflict-resolver model waterfall
        id: models
        if: steps.context.outputs.skip == 'false' && steps.start.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          waterfall='["default"]'
          response="$RUNNER_TEMP/rebase-model-waterfall.json"
          if curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
               --connect-timeout 5 --max-time 12 --retry 2 --retry-delay 1 \
               --max-filesize 65536 --output "$response" \
               "https://thingtime.com/api/v1/settings/pr-conflict-auto-resolver-model-waterfall"; then
            configured="$(jq -cse '
              select(length == 1) | .[0]
              | select(.ok == true)
              | select(.key == "Thingtime.PRConflictAutoResolverModelWaterfall")
              | .waterfall
              | select(type == "array" and length >= 1 and length <= 3)
              | select(all(.[];
                  . == "default"
                  or . == "claude-fable-5"
                  or . == "claude-opus-5"))
              | select(length == (unique | length))
            ' "$response" 2>/dev/null || true)"
            [ -z "$configured" ] || waterfall="$configured"
          fi
          if ! jq -e 'index("default") != null' >/dev/null <<<"$waterfall"; then
            waterfall="$(jq -c '. + ["default"]' <<<"$waterfall")"
          fi
          primary="$(jq -r '.[0]' <<<"$waterfall")"
          args="--model $primary"
          if [ "$(jq 'length' <<<"$waterfall")" -gt 1 ]; then
            fallbacks="$(jq -r '.[1:] | join(",")' <<<"$waterfall")"
            args="$args --fallback-model $fallbacks"
          fi
          echo "model_args=$args" >> "$GITHUB_OUTPUT"

      - name: Isolate the real rebasing repository outside model workspace
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$(cd -- repo && pwd -P)"
          [ "$source_repo" = "$GITHUB_WORKSPACE/repo" ] \
            || { echo "::error::Unexpected PR checkout location."; exit 1; }
          case "$REBASE_REPO/" in
            "$RUNNER_TEMP/"*) ;;
            *) echo "::error::REBASE_REPO must be inside RUNNER_TEMP."; exit 1 ;;
          esac
          [ ! -e "$REBASE_REPO" ] \
            || { echo "::error::Isolated rebase destination already exists."; exit 1; }
          mv -- "$source_repo" "$REBASE_REPO"
          git -C "$REBASE_REPO" rev-parse --is-inside-work-tree >/dev/null

      # Static, bounded rounds are intentionally verbose. GitHub Actions has
      # no safe dynamic loop for composite actions, and each invocation must
      # get a fresh, mechanically-derived conflict baseline. Ten replay stops
      # is a hard cost/time cap; reaching an eleventh leaves the remote branch
      # untouched and pauses the PR.
      - name: Resolve replay conflict 1 of 10
        id: round_1
        if: steps.context.outputs.skip == 'false' && steps.start.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "1"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 2 of 10
        id: round_2
        if: steps.round_1.outcome == 'success' && steps.round_1.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "2"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 3 of 10
        id: round_3
        if: steps.round_2.outcome == 'success' && steps.round_2.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "3"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 4 of 10
        id: round_4
        if: steps.round_3.outcome == 'success' && steps.round_3.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "4"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 5 of 10
        id: round_5
        if: steps.round_4.outcome == 'success' && steps.round_4.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "5"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 6 of 10
        id: round_6
        if: steps.round_5.outcome == 'success' && steps.round_5.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "6"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 7 of 10
        id: round_7
        if: steps.round_6.outcome == 'success' && steps.round_6.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "7"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 8 of 10
        id: round_8
        if: steps.round_7.outcome == 'success' && steps.round_7.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "8"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 9 of 10
        id: round_9
        if: steps.round_8.outcome == 'success' && steps.round_8.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "9"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Resolve replay conflict 10 of 10
        id: round_10
        if: steps.round_9.outcome == 'success' && steps.round_9.outputs.complete != 'true'
        uses: ./trusted/.github/actions/rebase-conflict-round
        with:
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          round: "10"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}

      - name: Verify the complete local rebase
        id: finished
        if: steps.context.outputs.skip == 'false' && success()
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          rebase_merge="$(git rev-parse --git-path rebase-merge)"
          rebase_apply="$(git rev-parse --git-path rebase-apply)"
          if [ -d "$rebase_merge" ] || [ -d "$rebase_apply" ]; then
            if [ "${{ steps.round_10.outputs.complete }}" != true ]; then
              echo "::error::Conflict-round cap reached; an eleventh replay stop would be required."
            else
              echo "::error::A composite round reported completion while rebase state still exists."
            fi
            git rebase --abort || true
            exit 1
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::The completed rebase still has unmerged paths."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The completed rebase left uncommitted or untracked files."
            git status --short
            exit 1
          fi
          echo "new_head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate every tracked symlink before graphify
        if: steps.context.outputs.skip == 'false' && success()
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          repo_abs="$(pwd -P)"

          normalize_repo_relative() {
            local input part
            local -a parts stack
            input="$1"
            stack=()
            IFS='/' read -r -a parts <<<"$input"
            for part in "${parts[@]}"; do
              case "$part" in
                ""|.) ;;
                ..)
                  [ "${#stack[@]}" -gt 0 ] || return 1
                  unset "stack[$((${#stack[@]} - 1))]"
                  ;;
                *) stack+=("$part") ;;
              esac
            done
            [ "${#stack[@]}" -gt 0 ] || return 1
            (IFS=/; printf '%s' "${stack[*]}")
          }

          while IFS= read -r -d '' entry; do
            metadata="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            mode="${metadata%% *}"
            [ "$mode" = 120000 ] || continue
            if [[ "$path" =~ [[:cntrl:]] ]] || [ ! -L "$path" ]; then
              echo "::error::Unsafe or missing tracked symlink: $path"
              exit 1
            fi
            target=''
            IFS= read -r -d '' target < <(readlink -n -- "$path"; printf '\0') || true
            if [ -z "$target" ] || [[ "$target" = /* ]] \
               || [[ "$target" =~ [[:cntrl:]] ]]; then
              echo "::error::Tracked symlink has an unsafe target: $path"
              exit 1
            fi
            directory="${path%/*}"
            [ "$directory" != "$path" ] || directory=.
            normalized="$(normalize_repo_relative "$directory/$target")" \
              || { echo "::error::Tracked symlink escapes the repository: $path -> $target"; exit 1; }
            case "$normalized" in
              .git|.git/*)
                echo "::error::Tracked symlink targets Git internals: $path -> $target"
                exit 1
                ;;
            esac
            candidate="$repo_abs/$normalized"
            resolved="$(realpath -- "$candidate" 2>/dev/null || true)"
            if [ "$resolved" != "$candidate" ] || [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              echo "::error::Tracked symlink must resolve directly to an in-repo regular file: $path -> $target"
              exit 1
            fi
            target_mode="$(git ls-files -s -- "$normalized" | awk '$3 == 0 { print $1; exit }')"
            case "$target_mode" in
              100644|100755) ;;
              *)
                echo "::error::Tracked symlink target is not a tracked regular file: $path -> $normalized"
                exit 1
                ;;
            esac
            echo "Validated tracked symlink: $path -> $normalized"
          done < <(git ls-files -s -z)

      - name: Refresh graphify outputs after the complete rebase
        id: graphify
        if: steps.context.outputs.skip == 'false' && success()
        timeout-minutes: 25
        env:
          GRAPHIFY_VERSION: "0.9.4"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ""
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN

          # Start from the exact replayed commits. Ignored/untracked model
          # output must not become an input to graphify's tracked outputs.
          git reset --hard HEAD
          git clean -ffdx
          install_dir="$RUNNER_TEMP/graphify-install"
          mkdir -p "$install_dir"
          install_env=(
            env -i
            "HOME=$HOME"
            "PATH=$PATH"
            "LANG=${LANG:-C.UTF-8}"
            "PIP_CONFIG_FILE=/dev/null"
            "PIP_INDEX_URL=https://pypi.org/simple"
            "PIP_EXTRA_INDEX_URL="
            "PIP_DISABLE_PIP_VERSION_CHECK=1"
          )
          if ! (cd "$install_dir" \
                && { "${install_env[@]}" \
                       pipx install "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1 \
                     || "${install_env[@]}" \
                       pip install --user --no-input "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1; }); then
            echo "::error::graphify $GRAPHIFY_VERSION could not be installed."
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"

          backend=''
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            backend=claude
            # The API backend does not need the separate OAuth credential.
            unset CLAUDE_CODE_OAUTH_TOKEN
          elif [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            # graphify's claude-cli backend would launch Claude from the PR
            # checkout, where project settings/hooks are untrusted. Keep OAuth
            # runs AST-only; the API backend does not consume project config.
            echo "::warning::OAuth-only run: using AST/text-only graphify update."
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi

          graph_not_collapsed() {
            old_n="$(git show HEAD:graphify-out/graph.json 2>/dev/null \
              | jq '.nodes | length' 2>/dev/null || echo 0)"
            new_n="$(jq '.nodes | length' graphify-out/graph.json 2>/dev/null || echo 0)"
            case "$old_n" in ""|*[!0-9]*) old_n=0 ;; esac
            case "$new_n" in ""|*[!0-9]*) new_n=0 ;; esac
            if [ "$old_n" -gt 0 ] && [ "$new_n" -lt $((old_n / 2)) ]; then
              echo "::warning::Semantic refresh collapsed the graph ($old_n -> $new_n nodes)."
              return 1
            fi
          }

          semantic=none
          if [ -n "$backend" ]; then
            concurrency=4
            [ "$backend" != claude-cli ] || concurrency=1
            if graphify extract . --backend "$backend" \
                 --max-concurrency "$concurrency" --api-timeout 240 \
               && graphify cluster-only . --no-viz --no-label \
               && graph_not_collapsed; then
              semantic="$backend"
            else
              semantic=failed
              echo "::warning::Semantic graphify refresh failed; retrying AST/text-only."
              git checkout -q HEAD -- graphify-out/ 2>/dev/null || true
              git clean -qffdx -- graphify-out/
            fi
          fi

          if [ "$semantic" = none ] || [ "$semantic" = failed ]; then
            graphify update .
          fi

          for file in graph.json GRAPH_REPORT.md manifest.json cost.json; do
            path="graphify-out/$file"
            if [ -e "$path" ] \
               || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          if [ -d graphify-out/cache/semantic ] \
             || [ -n "$(git ls-files -- 'graphify-out/cache/semantic/')" ]; then
            git add -A -- graphify-out/cache/semantic/
          fi

          if [ -n "$(git status --porcelain --untracked-files=no -- . ':(exclude)graphify-out/')" ]; then
            echo "::error::graphify changed a tracked file outside graphify-out/."
            git reset --hard HEAD
            exit 1
          fi

          # Best-effort credential needle scan, matching the merge resolver's
          # backstop. The security boundary remains review on the PR branch.
          needles="$RUNNER_TEMP/graphify-secret-needles.txt"
          : > "$needles"
          for secret in "${ANTHROPIC_API_KEY:-}" "${CLAUDE_CODE_OAUTH_TOKEN:-}"; do
            [ -n "$secret" ] || continue
            {
              printf '%s\n' "$secret"
              printf '%s' "$secret" | base64 -w0
              printf '\n'
            } >> "$needles"
          done
          if [ -s "$needles" ]; then
            blob="$RUNNER_TEMP/graphify-staged-blob"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git show ":$path" > "$blob" 2>/dev/null || true
              if grep -qFf "$needles" "$blob"; then
                echo "::error::Staged graphify output $path contains resolver secret material."
                rm -f "$blob" "$needles"
                git reset --hard HEAD
                exit 1
              fi
            done < <(git diff --cached --name-only)
            rm -f "$blob"
          fi
          rm -f "$needles"

          if git diff --cached --quiet; then
            echo "Graphify outputs are already current."
            refreshed=nochange
          else
            git commit -q \
              -m "chore: refresh graphify outputs after AI rebase" \
              -m "Refreshed by the rebase-pr-stacks workflow: $RUN_URL"
            refreshed=true
          fi
          {
            echo "refreshed=$refreshed"
            echo "semantic=$semantic"
          } >> "$GITHUB_OUTPUT"

      - name: Revalidate live refs and final local state
        id: prepush
        if: steps.context.outputs.skip == 'false' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed while the rebase was running."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR head repository changed while running."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            || { echo "::error::PR head branch changed while running."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR base branch changed while running."; exit 1; }
          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            echo "::error::no-ai-rebase was added while the rebase was running."
            exit 1
          fi
          if jq -e 'any(. == "ai-merge-paused" or . == "ai-rebase-paused")' \
               >/dev/null <<<"$labels"; then
            echo "::error::A pause label was added while the rebase was running."
            exit 1
          fi
          if ! jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
            echo "::error::The rebase ownership mutex disappeared while running."
            exit 1
          fi
          [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::Head branch became protected while running."; exit 1; }

          live_head="$(live_ref_sha "$HEAD_REF")"
          live_base="$(live_ref_sha "$BASE_REF")"
          [ "$live_head" = "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Head moved while resolving ($EXPECTED_HEAD_SHA -> $live_head)."; exit 1; }
          [ "$live_base" = "$EXPECTED_BASE_SHA" ] \
            || { echo "::error::Base moved while resolving ($EXPECTED_BASE_SHA -> $live_base)."; exit 1; }

          if [ "$MODE" = root ]; then
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$HEAD_REF" \
              --arg base "$BASE_REF" '
                any(.[];
                  .number != $number
                  and .head.repo.full_name == $repo
                  and .base.repo.full_name == $repo
                  and (.head.ref == $base or .base.ref == $head))
              ' <<<"$all_open")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            rebase_owned=false
            if { [ "$stack_member" = true ] \
                 && { [ "$mergeable" = false ] || [ "$rebaseable" = false ]; }; } \
               || { [ "$stack_member" != true ] \
                    && [ "$mergeable" = true ] \
                    && [ "$rebaseable" = false ]; }; then
              rebase_owned=true
            fi
            [ "$rebase_owned" = true ] \
              || { echo "::error::PR topology/verdicts changed to a non-rebase owner while running."; exit 1; }
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Local checkout is not pristine before push."
            git status --short
            exit 1
          fi
          new_head="$(git rev-parse HEAD)"
          [ "$new_head" != "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Rebase produced no new history; refusing a force-push."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$new_head" \
            || { echo "::error::Rewritten head does not descend from the exact live base SHA."; exit 1; }

          # GitHub validates workflow permission against rewritten commits,
          # not just the old/new tip trees (which are usually identical after
          # a rebase). Inspect the complete rewritten PR range before holding
          # children or attempting a push with the default token.
          if [ -z "${PUSH_PAT:-}" ]; then
            workflow_paths="$(git log --format= --name-only \
              "$EXPECTED_BASE_SHA..$new_head" -- .github/workflows/ \
              | sed '/^$/d' | LC_ALL=C sort -u)"
            if [ -n "$workflow_paths" ]; then
              echo "::error::Rebased commits touch .github/workflows/, so CONFLICT_RESOLVER_PAT with workflow permission is required."
              printf '%s\n' "$workflow_paths" | sed 's/^/  - /'
              exit 1
            fi
          fi
          echo "new_head_sha=$new_head" >> "$GITHUB_OUTPUT"

      - name: Snapshot and hold direct child PRs
        id: children
        if: >-
          steps.context.outputs.skip == 'false'
          && success()
          && env.CASCADE == 'true'
          && fromJSON(env.DEPTH) < 64
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          children='[]'
          file="$RUNNER_TEMP/rebase-children.json"
          printf '[]\n' > "$file"
          open="$(gh api --paginate \
            "repos/$REPO/pulls?state=open&base=$(encode_ref "$HEAD_REF")&per_page=100" \
            --slurp | jq -c 'add // []')"
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            child="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$child")"
            child_head="$(jq -r '.head.ref' <<<"$child")"

            [ "$(jq -r '.head.repo.full_name' <<<"$child")" = "$REPO" ] || continue
            labels="$(jq -c '[.labels[].name]' <<<"$child")"
            if jq -e 'any(. == "no-ai-rebase" or . == "ai-rebase-paused" or . == "ai-rebase-in-progress")' \
                 >/dev/null <<<"$labels"; then
              echo "Skipping child #$number: opted out, paused, or already owned."
              continue
            fi
            if [ "$(gh api "repos/$REPO/branches/$(encode_ref "$child_head")" --jq '.protected')" = true ]; then
              echo "::warning::Skipping protected child branch for PR #$number."
              continue
            fi

            child_sha="$(live_ref_sha "$child_head")"
            if ! git cat-file -e "$child_sha^{commit}" 2>/dev/null; then
              # A child opened after checkout may not be in the original
              # fetch. Authenticate only this trusted fetch via ephemeral git
              # config; no credential is persisted in .git/config.
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_2="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth" \
                git fetch --no-tags "https://github.com/$REPO.git" \
                  "+refs/heads/$child_head:refs/remotes/ai-rebase-child/$number"
              fetched_child="$(git rev-parse "refs/remotes/ai-rebase-child/$number")"
              [ "$fetched_child" = "$child_sha" ] \
                || { echo "::error::Child #$number moved during its snapshot."; exit 1; }
            fi

            # A stacked PR's API base SHA can lag the actual parent ref. Even
            # more importantly, the parent's current head need not be an
            # ancestor of the child (as in #156 -> #158). The safe old
            # boundary for `rebase --onto` is their exact pre-push merge-base.
            mapfile -t fork_points < <(git merge-base --all "$child_sha" "$EXPECTED_HEAD_SHA")
            if [ "${#fork_points[@]}" -ne 1 ] \
               || ! [[ "${fork_points[0]:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::Skipping child #$number: expected one exact merge-base, found ${#fork_points[@]}."
              continue
            fi
            fork_point="${fork_points[0]}"
            git merge-base --is-ancestor "$fork_point" "$child_sha"
            item="$(jq -cn \
              --argjson number "$number" \
              --arg head "$child_head" \
              --arg head_sha "$child_sha" \
              --arg fork_point "$fork_point" \
              '{number:$number,head:$head,head_sha:$head_sha,fork_point:$fork_point}')"
            children="$(jq -c --argjson item "$item" '. + [$item]' <<<"$children")"
            # Persist ownership before applying the label. Any later failure
            # can then release every hold already attempted.
            printf '%s\n' "$children" > "$file"

            gh api --method POST "repos/$REPO/issues/$number/labels" \
              --input <(jq -cn '{labels:["ai-rebase-in-progress"]}') >/dev/null
            echo "Held child #$number at $child_sha (fork point $fork_point)."
          done < <(jq -r '.[] | @base64' <<<"$open")

          echo "count=$(jq 'length' <<<"$children")" >> "$GITHUB_OUTPUT"

      - name: Force-push the fully verified rewritten history once
        id: push
        if: steps.context.outputs.skip == 'false' && success()
        env:
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          # This is deliberately adjacent to the push. Child discovery may
          # have taken time since the earlier full validation.
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed immediately before push."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR head repository changed immediately before push."; exit 1; }
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR base repository changed immediately before push."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            || { echo "::error::PR head ref changed immediately before push."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR base ref changed immediately before push."; exit 1; }
          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            echo "::error::no-ai-rebase was added immediately before push."
            exit 1
          fi
          if jq -e 'any(. == "ai-merge-paused" or . == "ai-rebase-paused")' \
               >/dev/null <<<"$labels"; then
            echo "::error::A pause label was added immediately before push."
            exit 1
          fi
          if ! jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
            echo "::error::The rebase ownership mutex disappeared immediately before push."
            exit 1
          fi
          [ "$(live_ref_sha "$HEAD_REF")" = "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Head moved immediately before push."; exit 1; }
          [ "$(live_ref_sha "$BASE_REF")" = "$EXPECTED_BASE_SHA" ] \
            || { echo "::error::Base moved immediately before push."; exit 1; }
          [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::Head became protected immediately before push."; exit 1; }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$HEAD_REF" != "$default_ref" ] \
            || { echo "::error::PR head became the repository default branch; refusing to push."; exit 1; }
          default_sha="$(live_ref_sha "$default_ref")"
          [[ "$default_sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not verify the live default-branch ref."; exit 1; }

          if [ "$MODE" = root ]; then
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$HEAD_REF" \
              --arg base "$BASE_REF" '
                any(.[];
                  .number != $number
                  and .head.repo.full_name == $repo
                  and .base.repo.full_name == $repo
                  and (.head.ref == $base or .base.ref == $head))
              ' <<<"$all_open")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            rebase_owned=false
            if { [ "$stack_member" = true ] \
                 && { [ "$mergeable" = false ] || [ "$rebaseable" = false ]; }; } \
               || { [ "$stack_member" != true ] \
                    && [ "$mergeable" = true ] \
                    && [ "$rebaseable" = false ]; }; then
              rebase_owned=true
            fi
            [ "$rebase_owned" = true ] \
              || { echo "::error::PR topology/verdicts changed owner immediately before push."; exit 1; }
          fi

          token="${PUSH_PAT:-$DEFAULT_TOKEN}"
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_2="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth"

          new_head="$(git rev-parse HEAD)"
          set +e
          git push \
            --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_HEAD_SHA" \
            "https://github.com/$REPO.git" \
            "HEAD:refs/heads/$HEAD_REF"
          transport_rc=$?
          set -e

          remote_sha=''
          for attempt in 1 2 3 4 5; do
            remote_sha="$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)"
            [ "$remote_sha" != "$new_head" ] || break
            [ "$attempt" -eq 5 ] || sleep 2
          done
          if [ "$remote_sha" = "$new_head" ]; then
            {
              echo "remote_state=published"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            if [ "$transport_rc" -ne 0 ]; then
              echo "::warning::git push returned $transport_rc, but the live ref proves the exact rewritten SHA was published."
            fi
            exit 0
          fi
          if [ "$remote_sha" = "$EXPECTED_HEAD_SHA" ]; then
            {
              echo "remote_state=unchanged"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::The live ref proves the remote branch is unchanged after push."
            exit 1
          fi
          if [ -z "$remote_sha" ]; then
            {
              echo "remote_state=unverifiable"
              echo "remote_sha=unavailable"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Push outcome is unverifiable because the live ref could not be queried."
            exit 1
          fi
          {
            echo "remote_state=unexpected"
            echo "remote_sha=$remote_sha"
            echo "transport_rc=$transport_rc"
          } >> "$GITHUB_OUTPUT"
          echo "::error::Ambiguous push outcome: live head is unexpected ($remote_sha)."
          exit 1

      - name: Verify the published ref
        id: published
        if: steps.push.outputs.remote_state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          NEW_HEAD_SHA: ${{ steps.prepush.outputs.new_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encoded="$(jq -rn --arg value "$HEAD_REF" '$value | @uri')"
          published=''
          for _ in 1 2 3 4 5; do
            published="$(gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha')"
            [ "$published" = "$NEW_HEAD_SHA" ] && break
            sleep 2
          done
          [ "$published" = "$NEW_HEAD_SHA" ] \
            || { echo "::error::Remote ref did not settle on the pushed SHA."; exit 1; }
          echo "sha=$published" >> "$GITHUB_OUTPUT"

      - name: Dispatch Web CI for a rewritten web diff
        id: web_ci
        if: steps.published.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          if [ -n "${PUSH_PAT:-}" ]; then
            echo "PAT-authored push emits the ordinary pull_request synchronize run; explicit Web CI dispatch is not needed."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- \
               remix/ .github/workflows/web-ci.yml; then
            echo "Web CI dispatch not needed; final PR diff has no web paths."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GITHUB_TOKEN pushes intentionally do not emit ordinary push/PR
          # workflow runs. workflow_dispatch is an explicit exception, so
          # recreate the relevant check against the rewritten branch ref.
          gh workflow run web-ci.yml --repo "$REPO" --ref "$HEAD_REF"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact child transplants
        if: steps.published.outcome == 'success' && env.CASCADE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PARENT_SHA: ${{ steps.published.outputs.sha }}
          VISITED_NEXT: ${{ steps.context.outputs.visited }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          children="$RUNNER_TEMP/rebase-children.json"
          [ -f "$children" ] || printf '[]\n' > "$children"
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            child="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$child")"
            next_depth=$((DEPTH + 1))
            if gh api "repos/$REPO/dispatches" \
              -f event_type=rebase-pr-stack-ai \
              -f "client_payload[pr_number]=$number" \
              -f "client_payload[expected_head_sha]=$(jq -r '.head_sha' <<<"$child")" \
              -f "client_payload[expected_base_sha]=$NEW_PARENT_SHA" \
              -f "client_payload[old_base_sha]=$(jq -r '.fork_point' <<<"$child")" \
              -f "client_payload[new_base_sha]=$NEW_PARENT_SHA" \
              -f "client_payload[cascade]=true" \
              -f "client_payload[manual]=false" \
              -f "client_payload[depth]=$next_depth" \
              -f "client_payload[visited]=$VISITED_NEXT"; then
              echo "Dispatched child PR #$number."
            else
              echo "::warning::Could not dispatch child #$number; releasing its hold for the next scheduled scan."
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            fi
          done < <(jq -r '.[] | @base64' "$children")

      - name: Release current PR and report success
        if: steps.published.outcome == 'success' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          NEW_HEAD_SHA: ${{ steps.published.outputs.sha }}
          GRAPHIFY_REFRESHED: ${{ steps.graphify.outputs.refreshed }}
          GRAPHIFY_SEMANTIC: ${{ steps.graphify.outputs.semantic }}
          CHILD_COUNT: ${{ steps.children.outputs.count || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true

          body="$RUNNER_TEMP/rebase-success.md"
          {
            echo "🧬 Rebased \`$HEAD_REF\` onto \`$BASE_REF\` with the [AI PR/stack rebase workflow]($RUN_URL)."
            echo
            echo "- Previous head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Rewritten head: \`$NEW_HEAD_SHA\`"
            if [ "$GRAPHIFY_REFRESHED" = true ]; then
              echo "- graphify: refreshed and committed (semantic mode: \`${GRAPHIFY_SEMANTIC:-none}\`)"
            else
              echo "- graphify: already current (semantic mode: \`${GRAPHIFY_SEMANTIC:-none}\`)"
            fi
            if [ "$CASCADE" = true ]; then
              echo "- Direct stacked children dispatched: $CHILD_COUNT"
            else
              echo "- Child cascade: disabled for this manual run"
            fi
            if [ -s "$RUNNER_TEMP/rebase-sensitive-conflicts.txt" ]; then
              echo
              echo "⚠️ Configuration/security-adjacent conflicts were auto-resolved and did not pause this run. Review these paths closely:"
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                -e 's|^|- <code>|' -e 's|$|</code>|' \
                "$RUNNER_TEMP/rebase-sensitive-conflicts.txt"
            fi
            echo
            echo "The branch was published once with an exact force-with-lease. Please review the rewritten commits before relying on them."
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body" || \
            echo "::warning::Rebase succeeded, but the PR comment could not be posted."

      - name: Clean up after a pre-push failure
        if: >-
          failure()
          && steps.context.outputs.skip == 'false'
          && steps.push.outputs.remote_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          repo_dir=''
          for candidate in "$REBASE_REPO" "$GITHUB_WORKSPACE/repo"; do
            if git -C "$candidate" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repo_dir="$candidate"
              break
            fi
          done
          if [ -n "$repo_dir" ]; then
            cd -- "$repo_dir"
            git rebase --abort >/dev/null 2>&1 || true
          fi
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true

          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          paused=false
          pause_marker=''
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || true)"
          protected_state="$(gh api \
            "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" \
            --jq '.protected' 2>/dev/null || true)"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch' 2>/dev/null || true)"
          live_head="$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)"
          live_base="$(live_ref_sha "$BASE_REF" 2>/dev/null || true)"
          in_progress_absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
            --jq '[.labels[].name] | index("ai-rebase-in-progress") == null' \
            2>/dev/null || true)"

          exact_snapshot=false
          if [ -n "$pr" ] \
             && [ "$(jq -r '.state' <<<"$pr")" = open ] \
             && [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
             && [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
             && [ "$live_head" = "$EXPECTED_HEAD_SHA" ] \
             && [ "$live_base" = "$EXPECTED_BASE_SHA" ] \
             && [ "$protected_state" = false ] \
             && [ -n "$default_ref" ] \
             && [ "$HEAD_REF" != "$default_ref" ] \
             && [ "$in_progress_absent" = true ]; then
            exact_snapshot=true
          fi

          rebase_owned=false
          topology=standalone
          if [ "$exact_snapshot" = true ]; then
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            if ! jq -e 'index("no-ai-rebase") != null' \
                 >/dev/null <<<"$labels"; then
              if [ "$MODE" = onto ]; then
                rebase_owned=true
                topology=stack
              else
                all_open="$(
                  gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp 2>/dev/null \
                    | jq -c 'add // []' || true
                )"
                if [ -n "$all_open" ]; then
                  stack_member="$(jq -r \
                    --arg repo "$REPO" \
                    --argjson number "$PR_NUMBER" \
                    --arg head "$HEAD_REF" \
                    --arg base "$BASE_REF" '
                      any(.[];
                        .number != $number
                        and .head.repo.full_name == $repo
                        and .base.repo.full_name == $repo
                        and (.head.ref == $base or .base.ref == $head))
                    ' <<<"$all_open")"
                  [ "$stack_member" != true ] || topology=stack
                  mergeable="$(jq -r '.mergeable' <<<"$pr")"
                  rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
                  if { [ "$stack_member" = true ] \
                       && { [ "$mergeable" = false ] || [ "$rebaseable" = false ]; }; } \
                     || { [ "$stack_member" != true ] \
                          && [ "$mergeable" = true ] \
                          && [ "$rebaseable" = false ]; }; then
                    rebase_owned=true
                  fi
                fi
              fi
            fi
          fi

          if [ "$rebase_owned" = true ]; then
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/ai-merge-paused" \
              >/dev/null 2>&1 || true
            merge_pause_absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
              --jq '[.labels[].name] | index("ai-merge-paused") == null' \
              2>/dev/null || true)"
            if [ "$merge_pause_absent" = true ]; then
              pause_payload="$(jq -cn \
                --argjson pr "$PR_NUMBER" \
                --arg head_ref "$HEAD_REF" \
                --arg head_sha "$EXPECTED_HEAD_SHA" \
                --arg base_ref "$BASE_REF" \
                --arg base_sha "$EXPECTED_BASE_SHA" \
                --arg topology "$topology" \
                --arg run_id "${GITHUB_RUN_ID:-}" \
                '{v:1,owner:"rebase",pr:$pr,head_ref:$head_ref,head_sha:$head_sha,
                  base_ref:$base_ref,base_sha:$base_sha,topology:$topology,run_id:$run_id}')"
              pause_token="$(printf '%s' "$pause_payload" | base64 -w0 \
                | tr '+/' '-_' | tr -d '=')"
              pause_marker="<!-- thingtime-ai-conflict-pause:v1 $pause_token -->"
              if gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
                   --input <(jq -cn '{labels:["ai-rebase-paused"]}') >/dev/null; then
                paused=true
              else
                echo "::warning::Could not apply ai-rebase-paused."
              fi
            else
              echo "::warning::Could not clear opposing ai-merge-paused, so no rebase pause was applied."
            fi
          else
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-paused" \
              >/dev/null 2>&1 || true
            echo "::notice::The failed rebase snapshot moved or changed owner, so it was not paused."
          fi

          children="$RUNNER_TEMP/rebase-children.json"
          if [ -f "$children" ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            done < <(jq -r '.[].number' "$children")
          fi

          case "${{ steps.push.outputs.remote_state }}" in
            unchanged)
              outcome="A live-ref query proved the remote branch still points to \`$EXPECTED_HEAD_SHA\`." ;;
            unexpected|unverifiable)
              outcome="The push outcome is ambiguous: the live branch points to unexpected SHA \`${{ steps.push.outputs.remote_sha }}\`. Inspect it before retrying." ;;
            *)
              outcome="The workflow stopped before it attempted its force-with-lease push." ;;
          esac
          body="$RUNNER_TEMP/rebase-failure.md"
          {
            echo "⚠️ The [AI PR/stack rebase workflow]($RUN_URL) did not complete. $outcome"
            if [ "$paused" = true ]; then
              echo
              echo "\`ai-rebase-paused\` was added for this exact ref/topology snapshot; review the run, then use a manual PR-number run to retry."
              echo
              echo "$pause_marker"
            else
              echo
              echo "The PR changed refs or resolver ownership, so no pause was added; the current state remains eligible for automatic re-detection."
            fi
            if [ -s "$RUNNER_TEMP/rebase-sensitive-conflicts.txt" ]; then
              echo
              echo "⚠️ Configuration/security-adjacent conflicts were resolved locally before this later failure; nothing from this run was published. Review these paths when retrying:"
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                -e 's|^|- <code>|' -e 's|$|</code>|' \
                "$RUNNER_TEMP/rebase-sensitive-conflicts.txt"
            fi
          } > "$body"
          if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"; then
            if [ "$paused" = true ]; then
              gh api --method DELETE \
                "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-paused" \
                >/dev/null 2>&1 || true
              echo "::warning::Pause comment failed, so ai-rebase-paused was removed rather than leaving metadata-free state."
            fi
          fi

      - name: Clean up if publication succeeded but follow-up failed
        if: failure() && steps.push.outputs.remote_state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_dir=''
          for candidate in "$REBASE_REPO" "$GITHUB_WORKSPACE/repo"; do
            if git -C "$candidate" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repo_dir="$candidate"
              break
            fi
          done
          [ -z "$repo_dir" ] || cd -- "$repo_dir"
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true
          children="$RUNNER_TEMP/rebase-children.json"
          if [ -f "$children" ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            done < <(jq -r '.[].number' "$children")
          fi
          body="$RUNNER_TEMP/rebase-follow-up-failure.md"
          {
            echo "⚠️ The branch was rewritten successfully, but a [post-push verification or cascade step]($RUN_URL) failed. Child holds were released so the next scheduled scan can recover them."
            if [ -s "$RUNNER_TEMP/rebase-sensitive-conflicts.txt" ]; then
              echo
              echo "⚠️ Configuration/security-adjacent conflicts were auto-resolved and published. Review these paths closely:"
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                -e 's|^|- <code>|' -e 's|$|</code>|' \
                "$RUNNER_TEMP/rebase-sensitive-conflicts.txt"
            fi
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body" || true
