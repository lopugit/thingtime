      - name: Verify the complete local rebase
        id: finished
        if: steps.context.outputs.skip == 'false' && success()
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          rebase_merge="$(git rev-parse --git-path rebase-merge)"
          rebase_apply="$(git rev-parse --git-path rebase-apply)"
          if [ -d "$rebase_merge" ] || [ -d "$rebase_apply" ]; then
            if [ "${THINGTIME_AI_REBASE_COMPLETE:-false}" != true ]; then
              echo "::error::Conflict-round cap reached after 500 replay stops."
            else
              echo "::error::A composite round reported completion while rebase state still exists."
            fi
            git rebase --abort || true
            exit 1
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::The completed rebase still has unmerged paths."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The completed rebase left uncommitted or untracked files."
            git status --short
            exit 1
          fi
          echo "new_head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate every tracked symlink before graphify
        if: steps.context.outputs.skip == 'false' && success()
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          repo_abs="$(pwd -P)"

          normalize_repo_relative() {
            local input part
            local -a parts stack
            input="$1"
            stack=()
            IFS='/' read -r -a parts <<<"$input"
            for part in "${parts[@]}"; do
              case "$part" in
                ""|.) ;;
                ..)
                  [ "${#stack[@]}" -gt 0 ] || return 1
                  unset "stack[$((${#stack[@]} - 1))]"
                  ;;
                *) stack+=("$part") ;;
              esac
            done
            [ "${#stack[@]}" -gt 0 ] || return 1
            (IFS=/; printf '%s' "${stack[*]}")
          }

          while IFS= read -r -d '' entry; do
            metadata="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            mode="${metadata%% *}"
            [ "$mode" = 120000 ] || continue
            if [[ "$path" =~ [[:cntrl:]] ]] || [ ! -L "$path" ]; then
              echo "::error::Unsafe or missing tracked symlink: $path"
              exit 1
            fi
            target=''
            IFS= read -r -d '' target < <(readlink -n -- "$path"; printf '\0') || true
            if [ -z "$target" ] || [[ "$target" = /* ]] \
               || [[ "$target" =~ [[:cntrl:]] ]]; then
              echo "::error::Tracked symlink has an unsafe target: $path"
              exit 1
            fi
            directory="${path%/*}"
            [ "$directory" != "$path" ] || directory=.
            normalized="$(normalize_repo_relative "$directory/$target")" \
              || { echo "::error::Tracked symlink escapes the repository: $path -> $target"; exit 1; }
            case "$normalized" in
              .git|.git/*)
                echo "::error::Tracked symlink targets Git internals: $path -> $target"
                exit 1
                ;;
            esac
            candidate="$repo_abs/$normalized"
            resolved="$(realpath -- "$candidate" 2>/dev/null || true)"
            if [ "$resolved" != "$candidate" ] || [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              echo "::error::Tracked symlink must resolve directly to an in-repo regular file: $path -> $target"
              exit 1
            fi
            target_mode="$(git ls-files -s -- "$normalized" | awk '$3 == 0 { print $1; exit }')"
            case "$target_mode" in
              100644|100755) ;;
              *)
                echo "::error::Tracked symlink target is not a tracked regular file: $path -> $normalized"
                exit 1
                ;;
            esac
            echo "Validated tracked symlink: $path -> $normalized"
          done < <(git ls-files -s -z)

      - name: Refresh graphify outputs after the complete rebase
        id: graphify
        if: steps.context.outputs.skip == 'false' && success()
        timeout-minutes: 360
        env:
          GRAPHIFY_VERSION: "0.9.4"
          PRIMARY_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREFERRED_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_THINGTIME }}
          PRIMARY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FALLBACK_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_FALLBACK }}
          FALLBACK_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_BACKEND: ${{ vars.LOPU_AGENT_BACKEND || vars.LOPU_REVIEW_BACKEND || 'claude' }}
          CODEX_MODEL: ${{ vars.LOPU_CODEX_MODEL || 'gpt-5.6-terra' }}
          PREFERRED_MODEL: ${{ steps.models.outputs.primary_model }}
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ""
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          unset ANTHROPIC_API_KEY
          if [ -s "$RUNNER_TEMP/lopu-claude-credential-token" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$(<"$RUNNER_TEMP/lopu-claude-credential-token")"
          else
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "${OPENAI_API_KEY:-}" ] || unset OPENAI_API_KEY

          graphify_model_args=()
          case "${PREFERRED_MODEL:-default}" in
            default)
              unset GRAPHIFY_CLAUDE_CLI_MODEL
              ;;
            claude-*)
              if [[ "$PREFERRED_MODEL" =~ ^claude-[a-z0-9-]{1,48}$ ]]; then
                graphify_model_args=(--model "$PREFERRED_MODEL")
                export GRAPHIFY_CLAUDE_CLI_MODEL="$PREFERRED_MODEL"
              else
                echo "::warning::Unexpected preferred model output; Graphify will use its built-in default."
                unset GRAPHIFY_CLAUDE_CLI_MODEL
              fi
              ;;
            *)
              echo "::warning::Unexpected preferred model output; Graphify will use its built-in default."
              unset GRAPHIFY_CLAUDE_CLI_MODEL
              ;;
          esac

          # Start from the exact replayed commits. Ignored/untracked model
          # output must not become an input to graphify's tracked outputs.
          git reset --hard HEAD
          git clean -ffdx
          install_dir="$RUNNER_TEMP/graphify-install"
          mkdir -p "$install_dir"
          install_env=(
            env -i
            "HOME=$HOME"
            "PATH=$PATH"
            "LANG=${LANG:-C.UTF-8}"
            "PIP_CONFIG_FILE=/dev/null"
            "PIP_INDEX_URL=https://pypi.org/simple"
            "PIP_EXTRA_INDEX_URL="
            "PIP_DISABLE_PIP_VERSION_CHECK=1"
          )
          if ! (cd "$install_dir" \
                && { "${install_env[@]}" \
                       pipx install "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1 \
                     || "${install_env[@]}" \
                       pip install --user --no-input "graphifyy==$GRAPHIFY_VERSION" >/dev/null 2>&1; }); then
            echo "::error::graphify $GRAPHIFY_VERSION could not be installed."
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          graphify_router="$GITHUB_WORKSPACE/trusted/.github/scripts/graphify-cas.mjs"
          graphify_stager="$GITHUB_WORKSPACE/trusted/.github/scripts/stage-graphify-snapshots.mjs"
          test -f "$graphify_router" && test -f "$graphify_stager"

          select_claude_backend() {
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then printf 'claude\n'; fi
          }
          backend=''
          case "${AGENT_BACKEND:-claude}" in
            codex)
              if [ -n "${OPENAI_API_KEY:-}" ]; then backend=openai; else backend="$(select_claude_backend)"; fi
              ;;
            claude)
              backend="$(select_claude_backend)"
              if [ -z "$backend" ] && [ -n "${OPENAI_API_KEY:-}" ]; then backend=openai; fi
              ;;
            *) echo "::warning::Unexpected Lopu backend; choosing an available Graphify credential."; backend="$(select_claude_backend)" ;;
          esac
          if [ "$backend" = claude ]; then
            # The API backend does not need the separate OAuth credential.
            unset CLAUDE_CODE_OAUTH_TOKEN
          elif [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "$backend" ]; then
            # graphify's claude-cli backend would launch Claude from the PR
            # checkout, where project settings/hooks are untrusted. Keep OAuth
            # runs AST-only; the API backend does not consume project config.
            echo "::warning::OAuth-only run: using AST/text-only graphify update."
            unset CLAUDE_CODE_OAUTH_TOKEN
          fi
          if [ "$backend" = openai ]; then
            unset GRAPHIFY_CLAUDE_CLI_MODEL
            case "${CODEX_MODEL:-gpt-5.6-terra}" in
              gpt-5.6-terra|gpt-5.6-sol)
                graphify_model_args=(--model "$CODEX_MODEL")
                export GRAPHIFY_OPENAI_MODEL="$CODEX_MODEL"
                ;;
              *) echo "::warning::Unexpected Lopu Codex model; Graphify will use its OpenAI default."; unset GRAPHIFY_OPENAI_MODEL ;;
            esac
          fi

          graph_not_collapsed() {
            old_n="$(git show HEAD:graphify-out/graph.json 2>/dev/null \
              | jq '.nodes | length' 2>/dev/null || echo 0)"
            new_n="$(jq '.nodes | length' graphify-out/graph.json 2>/dev/null || echo 0)"
            case "$old_n" in ""|*[!0-9]*) old_n=0 ;; esac
            case "$new_n" in ""|*[!0-9]*) new_n=0 ;; esac
            if [ "$old_n" -gt 0 ] && [ "$new_n" -lt $((old_n / 2)) ]; then
              echo "::warning::Semantic refresh collapsed the graph ($old_n -> $new_n nodes)."
              return 1
            fi
          }

          semantic=none
          if [ -n "$backend" ]; then
            concurrency=4
            [ "$backend" != claude-cli ] || concurrency=1
            if node "$graphify_router" extract . --backend "$backend" "${graphify_model_args[@]}" \
                 --max-concurrency "$concurrency" --api-timeout 240 \
               && graph_not_collapsed; then
              semantic="$backend"
            else
              semantic=failed
              echo "::warning::Semantic graphify refresh failed; retrying AST/text-only."
              git checkout -q HEAD -- graphify-out/ 2>/dev/null || true
              git clean -qffdx -- graphify-out/
            fi
          fi

          if [ "$semantic" = none ] || [ "$semantic" = failed ]; then
            node "$graphify_router" update .
          fi

          node "$graphify_stager"

          if [ -n "$(git status --porcelain --untracked-files=no -- . ':(exclude)graphify-out/')" ]; then
            echo "::error::graphify changed a tracked file outside graphify-out/."
            git reset --hard HEAD
            exit 1
          fi

          # Best-effort credential needle scan, matching the merge resolver's
          # backstop. The security boundary remains review on the PR branch.
          needles="$RUNNER_TEMP/graphify-secret-needles.txt"
          node "$GITHUB_WORKSPACE/trusted/.github/scripts/lopu-credential-vault.mjs" needles "$needles"
          for secret in "${OPENAI_API_KEY:-}"; do
            [ -n "$secret" ] || continue
            {
              printf '%s\n' "$secret"
              printf '%s' "$secret" | base64 -w0
              printf '\n'
            } >> "$needles"
          done
          if [ -s "$needles" ]; then
            blob="$RUNNER_TEMP/graphify-staged-blob"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git show ":$path" > "$blob" 2>/dev/null || true
              if grep -qFf "$needles" "$blob"; then
                echo "::error::Staged graphify output $path contains resolver secret material."
                rm -f "$blob" "$needles"
                git reset --hard HEAD
                exit 1
              fi
            done < <(git diff --cached --name-only)
            rm -f "$blob"
          fi
          rm -f "$needles"

          if git diff --cached --quiet; then
            echo "Graphify outputs are already current."
            refreshed=nochange
          else
            git commit -q \
              -m "chore: refresh graphify outputs after AI rebase" \
              -m "Refreshed by the rebase-pr-stacks workflow: $RUN_URL"
            refreshed=true
          fi
          # The router may leave ignored aliases and derived HTML/analysis
          # beside the committed portable snapshot. The pre-push fence requires
          # an exactly clean checkout, so drop only untracked Graphify material.
          git clean -qffdx -- graphify-out/
          {
            echo "refreshed=$refreshed"
            echo "semantic=$semantic"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp exact Lopu rebase provenance on the rewritten tip
        if: steps.context.outputs.skip == 'false' && success()
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          trailer="Lopu-Rebase-Completion: run=$GITHUB_RUN_ID pr=$PR_NUMBER"
          message="$RUNNER_TEMP/lopu-rebase-tip-message.txt"
          git log -1 --format=%B \
            | sed -E '/^Lopu-(Conflict-Resolution|Rebase-Completion): run=[1-9][0-9]* pr=[1-9][0-9]*$/d' \
            | git interpret-trailers \
                --if-exists replace \
                --if-missing add \
                --trailer "$trailer" \
            > "$message"
          markers="$(
            sed -nE \
              's/^Lopu-Rebase-Completion: run=([1-9][0-9]*) pr=([1-9][0-9]*)$/\1 \2/p' \
              "$message"
          )"
          marker_count="$(printf '%s\n' "$markers" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "$marker_count" = 1 ] \
            || { echo "::error::Rewritten tip must contain exactly one Lopu rebase trailer."; exit 1; }
          [ "$markers" = "$GITHUB_RUN_ID $PR_NUMBER" ] \
            || { echo "::error::Rewritten tip contains the wrong Lopu rebase provenance."; exit 1; }
          git commit --amend --no-verify -q -F "$message"

      - name: Revalidate live refs and final local state
        id: prepush
        if: steps.context.outputs.skip == 'false' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed while the rebase was running."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR head repository changed while running."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            || { echo "::error::PR head branch changed while running."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR base branch changed while running."; exit 1; }
          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            echo "::error::no-ai-rebase was added while the rebase was running."
            exit 1
          fi
          if jq -e 'any(. == "ai-merge-paused" or . == "ai-rebase-paused")' \
               >/dev/null <<<"$labels"; then
            echo "::error::A pause label was added while the rebase was running."
            exit 1
          fi
          if ! jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
            echo "::error::The rebase ownership mutex disappeared while running."
            exit 1
          fi
          [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::Head branch became protected while running."; exit 1; }

          live_head="$(live_ref_sha "$HEAD_REF")"
          live_base="$(live_ref_sha "$BASE_REF")"
          [ "$live_head" = "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Head moved while resolving ($EXPECTED_HEAD_SHA -> $live_head)."; exit 1; }
          [ "$live_base" = "$EXPECTED_BASE_SHA" ] \
            || { echo "::error::Base moved while resolving ($EXPECTED_BASE_SHA -> $live_base)."; exit 1; }

          if [ "$MODE" = root ]; then
            default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$HEAD_REF" \
              --arg base "$BASE_REF" \
              --arg default_ref "$default_ref" \
              "$STACK_MEMBER_JQ" <<<"$all_open")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            rebase_owned="$(jq -nr \
              --argjson stack_member "$stack_member" \
              --argjson no_ai_rebase false \
              --argjson mergeable "$mergeable" \
              --argjson rebaseable "$rebaseable" \
              --argjson manual "$MANUAL" \
              "$REBASE_OWNER_JQ")"
            [ "$rebase_owned" = true ] \
              || { echo "::error::PR topology/verdicts changed to a non-rebase owner while running."; exit 1; }
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Local checkout is not pristine before push."
            git status --short
            exit 1
          fi
          new_head="$(git rev-parse HEAD)"
          [ "$new_head" != "$EXPECTED_HEAD_SHA" ] \
            || { echo "::error::Rebase produced no new history; refusing a force-push."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$new_head" \
            || { echo "::error::Rewritten head does not descend from the exact live base SHA."; exit 1; }

          # GitHub validates workflow permission against rewritten commits,
          # not just the old/new tip trees (which are usually identical after
          # a rebase). Inspect the complete rewritten PR range before holding
          # children or attempting a push with the default token.
          if [ -z "${PUSH_PAT:-}" ]; then
            workflow_paths="$(git log --format= --name-only \
              "$EXPECTED_BASE_SHA..$new_head" -- .github/workflows/ \
              | sed '/^$/d' | LC_ALL=C sort -u)"
            if [ -n "$workflow_paths" ]; then
              echo "::error::Rebased commits touch .github/workflows/, so CONFLICT_RESOLVER_PAT with workflow permission is required."
              printf '%s\n' "$workflow_paths" | sed 's/^/  - /'
              exit 1
            fi
          fi
          echo "new_head_sha=$new_head" >> "$GITHUB_OUTPUT"

      - name: Snapshot and hold direct child PRs
        id: children
        if: >-
          steps.context.outputs.skip == 'false'
          && success()
          && env.CASCADE == 'true'
          && fromJSON(env.DEPTH) < 64
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }

          children='[]'
          file="$RUNNER_TEMP/rebase-children.json"
          printf '[]\n' > "$file"
          open="$(gh api --paginate \
            "repos/$REPO/pulls?state=open&base=$(encode_ref "$HEAD_REF")&per_page=100" \
            --slurp | jq -c 'add // []')"
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            child="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$child")"
            child_head="$(jq -r '.head.ref' <<<"$child")"

            [ "$(jq -r '.head.repo.full_name' <<<"$child")" = "$REPO" ] || continue
            labels="$(jq -c '[.labels[].name]' <<<"$child")"
            if jq -e 'any(. == "no-ai-rebase" or . == "ai-rebase-paused" or . == "ai-rebase-in-progress")' \
                 >/dev/null <<<"$labels"; then
              echo "Skipping child #$number: opted out, paused, or already owned."
              continue
            fi
            if [ "$(gh api "repos/$REPO/branches/$(encode_ref "$child_head")" --jq '.protected')" = true ]; then
              echo "::warning::Skipping protected child branch for PR #$number."
              continue
            fi

            child_sha="$(live_ref_sha "$child_head")"
            if ! git cat-file -e "$child_sha^{commit}" 2>/dev/null; then
              # A child opened after checkout may not be in the original
              # fetch. Authenticate only this trusted fetch via ephemeral git
              # config; no credential is persisted in .git/config.
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_2="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth" \
                git fetch --no-tags "https://github.com/$REPO.git" \
                  "+refs/heads/$child_head:refs/remotes/ai-rebase-child/$number"
              fetched_child="$(git rev-parse "refs/remotes/ai-rebase-child/$number")"
              [ "$fetched_child" = "$child_sha" ] \
                || { echo "::error::Child #$number moved during its snapshot."; exit 1; }
            fi

            # A stacked PR's API base SHA can lag the actual parent ref. Even
            # more importantly, the parent's current head need not be an
            # ancestor of the child (as in #156 -> #158). The safe old
            # boundary for `rebase --onto` is their exact pre-push merge-base.
            mapfile -t fork_points < <(git merge-base --all "$child_sha" "$EXPECTED_HEAD_SHA")
            if [ "${#fork_points[@]}" -ne 1 ] \
               || ! [[ "${fork_points[0]:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::Skipping child #$number: expected one exact merge-base, found ${#fork_points[@]}."
              continue
            fi
            fork_point="${fork_points[0]}"
            git merge-base --is-ancestor "$fork_point" "$child_sha"
            item="$(jq -cn \
              --argjson number "$number" \
              --arg head "$child_head" \
              --arg head_sha "$child_sha" \
              --arg fork_point "$fork_point" \
              '{number:$number,head:$head,head_sha:$head_sha,fork_point:$fork_point}')"
            children="$(jq -c --argjson item "$item" '. + [$item]' <<<"$children")"
            # Persist ownership before applying the label. Any later failure
            # can then release every hold already attempted.
            printf '%s\n' "$children" > "$file"

            gh api --method POST "repos/$REPO/issues/$number/labels" \
              --input <(jq -cn '{labels:["ai-rebase-in-progress"]}') >/dev/null
            echo "Held child #$number at $child_sha (fork point $fork_point)."
          done < <(jq -r '.[] | @base64' <<<"$open")

          echo "count=$(jq 'length' <<<"$children")" >> "$GITHUB_OUTPUT"

      - name: Force-push the fully verified rewritten history once
        id: push
        if: steps.context.outputs.skip == 'false' && success()
        env:
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          defer_ref_race() {
            local reason="$1" live_sha="$2"
            {
              echo "remote_state=retry"
              echo "retry_reason=$reason"
              echo "live_sha=$live_sha"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::$reason moved to $live_sha beside publication; the exact lease preserved it and Lopu will requeue from fresh refs."
            exit 0
          }
          # This is deliberately adjacent to the push. Child discovery may
          # have taken time since the earlier full validation.
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] \
            || { echo "::error::PR closed immediately before push."; exit 1; }
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR head repository changed immediately before push."; exit 1; }
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || { echo "::error::PR base repository changed immediately before push."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
            || { echo "::error::PR head ref changed immediately before push."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
            || { echo "::error::PR base ref changed immediately before push."; exit 1; }
          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            echo "::error::no-ai-rebase was added immediately before push."
            exit 1
          fi
          if jq -e 'any(. == "ai-merge-paused" or . == "ai-rebase-paused")' \
               >/dev/null <<<"$labels"; then
            echo "::error::A pause label was added immediately before push."
            exit 1
          fi
          if ! jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
            echo "::error::The rebase ownership mutex disappeared immediately before push."
            exit 1
          fi
          live_head_sha="$(live_ref_sha "$HEAD_REF")"
          [ "$live_head_sha" = "$EXPECTED_HEAD_SHA" ] \
            || defer_ref_race head "$live_head_sha"
          live_base_sha="$(live_ref_sha "$BASE_REF")"
          [ "$live_base_sha" = "$EXPECTED_BASE_SHA" ] \
            || defer_ref_race base "$live_base_sha"
          [ "$(gh api "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" --jq '.protected')" != true ] \
            || { echo "::error::Head became protected immediately before push."; exit 1; }
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$HEAD_REF" != "$default_ref" ] \
            || { echo "::error::PR head became the repository default branch; refusing to push."; exit 1; }
          default_sha="$(live_ref_sha "$default_ref")"
          [[ "$default_sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not verify the live default-branch ref."; exit 1; }

          if [ "$MODE" = root ]; then
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$HEAD_REF" \
              --arg base "$BASE_REF" \
              --arg default_ref "$default_ref" \
              "$STACK_MEMBER_JQ" <<<"$all_open")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            rebase_owned="$(jq -nr \
              --argjson stack_member "$stack_member" \
              --argjson no_ai_rebase false \
              --argjson mergeable "$mergeable" \
              --argjson rebaseable "$rebaseable" \
              --argjson manual "$MANUAL" \
              "$REBASE_OWNER_JQ")"
            [ "$rebase_owned" = true ] \
              || { echo "::error::PR topology/verdicts changed owner immediately before push."; exit 1; }
          fi

          token="${PUSH_PAT:-$DEFAULT_TOKEN}"
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_2="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth"

          new_head="$(git rev-parse HEAD)"
          set +e
          git push \
            --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_HEAD_SHA" \
            "https://github.com/$REPO.git" \
            "HEAD:refs/heads/$HEAD_REF"
          transport_rc=$?
          set -e

          remote_sha=''
          for attempt in 1 2 3 4 5; do
            remote_sha="$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)"
            [ "$remote_sha" != "$new_head" ] || break
            [ "$attempt" -eq 5 ] || sleep 2
          done
          if [ "$remote_sha" = "$new_head" ]; then
            {
              echo "remote_state=published"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            if [ "$transport_rc" -ne 0 ]; then
              echo "::warning::git push returned $transport_rc, but the live ref proves the exact rewritten SHA was published."
            fi
            exit 0
          fi
          if [ "$remote_sha" = "$EXPECTED_HEAD_SHA" ]; then
            {
              echo "remote_state=unchanged"
              echo "remote_sha=$remote_sha"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::The live ref proves the remote branch is unchanged after push."
            exit 1
          fi
          if [ -z "$remote_sha" ]; then
            {
              echo "remote_state=unverifiable"
              echo "remote_sha=unavailable"
              echo "transport_rc=$transport_rc"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Push outcome is unverifiable because the live ref could not be queried."
            exit 1
          fi
          {
            echo "remote_state=unexpected"
            echo "remote_sha=$remote_sha"
            echo "transport_rc=$transport_rc"
          } >> "$GITHUB_OUTPUT"
          echo "::error::Ambiguous push outcome: live head is unexpected ($remote_sha)."
          exit 1

      - name: Requeue after a moving-ref rebase race
        if: steps.push.outputs.remote_state == 'retry'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_WRITE_TOKEN: ${{ secrets.CONFLICT_RESOLVER_PAT }}
          RACE_RETRY_ATTEMPT: ${{ github.event.client_payload.worker.ref_race_retry || inputs.ref_race_retry || '0' }}
          RACE_REASON: ${{ steps.push.outputs.retry_reason }}
          RACE_LIVE_SHA: ${{ steps.push.outputs.live_sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$RACE_RETRY_ATTEMPT" in
            ''|*[!0-9]*)
              echo "::error::ref_race_retry must be a decimal integer."
              exit 1
              ;;
          esac
          if [ "$RACE_RETRY_ATTEMPT" -ge 3 ]; then
            echo "::error::Head/base refs moved during four consecutive rebase publication attempts; leaving every exact remote ref untouched for the scheduled sweep."
            exit 1
          fi

          remove_label_verified() {
            local number="$1" label="$2" encoded token issue absent
            encoded="$(jq -rn --arg value "$label" '$value | @uri')"
            local -a tokens=("$GH_TOKEN")
            if [ -n "${LABEL_WRITE_TOKEN:-}" ] \
               && [ "$LABEL_WRITE_TOKEN" != "$GH_TOKEN" ]; then
              tokens+=("$LABEL_WRITE_TOKEN")
            fi
            for token in "${tokens[@]}"; do
              GH_TOKEN="$token" gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/$encoded" \
                --silent >/dev/null 2>&1 || true
              for _ in 1 2 3; do
                issue="$(GH_TOKEN="$token" gh api "repos/$REPO/issues/$number" 2>/dev/null || true)"
                absent="$(jq -r --arg label "$label" '
                    if type == "object" and (.labels | type) == "array"
                    then ([.labels[].name] | index($label) == null)
                    else false
                    end
                  ' <<<"$issue" 2>/dev/null || true)"
                [ "$absent" != true ] || return 0
                sleep 1
              done
            done
            echo "::error::Could not release $label from PR #$number before retry."
            return 1
          }

          # Release every ownership hold acquired by this exact attempt before
          # asking the normal detector to take a new live snapshot.
          remove_label_verified "$PR_NUMBER" ai-rebase-in-progress
          children="$RUNNER_TEMP/rebase-children.json"
          if [ -f "$children" ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              remove_label_verified "$number" ai-rebase-in-progress
            done < <(jq -r '.[].number' "$children")
          fi

          next_attempt=$((RACE_RETRY_ATTEMPT + 1))
          dispatch_id="rebase-ref-race:$PR_NUMBER:${{ github.run_id }}:${{ github.run_attempt }}:$next_attempt"
          payload="$(jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg retry "$next_attempt" \
            --arg dispatch_id "$dispatch_id" \
            --argjson cascade "$CASCADE" '
              {
                ref:"github-actions",
                inputs:{
                  pr_number:$pr_number,
                  branch:"",
                  maintenance_operation:"manage-prs",
                  rebase_cascade:$cascade,
                  detector_handoff:false,
                  manual_retry:false,
                  ref_race_retry:$retry,
                  ref_race_handoff:true,
                  execution_provider:"github-actions",
                  runner_label:"",
                  control_dispatch_id:$dispatch_id,
                  routing_proof:"",
                  routing_proof_issued_at:""
                }
              }
            ')"
          for attempt in 1 2 3; do
            if gh api --method POST \
                 "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
                 --input - <<<"$payload"; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 2
          done

          body="$RUNNER_TEMP/rebase-ref-race.md"
          {
            echo '<!-- thingtime-ai-rebase-ref-race:v1 -->'
            echo "🔄 Lopu preserved the live \`$RACE_REASON\` ref at \`$RACE_LIVE_SHA\` because it moved beside rebase publication, released this attempt's ownership labels, and queued retry $next_attempt/3 from fresh PR refs."
            echo
            echo "No stale rewritten history was pushed. [View this guarded attempt]($RUN_URL)."
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body" || \
            echo "::warning::Rebase retry was queued, but the PR comment could not be posted."

      - name: Verify the published ref
        id: published
        if: steps.push.outputs.remote_state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          NEW_HEAD_SHA: ${{ steps.prepush.outputs.new_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          encoded="$(jq -rn --arg value "$HEAD_REF" '$value | @uri')"
          published=''
          for _ in 1 2 3 4 5; do
            published="$(gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha')"
            [ "$published" = "$NEW_HEAD_SHA" ] && break
            sleep 2
          done
          [ "$published" = "$NEW_HEAD_SHA" ] \
            || { echo "::error::Remote ref did not settle on the pushed SHA."; exit 1; }
          echo "sha=$published" >> "$GITHUB_OUTPUT"

      - name: Dispatch Web CI for a rewritten web diff
        id: web_ci
        if: steps.published.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          PUSH_PAT: ${{ secrets.CONFLICT_RESOLVER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          if [ -n "${PUSH_PAT:-}" ]; then
            echo "PAT-authored push emits the ordinary pull_request synchronize run; explicit Web CI dispatch is not needed."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- \
               remix/ .github/workflows/web-ci.yml; then
            echo "Web CI dispatch not needed; final PR diff has no web paths."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GITHUB_TOKEN pushes intentionally do not emit ordinary push/PR
          # workflow runs. workflow_dispatch is an explicit exception, so
          # recreate the relevant check against the rewritten branch ref.
          gh workflow run web-ci.yml --repo "$REPO" --ref "$HEAD_REF"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact child transplants
        if: steps.published.outcome == 'success' && env.CASCADE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PARENT_SHA: ${{ steps.published.outputs.sha }}
          VISITED_NEXT: ${{ steps.context.outputs.visited }}
          EXECUTION_PROVIDER: ${{ needs.route.outputs.execution_provider || 'github-actions' }}
          RUNNER_LABEL: ${{ needs.route.outputs.runner_label || '' }}
          CONTROL_DISPATCH_ID: ${{ needs.route.outputs.control_dispatch_id || '' }}
          ROUTING_PROOF: ${{ needs.route.outputs.routing_proof || '' }}
          ROUTING_PROOF_ISSUED_AT: ${{ needs.route.outputs.routing_proof_issued_at || '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          children="$RUNNER_TEMP/rebase-children.json"
          [ -f "$children" ] || printf '[]\n' > "$children"
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            child="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$child")"
            next_depth=$((DEPTH + 1))
            if jq -n \
              --arg pr_number "$number" \
              --arg expected_head_sha "$(jq -r '.head_sha' <<<"$child")" \
              --arg expected_base_sha "$NEW_PARENT_SHA" \
              --arg old_base_sha "$(jq -r '.fork_point' <<<"$child")" \
              --arg new_base_sha "$NEW_PARENT_SHA" \
              --arg depth "$next_depth" \
              --arg visited "$VISITED_NEXT" \
              --arg execution_provider "$EXECUTION_PROVIDER" \
              --arg runner_label "$RUNNER_LABEL" \
              --arg control_dispatch_id "$CONTROL_DISPATCH_ID" \
              --arg routing_proof "$ROUTING_PROOF" \
              --arg routing_proof_issued_at "$ROUTING_PROOF_ISSUED_AT" '
                {
                  event_type:"rebase-pr-stack-ai",
                  client_payload:{
                    pr_number:$pr_number,
                    execution_provider:$execution_provider,
                    runner_label:$runner_label,
                    control_dispatch_id:$control_dispatch_id,
                    routing_proof:$routing_proof,
                    routing_proof_issued_at:$routing_proof_issued_at,
                    worker:{
                      branch:"",
                      cascade:true,
                      worker_handoff:true,
                      expected_head_sha:$expected_head_sha,
                      expected_base_sha:$expected_base_sha,
                      old_base_sha:$old_base_sha,
                      new_base_sha:$new_base_sha,
                      manual:false,
                      depth:$depth,
                      ref_race_retry:"0",
                      automatic_retry:false,
                      visited:$visited,
                      recover_stale_lock:false
                    }
                  }
                }
              ' | gh api --method POST \
                "repos/$REPO/dispatches" \
                --input -; then
              echo "Dispatched child PR #$number."
            else
              echo "::warning::Could not dispatch child #$number; releasing its hold for the next scheduled scan."
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            fi
          done < <(jq -r '.[] | @base64' "$children")

      - name: Release current PR and report success
        if: steps.published.outcome == 'success' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          NEW_HEAD_SHA: ${{ steps.published.outputs.sha }}
          GRAPHIFY_REFRESHED: ${{ steps.graphify.outputs.refreshed }}
          GRAPHIFY_SEMANTIC: ${{ steps.graphify.outputs.semantic }}
          CHILD_COUNT: ${{ steps.children.outputs.count || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$REBASE_REPO"
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true

          body="$RUNNER_TEMP/rebase-success.md"
          {
            echo '<!-- thingtime-ai-rebase-result:v1 -->'
            echo "🧬 Rebased \`$HEAD_REF\` onto \`$BASE_REF\` with the [AI PR/stack rebase workflow]($RUN_URL)."
            echo
            echo "- Previous head: \`$EXPECTED_HEAD_SHA\`"
            echo "- Rewritten head: \`$NEW_HEAD_SHA\`"
            if [ "$GRAPHIFY_REFRESHED" = true ]; then
              echo "- graphify: refreshed and committed (semantic mode: \`${GRAPHIFY_SEMANTIC:-none}\`)"
            else
              echo "- graphify: already current (semantic mode: \`${GRAPHIFY_SEMANTIC:-none}\`)"
            fi
            if [ "$CASCADE" = true ]; then
              echo "- Direct stacked children dispatched: $CHILD_COUNT"
            else
              echo "- Child cascade: disabled for this manual run"
            fi
            echo
            echo "The branch was published once with an exact force-with-lease. Please review the rewritten commits before relying on them."
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body" || \
            echo "::warning::Rebase succeeded, but the PR comment could not be posted."

      - name: Queue repository maintenance after the rebase fleet settles
        if: steps.published.outcome == 'success' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Parent workers hold every direct child before dispatching it, and
          # each worker releases its own label only after publication. The last
          # successful worker therefore observes zero live rebase owners and
          # becomes the fleet finalizer. Concurrent last siblings are harmless:
          # the destination workflows have one shared, coalescing namespace.
          live_rebase_owners="$(
            gh api --paginate \
              "repos/$REPO/issues?state=open&labels=ai-rebase-in-progress&per_page=100" \
              --slurp | jq '[add // [] | .[] | select(has("pull_request"))] | length'
          )"
          if [ "$live_rebase_owners" -ne 0 ]; then
            echo "::notice::$live_rebase_owners rebase worker(s) still own the cascade; the last worker will queue repository maintenance."
            exit 0
          fi

          # A fully materialized conflict batch already owns one repository-
          # wide review/build finalizer. Do not place a rebase-generated pair
          # in front of its pending PR repairs.
          runs="$(
            gh api \
              "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/runs?per_page=100" \
              | jq -c '.workflow_runs'
          )"
          if jq -e '
            any(.[];
              .display_title == "Lopu resolves a PR batch from the control plane"
              and .event == "workflow_dispatch"
              and .head_branch == "github-actions"
              and .actor.login == "github-actions[bot]"
              and .path == ".github/workflows/resolve-pr-conflicts.yml"
              and (.status == "queued"
                   or .status == "in_progress"
                   or .status == "pending"
                   or .status == "waiting"
                   or .status == "requested"))
          ' >/dev/null <<<"$runs"; then
            echo '::notice::An active conflict batch already owns the repository maintenance finalizer.'
            exit 0
          fi

          jq -n '{
            ref:"github-actions",
            inputs:{
              pr_number:"",
              branch:"lopu-internal-all-branch",
              maintenance_operation:"manage-prs"
            }
          }' | gh api --method POST \
            "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
            --input -

          jq -n --arg dispatch_id "lopu-review:rebase-fleet:$GITHUB_RUN_ID" '{
            ref:"github-actions",
            inputs:{
              pr_number:"",
              branch:"",
              detector_handoff:true,
              manual_retry:false,
              depth:"0",
              control_dispatch_id:$dispatch_id
            }
          }' | gh api --method POST \
            "repos/$REPO/actions/workflows/resolve-pr-conflicts.yml/dispatches" \
            --input -
          echo 'Queued one repository-wide review and all-branch rebuild after the rebase fleet.'

      - name: Clean up after a pre-push failure
        if: >-
          failure()
          && steps.context.outputs.skip == 'false'
          && steps.push.outputs.remote_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MODE: ${{ steps.context.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          repo_dir=''
          for candidate in "$REBASE_REPO" "$GITHUB_WORKSPACE/repo"; do
            if git -C "$candidate" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repo_dir="$candidate"
              break
            fi
          done
          if [ -n "$repo_dir" ]; then
            cd -- "$repo_dir"
            git rebase --abort >/dev/null 2>&1 || true
          fi
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true

          encode_ref() { jq -rn --arg value "$1" '$value | @uri'; }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          paused=false
          pause_marker=''
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER" 2>/dev/null || true)"
          protected_state="$(gh api \
            "repos/$REPO/branches/$(encode_ref "$HEAD_REF")" \
            --jq '.protected' 2>/dev/null || true)"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch' 2>/dev/null || true)"
          live_head="$(live_ref_sha "$HEAD_REF" 2>/dev/null || true)"
          live_base="$(live_ref_sha "$BASE_REF" 2>/dev/null || true)"
          in_progress_absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
            --jq '[.labels[].name] | index("ai-rebase-in-progress") == null' \
            2>/dev/null || true)"

          exact_snapshot=false
          if [ -n "$pr" ] \
             && [ "$(jq -r '.state' <<<"$pr")" = open ] \
             && [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
             && [ "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF" ] \
             && [ "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF" ] \
             && [ "$live_head" = "$EXPECTED_HEAD_SHA" ] \
             && [ "$live_base" = "$EXPECTED_BASE_SHA" ] \
             && [ "$protected_state" = false ] \
             && [ -n "$default_ref" ] \
             && [ "$HEAD_REF" != "$default_ref" ] \
             && [ "$in_progress_absent" = true ]; then
            exact_snapshot=true
          fi

          rebase_owned=false
          topology=standalone
          if [ "$exact_snapshot" = true ]; then
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            if ! jq -e 'index("no-ai-rebase") != null' \
                 >/dev/null <<<"$labels"; then
              if [ "$MODE" = onto ]; then
                rebase_owned=true
                topology=stack
              else
                all_open="$(
                  gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp 2>/dev/null \
                    | jq -c 'add // []' || true
                )"
                if [ -n "$all_open" ]; then
                  stack_member="$(jq -r \
                    --arg repo "$REPO" \
                    --argjson number "$PR_NUMBER" \
                    --arg head "$HEAD_REF" \
                    --arg base "$BASE_REF" \
                    --arg default_ref "$default_ref" \
                    "$STACK_MEMBER_JQ" <<<"$all_open")"
                  [ "$stack_member" != true ] || topology=stack
                  mergeable="$(jq -r '.mergeable' <<<"$pr")"
                  rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
                  rebase_owned="$(jq -nr \
                    --argjson stack_member "$stack_member" \
                    --argjson no_ai_rebase false \
                    --argjson mergeable "$mergeable" \
                    --argjson rebaseable "$rebaseable" \
                    --argjson manual "$MANUAL" \
                    "$REBASE_OWNER_JQ")"
                fi
              fi
            fi
          fi

          if [ "$rebase_owned" = true ]; then
            merge_pause_absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
              --jq '[.labels[].name] | index("ai-merge-paused") == null' \
              2>/dev/null || true)"
            if [ "$merge_pause_absent" = true ]; then
              pause_payload="$(jq -cn \
                --argjson pr "$PR_NUMBER" \
                --arg head_ref "$HEAD_REF" \
                --arg head_sha "$EXPECTED_HEAD_SHA" \
                --arg base_ref "$BASE_REF" \
                --arg base_sha "$EXPECTED_BASE_SHA" \
                --arg topology "$topology" \
                --arg run_id "${GITHUB_RUN_ID:-}" \
                '{v:1,owner:"rebase",pr:$pr,head_ref:$head_ref,head_sha:$head_sha,
                  base_ref:$base_ref,base_sha:$base_sha,topology:$topology,run_id:$run_id}')"
              pause_token="$(printf '%s' "$pause_payload" | base64 -w0 \
                | tr '+/' '-_' | tr -d '=')"
              pause_marker="<!-- thingtime-ai-conflict-pause:v1 $pause_token -->"
              if gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
                   --input <(jq -cn '{labels:["ai-rebase-paused"]}') >/dev/null; then
                paused=true
              else
                echo "::warning::Could not apply ai-rebase-paused."
              fi
            else
              echo "::notice::A user-controlled ai-merge-paused label is present, so no automation label was changed."
            fi
          else
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-paused" \
              >/dev/null 2>&1 || true
            echo "::notice::The failed rebase snapshot moved or changed owner, so it was not paused."
          fi

          children="$RUNNER_TEMP/rebase-children.json"
          if [ -f "$children" ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            done < <(jq -r '.[].number' "$children")
          fi

          case "${{ steps.push.outputs.remote_state }}" in
            unchanged)
              outcome="A live-ref query proved the remote branch still points to \`$EXPECTED_HEAD_SHA\`." ;;
            unexpected|unverifiable)
              outcome="The push outcome is ambiguous: the live branch points to unexpected SHA \`${{ steps.push.outputs.remote_sha }}\`. Inspect it before retrying." ;;
            *)
              outcome="The workflow stopped before it attempted its force-with-lease push." ;;
          esac
          body="$RUNNER_TEMP/rebase-failure.md"
          {
            echo '<!-- thingtime-ai-rebase-failure:v1 -->'
            echo "⚠️ The [AI PR/stack rebase workflow]($RUN_URL) did not complete. $outcome"
            if [ "$paused" = true ]; then
              echo
              echo "\`ai-rebase-paused\` was added for this exact ref/topology snapshot; review the run, then use a manual PR-number run to retry."
              echo
              echo "$pause_marker"
            else
              echo
              echo "The PR changed refs or resolver ownership, so no pause was added; the current state remains eligible for automatic re-detection."
            fi
          } > "$body"
          if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"; then
            if [ "$paused" = true ]; then
              gh api --method DELETE \
                "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-paused" \
                >/dev/null 2>&1 || true
              echo "::warning::Pause comment failed, so ai-rebase-paused was removed rather than leaving metadata-free state."
            fi
          fi

      - name: Clean up if publication succeeded but follow-up failed
        if: failure() && steps.push.outputs.remote_state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_dir=''
          for candidate in "$REBASE_REPO" "$GITHUB_WORKSPACE/repo"; do
            if git -C "$candidate" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              repo_dir="$candidate"
              break
            fi
          done
          [ -z "$repo_dir" ] || cd -- "$repo_dir"
          gh api --method DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/ai-rebase-in-progress" \
            >/dev/null 2>&1 || true
          children="$RUNNER_TEMP/rebase-children.json"
          if [ -f "$children" ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              gh api --method DELETE \
                "repos/$REPO/issues/$number/labels/ai-rebase-in-progress" \
                >/dev/null 2>&1 || true
            done < <(jq -r '.[].number' "$children")
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "<!-- thingtime-ai-rebase-post-push:v1 -->
            ⚠️ The branch was rewritten successfully, but a [post-push verification or cascade step]($RUN_URL) failed. Child holds were released so the next scheduled scan can recover them." \
            || true
