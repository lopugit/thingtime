# Lopu's internal rebase and stack-cascade engine for same-repository pull requests.
#
# GitHub's `mergeable` and `rebaseable` answers describe different operations:
# a PR can merge cleanly while replaying one of its commits still conflicts.
# Automatic history rewrites are reserved for genuine stacks, where preserving
# branch-to-branch topology requires replaying the stack bottom-up. Standalone
# merge conflicts stay merge-owned, while standalone PRs that already merge
# cleanly are left alone even when GitHub says their commits are not rebaseable.
# An explicit PR-number dispatch may still retry that legacy standalone replay
# deliberately; blank/manual sweeps use the same stacks-only automatic policy.
#
# Coordination and race invariants:
# - The public Lopu PR manager calls this reusable engine. Its detector hands
#   exact work to repository_dispatch, whose thin default-branch listener
#   calls this protected control-plane workflow again for the final rewrite.
#   The worker checks out that same control ref before invoking local support.
# - fork PRs, the default branch, protected head branches, opted-out PRs, and
#   stale ref snapshots are rejected before checkout or Claude.
# - The real Git checkout moves under RUNNER_TEMP before Claude. The model gets
#   file tools over a repo-less scratch containing only exact conflict copies;
#   the trusted composite validates bytes back into the real index and
#   continues each rebase round deterministically.
# - no remote ref changes until every commit has replayed and graphify has
#   refreshed. The sole push uses
#   --force-with-lease=refs/heads/<head>:<original-sha>.
# - direct children are labelled `ai-rebase-in-progress` before the parent
#   push. This keeps the merge resolver and scheduled detector from racing the
#   explicit old-parent -> new-parent cascade.
#
# Secrets are shared with the merge resolver:
# - THINGTIME_CI_ROUTER_SECRET fetches the admin-ordered Claude Code OAuth
#   waterfall from Thingtime only when a non-graphify conflict reaches AI.
# - CONFLICT_RESOLVER_PAT is optional. GITHUB_TOKEN is sufficient unless the
#   rewritten history changes .github/workflows/. A PAT used here needs
#   contents/pull-request/issues/workflow access appropriate to this repository.

name: Lopu rebase engine

run-name: >-
  Lopu rebase and cascade${{ github.event.client_payload.pr_number && format(' for PR #{0}', github.event.client_payload.pr_number) || inputs.pr_number && format(' for PR #{0}', inputs.pr_number) || '' }}

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Exact PR to retry; leave blank to scan conflicting stacks"
        required: false
        default: ""
        type: string
      branch:
        description: "PR base or head branch to scan when no exact PR is supplied"
        required: false
        default: ""
        type: string
      cascade:
        description: "Continue through PRs stacked on the rebased branch"
        required: false
        default: true
        type: boolean
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: string
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string
      routing_proof:
        description: "Internal: signed proof for an already-validated provider route"
        required: false
        default: ""
        type: string
      routing_proof_issued_at:
        description: "Internal: Unix timestamp bound into routing_proof"
        required: false
        default: ""
        type: string
      worker_handoff:
        description: "Internal: exact snapshot worker routing flag"
        required: false
        default: false
        type: boolean
      expected_head_sha:
        required: false
        default: ""
        type: string
      expected_base_sha:
        required: false
        default: ""
        type: string
      old_base_sha:
        required: false
        default: ""
        type: string
      new_base_sha:
        required: false
        default: ""
        type: string
      manual:
        required: false
        default: false
        type: boolean
      depth:
        required: false
        default: "0"
        type: string
      ref_race_retry:
        description: "Internal: bounded publication-race retry count"
        required: false
        default: "0"
        type: string
      automatic_retry:
        description: "Internal: exact automatic retry without manual-selector authority"
        required: false
        default: false
        type: boolean
      visited:
        required: false
        default: ""
        type: string
      recover_stale_lock:
        required: false
        default: false
        type: boolean
permissions:
  contents: read

# Shared topology and ownership expressions are evaluated at detection and at
# every worker race boundary. Automatic rebase ownership requires a real stack
# edge between non-default branches. A reverse synchronization/promotion PR
# whose head is the default branch (for example `main` -> `develop`) must never
# make ordinary PRs targeting that default branch look like a synthetic stack.
# The manual exception preserves deliberate exact-PR retries without
# letting scheduled, push, pull-request, or blank-manual scans rewrite
# standalone histories.
env:
  STACK_MEMBER_JQ: >-
    (any(.[];
      .number == $number
      and .head.repo.full_name == $repo
      and .base.repo.full_name == $repo
      and ([.labels[].name] | index("no-ai-rebase") == null)))
    and any(.[];
      .number != $number
      and .head.repo.full_name == $repo
      and .base.repo.full_name == $repo
      and ([.labels[].name] | index("no-ai-rebase") == null)
      and ((.head.ref == $base and $base != $default_ref)
           or (.base.ref == $head and $head != $default_ref)))
  REBASE_OWNER_JQ: >-
    ($no_ai_rebase != true)
    and (
      ($stack_member == true
        and ($mergeable == false or $rebaseable == false))
      or
      ($manual == true
        and $stack_member != true
        and $mergeable == true
        and $rebaseable == false)
    )

concurrency:
  group: >-
    ${{ (github.event_name == 'repository_dispatch'
          || (github.event_name == 'workflow_dispatch' && inputs.worker_handoff == true))
        && format('ai-rebase-pr-{0}', github.event.client_payload.pr_number || inputs.pr_number)
        || format('ai-rebase-detect-{0}-{1}', github.event_name,
             github.event.pull_request.number || github.ref_name || github.run_id) }}
  # Never cancel a history rewrite. Detector runs are safe to supersede.
  cancel-in-progress: >-
    ${{ github.event_name != 'repository_dispatch'
        && (github.event_name != 'workflow_dispatch' || inputs.worker_handoff != true) }}

jobs:
  route:
    uses: ./.github/workflows/ci-provider-router.yml
    with:
      workflow: rebase-stack
      execution_provider: ${{ inputs.execution_provider || github.event.client_payload.execution_provider || 'github-actions' }}
      runner_label: ${{ inputs.runner_label || github.event.client_payload.runner_label || '' }}
      control_dispatch_id: ${{ inputs.control_dispatch_id || github.event.client_payload.control_dispatch_id || '' }}
      routing_proof: ${{ inputs.routing_proof || github.event.client_payload.routing_proof || '' }}
      routing_proof_issued_at: ${{ inputs.routing_proof_issued_at || github.event.client_payload.routing_proof_issued_at || '' }}
      internal_worker: >-
        ${{ (github.event_name == 'repository_dispatch'
             && github.event.action == 'rebase-pr-stack-ai')
            || (github.event_name == 'workflow_dispatch'
                && inputs.worker_handoff == true
                && inputs.pr_number != ''
                && inputs.branch == ''
                && inputs.expected_head_sha != ''
                && inputs.expected_base_sha != '') }}
      pr_number: ${{ inputs.pr_number || github.event.client_payload.pr_number || github.event.pull_request.number || '' }}
      branch: ${{ inputs.branch || (github.event_name == 'push' && github.ref_name) || '' }}
      cascade: ${{ github.event_name != 'workflow_dispatch' || inputs.cascade }}
    secrets: inherit

  detect:
    name: Find stack members that need rebasing
    needs: route
    if: >-
      needs.route.outputs.execute == 'true'
      && github.event_name != 'repository_dispatch'
      && (github.event_name != 'workflow_dispatch' || inputs.worker_handoff != true)
      && (github.event_name != 'push' || github.event.deleted == false)
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    # A scheduled/manual sweep may evaluate every open same-repo PR. Most
    # mergeability answers are cached, but the API can require one or more
    # bounded polling rounds across a large open-PR set.
    timeout-minutes: 20
    permissions:
      pull-requests: read
      issues: write
      contents: read
    outputs:
      targets: ${{ steps.scan.outputs.targets }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Scan open same-repository PRs via the API
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_TOKEN remains least-privilege primary. The existing resolver
          # PAT is a bounded fallback for repositories whose Actions token can
          # read labels but is refused when removing them.
          LABEL_WRITE_TOKEN: ${{ secrets.CONFLICT_RESOLVER_PAT }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          MANUAL_PR: ${{ inputs.pr_number }}
          MANUAL_BRANCH: ${{ inputs.branch }}
          AUTOMATIC_RETRY: ${{ inputs.automatic_retry && 'true' || 'false' }}
          CASCADE: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.cascade == false && 'false' || 'true' }}
          LOCK_TTL_SECONDS: "5400"
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_PR:-}" ] \
             && ! [[ "$MANUAL_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive decimal PR number."
            exit 1
          fi

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }

          live_ref_sha() {
            local encoded
            encoded="$(encode_ref "$1")"
            gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha'
          }

          branch_protected() {
            local encoded
            encoded="$(encode_ref "$1")"
            gh api "repos/$REPO/branches/$encoded" --jq '.protected'
          }

          all="$(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []'
          )"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"

          # A stack member either targets another open PR's head branch or is
          # itself the base of another open PR. Compare only same-repo PRs;
          # neither secrets nor force-pushes may ever cross a fork boundary.
          # no-ai-rebase also breaks topology edges. In particular, a standing
          # integration-branch promotion PR must not turn every feature PR
          # targeting that integration branch into one giant synthetic stack.
          same_repo="$(jq -c --arg repo "$REPO" '
            [.[]
              | select(.head.repo.full_name == $repo)
              | select(.base.repo.full_name == $repo)]
          ' <<<"$all")"
          explicit=false
          case "$EVENT_NAME" in
            workflow_dispatch|workflow_call)
              if [ -n "${MANUAL_PR:-}" ]; then
                explicit=true
                candidates="$(jq -c --argjson n "$MANUAL_PR" '[.[] | select(.number == $n)]' <<<"$same_repo")"
              elif [ -n "${MANUAL_BRANCH:-}" ]; then
                candidates="$(jq -c --arg ref "$MANUAL_BRANCH" '[.[] | select(.head.ref == $ref or .base.ref == $ref)]' <<<"$same_repo")"
              else
                candidates="$same_repo"
              fi
              ;;
            push)
              # A head push can make its own replay fail; a base push can make
              # each direct child fail. The later root filter keeps a blocked
              # parent ahead of a blocked child.
              candidates="$(jq -c --arg ref "$PUSHED_REF" '
                [.[] | select(.head.ref == $ref or .base.ref == $ref)]
              ' <<<"$same_repo")"
              ;;
            pull_request_target)
              # A fork user must never turn an opened PR into a repository-
              # wide AI scan. Start only from the triggering same-repo PR,
              # then walk any same-repo ancestors (bounded and cycle-checked)
              # so an opened child cannot jump ahead of its parent.
              candidates="$(jq -c --argjson n "$EVENT_PR" \
                '[.[] | select(.number == $n)]' <<<"$same_repo")"
              if [ "$(jq 'length' <<<"$candidates")" -eq 1 ]; then
                cursor="$(jq -r '.[0].base.ref' <<<"$candidates")"
                for ((ancestor_depth = 0; ancestor_depth < 64; ancestor_depth++)); do
                  parents="$(jq -c --arg base "$cursor" --arg default_ref "$default_ref" \
                    '[.[] | select(.head.ref == $base and .head.ref != $default_ref)]' <<<"$same_repo")"
                  count="$(jq 'length' <<<"$parents")"
                  [ "$count" -gt 0 ] || break
                  if [ "$count" -ne 1 ]; then
                    echo "::warning::Ambiguous stack parent branch $cursor; stopping ancestor walk."
                    break
                  fi
                  parent="$(jq -c '.[0]' <<<"$parents")"
                  parent_number="$(jq -r '.number' <<<"$parent")"
                  if jq -e --argjson n "$parent_number" \
                       'any(.[]; .number == $n)' >/dev/null <<<"$candidates"; then
                    echo "::warning::Cycle detected while walking stack ancestors; stopping."
                    break
                  fi
                  candidates="$(jq -c --argjson parent "$parent" '. + [$parent]' <<<"$candidates")"
                  cursor="$(jq -r '.base.ref' <<<"$parent")"
                done
              else
                # Includes fork PRs. The global schedule remains the backstop
                # for unrelated same-repository PRs and stacks.
                candidates='[]'
              fi
              ;;
            schedule)
              candidates="$same_repo"
              ;;
            *)
              candidates='[]'
              ;;
          esac

          if [ "$EVENT_NAME" = push ]; then
            # The pushed ref can be a child head. Include that candidate's
            # ancestors before checking rebaseability, otherwise a blocked
            # child could be dispatched ahead of its blocked parent.
            seeds="$candidates"
            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              seed="$(base64 --decode <<<"$encoded")"
              cursor="$(jq -r '.base.ref' <<<"$seed")"
              for ((ancestor_depth = 0; ancestor_depth < 64; ancestor_depth++)); do
                parents="$(jq -c --arg base "$cursor" --arg default_ref "$default_ref" \
                  '[.[] | select(.head.ref == $base and .head.ref != $default_ref)]' <<<"$same_repo")"
                count="$(jq 'length' <<<"$parents")"
                [ "$count" -gt 0 ] || break
                if [ "$count" -ne 1 ]; then
                  echo "::warning::Ambiguous stack parent branch $cursor; stopping ancestor walk."
                  break
                fi
                parent="$(jq -c '.[0]' <<<"$parents")"
                parent_number="$(jq -r '.number' <<<"$parent")"
                if jq -e --argjson n "$parent_number" \
                     'any(.[]; .number == $n)' >/dev/null <<<"$candidates"; then
                  break
                fi
                candidates="$(jq -c --argjson parent "$parent" '. + [$parent]' <<<"$candidates")"
                cursor="$(jq -r '.base.ref' <<<"$parent")"
              done
            done < <(jq -r '.[] | @base64' <<<"$seeds")
          fi

          manual_selection="$explicit"
          if [ "$AUTOMATIC_RETRY" = true ]; then
            manual_selection=false
          fi

          if [ "$explicit" = true ] && [ "$(jq 'length' <<<"$candidates")" -eq 0 ]; then
            echo "::error::Open same-repository PR #$MANUAL_PR was not found."
            exit 1
          fi

          # GitHub computes mergeability and rebaseability lazily. Poll every
          # still-unknown candidate once per round rather than sleeping eight
          # times for one PR before looking at the next; a repository-wide scan
          # therefore gives every open PR a verdict opportunity within the
          # bounded detector window.
          verdicts='{}'
          pending="$(jq -c '[.[].number]' <<<"$candidates")"
          for attempt in 1 2 3 4 5 6 7 8; do
            next_pending='[]'
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              detail="$(gh api "repos/$REPO/pulls/$number")"
              rebaseable="$(jq -r '.rebaseable' <<<"$detail")"
              mergeable="$(jq -r '.mergeable' <<<"$detail")"
              if [ "$rebaseable" != null ] && [ "$mergeable" != null ]; then
                verdicts="$(jq -c \
                  --arg key "$number" \
                  --argjson mergeable "$mergeable" \
                  --argjson rebaseable "$rebaseable" '
                    . + {($key): {
                      mergeable:$mergeable,
                      rebaseable:$rebaseable
                    }}
                  ' <<<"$verdicts")"
              else
                next_pending="$(jq -c --argjson n "$number" '. + [$n]' \
                  <<<"$next_pending")"
              fi
            done < <(jq -r '.[]' <<<"$pending")
            pending="$next_pending"
            unknown_count="$(jq 'length' <<<"$pending")"
            [ "$unknown_count" -gt 0 ] || break
            echo "attempt $attempt/8: $unknown_count PR(s) still computing merge/rebaseability."
            [ "$attempt" -eq 8 ] || sleep 8
          done

          blocked='[]'
          barriers='[]'
          label_cleanup_failed=false
          add_barrier() {
            local barrier
            barrier="$(jq -cn \
              --argjson number "$number" \
              --arg head "$head" \
              --arg base "$base" \
              '{number:$number,head:$head,base:$base}')"
            barriers="$(jq -c --argjson barrier "$barrier" \
              '. + [$barrier]' <<<"$barriers")"
          }
          remove_label_verified() {
            local label="$1" encoded_label endpoint error_file
            local token_name token issue_json absent attempt token_index
            local delete_succeeded verify_attempt
            local -a tokens=("$GH_TOKEN") token_names=("GITHUB_TOKEN")
            if [ -n "${LABEL_WRITE_TOKEN:-}" ] \
               && [ "$LABEL_WRITE_TOKEN" != "$GH_TOKEN" ]; then
              tokens+=("$LABEL_WRITE_TOKEN")
              token_names+=("CONFLICT_RESOLVER_PAT")
            fi
            encoded_label="$(jq -rn --arg value "$label" '$value | @uri')"
            endpoint="repos/$REPO/issues/$number/labels/$encoded_label"
            error_file="$(mktemp "$RUNNER_TEMP/thingtime-label-cleanup.XXXXXX")"

            for token_index in "${!tokens[@]}"; do
              token="${tokens[$token_index]}"
              token_name="${token_names[$token_index]}"
              for attempt in 1 2 3; do
                : >"$error_file"
                delete_succeeded=false
                if GH_TOKEN="$token" gh api --method DELETE "$endpoint" \
                  --silent 2>"$error_file"; then
                  delete_succeeded=true
                fi
                # A successful DELETE is issued only once. Polling its result
                # avoids deleting a fresh same-name hold that another worker
                # could apply while GitHub's issue response catches up.
                for verify_attempt in 1 2 3; do
                  issue_json="$(GH_TOKEN="$token" gh api \
                    "repos/$REPO/issues/$number" 2>>"$error_file" || true)"
                  absent="$(jq -r --arg label "$label" '
                      if type == "object" and (.labels | type) == "array"
                      then ([.labels[].name] | index($label) == null)
                      else false
                      end
                    ' <<<"$issue_json" 2>>"$error_file" || true)"
                  if [ "$absent" = true ]; then
                    rm -f -- "$error_file"
                    if [ "$attempt" -gt 1 ] \
                       || [ "$token_name" != GITHUB_TOKEN ]; then
                      echo "Removed $label from #$number with $token_name on attempt $attempt."
                    fi
                    return 0
                  fi
                  [ "$delete_succeeded" = true ] \
                    && [ "$verify_attempt" -lt 3 ] \
                    || break
                  sleep "$verify_attempt"
                done

                echo "::warning::Label cleanup attempt $attempt/3 with $token_name did not remove $label from #$number."
                if [ -s "$error_file" ]; then
                  sed -E \
                    's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/[redacted-token]/g' \
                    "$error_file" >&2
                fi
                if [ "$delete_succeeded" = true ]; then
                  echo "::warning::The label remained or was re-applied after a successful DELETE; refusing another DELETE that could erase a newer hold."
                  rm -f -- "$error_file"
                  return 1
                fi
                # Authentication/authorization failures are deterministic for
                # this token; move directly to the configured fallback.
                if grep -Eqi \
                  'HTTP (401|403)|Resource not accessible by integration' \
                  "$error_file"; then
                  break
                fi
                [ "$attempt" -eq 3 ] || sleep "$attempt"
              done
            done

            rm -f -- "$error_file"
            echo "::error::Could not remove stale $label from #$number after bounded retries and verification."
            return 1
          }
          release_recovered_lock() {
            [ "${stale_lock:-false}" = true ] || return 0
            remove_label_verified ai-rebase-in-progress || {
              echo "::error::Could not release stale AI rebase lock on #$number."
              return 1
            }
            echo "Released recovered ai-rebase-in-progress lock on #$number."
          }
          decode_base64url() {
            local value="$1"
            value="$(tr '_-' '/+' <<<"$value" | tr -d '\n')"
            case $((${#value} % 4)) in
              0) ;;
              2) value="${value}==" ;;
              3) value="${value}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$value" | base64 --decode
          }
          rebase_pause_matches() {
            local token decoded payload topology
            topology="$1"
            token="$(
              gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" --slurp 2>/dev/null \
                | jq -r '
                    add // []
                    | [.[]
                        | select(.user.login == "github-actions[bot]")
                        | .body
                        | capture("<!-- thingtime-ai-conflict-pause:v1 (?<token>[A-Za-z0-9_-]+) -->")?
                        | .token]
                    | last // empty
                  ' 2>/dev/null || true
            )"
            [ -n "$token" ] || return 2
            decoded="$(decode_base64url "$token" 2>/dev/null || true)"
            payload="$(jq -ce \
              --argjson expected_number "$number" '
                select(type == "object")
                | select(.v == 1 and .owner == "rebase" and .pr == $expected_number)
                | select(.head_ref | type == "string" and length > 0)
                | select(.base_ref | type == "string" and length > 0)
                | select(.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.base_sha | type == "string" and test("^[0-9a-f]{40}$"))
                | select(.topology == "standalone" or .topology == "stack")
              ' <<<"$decoded" 2>/dev/null || true)"
            [ -n "$payload" ] || return 2
            if [ "$head" = "$(jq -r '.head_ref' <<<"$payload")" ] \
              && [ "$base" = "$(jq -r '.base_ref' <<<"$payload")" ] \
              && [ "$head_sha" = "$(jq -r '.head_sha' <<<"$payload")" ] \
              && [ "$base_sha" = "$(jq -r '.base_sha' <<<"$payload")" ] \
              && [ "$topology" = "$(jq -r '.topology' <<<"$payload")" ]; then
              return 0
            fi
            return 1
          }
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            pr="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$pr")"
            head="$(jq -r '.head.ref' <<<"$pr")"
            base="$(jq -r '.base.ref' <<<"$pr")"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$number" \
              --arg head "$head" \
              --arg base "$base" \
              --arg default_ref "$default_ref" \
              "$STACK_MEMBER_JQ" <<<"$all")"
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            stale_lock=false
            if jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels"; then
              stale_lock=true
              if [ "$manual_selection" = true ]; then
                echo "Manual run will recover the existing ai-rebase-in-progress lock on #$number."
              else
                labelled_at="$(
                  gh api --paginate "repos/$REPO/issues/$number/events?per_page=100" --slurp \
                    | jq -r 'add // []
                        | map(select(.event == "labeled"
                                     and .label.name == "ai-rebase-in-progress"))
                        | sort_by(.created_at) | last | .created_at // empty'
                )"
                if [ -z "$labelled_at" ]; then
                  echo "Skipping #$number: in-progress label age could not be established."
                  add_barrier
                  continue
                fi
                labelled_epoch="$(date -u -d "$labelled_at" +%s)"
                now_epoch="$(date -u +%s)"
                age=$((now_epoch - labelled_epoch))
                if [ "$age" -lt "$LOCK_TTL_SECONDS" ]; then
                  echo "Skipping #$number: an AI rebase is in progress (${age}s old)."
                  add_barrier
                  continue
                fi
                echo "::warning::Recovering stale ai-rebase-in-progress lock on #$number (${age}s old)."
              fi
            fi
            no_ai_rebase=false
            if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
              no_ai_rebase=true
            fi
            rebase_paused=false
            jq -e 'index("ai-rebase-paused") != null' >/dev/null <<<"$labels" \
              && rebase_paused=true
            merge_paused=false
            jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels" \
              && merge_paused=true

            # This label is a user-controlled hard stop shared by both AI
            # automations. Never clear, recover, or supersede it: a user must
            # remove it before a rebase detector or worker may proceed.
            if [ "$merge_paused" = true ]; then
              echo "Skipping #$number: user-controlled ai-merge-paused is present."
              release_recovered_lock
              [ "$stack_member" != true ] || add_barrier
              continue
            fi

            # Both answers are required for every candidate: a real stack with
            # M=false/R=true still belongs to this workflow and needs a clean
            # history replay. Standalone automatic candidates never do.
            verdict_known="$(jq -r --arg key "$number" 'has($key)' <<<"$verdicts")"
            if [ "$verdict_known" != true ]; then
              echo "::warning::Skipping #$number for now: merge/rebaseability stayed unknown."
              release_recovered_lock
              [ "$stack_member" != true ] || add_barrier
              continue
            fi
            mergeable="$(jq -r --arg key "$number" '.[$key].mergeable' <<<"$verdicts")"
            rebaseable="$(jq -r --arg key "$number" '.[$key].rebaseable' <<<"$verdicts")"

            # Current ownership is a pure function of topology, opt-out, and
            # the two live GitHub verdicts. Pauses are consulted only AFTER
            # this decision, so an old owner can never strand a new state.
            merge_owned=false
            rebase_owned=false
            if [ "$mergeable" = false ] \
               && { [ "$no_ai_rebase" = true ] || [ "$stack_member" != true ]; }; then
              merge_owned=true
            else
              rebase_owned="$(jq -nr \
                --argjson stack_member "$stack_member" \
                --argjson no_ai_rebase "$no_ai_rebase" \
                --argjson mergeable "$mergeable" \
                --argjson rebaseable "$rebaseable" \
                --argjson manual "$explicit" \
                "$REBASE_OWNER_JQ")"
            fi

            if [ "$merge_owned" = true ]; then
              echo "#$number: current state is owned by Resolve PR conflicts (AI)."
              release_recovered_lock
              if [ "$rebase_paused" = true ] \
                 && ! remove_label_verified ai-rebase-paused; then
                label_cleanup_failed=true
                [ "$stack_member" != true ] || add_barrier
                continue
              fi
              # A no-ai stack parent must finish its merge before descendants
              # can be safely replayed onto the updated branch.
              [ "$stack_member" != true ] || add_barrier
              continue
            fi

            if [ "$rebase_owned" != true ]; then
              echo "#$number: no automatic merge or rebase operation is needed."
              release_recovered_lock
              if [ "$rebase_paused" = true ] \
                 && ! remove_label_verified ai-rebase-paused; then
                label_cleanup_failed=true
              fi
              if [ "$stack_member" = true ] && [ "$no_ai_rebase" = true ] \
                 && [ "$rebaseable" = false ]; then
                add_barrier
              fi
              continue
            fi

            if ! protected="$(branch_protected "$head")"; then
              echo "::warning::Skipping #$number: branch protection could not be verified."
              release_recovered_lock
              add_barrier
              continue
            fi
            if [ "$protected" = true ]; then
              echo "::warning::Skipping #$number: protected head branch $head still requires a history rewrite."
              release_recovered_lock
              add_barrier
              continue
            fi

            # Do not use `.base.sha`: GitHub can leave it stale on stacked PR
            # records after a parent rewrite. Snapshot both live branch refs.
            if ! head_sha="$(live_ref_sha "$head")" \
               || ! base_sha="$(live_ref_sha "$base")"; then
              echo "::warning::Skipping #$number: live branch refs could not be snapshotted."
              release_recovered_lock
              add_barrier
              continue
            fi

            if [ "$rebase_paused" = true ] && [ "$manual_selection" != true ]; then
              topology=standalone
              [ "$stack_member" != true ] || topology=stack
              if rebase_pause_matches "$topology"; then
                echo "Skipping #$number: ai-rebase-paused still matches the exact failed snapshot."
                release_recovered_lock
                add_barrier
                continue
              else
                pause_state=$?
              fi
              if [ "$pause_state" -eq 2 ]; then
                echo "::notice::Skipping #$number: ai-rebase-paused lacks valid exact bot snapshot metadata; use a manual PR-number retry."
                release_recovered_lock
                add_barrier
                continue
              fi
              echo "#$number: ai-rebase-paused snapshot is stale; retrying the current rebase-owned state."
              if ! remove_label_verified ai-rebase-paused; then
                label_cleanup_failed=true
                release_recovered_lock
                add_barrier
                continue
              fi
              rebase_paused=false
            fi
            target="$(jq -cn \
              --argjson number "$number" \
              --arg head "$head" \
              --arg base "$base" \
              --arg head_sha "$head_sha" \
              --arg base_sha "$base_sha" \
              --argjson cascade "$CASCADE" \
              --argjson manual "$manual_selection" \
              --argjson stale_lock "$stale_lock" \
              '{number:$number, head:$head, base:$base,
                head_sha:$head_sha, base_sha:$base_sha,
                cascade:$cascade, manual:$manual, stale_lock:$stale_lock}')"
            blocked="$(jq -c --argjson target "$target" '. + [$target]' <<<"$blocked")"
          done < <(jq -r '.[] | @base64' <<<"$candidates")

          if [ "$label_cleanup_failed" = true ]; then
            echo "::error::One or more stale resolver labels remain after cleanup; refusing to dispatch against ambiguous ownership state."
            exit 1
          fi

          # Bottom-up ordering: dispatch a blocked PR only when it has no
          # blocked or temporarily non-runnable ancestor. The recursive walk
          # deliberately crosses clean intermediate stack members: after the
          # oldest blocked ancestor is rewritten, the cascade must transplant
          # each of those intermediates before it reaches the blocked leaf.
          # A clean parent is not itself a barrier, so a genuinely root-most
          # blocked child can still run. Manual targeting remains deliberate
          # and bypasses this automatic ordering filter.
          if [ "$manual_selection" = true ]; then
            roots="$blocked"
          else
            # Large PR bodies and file lists can make the repository-wide
            # candidate graph exceed execve's argv limit. Keep JSON out of
            # command-line arguments: write the three bounded detector values
            # to RUNNER_TEMP, then let jq load them by short file path.
            printf '%s\n' "$blocked" > "$RUNNER_TEMP/rebase-blocked.json"
            printf '%s\n' "$barriers" > "$RUNNER_TEMP/rebase-barriers.json"
            printf '%s\n' "$candidates" > "$RUNNER_TEMP/rebase-candidates.json"
            roots="$(jq -cn \
              --arg default_ref "$default_ref" \
              --slurpfile blocked_file "$RUNNER_TEMP/rebase-blocked.json" \
              --slurpfile barriers_file "$RUNNER_TEMP/rebase-barriers.json" \
              --slurpfile candidates_file "$RUNNER_TEMP/rebase-candidates.json" '
              def head_ref:
                if (.head | type) == "object" then .head.ref else .head end;
              def base_ref:
                if (.base | type) == "object" then .base.ref else .base end;
              def has_ordering_ancestor($pr; $all; $ordered; $depth):
                if any($ordered[];
                    .number != $pr.number
                    and head_ref != $default_ref
                    and (head_ref == ($pr | base_ref))) then
                  true
                else
                  [$all[] | select(head_ref != $default_ref
                                    and head_ref == ($pr | base_ref))] as $parents
                  | if ($parents | length) == 0 then
                      false
                    elif ($parents | length) > 1 or $depth >= 64 then
                      true
                    else
                      has_ordering_ancestor($parents[0]; $all; $ordered; $depth + 1)
                    end
                end;
              ($blocked_file[0] // []) as $blocked
              | ($barriers_file[0] // []) as $barriers
              | ($candidates_file[0] // []) as $candidates
              | ($blocked + $barriers) as $ordered
              | [$blocked[] as $pr
                  | select(has_ordering_ancestor(
                      $pr; $candidates; $ordered; 0) | not)
                  | $pr]
            ')"
          fi

          echo "AI-rebase roots:"
          jq -r '.[] | "  #\(.number) \(.head) onto \(.base) (\(.head_sha[0:8]) -> base \(.base_sha[0:8]))"' <<<"$roots"
          echo "targets=$roots" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$roots")" >> "$GITHUB_OUTPUT"

  handoff:
    name: Hand off to trusted github-actions workers
    needs: [route, detect]
    if: needs.detect.outputs.any == 'true'
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      # POST /repos/{owner}/{repo}/dispatches requires Contents write. Keep the
      # root handoff on the GITHUB_TOKEN and grant only that documented scope.
      contents: write
    steps:
      - name: Dispatch one exact ref snapshot per root PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGETS: ${{ needs.detect.outputs.targets }}
          EXECUTION_PROVIDER: ${{ needs.route.outputs.execution_provider || 'github-actions' }}
          RUNNER_LABEL: ${{ needs.route.outputs.runner_label || '' }}
          CONTROL_DISPATCH_ID: ${{ needs.route.outputs.control_dispatch_id || '' }}
          ROUTING_PROOF: ${{ needs.route.outputs.routing_proof || '' }}
          ROUTING_PROOF_ISSUED_AT: ${{ needs.route.outputs.routing_proof_issued_at || '' }}
          REF_RACE_RETRY: ${{ inputs.ref_race_retry || '0' }}
          AUTOMATIC_RETRY: ${{ inputs.automatic_retry && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            target="$(base64 --decode <<<"$encoded")"
            number="$(jq -r '.number' <<<"$target")"
            echo "Dispatching trusted AI rebase for #$number."
            jq -n \
              --arg pr_number "$number" \
              --arg expected_head_sha "$(jq -r '.head_sha' <<<"$target")" \
              --arg expected_base_sha "$(jq -r '.base_sha' <<<"$target")" \
              --arg execution_provider "$EXECUTION_PROVIDER" \
              --arg runner_label "$RUNNER_LABEL" \
              --arg control_dispatch_id "$CONTROL_DISPATCH_ID" \
              --arg routing_proof "$ROUTING_PROOF" \
              --arg routing_proof_issued_at "$ROUTING_PROOF_ISSUED_AT" \
              --arg ref_race_retry "$REF_RACE_RETRY" \
              --argjson cascade "$(jq -r '.cascade' <<<"$target")" \
              --argjson manual "$(jq -r '.manual' <<<"$target")" \
              --argjson automatic_retry "$AUTOMATIC_RETRY" \
              --argjson recover_stale_lock "$(jq -r '.stale_lock' <<<"$target")" '
                {
                  event_type:"rebase-pr-stack-ai",
                  client_payload:{
                    pr_number:$pr_number,
                    execution_provider:$execution_provider,
                    runner_label:$runner_label,
                    control_dispatch_id:$control_dispatch_id,
                    routing_proof:$routing_proof,
                    routing_proof_issued_at:$routing_proof_issued_at,
                    worker:{
                      branch:"",
                      cascade:$cascade,
                      worker_handoff:true,
                      expected_head_sha:$expected_head_sha,
                      expected_base_sha:$expected_base_sha,
                      old_base_sha:"",
                      new_base_sha:"",
                      manual:$manual,
                      depth:"0",
                      ref_race_retry:$ref_race_retry,
                      automatic_retry:$automatic_retry,
                      visited:"",
                      recover_stale_lock:$recover_stale_lock
                    }
                  }
                }
              ' | gh api --method POST \
                "repos/$REPO/dispatches" \
                --input -
          done < <(jq -r '.[] | @base64' <<<"$TARGETS")

  rebase:
    name: "Rebase PR #${{ github.event.client_payload.pr_number || inputs.pr_number }}"
    needs: route
    if: >-
      needs.route.outputs.execute == 'true'
      && ((github.event_name == 'repository_dispatch'
           && github.event.action == 'rebase-pr-stack-ai')
          || (github.event_name == 'workflow_dispatch'
              && inputs.worker_handoff == true
              && github.actor == 'github-actions[bot]'
              && github.ref_name == 'github-actions'))
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    # Shared with conflict and promotion repair: Lopu works through the
    # repository's queue one model-backed operation at a time.
    concurrency:
      group: lopu-agent-fleet-${{ github.repository }}
      # Preserve every pending stack operation while the repository's one
      # live Lopu worker finishes the current review/resolve/promotion task.
      queue: max
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.worker.expected_head_sha || inputs.expected_head_sha }}
      EXPECTED_BASE_SHA: ${{ github.event.client_payload.worker.expected_base_sha || inputs.expected_base_sha }}
      OLD_BASE_SHA: ${{ github.event.client_payload.worker.old_base_sha || inputs.old_base_sha }}
      NEW_BASE_SHA: ${{ github.event.client_payload.worker.new_base_sha || inputs.new_base_sha }}
      CASCADE: >-
        ${{ github.event_name == 'repository_dispatch'
            && format('{0}', github.event.client_payload.worker.cascade)
            || (inputs.cascade && 'true' || 'false') }}
      MANUAL: >-
        ${{ github.event_name == 'repository_dispatch'
            && format('{0}', github.event.client_payload.worker.manual)
            || (inputs.manual && 'true' || 'false') }}
      DEPTH: ${{ github.event.client_payload.worker.depth || inputs.depth || '0' }}
      VISITED: ${{ github.event.client_payload.worker.visited || inputs.visited || '' }}
      RECOVER_STALE_LOCK: >-
        ${{ github.event_name == 'repository_dispatch'
            && format('{0}', github.event.client_payload.worker.recover_stale_lock)
            || (inputs.recover_stale_lock && 'true' || 'false') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Every trusted git operation is hook- and fsmonitor-proof, including
      # commands launched inside the exact-SHA local composite action.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_CEILING_DIRECTORIES: ${{ github.workspace }}
    steps:
      - name: Validate dispatch against live PR and branch refs
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid repository_dispatch PR number."
            exit 1
          fi
          for sha_name in EXPECTED_HEAD_SHA EXPECTED_BASE_SHA; do
            sha="${!sha_name}"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$sha_name must be an exact 40-character commit SHA."
              exit 1
            fi
          done
          if ! [[ "$DEPTH" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid cascade depth."
            exit 1
          fi
          if [ "$DEPTH" -gt 64 ]; then
            echo "::error::Cascade depth cap exceeded ($DEPTH > 64)."
            exit 1
          fi
          if ! [[ "$VISITED" =~ ^([0-9]+,)*[0-9]*$ ]]; then
            echo "::error::Invalid cascade visited list."
            exit 1
          fi
          if [[ ",$VISITED," == *",$PR_NUMBER,"* ]]; then
            echo "::error::Cascade cycle detected at PR #$PR_NUMBER."
            exit 1
          fi
          case "$CASCADE" in true|false) ;; *) echo "::error::Invalid cascade flag."; exit 1 ;; esac
          case "$MANUAL" in true|false) ;; *) echo "::error::Invalid manual flag."; exit 1 ;; esac
          case "$RECOVER_STALE_LOCK" in true|false) ;; *) echo "::error::Invalid stale-lock flag."; exit 1 ;; esac

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }
          live_ref_sha() {
            gh api "repos/$REPO/git/ref/heads/$(encode_ref "$1")" --jq '.object.sha'
          }
          remove_label() {
            gh api --method DELETE \
              "repos/$REPO/issues/$PR_NUMBER/labels/$1" >/dev/null 2>&1 || true
            absent="$(gh api "repos/$REPO/issues/$PR_NUMBER" \
              --jq "[.labels[].name] | index(\"$1\") == null")"
            [ "$absent" = true ]
          }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skip: $1"
            # A parent may have held this child before dispatch. Once this run
            # owns the per-PR concurrency slot it is safe to release that hold.
            if [ -n "${OLD_BASE_SHA:-}" ] || [ "$RECOVER_STALE_LOCK" = true ]; then
              remove_label ai-rebase-in-progress || \
                echo "::warning::Could not verify release of ai-rebase-in-progress while skipping."
            fi
            exit 0
          }

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          [ "$(jq -r '.state' <<<"$pr")" = open ] || skip "PR #$PR_NUMBER is no longer open."
          [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || skip "fork PRs are never rewritten or exposed to resolver secrets."
          [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$REPO" ] \
            || skip "the PR base is outside this repository."

          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          default_ref="$(gh api "repos/$REPO" --jq '.default_branch')"
          [ "$head_ref" != "$default_ref" ] \
            || skip "the remote default branch is never a rewrite target."

          head_branch="$(gh api "repos/$REPO/branches/$(encode_ref "$head_ref")")"
          [ "$(jq -r '.protected' <<<"$head_branch")" != true ] \
            || skip "head branch $head_ref is protected."

          labels="$(jq -c '[.labels[].name]' <<<"$pr")"
          if jq -e 'index("no-ai-rebase") != null' >/dev/null <<<"$labels"; then
            skip "PR #$PR_NUMBER is labelled no-ai-rebase."
          fi
          if jq -e 'index("ai-rebase-in-progress") != null' >/dev/null <<<"$labels" \
             && [ -z "${OLD_BASE_SHA:-}" ] \
             && [ "$RECOVER_STALE_LOCK" != true ]; then
            skip "another AI rebase acquired the in-progress mutex after detection."
          fi

          live_head_sha="$(live_ref_sha "$head_ref")"
          live_base_sha="$(live_ref_sha "$base_ref")"
          [ "$live_head_sha" = "$EXPECTED_HEAD_SHA" ] \
            || skip "head moved after detection ($EXPECTED_HEAD_SHA -> $live_head_sha)."
          [ "$live_base_sha" = "$EXPECTED_BASE_SHA" ] \
            || skip "base moved after detection ($EXPECTED_BASE_SHA -> $live_base_sha)."

          mode=root
          topology=standalone
          if [ -n "${OLD_BASE_SHA:-}" ] || [ -n "${NEW_BASE_SHA:-}" ]; then
            if ! [[ "${OLD_BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] \
               || ! [[ "${NEW_BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::A cascade requires exact old_base_sha and new_base_sha values."
              exit 1
            fi
            [ "$OLD_BASE_SHA" != "$NEW_BASE_SHA" ] \
              || { echo "::error::Cascade old/new parent SHAs are identical."; exit 1; }
            [ "$NEW_BASE_SHA" = "$live_base_sha" ] \
              || skip "the child's live base no longer equals the cascaded parent SHA."
            mode=onto
            topology=stack
          else
            # Recompute the same ownership predicate as detection. A real stack
            # with mergeable=false/rebaseable=true still needs a clean rebase;
            # automatic standalone rewrites are forbidden.
            all_open="$(gh api --paginate \
              "repos/$REPO/pulls?state=open&per_page=100" --slurp \
              | jq -c 'add // []')"
            stack_member="$(jq -r \
              --arg repo "$REPO" \
              --argjson number "$PR_NUMBER" \
              --arg head "$head_ref" \
              --arg base "$base_ref" \
              --arg default_ref "$default_ref" \
              "$STACK_MEMBER_JQ" <<<"$all_open")"
            [ "$stack_member" != true ] || topology=stack

            rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
            mergeable="$(jq -r '.mergeable' <<<"$pr")"
            for _ in 1 2 3 4 5; do
              [ "$rebaseable" = null ] || [ "$mergeable" = null ] || break
              sleep 5
              pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
              rebaseable="$(jq -r '.rebaseable' <<<"$pr")"
              mergeable="$(jq -r '.mergeable' <<<"$pr")"
            done
            [ "$rebaseable" != null ] && [ "$mergeable" != null ] \
              || skip "merge/rebaseability is still unknown."

            rebase_owned="$(jq -nr \
              --argjson stack_member "$stack_member" \
              --argjson no_ai_rebase false \
              --argjson mergeable "$mergeable" \
              --argjson rebaseable "$rebaseable" \
              --argjson manual "$MANUAL" \
              "$REBASE_OWNER_JQ")"
            [ "$rebase_owned" = true ] \
              || skip "the current PR state is no longer owned by the rebase workflow."
          fi

          if jq -e 'index("ai-merge-paused") != null' >/dev/null <<<"$labels"; then
            skip "ai-merge-paused is user-controlled; a user must remove it before an AI rebase may run."
          fi
          if jq -e 'index("ai-rebase-paused") != null' >/dev/null <<<"$labels"; then
            if [ "$MANUAL" = true ]; then
              remove_label ai-rebase-paused \
                || { echo "::error::Could not clear ai-rebase-paused for manual retry."; exit 1; }
            else
              skip "ai-rebase-paused was re-applied after detection; use a manual PR-number retry."
            fi
          fi

          # Create operational labels if this is the first run in a fork of
          # the repository. Label creation is idempotent and trusted-input only.
          gh label create ai-rebase-in-progress --repo "$REPO" --force \
            --color 1d76db --description "AI stack rebase currently owns this PR branch" >/dev/null
          gh label create ai-rebase-paused --repo "$REPO" --force \
            --color d93f0b --description "AI stack rebase failed; manual retry or review required" >/dev/null
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
            --input <(jq -cn '{labels:["ai-rebase-in-progress"]}') >/dev/null

          visited_next="${VISITED:+$VISITED,}$PR_NUMBER"
          {
            echo "skip=false"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "head_sha=$live_head_sha"
            echo "base_sha=$live_base_sha"
            echo "mode=$mode"
            echo "topology=$topology"
            echo "visited=$visited_next"
          } >> "$GITHUB_OUTPUT"

      # Same reviewer-visibility contract as resolve-pr-conflicts.yml's
      # "Comment on PR (resolution starting)": once validation commits this
      # run to the rebase (skip=false, ownership label taken), say so on the
      # PR before the slow checkouts and replay rounds, so a reviewer opening
      # the PR mid-rebase is not left guessing. Upserted via hidden marker so
      # cascades and retries edit one status comment; a comment failure never
      # blocks the rebase itself.
      - name: Comment on PR (rebase starting)
        if: steps.context.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          post_start_comment() {
            local marker='<!-- thingtime-ai-rebase-start:v1 -->'
            local started eta body comment_id
            started="$(date -u '+%H:%M UTC')"
            eta="$(date -u -d '+15 minutes' '+%H:%M UTC')"
            body="$RUNNER_TEMP/rebase-start-comment.md"
            {
              printf '🤖 **Lopu is rebasing this stack** — work started at %s.\n\n' "$started"
              printf 'Expected to finish around **%s** (most rebases still land in 5-15 minutes; the hosted-runner ceiling is 360). ' "$eta"
              printf 'On success this branch is force-pushed onto its new base and a result comment follows — no manual action is needed meanwhile.\n\n'
              printf '[Live status](%s)\n\n%s\n' "$RUN_URL" "$marker"
            } > "$body"
            comment_id="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --slurp \
              | jq -r '
                  add // []
                  | [.[]
                      | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("thingtime-ai-rebase-start:v1"))
                      | .id]
                  | last // empty
                ')"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" >/dev/null
            else
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
            fi
          }
          post_start_comment || echo "::warning::Could not post the rebase-start comment; continuing with the rebase."

      - name: Define the isolated real-repository path
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          printf 'REBASE_REPO=%s\n' "$RUNNER_TEMP/ai-rebase-repo" >> "$GITHUB_ENV"

      - name: Check out the trusted automation control plane
        if: steps.context.outputs.skip == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: github-actions
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Verify the trusted action snapshot
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          trusted_sha="$(git -C trusted rev-parse HEAD)"
          trusted_ref_sha="$(git -C trusted rev-parse 'origin/github-actions^{commit}')"
          [ "$trusted_sha" = "$trusted_ref_sha" ] \
            || { echo "::error::Trusted checkout does not match origin/github-actions."; exit 1; }
          for path in \
            .github/actions/lopu-agent/action.yml \
            .github/actions/rebase-conflict-round/action.yml \
            .github/scripts/graphify-cas.mjs \
            .github/scripts/stage-graphify-snapshots.mjs \
            .github/scripts/rebase-stack/start.sh \
            .github/scripts/rebase-stack/prepare-round.sh; do
            git -C trusted ls-files --error-unmatch -- "$path" >/dev/null
            [ -f "trusted/$path" ] && [ ! -L "trusted/$path" ] \
              || { echo "::error::Trusted action path is not a regular tracked file: $path"; exit 1; }
          done

      - name: Check out the exact PR head
        if: steps.context.outputs.skip == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          path: repo
          fetch-depth: 0
          # The rebase needs complete commit ancestry, not every historical
          # blob in this multi-gigabyte repository. Missing current/replayed
          # blobs are fetched lazily by Git as their commits are checked out.
          filter: blob:none
          persist-credentials: false
          set-safe-directory: false

      - name: Configure and begin the rebase
        id: start
        if: steps.context.outputs.skip == 'false'
        env:
          MODE: ${{ steps.context.outputs.mode }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          repo_path="$GITHUB_WORKSPACE/repo"
          start_script="$GITHUB_WORKSPACE/trusted/.github/scripts/rebase-stack/start.sh"
          git -C "$repo_path" config user.name "github-actions[bot]"
          git -C "$repo_path" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          for ref_name in "$HEAD_REF" "$BASE_REF"; do
            git check-ref-format "refs/heads/$ref_name" >/dev/null \
              || { echo "::error::Unsafe rebase branch ref: $ref_name"; exit 1; }
          done

          # Keep the routine checkout blobless so old branches do not download
          # the repository's multi-gigabyte history before Lopu knows it needs
          # a historical file. Git normally demand-fetches promised blobs in
          # batches. If GitHub refuses one of those raw-object batches, abort
          # the incomplete replay, refetch only the exact head/base histories
          # without a filter, and retry the trusted rebase once. `--refetch`
          # is required because both commits already exist in the partial
          # clone; an ordinary fetch would otherwise report them up to date.
          start_log="$RUNNER_TEMP/rebase-start.log"
          run_start() {
            if [ "$MODE" = onto ]; then
              "$start_script" "$repo_path" onto "$BASE_SHA" \
                "$OLD_BASE_SHA" "$NEW_BASE_SHA"
            else
              "$start_script" "$repo_path" root "$BASE_SHA"
            fi
          }
          promisor_fetch_failed() {
            grep -Eq \
              'could not fetch [0-9a-f]{40} from promisor remote|upload-pack: not our ref [0-9a-f]{40}' \
              "$start_log"
          }
          attempt_start() {
            local status
            : > "$start_log"
            set +e
            run_start \
              > >(tee -a "$start_log") \
              2> >(tee -a "$start_log" >&2)
            status=$?
            set -e
            return "$status"
          }

          status=0
          attempt_start || status=$?
          if [ "$status" -ne 0 ] && promisor_fetch_failed; then
            echo "::notice::The blobless checkout could not hydrate a promised rebase object; refetching the exact PR branches without a partial-clone filter and retrying once."
            git -C "$repo_path" rebase --abort >/dev/null 2>&1 || true
            git -C "$repo_path" reset --hard "$EXPECTED_HEAD_SHA"
            git -C "$repo_path" fetch --no-tags --no-recurse-submodules \
              --refetch --no-filter origin \
              "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF" \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            git -C "$repo_path" config --unset-all remote.origin.promisor || true
            git -C "$repo_path" config --unset-all remote.origin.partialclonefilter || true
            git -C "$repo_path" config --unset-all extensions.partialClone || true
            git -C "$repo_path" reset --hard "$EXPECTED_HEAD_SHA"

            status=0
            attempt_start || status=$?
            if [ "$status" -ne 0 ] && promisor_fetch_failed; then
              echo "::error::The complete-history retry still could not materialize the exact rebase snapshot."
              exit 1
            fi
          fi
          exit "$status"

      - name: Load the conflict-resolver model waterfall
        id: models
        # Load this for every owned rebase: conflict rounds and the final
        # semantic Graphify refresh must use the same Admin-selected primary.
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          waterfall='["default"]'
          response="$RUNNER_TEMP/rebase-model-waterfall.json"
          if curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
               --connect-timeout 5 --max-time 12 --retry 2 --retry-delay 1 \
               --max-filesize 65536 --output "$response" \
               "https://thingtime.com/api/v1/settings/pr-conflict-auto-resolver-model-waterfall"; then
            # Unique 1..256 array of closed-charset composed option ids
            # (`<model>[:<effort>][:fast]`); entries can never lead with `-`
            # or contain a space, so no CLI flag can be smuggled through.
            configured="$(jq -cse '
              select(length == 1) | .[0]
              | select(.ok == true)
              | select(.key == "Thingtime.PRConflictAutoResolverModelWaterfall")
              | .waterfall
              | select(type == "array" and length >= 1 and length <= 256)
              | select(all(.[]; type == "string"))
              | select(all(.[]; test("^[a-z0-9][a-z0-9.:-]{0,63}$")))
              | select(length == (unique | length))
            ' "$response" 2>/dev/null || true)"
            [ -z "$configured" ] || waterfall="$configured"
          fi
          if ! jq -e 'index("default") != null' >/dev/null <<<"$waterfall"; then
            waterfall="$(jq -c '. + ["default"]' <<<"$waterfall")"
          fi
          # Re-validate each entry against fixed patterns and rebuild the
          # Claude chain only from matched tokens. Claude Code runs
          # Claude-capable entries; another provider's entries (OpenAI ids)
          # configure that provider's own consumers and are skipped here.
          mapfile -t configured_ids < <(jq -r '.[]' <<<"$waterfall")
          models=()
          claude_effort="max"
          mapping_failed=0
          for id in "${configured_ids[@]}"; do
            if ! [[ "$id" =~ ^[a-z0-9][a-z0-9.:-]{0,63}$ ]] || [[ "$id" == *::* ]] || [[ "$id" == *: ]]; then
              mapping_failed=1
              break
            fi
            IFS=':' read -r -a segments <<<"$id"
            base="${segments[0]}"
            effort=""
            # `fast` has no headless Claude Code flag, so it is dropped here —
            # but it is still counted, so a repeated segment fails the mapping
            # closed exactly as the resolver's copy of this grammar does.
            fast=0
            segments_ok=1
            for segment in "${segments[@]:1}"; do
              case "$segment" in
                fast)
                  [ "$fast" -eq 0 ] || segments_ok=0
                  fast=1
                  ;;
                none|minimal|low|medium|high|xhigh|max|ultra)
                  [ -z "$effort" ] || segments_ok=0
                  effort="$segment"
                  ;;
                *) segments_ok=0 ;;
              esac
            done
            if [ "$segments_ok" -ne 1 ]; then
              mapping_failed=1
              break
            fi
            if [ "$base" = "default" ]; then
              model="default"
            elif [[ "$base" =~ ^claude-[a-z0-9-]{1,48}$ ]]; then
              model="${BASH_REMATCH[0]}"
            else
              echo "Skipping waterfall entry '$id'; this Claude Code chain cannot run it."
              continue
            fi
            duplicate=0
            for existing in "${models[@]}"; do
              if [ "$existing" = "$model" ]; then
                duplicate=1
                break
              fi
            done
            [ "$duplicate" -eq 0 ] || continue
            if [ "${#models[@]}" -eq 0 ]; then
              case "$effort" in
                low|medium|high|xhigh|max) claude_effort="$effort" ;;
                *) : ;;
              esac
            fi
            models+=("$model")
          done
          if [ "$mapping_failed" -eq 1 ] || [ "${#models[@]}" -eq 0 ]; then
            models=("default")
            claude_effort="max"
          fi
          has_default=0
          for existing in "${models[@]}"; do
            if [ "$existing" = "default" ]; then
              has_default=1
            fi
          done
          [ "$has_default" -eq 1 ] || models+=("default")
          primary="${models[0]}"
          args="--model $primary"
          if [ "${#models[@]}" -gt 1 ]; then
            fallbacks="$(IFS=,; echo "${models[*]:1}")"
            args="$args --fallback-model $fallbacks"
          fi
          args="$args --effort $claude_effort"
          # Fail closed at the loader if the chain exceeds the 2048-character
          # transport cap enforced downstream, instead of erroring after work.
          if [ "${#args}" -gt 2048 ]; then
            echo "::warning::Validated model args exceed the 2048-character transport cap; using [default]."
            primary="default"
            claude_effort="max"
            args="--model $primary --effort $claude_effort"
          fi
          echo "model_args=$args" >> "$GITHUB_OUTPUT"
          echo "primary_model=$primary" >> "$GITHUB_OUTPUT"

      - name: Isolate the real rebasing repository outside model workspace
        if: steps.context.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$(cd -- repo && pwd -P)"
          [ "$source_repo" = "$GITHUB_WORKSPACE/repo" ] \
            || { echo "::error::Unexpected PR checkout location."; exit 1; }
          case "$REBASE_REPO/" in
            "$RUNNER_TEMP/"*) ;;
            *) echo "::error::REBASE_REPO must be inside RUNNER_TEMP."; exit 1 ;;
          esac
          [ ! -e "$REBASE_REPO" ] \
            || { echo "::error::Isolated rebase destination already exists."; exit 1; }
          mv -- "$source_repo" "$REBASE_REPO"
          git -C "$REBASE_REPO" rev-parse --is-inside-work-tree >/dev/null

      # GitHub Actions has no dynamic loop for action steps. These YAML
      # aliases expand to 500 real, sequential composite-action invocations
      # while keeping the checked-in control plane reviewable. The composite
      # action owns the one-based counter and stops later aliases after success.
      # Keep the explicit + aliased invocation count protected by the routing
      # contract whenever this chain changes.
      - name: Resolve replay conflicts (round 1 of up to 500)
        if: steps.context.outputs.skip == 'false' && steps.start.outputs.complete != 'true'
        uses: &thingtime_rebase_conflict_round_action ./trusted/.github/actions/rebase-conflict-round
        with: &thingtime_rebase_conflict_round_inputs
          backend: ${{ vars.LOPU_AGENT_BACKEND || vars.LOPU_REVIEW_BACKEND || 'claude' }}
          repo-path: ${{ env.REBASE_REPO }}
          pr-number: ${{ env.PR_NUMBER }}
          base-ref: ${{ steps.context.outputs.base_ref }}
          head-ref: ${{ steps.context.outputs.head_ref }}
          run-url: ${{ env.RUN_URL }}
          conflict-policy: pr-rebase
          allow-unresolved: "true"
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude-code-oauth-token-preferred: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_THINGTIME }}
          anthropic-api-key-fallback: ${{ secrets.ANTHROPIC_API_KEY_FALLBACK }}
          claude-code-oauth-token-fallback: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          thingtime-ci-router-secret: ${{ secrets.THINGTIME_CI_ROUTER_SECRET }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          model-args: ${{ steps.models.outputs.model_args }}
          codex-model: ${{ vars.LOPU_CODEX_MODEL || 'gpt-5.6-terra' }}
          codex-reasoning-effort: ${{ vars.LOPU_CODEX_REASONING_EFFORT || 'xhigh' }}

      - &thingtime_rebase_conflict_retry
        name: Continue replay conflict resolution (up to round 500)
        if: steps.context.outputs.skip == 'false' && steps.start.outputs.complete != 'true' && env.THINGTIME_AI_REBASE_COMPLETE != 'true' && success()
