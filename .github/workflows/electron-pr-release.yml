name: Thingtime Electron PR Release

# This is the trusted implementation. Product branches only carry a tiny
# pull_request_target/workflow_dispatch caller, which invokes this file at the
# protected github-actions ref. The implementation resolves the current PR
# through GitHub's API and checks out its immutable head SHA only after the
# caller and source have passed the release gate.
on:
  workflow_call:
    inputs:
      release_kind:
        description: Protected main release or approved PR release
        required: false
        default: pr
        type: string
      pr_number:
        description: Existing same-repository PR number to sign and publish
        required: false
        default: ""
        type: string
      triggering_event:
        description: Trusted caller event type
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR number to sign and publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: electron-release-${{ inputs.release_kind || 'pr' }}-${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish approved PR release
    # Publication always requires an owner-controlled same-repository PR and
    # maintainer label. A complete Developer ID/notarization secret set yields
    # the trusted lane; an entirely absent set yields a clearly labelled,
    # manually approved UNSIGNED lane. Partial configuration fails closed.
    # Reusable workflows retain the caller's event_name; it is never
    # "workflow_call" for a push/PR/dispatch listener.
    if: >-
      github.repository == 'lopugit/thingtime' && (
        (inputs.release_kind == 'main' && (
          (github.event_name == 'push' && github.ref_name == 'main') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.ref_name == 'github-actions' || github.ref_name == 'main') &&
            github.actor == github.repository_owner))) ||
        (inputs.release_kind != 'main' && (
          (github.event_name == 'workflow_dispatch' &&
            (github.ref_name == 'github-actions' || github.ref_name == 'develop' || github.ref_name == 'main') &&
            github.actor == github.repository_owner) ||
          (github.event_name == 'pull_request_target' &&
            (github.ref_name == 'develop' || github.ref_name == 'main') &&
            inputs.triggering_event == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.author_association == 'OWNER' &&
            contains(github.event.pull_request.labels.*.name, 'desktop-release'))))
      )
    runs-on: macos-latest
    steps:
      - name: Resolve and validate PR source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          TRIGGERING_EVENT: ${{ inputs.triggering_event || github.event_name }}
          RELEASE_KIND: ${{ inputs.release_kind || 'pr' }}
          CALL_MODE: ${{ github.event_name }}
          CONTROL_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "lopugit/thingtime"
          if [ "${RELEASE_KIND}" = main ]; then
            case "${CALL_MODE}:${CONTROL_REF}" in
              push:main) head_sha="${GITHUB_SHA}" ;;
              workflow_dispatch:github-actions|workflow_dispatch:main)
                test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
                head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                ;;
              *) echo "::error::Main releases require a main push or owner dispatch."; exit 1 ;;
            esac
            [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
            {
              echo "head_ref=main"
              echo "head_sha=${head_sha}"
              echo "pr_number="
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${RELEASE_KIND}" = pr
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "::error::A numeric PR number is required."; exit 1 ;;
          esac
          test "${TRIGGERING_EVENT}" = "${CALL_MODE}"
          case "${TRIGGERING_EVENT}" in
            pull_request_target|workflow_dispatch) ;;
            *) echo "::error::Unsupported release caller event: ${TRIGGERING_EVENT}"; exit 1 ;;
          esac
          case "${CALL_MODE}:${CONTROL_REF}" in
            workflow_dispatch:github-actions|workflow_dispatch:develop|workflow_dispatch:main|pull_request_target:develop|pull_request_target:main) ;;
            *) echo "::error::Release worker must run directly on github-actions or through a develop/main listener."; exit 1 ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repository="$(printf '%s' "${pr_json}" | jq -r '.head.repo.full_name // empty')"
          head_ref="$(printf '%s' "${pr_json}" | jq -r '.head.ref // empty')"
          head_sha="$(printf '%s' "${pr_json}" | jq -r '.head.sha // empty')"
          author_association="$(printf '%s' "${pr_json}" | jq -r '.author_association // empty')"
          test "${head_repository}" = "${GITHUB_REPOSITORY}"
          test -n "${head_ref}"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]

          if [ "${TRIGGERING_EVENT}" = "pull_request_target" ]; then
            test "${author_association}" = "OWNER"
            printf '%s' "${pr_json}" | jq -e '[.labels[].name] | index("desktop-release")' >/dev/null
          else
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out approved PR commit
        uses: actions/checkout@v4
        with:
          # The immutable SHA was resolved above. Do not persist a write token
          # into the untrusted source checkout; publishing gets a short-lived
          # GH_TOKEN only in the final release step.
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.source.outputs.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install release dependencies
        run: |
          set -euo pipefail
          corepack pnpm --dir remix install --frozen-lockfile
          # MCP is deliberately npm-managed and commits package-lock.json rather
          # than a pnpm lockfile. Keep this deterministic so PR release builds
          # cannot fail before their unsigned source checks or signing gate.
          npm ci --prefix MCP
          corepack pnpm --dir electron install --frozen-lockfile

      - name: Test unsigned source before accessing signing credentials
        run: |
          set -euo pipefail
          corepack pnpm --dir MCP run typecheck
          corepack pnpm --dir MCP test
          corepack pnpm --dir MCP run build:desktop
          swift test --package-path macos/ThingtimeNode
          swift build --package-path macos/ThingtimeNode --configuration release --product ThingtimeNode
          swift build --package-path macos/ThingtimeNode --configuration release --product ThingtimeNodeBridge
          swift test --package-path macos/ThingtimeRecovery
          swift build --package-path macos/ThingtimeRecovery --configuration release --product ThingtimeRecovery
          swift build --package-path macos/ThingtimeRecovery --configuration release --product ThingtimeRecoveryInstaller
          corepack pnpm --dir electron test

      - name: Select release distribution
        id: distribution
        shell: bash
        # This static control-plane step sees secrets only after the immutable
        # PR source has completed its checks. It exports no secret material.
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Reuse the approved Apple API key already held by the iOS CI lane
          # only when macOS signing was deliberately configured. An unrelated
          # iOS setup must not disable the explicit unsigned fallback.
          if [ -n "${MAC_CSC_LINK}${MAC_CSC_KEY_PASSWORD}${APPLE_TEAM_ID}" ]; then
            APPLE_API_KEY_BASE64="${APPLE_API_KEY_BASE64:-${ASC_KEY_CONTENT}}"
            APPLE_API_KEY_ID="${APPLE_API_KEY_ID:-${ASC_KEY_ID}}"
            APPLE_API_ISSUER="${APPLE_API_ISSUER:-${ASC_ISSUER_ID}}"
          fi
          values=(
            "${MAC_CSC_LINK}"
            "${MAC_CSC_KEY_PASSWORD}"
            "${APPLE_API_KEY_BASE64}"
            "${APPLE_API_KEY_ID}"
            "${APPLE_API_ISSUER}"
            "${APPLE_TEAM_ID}"
          )
          populated=0
          for value in "${values[@]}"; do
            if [ -n "${value}" ]; then populated=$((populated + 1)); fi
          done
          case "${populated}" in
            0) distribution="unsigned" ;;
            6) distribution="signed" ;;
            *) echo "::error::Incomplete signing configuration: configure all six credentials or none for the temporary UNSIGNED lane."; exit 1 ;;
          esac
          echo "distribution=${distribution}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Publishing ${distribution} PR release artifacts."

      - name: Derive SemVer PR release identity
        id: version
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.release_kind || 'pr' }}
          DISTRIBUTION: ${{ steps.distribution.outputs.distribution }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          PR_REF: ${{ steps.source.outputs.head_ref }}
          PR_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./electron/package.json').version")"
          branch_slug="$(printf '%s' "${PR_REF}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z]+/-/g; s/^-+//; s/-+$//')"
          branch_slug="${branch_slug:0:48}"
          test -n "${branch_slug}"
          short_sha="${PR_SHA:0:12}"
          if [ "${RELEASE_KIND}" = main ]; then
            release_version="${base_version}+build.${GITHUB_RUN_NUMBER}.g${short_sha}"
          else
            release_version="${base_version}-pr.${PR_NUMBER}.${branch_slug}.g${short_sha}"
          fi
          release_title="Thingtime Desktop ${release_version}"
          if [ "${DISTRIBUTION}" = "unsigned" ]; then
            release_version="${release_version}.unsigned"
            release_title="Thingtime Desktop UNSIGNED ${release_version}"
          fi
          release_tag="electron-v${release_version}"
          node -e 'const value = process.argv[1]; if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(value)) process.exit(1)' "${release_version}"

          {
            echo "THINGTIME_ELECTRON_BUILD_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "THINGTIME_ELECTRON_BASE_VERSION=${base_version}"
            echo "THINGTIME_ELECTRON_RELEASE_DISTRIBUTION=${DISTRIBUTION}"
            echo "THINGTIME_ELECTRON_RELEASE_VERSION=${release_version}"
            echo "THINGTIME_ELECTRON_RELEASE_TAG=${release_tag}"
            echo "THINGTIME_ELECTRON_RELEASE_TITLE=${release_title}"
          } >> "${GITHUB_ENV}"
          {
            echo "release_version=${release_version}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stop if this release already exists
        id: existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # API/auth failures must fail this step, not masquerade as absence.
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          if printf '%s\n' "${tags}" | grep -Fxq -- "${THINGTIME_ELECTRON_RELEASE_TAG}"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${THINGTIME_ELECTRON_RELEASE_TAG} already exists; skipping duplicate publication."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Import Developer ID and notarization credentials
        if: steps.existing_release.outputs.exists != 'true' && steps.distribution.outputs.distribution == 'signed'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 || secrets.ASC_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${MAC_CSC_LINK:?MAC_CSC_LINK is required}"
          : "${MAC_CSC_KEY_PASSWORD:?MAC_CSC_KEY_PASSWORD is required}"
          : "${APPLE_API_KEY_BASE64:?APPLE_API_KEY_BASE64 is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          keychain_path="${RUNNER_TEMP}/thingtime-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/thingtime-developer-id.p12"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "${MAC_CSC_LINK}" | /usr/bin/base64 -D > "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_BASE64}" | /usr/bin/base64 -D > "${api_key_path}"
          chmod 600 "${certificate_path}" "${api_key_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${MAC_CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          identity="$(security find-identity -v -p codesigning "${keychain_path}" | sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -n 1)"
          test -n "${identity}"
          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "CSC_NAME=${identity}"
            echo "THINGTIME_ELECTRON_SIGNING_IDENTITY=${identity}"
            echo "APPLE_API_KEY=${api_key_path}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "${GITHUB_ENV}"

      - name: Build signed and notarized Electron release
        if: steps.existing_release.outputs.exists != 'true' && steps.distribution.outputs.distribution == 'signed'
        run: |
          set -euo pipefail
          corepack pnpm --dir electron run dist
          THINGTIME_RECOVERY_SIGNING_IDENTITY="${THINGTIME_ELECTRON_SIGNING_IDENTITY}" \
          THINGTIME_RECOVERY_VERSION="${THINGTIME_ELECTRON_RELEASE_VERSION}" \
          THINGTIME_RECOVERY_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          macos/ThingtimeRecovery/script/build-production-release.sh

      - name: Build unsigned Electron release
        if: steps.existing_release.outputs.exists != 'true' && steps.distribution.outputs.distribution == 'unsigned'
        run: |
          set -euo pipefail
          corepack pnpm --dir electron run dist:unsigned
          THINGTIME_RECOVERY_VERSION="${THINGTIME_ELECTRON_RELEASE_VERSION}" \
          THINGTIME_RECOVERY_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          macos/ThingtimeRecovery/script/build-unsigned-release.sh

      - name: Collect updater-compatible release assets
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          raw_assets=(electron/release/*.dmg electron/release/*.zip electron/release/*.pkg)
          zip_assets=(electron/release/*.zip)
          if [ "${THINGTIME_ELECTRON_RELEASE_DISTRIBUTION}" = "unsigned" ]; then
            desktop_prefix="Thingtime-Electron-App-UNSIGNED-Release"
            recovery_assets=(macos/ThingtimeRecovery/release/Thingtime-Recovery-App-UNSIGNED-Release-*.zip)
          else
            desktop_prefix="Thingtime-Electron-App-Release"
            recovery_assets=(macos/ThingtimeRecovery/release/Thingtime-Recovery-App-Release-*.zip)
          fi
          test "${#raw_assets[@]}" -gt 0
          test "${#zip_assets[@]}" -gt 0
          test "${#recovery_assets[@]}" -eq 1
          asset_dir="electron/release-upload"
          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"
          index=0
          for asset in "${raw_assets[@]}"; do
            ext="${asset##*.}"
            destination="${asset_dir}/${desktop_prefix}-${THINGTIME_ELECTRON_RELEASE_VERSION}-macos-$(uname -m)-${index}.${ext}"
            cp "${asset}" "${destination}"
            index=$((index + 1))
          done
          cp "${recovery_assets[0]}" "${asset_dir}/$(basename "${recovery_assets[0]}")"

      - name: Generate PR release notes
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.release_kind || 'pr' }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          PR_REF: ${{ steps.source.outputs.head_ref }}
          PR_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            if [ "${THINGTIME_ELECTRON_RELEASE_DISTRIBUTION}" = "unsigned" ]; then
              echo "## ⚠️ UNSIGNED Thingtime Desktop release"
            else
              echo "## Signed Thingtime Desktop release"
            fi
            echo
            echo "- Version: \`${THINGTIME_ELECTRON_RELEASE_VERSION}\`"
            if [ -n "${PR_NUMBER}" ]; then echo "- Pull request: #${PR_NUMBER}"; fi
            echo "- Branch: \`${PR_REF}\`"
            echo "- Commit: \`${PR_SHA}\`"
            if [ "${THINGTIME_ELECTRON_RELEASE_DISTRIBUTION}" = "unsigned" ]; then
              echo "- Trust: **UNSIGNED**. These apps have no Developer ID certificate and are not notarized. They use ad-hoc code signatures only so nested macOS processes can run."
              echo "- First launch: macOS may block the app. Open it deliberately, then use System Settings → Privacy & Security → Open Anyway when macOS offers it."
              echo "- Recovery: releases ending in \`.unsigned\` appear with an UNSIGNED badge. After explicit acknowledgement, Thingtime Recovery can cache, launch, and atomically install them; they are never presented as verified updates."
            else
              echo "- Desktop update asset: the attached Thingtime macOS ZIP is verified, cached, launchable, and installable by Thingtime's recovery updater."
              echo "- Recovery asset: the attached Thingtime Recovery ZIP is a separately signed, notarized native app which can update itself and restore cached desktop versions."
            fi
          } > electron-release-notes.md

      - name: Publish prerelease
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.source.outputs.head_sha }}
          RELEASE_KIND: ${{ inputs.release_kind || 'pr' }}
        run: |
          set -euo pipefail
          publication_flags=(--latest=false)
          if [ "${RELEASE_KIND}" != main ] || [ "${THINGTIME_ELECTRON_RELEASE_DISTRIBUTION}" = unsigned ]; then
            publication_flags+=(--prerelease)
          else
            publication_flags=(--latest)
          fi
          gh release create "${THINGTIME_ELECTRON_RELEASE_TAG}" electron/release-upload/* \
            --target "${PR_SHA}" \
            --title "${THINGTIME_ELECTRON_RELEASE_TITLE}" \
            --notes-file electron-release-notes.md \
            "${publication_flags[@]}"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/thingtime-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/thingtime-developer-id.p12" "${RUNNER_TEMP}"/AuthKey_*.p8
