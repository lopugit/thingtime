# Keep develop in sync with main.
#
# When the public Lopu manager receives a main push (or an explicit owner
# maintenance request), merge main into develop:
# - Clean merge → pushed straight to develop, no ceremony.
# - Conflicts or workflow-scope push refusal → a standing PR is opened from the
#   automation-owned `sync/main-into-develop` branch. The branch is updated
#   from an immutable, revalidated candidate and may be rewritten only with an
#   exact force-with-lease. A clean candidate is merged immediately; otherwise
#   Lopu safely merges `develop` into that head, resolves it, and the resolver
#   merges the exact verified PR without ever mutating protected `main`.
#
# Token notes (same trade-off documented in resolve-pr-conflicts.yml):
# - GITHUB_TOKEN pushes are rejected whenever the merge brings ANY change
#   under .github/workflows/. When that happens we fall back to the PR path
#   rather than failing the run. An optional SYNC_BRANCHES_PAT (repo +
#   workflow scope) makes those pushes work too — CONFLICT_RESOLVER_PAT is
#   honoured as a fallback since it already carries the right scopes.
# - Pushes made with GITHUB_TOKEN do not retrigger workflows; with a PAT the
#   merge commit runs CI on develop as usual.
# - The fallback sync PR is opened with the same PAT chain, never GITHUB_TOKEN:
#   PRs created by GITHUB_TOKEN cannot trigger workflows either, so they would
#   sit open with no CI checks. The step fails loudly when neither PAT secret
#   exists rather than degrading to a checkless PR.

name: Lopu internal main/develop synchronization

on:
  workflow_call:
    inputs:
      execution_provider:
        description: "Internal: hosted compute selected by Thingtime CI Control"
        required: false
        default: "github-actions"
        type: string
      runner_label:
        description: "Internal: unique Vercel Sandbox self-hosted runner label"
        required: false
        default: ""
        type: string
      control_dispatch_id:
        description: "Internal: Thingtime ci-dispatch id used for cross-run observability"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-into-develop
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/ci-provider-router.yml
    with:
      workflow: sync-main
      execution_provider: ${{ inputs.execution_provider || 'github-actions' }}
      runner_label: ${{ inputs.runner_label || '' }}
      control_dispatch_id: ${{ inputs.control_dispatch_id || '' }}
    secrets: inherit

  sync:
    needs: route
    if: needs.route.outputs.execute == 'true'
    runs-on: ${{ needs.route.outputs.runner_label || 'ubuntu-latest' }}
    steps:
      - name: Check develop exists
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/develop" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No develop branch — nothing to sync."
          fi

      - name: Checkout develop
        if: steps.develop.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.SYNC_BRANCHES_PAT || secrets.CONFLICT_RESOLVER_PAT || github.token }}

      - name: Merge main into develop
        if: steps.develop.outputs.exists == 'true'
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop
          main_sha="$(git rev-parse 'origin/main^{commit}')"
          develop_sha="$(git rev-parse 'origin/develop^{commit}')"
          [ "$(git rev-parse 'HEAD^{commit}')" = "$develop_sha" ] || {
            echo "::error::The checked-out develop branch moved before synchronization."
            exit 1
          }

          # Graphify snapshots are content-addressed per source fingerprint, so
          # each side of a sync carries a differently named tree and the merge
          # unions them instead of conflicting. Both sides were individually
          # bounded when they were built, but nothing re-applies the bound to
          # the merge result, so develop drifts one ~45MB snapshot past
          # retention per distinct branch graph it absorbs. Re-apply it here,
          # before the candidate SHA is published, using the protected
          # control-plane router: product-branch code must never execute in
          # this credentialed job.
          bound_graphify_snapshots() {
            local helper="$RUNNER_TEMP/graphify-cas.mjs"
            # No --depth here: this checkout is unshallow, and a shallow fetch
            # would set a shallow boundary that can break the develop push.
            git fetch --no-tags origin \
              +refs/heads/github-actions:refs/remotes/origin/github-actions || return 1
            git show origin/github-actions:.github/scripts/graphify-cas.mjs \
              >"$helper" || return 1
            node "$helper" prune || return 1
            # Scope staging to the immutable snapshot trees; the router's
            # ignored root aliases and lock/work state stay out of the commit.
            if git diff --quiet -- graphify-out/snapshots; then
              return 0
            fi
            # -u, not -A: prune only ever deletes already-tracked files, so
            # restricting staging to tracked paths is exactly the operation.
            # It also has to be -u. A branch carrying the broad
            # `graphify-out/snapshots/` ignore rule that
            # stage-graphify-snapshots.mjs force-adds around makes `git add -A`
            # exit 1 on the ignored pathspec, which would fail-soft this whole
            # helper and silently skip the prune it exists to apply. Plain
            # --force would clear that error but start tracking the very files
            # the ignore rules exclude on purpose — the derived ~27MB
            # snapshots/**/graph.html and .staging-* scratch. -u sidesteps
            # both: it never considers an untracked path at all.
            git add -u -- graphify-out/snapshots || return 1
            git commit -qm "chore(graphify): bound snapshot retention after main sync" || return 1
          }

          if git merge --no-edit origin/main; then
            if ! bound_graphify_snapshots; then
              echo "::warning::Could not re-apply the Graphify snapshot retention bound; syncing the merge unpruned."
            fi
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$main_sha" >> "$GITHUB_OUTPUT"
            echo "::notice::main → develop has conflicts; opening a PR instead."
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"

      - name: Push develop
        if: steps.merge.outputs.result == 'clean'
        id: push
        run: |
          if git push origin develop; then
            echo "result=pushed" >> "$GITHUB_OUTPUT"
            echo "Merged main into develop cleanly." >> "$GITHUB_STEP_SUMMARY"
          else
            # Most likely: GITHUB_TOKEN refused because the merge touches
            # .github/workflows/**. Hand the merge to a PR instead of failing.
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::Push to develop was refused (workflow-file changes need a PAT); falling back to a PR."
          fi

      - name: Open or refresh the safe sync PR
        id: sync_pr
        if: steps.merge.outputs.result == 'conflict' || steps.push.outputs.result == 'blocked'
        env:
          GH_TOKEN: ${{ secrets.SYNC_BRANCHES_PAT || secrets.CONFLICT_RESOLVER_PAT }}
          SYNC_BRANCH: sync/main-into-develop
          CANDIDATE_SHA: ${{ steps.merge.outputs.candidate_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          EXPECTED_DEVELOP_SHA: ${{ steps.merge.outputs.develop_sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Opening the sync PR needs SYNC_BRANCHES_PAT or CONFLICT_RESOLVER_PAT — a PR created by GITHUB_TOKEN would run no CI."
            exit 1
          fi

          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid synchronization candidate SHA."
            exit 1
          }
          branch_refs="$(git ls-remote --heads origin refs/heads/main refs/heads/develop)"
          live_main_sha="$(printf '%s\n' "$branch_refs" | awk '$2 == "refs/heads/main" {print $1}')"
          live_develop_sha="$(printf '%s\n' "$branch_refs" | awk '$2 == "refs/heads/develop" {print $1}')"
          [ "$live_main_sha" = "$EXPECTED_MAIN_SHA" ] \
            && [ "$live_develop_sha" = "$EXPECTED_DEVELOP_SHA" ] || {
              echo "::error::main or develop moved before the safe sync branch publication."
              exit 1
            }

          remote_sha="$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | awk 'NR == 1 {print $1}')"
          if [ -n "$remote_sha" ]; then
            git fetch --no-tags origin \
              "refs/heads/$SYNC_BRANCH:refs/remotes/origin/lopu-main-develop-sync"
            [ "$(git rev-parse 'refs/remotes/origin/lopu-main-develop-sync^{commit}')" = "$remote_sha" ] || {
              echo "::error::$SYNC_BRANCH moved while its safe update was being prepared."
              exit 1
            }

            if git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$remote_sha"; then
              CANDIDATE_SHA="$remote_sha"
              echo "::notice::$SYNC_BRANCH already contains the current main; preserving Lopu's existing resolution."
            else
              git push origin "$CANDIDATE_SHA:refs/heads/$SYNC_BRANCH" \
                --force-with-lease="refs/heads/$SYNC_BRANCH:$remote_sha"
            fi
          else
            git push origin "$CANDIDATE_SHA:refs/heads/$SYNC_BRANCH"
          fi

          # Keep lookup and creation on the REST API. `gh pr` uses GraphQL,
          # where a transient gateway error can arrive after GitHub has already
          # committed the mutation. Always verify the desired postcondition
          # after an error so a created PR does not leave this run false-red.
          find_sync_pr() {
            local attempt existing
            for attempt in 1 2 3 4; do
              if existing=$(gh api --method GET "repos/${{ github.repository }}/pulls" \
                -f state=open \
                -f base=develop \
                -f head="${{ github.repository_owner }}:$SYNC_BRANCH" \
                --jq '.[0].number // empty'); then
                printf '%s' "$existing"
                return 0
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          existing=""
          if ! existing=$(find_sync_pr); then
            echo "::warning::Could not query the standing sync PR after bounded retries; attempting the idempotent create path."
          fi
          if [ -n "$existing" ]; then
            echo "Safe sync PR #$existing is already open and now points at candidate $CANDIDATE_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            sync_pr_body="Automated sync opened by **Lopu PR manager** because main could not be merged into develop directly (merge conflicts, or workflow-file push scope). The automation-owned \`$SYNC_BRANCH\` head carries the exact fenced candidate. Clean candidates merge immediately; when conflicts exist, Lopu merges \`develop\` into the head, resolves and verifies them, rebuilds Graphify, and merges the exact published PR without mutating \`main\`."
            for attempt in 1 2 3; do
              created=""
              if created=$(gh api --method POST "repos/${{ github.repository }}/pulls" \
                -f base=develop \
                -f head="$SYNC_BRANCH" \
                -f title="Sync main into develop" \
                -f body="$sync_pr_body" \
                --jq '.number'); then
                existing="$created"
                echo "Opened safe sync PR #$existing ($SYNC_BRANCH → develop)." >> "$GITHUB_STEP_SUMMARY"
                break
              fi

              echo "::warning::Sync PR creation attempt $attempt failed; checking whether GitHub committed it despite the API error."
              existing=""
              if existing=$(find_sync_pr) && [ -n "$existing" ]; then
                echo "Safe sync PR #$existing exists after a transient create error." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 3))
              fi
            done
          fi

          [ -n "$existing" ] || {
            echo "::error::Could not open or find the safe main → develop sync PR after bounded retries."
            exit 1
          }
          {
            echo "pr_number=$existing"
            echo "head_sha=$CANDIDATE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the trusted sync merger
        if: steps.sync_pr.outputs.pr_number != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: github-actions
          path: workflow-control
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts/merge-main-develop-sync-pr.mjs
          sparse-checkout-cone-mode: false

      - name: Merge the standing sync PR when ready
        if: steps.sync_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_BRANCHES_PAT || secrets.CONFLICT_RESOLVER_PAT }}
          REPO: ${{ github.repository }}
          SYNC_PR_NUMBER: ${{ steps.sync_pr.outputs.pr_number }}
          EXPECTED_SYNC_HEAD_SHA: ${{ steps.sync_pr.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          EXPECTED_DEVELOP_SHA: ${{ steps.merge.outputs.develop_sha }}
        run: node workflow-control/.github/scripts/merge-main-develop-sync-pr.mjs
