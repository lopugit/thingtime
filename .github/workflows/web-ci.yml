name: Web CI

# One workflow for the remix/ web app (TODO 15 DX ratchet), consolidated from
# PRs #119 / #121 / #123 / #126:
#   build      — Vite client build + typecheck ratchet + node --test unit suites
#   api-tests  — the same suite as the interactive /tests page, run headlessly
#                against a real dev stack (Vite + Nitro) and a real MongoDB —
#                no mocks, per FUNDAMENTALS.md (seed and test via the real API).
# The pull-request listener is deliberately path-filter-free: required checks
# from a filtered-out workflow remain pending forever. A scope job gives the
# stable required-context names to either the full jobs or lightweight
# companions, so non-Remix PRs remain mergeable without masking real failures.

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
    paths:
      - remix/**
      - .github/workflows/web-ci.yml
  workflow_dispatch:

# CI only reads the repo — never grant the default write token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two questions decide whether the full suite applies, and both must be asked.
  #
  # First, is there a web app in this tree at all? The control plane carries
  # only `.github/**`, so a branch (or a PR stacked on one) legitimately has no
  # `remix/`, and the suite below would fail in seconds against nothing. Branch
  # names are the wrong signal — deleting `remix/**` still matches the path
  # filter, and a stacked PR's base is the branch it is stacked on, not the
  # control plane. Asking the tree works for every topology.
  #
  # Second, does this pull request touch the web app? The listener above is
  # deliberately path-filter-free, so a PR that changes nothing under `remix/`
  # still starts this workflow; it gets the lightweight required-context
  # companions instead of the full suite.
  #
  # Either answer being "no" means `full_web_ci=false`, which hands the stable
  # required-context names to the companions rather than leaving them pending.
  scope:
    name: Classify Web CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full_web_ci: ${{ steps.scope.outputs.full_web_ci }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect the web app
        id: detect
        run: |
          set -euo pipefail
          if [ -f remix/package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "This tree has no remix/ app; the web suite does not apply."
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect pull-request paths
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_APP: ${{ steps.detect.outputs.has_app }}
        with:
          script: |
            if (process.env.HAS_APP !== 'true') {
              core.setOutput('full_web_ci', 'false');
              core.info(
                'This tree has no remix/ app: the required-context companions ' +
                'stand in for the full Web CI suite.'
              );
              return;
            }

            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setOutput('full_web_ci', 'true');
              core.info('Non-pull-request event: running the full Web CI suite.');
              return;
            }

            const expectedChangedFiles = Number(pullRequest.changed_files ?? 0);
            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
            } catch (error) {
              const status = error?.status ? ` (${error.status})` : '';
              core.warning(
                `Could not inspect pull-request files${status}; running the full Web CI suite.`
              );
              core.setOutput('full_web_ci', 'true');
              return;
            }
            const truncated = expectedChangedFiles > files.length;
            const touchesWebCi = files.some(({ filename }) =>
              filename.startsWith('remix/') ||
              filename === '.github/workflows/web-ci.yml'
            );
            // GitHub caps this endpoint at 3,000 files. If the list is ever
            // incomplete, spend the CI time rather than incorrectly no-op.
            const fullWebCi = truncated || touchesWebCi;
            core.setOutput('full_web_ci', String(fullWebCi));
            core.info(
              `Web CI scope: ${fullWebCi ? 'full suite' : 'required-context companions'}; ` +
              `${files.length}/${expectedChangedFiles} changed files inspected` +
              `${truncated ? ' (API result truncated; failing safe)' : ''}.`
            );

  build:
    needs: scope
    if: needs.scope.outputs.full_web_ci == 'true'
    # This label is a ruleset API identifier. Keep it stable even when the
    # checked-out product branch makes the ratchet implementation warning-only.
    name: ${{ needs.scope.outputs.full_web_ci == 'true' && 'Build + typecheck ratchet + unit tests' || 'Full Web CI build (not needed)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remix
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: remix/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: remix/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client shell
        run: pnpm run build:client

      # Fails only when the tsc error count grows past
      # scripts/typecheck-baseline.json; shrinking the count is celebrated and
      # locked in with --update-baseline.
      - name: Typecheck ratchet
        run: pnpm run typecheck:ratchet

      - name: Unit tests
        run: pnpm run test:unit

  api-tests:
    needs: scope
    if: needs.scope.outputs.full_web_ci == 'true'
    name: ${{ needs.scope.outputs.full_web_ci == 'true' && 'API suite (headless /tests runner)' || 'Full Web CI API suite (not needed)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remix
    env:
      MONGODB_CONNECTION_STRING: mongodb://127.0.0.1:27017/
      # CI-only HS256 secret; the suite never needs the production ES256 keys
      JWT_SECRET: ci-only-api-tests-secret
      TT_WEB_PORT: '9999'
      TT_HMR_PORT: '9998'
      TT_API_PORT: '10000'
    steps:
      - uses: actions/checkout@v4

      # Storage-accounted writes (registration's subscription-ledger seed, app
      # data, content mutations) run inside real MongoDB transactions, which a
      # STANDALONE mongod rejects with IllegalOperation ("Transaction numbers
      # are only allowed on a replica set member or mongos") — by design there
      # is no non-transactional fallback (see withMongoTransaction). A GitHub
      # `services:` container cannot pass mongod arguments, so start the
      # container directly as a single-node replica set. The member host must
      # be 127.0.0.1 explicitly: a bare rs.initiate() would advertise the
      # container hostname, which the runner-side driver cannot resolve when
      # it follows replica-set discovery.
      - name: Start MongoDB (single-node replica set — transactions need one)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ]; then
              echo "replica set primary ready"; exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary in time"; exit 1

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: remix/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: remix/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start dev stack
        run: |
          nohup npm run dev > /tmp/tt-dev.log 2>&1 &
          echo "started dev stack"

      - name: Wait for the API to come up
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${TT_WEB_PORT}/api/v1/mongodb/status" > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not come up in time"; tail -100 /tmp/tt-dev.log; exit 1

      - name: Run API test suite
        run: pnpm exec tsx scripts/run-api-tests.mts --base "http://127.0.0.1:${TT_WEB_PORT}"

      - name: Dev stack logs on failure
        if: failure()
        run: tail -200 /tmp/tt-dev.log

  required-build-context:
    needs: scope
    if: needs.scope.outputs.full_web_ci == 'false'
    name: ${{ needs.scope.outputs.full_web_ci == 'false' && 'Build + typecheck ratchet + unit tests' || 'Build required-context companion (not needed)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the non-Remix build context
        run: echo "No Remix or Web CI workflow changes; the full build is not required."

  required-api-context:
    needs: scope
    if: needs.scope.outputs.full_web_ci == 'false'
    name: ${{ needs.scope.outputs.full_web_ci == 'false' && 'API suite (headless /tests runner)' || 'API required-context companion (not needed)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the non-Remix API context
        run: echo "No Remix or Web CI workflow changes; the full API suite is not required."
