name: Web CI

# Build + test the remix/ web app: unit suites (node --test), the Vite client
# build, and the full 241-test API suite run headlessly against a real
# Nitro + Mongo stack via scripts/run-api-tests.mjs — the same definitions the
# interactive /tests page runs, so the page and CI can never drift.

on:
  push:
    branches: [main]
    paths:
      - remix/**
      - .github/workflows/web-ci.yml
  pull_request:
    paths:
      - remix/**
      - .github/workflows/web-ci.yml
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_CONNECTION_STRING: mongodb://127.0.0.1:27017
      # deterministic CI ports (worktree-ports respects TT_* overrides)
      TT_WEB_PORT: '9999'
      TT_HMR_PORT: '9998'
      TT_API_PORT: '10000'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        working-directory: remix
        run: pnpm install --frozen-lockfile

      # informational until the 121-error baseline is burned down — the
      # ratchet is: fix a file, then it stays fixed
      - name: Typecheck (non-blocking baseline)
        working-directory: remix
        continue-on-error: true
        run: pnpm run typecheck

      - name: Unit tests
        working-directory: remix
        run: pnpm run test:unit

      - name: Build client
        working-directory: remix
        run: pnpm run build:client

      - name: Start dev stack
        working-directory: remix
        run: |
          nohup npm run dev > /tmp/tt-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9999/ > /dev/null && curl -sf http://127.0.0.1:10000/api/v1/mongodb/status > /dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 2
          done
          echo "dev stack failed to start"; tail -50 /tmp/tt-dev.log; exit 1

      - name: API tests (headless /tests suite)
        working-directory: remix
        run: node scripts/run-api-tests.mjs --base http://127.0.0.1:9999

      - name: Dev stack logs on failure
        if: failure()
        run: tail -100 /tmp/tt-dev.log || true
