# REVIEW DRAFT: do not install or trigger before exact helper/workflow review.
name: Inert native lifecycle platform experiment
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: inert-native-lifecycle-${{ github.event.number }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'lopugit/thingtime' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.sender.login == 'lopugit' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'github-actions' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/oauth-native-authority-lifecycle' &&
      github.event.label.name == format('native-lifecycle-{0}', github.event.pull_request.head.sha)
    runs-on: macos-15
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [normal, parent-loss]
    env:
      EXPERIMENT_HELPER_SHA: 84a6338f87082b61ef665ccea6748fa9fc29697a
    steps:
      - name: Acquire only independently reviewed inert helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 84a6338f87082b61ef665ccea6748fa9fc29697a
          persist-credentials: false
          path: inert-helper
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/native-lifecycle-experiment.py
      - name: Bind owner label, current head, executed workflow bytes and helper
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REVIEW_ACTOR: ${{ github.event.sender.login }}
          REVIEW_LABEL: ${{ github.event.label.name }}
          SOURCE_PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess
          def api(path):
              return json.loads(subprocess.run(['gh', 'api', path], check=True, capture_output=True).stdout)
          helper, head, workflow = (os.environ[key] for key in ('EXPERIMENT_HELPER_SHA', 'REVIEWED_HEAD', 'WORKFLOW_SHA'))
          assert all(re.fullmatch('[0-9a-f]{40}', value) for value in (helper, head, workflow))
          assert os.environ['REVIEW_ACTOR'] == 'lopugit'
          assert os.environ['REVIEW_LABEL'] == 'native-lifecycle-' + head
          pr = os.environ['SOURCE_PR']
          assert re.fullmatch('[1-9][0-9]*', pr)
          current = api('repos/lopugit/thingtime/pulls/' + pr)
          assert current['state'] == 'open' and current['head']['sha'] == head
          assert current['head']['repo']['full_name'] == 'lopugit/thingtime'
          assert current['base']['ref'] == 'github-actions'
          path = 'repos/lopugit/thingtime/contents/.github/workflows/native-lifecycle-experiment.yml?ref='
          reviewed_bytes = base64.b64decode(api(path + head)['content'])
          executed_bytes = base64.b64decode(api(path + workflow)['content'])
          assert reviewed_bytes == executed_bytes
          actual = subprocess.run(['git', '-C', 'inert-helper', 'rev-parse', 'HEAD'], check=True, capture_output=True).stdout.decode().strip()
          assert actual == helper
          script = pathlib.Path('inert-helper/.github/scripts/native-lifecycle-experiment.py')
          assert hashlib.sha256(script.read_bytes()).hexdigest() == 'd6b9168697f5e525355be1be93d99708f893617e601181add3cf95e8524d22de'
          provenance = {'helperSha': helper, 'reviewedHeadSha': head, 'workflowSha': workflow,
                        'actor': os.environ['REVIEW_ACTOR'], 'label': os.environ['REVIEW_LABEL'],
                        'workflowBytesEqual': True, 'candidateCheckout': False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'inert-admission.json').write_text(json.dumps(provenance))
          PY
      - name: Exercise only fixed inert task domains on disposable hosted guest
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/inert-helper/.github/scripts/native-lifecycle-experiment.py"
          report="$RUNNER_TEMP/inert-lifecycle-report"
          status=0
          sudo -n /usr/bin/env -i \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" RUNNER_TEMP="$RUNNER_TEMP" \
            SUDO_UID="$(id -u)" \
            /usr/bin/python3 -I -S "$helper" supervise "$CASE" "$report" \
            "$RUNNER_TEMP/inert-admission.json" || status=$?
          for ((attempt=0; attempt<160; attempt++)); do
            test ! -f "$report/result.json" || break
            sleep 1
          done
          if [[ "$CASE" == parent-loss ]]; then
            test "$status" = 75
          else
            test "$status" = 0
          fi
          /usr/bin/python3 -I -S - "$report/result.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result['result'] == 'inert-platform-observations-passed', result['result']
          assert result['candidateExecuted'] is False and result['policyChanged'] is False
          PY
      - name: Preserve only allowlisted inert observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inert-native-lifecycle-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/inert-lifecycle-report/provenance.json
            ${{ runner.temp }}/inert-lifecycle-report/fixture.json
            ${{ runner.temp }}/inert-lifecycle-report/result.json
          if-no-files-found: warn
          retention-days: 7
