name: Lopu CodeQL PR handoff

# Privileged metadata-only bridge for PRs targeting arbitrary branches. This
# is deliberately separate from codeql-analysis.yml: pull_request tokens are
# capped at actions:read, while this pull_request_target-only bridge needs
# actions:write solely to create the unprivileged workflow_dispatch analysis.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  handoff:
    name: Lopu queues an unprivileged PR scan
    if: github.event_name == 'pull_request_target' && vars.CODEQL_CENTRAL_PR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch the exact PR head through the default-branch listener
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || {
            echo "::error::Invalid PR number in the trusted event payload."
            exit 1
          }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]] || {
            echo "::error::Invalid PR head SHA in the trusted event payload."
            exit 1
          }
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]{1,255}$ ]] || {
            echo "::error::Invalid default branch in the trusted repository payload."
            exit 1
          }

          # The dispatch API itself is the only remaining failure mode here,
          # and it fails transiently: GitHub answers
          # POST /actions/workflows/{id}/dispatches with HTTP 500 under load.
          # A single attempt turns that outage into a permanent red check on
          # the PR, because nothing re-enters this privileged hop until the
          # head moves. Retry instead. A retry can duplicate the analysis when
          # GitHub creates the dispatch and still answers 500, which is safe by
          # construction: codeql-analysis.yml fences concurrency on the
          # analyzed snapshot with `queue: max` and no-ops a scope whose
          # analysis already exists. Only an exhausted budget is a real red
          # check, because then no unprivileged analysis was queued at all.
          attempt=1
          attempts=4
          until gh workflow run codeql-analysis.yml \
            --repo "$REPO" \
            --ref "$DEFAULT_BRANCH" \
            -f "pr_number=$PR_NUMBER" \
            -f "expected_head_sha=$EXPECTED_HEAD_SHA"
          do
            if [ "$attempt" -ge "$attempts" ]; then
              echo "::error::GitHub rejected the CodeQL dispatch for PR #$PR_NUMBER on all $attempts attempts; no unprivileged analysis was queued for $EXPECTED_HEAD_SHA."
              exit 1
            fi
            echo "::warning::GitHub rejected the CodeQL dispatch for PR #$PR_NUMBER (attempt $attempt of $attempts); retrying."
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
