name: CodeQL all branches

# Trigger-only listener. The reviewed executable implementation lives on the
# protected github-actions branch.
on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  control-plane:
    uses: lopugit/thingtime/.github/workflows/codeql-analysis.yml@github-actions
