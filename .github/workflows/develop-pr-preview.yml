name: Develop S3 PR preview

# Stable event listener only. The secret-bearing implementation and controller
# script are versioned on the protected github-actions branch. The reusable
# workflow still executes in this caller's event context, and GitHub builds only
# the exact allowlisted SHA.

on:
  pull_request_target:
    # Do not filter by base branch here: edited/closed events must still remove
    # resources after a PR is retargeted away from develop.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open same-repository PR (any base branch) to preview in the develop environment
        required: true
        type: number
      maintenance_artifact_commit:
        description: Merged main commit containing a reviewed immutable preview-maintenance artifact
        required: false
        default: ''
        type: string
      maintenance_manifest_path:
        description: Exact ops/preview-maintenance artifact manifest path at the pinned main commit
        required: false
        default: ''
        type: string
      maintenance_manifest_sha256:
        description: SHA-256 of the reviewed manifest bytes at that commit
        required: false
        default: ''
        type: string
      retirement_deployment_ids:
        description: JSON array of reviewed obsolete deployment IDs; requires pr_number 0
        required: false
        default: ''
        type: string
      retirement_dry_run:
        description: Verify the selected retirements and save a decision artifact without deleting
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [develop-pr-preview-controller]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: read
  contents: write
  deployments: write
  issues: write
  pull-requests: write

jobs:
  control-plane:
    uses: lopugit/thingtime/.github/workflows/develop-pr-preview.yml@github-actions
    with:
      # workflow_dispatch values arrive as strings, while workflow_call enforces
      # the reusable workflow's declared number type before creating any jobs.
      pr_number: ${{ fromJSON(inputs.pr_number || '0') }}
      maintenance_artifact_commit: ${{ inputs.maintenance_artifact_commit || '' }}
      maintenance_manifest_path: ${{ inputs.maintenance_manifest_path || '' }}
      maintenance_manifest_sha256: ${{ inputs.maintenance_manifest_sha256 || '' }}
      retirement_deployment_ids: ${{ inputs.retirement_deployment_ids || '' }}
      retirement_dry_run: ${{ inputs.retirement_dry_run || false }}
    secrets: inherit
