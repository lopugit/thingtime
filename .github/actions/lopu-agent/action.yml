name: Lopu agent
description: Run Thingtime's principal repository agent through a validated Claude or Codex backend.

inputs:
  backend:
    description: "Legacy compatibility input; the saved admin waterfall selects providers."
    required: false
    default: claude
  prompt:
    description: Complete Lopu task prompt.
    required: true
  cooperative-review:
    description: Allow a batch review to finish its current PR and yield safely when other fleet work is queued.
    required: false
    default: "false"
  anthropic-api-key:
    description: Anthropic API key when the Claude backend uses API authentication.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token when the Claude backend uses OAuth authentication.
    required: false
  claude-code-oauth-token-preferred:
    description: Preferred Claude Code OAuth token; capacity or credential failures continue through the existing primary and fallback slots.
    required: false
  anthropic-api-key-fallback:
    description: Secondary Anthropic API key used only after an account-capacity or credential failure.
    required: false
  claude-code-oauth-token-fallback:
    description: Secondary Claude Code OAuth token used only after an account-capacity or credential failure.
    required: false
  thingtime-ci-router-secret:
    description: Stable HMAC secret used to fetch the ordered credential waterfall from Thingtime.
    required: false
  thingtime-credential-vault-origin:
    description: Thingtime origin hosting the Lopu credential vault API.
    required: false
    default: https://thingtime.com
  openai-api-key:
    description: OpenAI Platform project key when the Codex backend is selected.
    required: false
  github-token:
    description: Repository-scoped GitHub token available to the selected backend.
    required: true
  allowed-bots:
    description: Bot actor allowlist passed to claude-code-action.
    required: false
    default: github-actions
  claude-args:
    description: Trusted, caller-validated Claude CLI arguments.
    required: false
    default: ""
  codex-model:
    description: Legacy compatibility input; ignored in favor of the saved admin model order.
    required: false
  codex-reasoning-effort:
    description: Legacy compatibility input; effort comes from the saved admin model order.
    required: false
  working-directory:
    description: Working directory passed to codex-action.
    required: false
    default: .
  sandbox:
    description: Codex filesystem sandbox mode.
    required: false
    default: danger-full-access
  safety-strategy:
    description: Codex runner hardening strategy.
    required: false
    default: drop-sudo

outputs:
  backend:
    description: Actual provider that ran, including failover.
    value: ${{ steps.execute.outputs.backend }}
  backend-label:
    description: Actual configured model and effort.
    value: ${{ steps.execute.outputs.backend-label }}
  claude-credential-slot:
    description: Selected Claude account for exact-session continuation.
    value: ${{ steps.execute.outputs.claude-credential-slot }}
  claude-credential-name:
    description: Selected Claude account label.
    value: ${{ steps.execute.outputs.claude-credential-name }}

runs:
  using: composite
  steps:
    - name: Compile the saved Thingtime model waterfall
      id: prepare
      shell: bash
      env:
        THINGTIME_CI_ROUTER_SECRET: ${{ inputs.thingtime-ci-router-secret }}
        THINGTIME_CREDENTIAL_VAULT_ORIGIN: ${{ inputs.thingtime-credential-vault-origin }}
        LOPU_LEGACY_CLAUDE_TOKEN_PREFERRED: ${{ inputs.claude-code-oauth-token-preferred }}
        LOPU_LEGACY_CLAUDE_TOKEN_PRIMARY: ${{ inputs.claude-code-oauth-token }}
        LOPU_LEGACY_CLAUDE_TOKEN_FALLBACK: ${{ inputs.claude-code-oauth-token-fallback }}
        LOPU_SANDBOX: ${{ inputs.sandbox }}
        LOPU_SAFETY_STRATEGY: ${{ inputs.safety-strategy }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/lopu-model-waterfall.mjs" prepare

    - name: Install cooperative review checkpoints
      id: handoff
      if: inputs.cooperative-review == 'true'
      shell: bash
      env:
        LOPU_PROMPT: ${{ inputs.prompt }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/lopu-cooperative-review.mjs" initialize

    - name: Execute the exact configured provider and model order
      id: execute
      continue-on-error: true
      uses: ./.lopu-waterfall-action
      with:
        github-token: ${{ inputs.github-token }}
        allowed-bots: ${{ inputs.allowed-bots }}
        claude-args: ${{ inputs.claude-args }}
        working-directory: ${{ inputs.working-directory }}
        sandbox: ${{ inputs.sandbox }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        prompt: |
          ${{ steps.handoff.outputs.prompt || inputs.prompt }}

          Inspect the current workspace before continuing. Earlier configured
          attempts may have changed files. Preserve completed work and verify
          outcomes before repeating operations with external side effects.

    - name: Remove the generated action
      if: always() && steps.prepare.outputs.prepared == 'true'
      shell: bash
      run: |
        node -e 'require("node:fs").rmSync(require("node:path").join(process.env.GITHUB_WORKSPACE, ".lopu-waterfall-action"), { recursive: true, force: true })'

    - name: Require successful configured execution
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.execute.outcome }}
      run: test "$OUTCOME" = success
