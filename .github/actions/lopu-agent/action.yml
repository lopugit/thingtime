name: Lopu agent
description: Run Thingtime's principal repository agent through a validated Claude or Codex backend.

inputs:
  backend:
    description: "Closed provider selector: claude or codex."
    required: false
    default: claude
  prompt:
    description: Complete Lopu task prompt.
    required: true
  cooperative-review:
    description: Allow a batch review to finish its current PR and yield safely when other fleet work is queued.
    required: false
    default: "false"
  anthropic-api-key:
    description: Anthropic API key when the Claude backend uses API authentication.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token when the Claude backend uses OAuth authentication.
    required: false
  claude-code-oauth-token-preferred:
    description: Preferred Claude Code OAuth token; capacity or credential failures continue through the existing primary and fallback slots.
    required: false
  anthropic-api-key-fallback:
    description: Secondary Anthropic API key used only after an account-capacity or credential failure.
    required: false
  claude-code-oauth-token-fallback:
    description: Secondary Claude Code OAuth token used only after an account-capacity or credential failure.
    required: false
  thingtime-ci-router-secret:
    description: Stable HMAC secret used to fetch the ordered credential waterfall from Thingtime.
    required: false
  thingtime-credential-vault-origin:
    description: Thingtime origin hosting the Lopu credential vault API.
    required: false
    default: https://thingtime.com
  openai-api-key:
    description: OpenAI Platform project key when the Codex backend is selected.
    required: false
  github-token:
    description: Repository-scoped GitHub token available to the selected backend.
    required: true
  allowed-bots:
    description: Bot actor allowlist passed to claude-code-action.
    required: false
    default: github-actions
  claude-args:
    description: Trusted, caller-validated Claude CLI arguments.
    required: false
    default: ""
  codex-model:
    description: Closed Codex model selector.
    required: false
    default: gpt-5.6-terra
  codex-reasoning-effort:
    description: Closed Codex reasoning-effort selector.
    required: false
    default: xhigh
  working-directory:
    description: Working directory passed to codex-action.
    required: false
    default: .
  sandbox:
    description: Codex filesystem sandbox mode.
    required: false
    default: danger-full-access
  safety-strategy:
    description: Codex runner hardening strategy.
    required: false
    default: drop-sudo

outputs:
  backend:
    description: Validated backend that ran.
    value: ${{ steps.config.outputs.backend }}
  backend-label:
    description: Human-readable provider and model label.
    value: ${{ steps.config.outputs.backend_label }}
  claude-credential-slot:
    description: Safe vault position for the Claude credential that produced the current execution output.
    value: ${{ steps.claude_result.outputs.credential_slot }}
  claude-credential-name:
    description: Non-sensitive admin label for the Claude credential that produced the current execution output.
    value: ${{ steps.claude_result.outputs.credential_name }}

runs:
  using: composite
  steps:
    - name: Fetch the ordered Claude credential waterfall
      id: credentials
      if: inputs.backend == 'claude'
      shell: bash
      env:
        THINGTIME_CI_ROUTER_SECRET: ${{ inputs.thingtime-ci-router-secret }}
        THINGTIME_CREDENTIAL_VAULT_ORIGIN: ${{ inputs.thingtime-credential-vault-origin }}
        LOPU_LEGACY_CLAUDE_TOKEN_PREFERRED: ${{ inputs.claude-code-oauth-token-preferred }}
        LOPU_LEGACY_CLAUDE_TOKEN_PRIMARY: ${{ inputs.claude-code-oauth-token }}
        LOPU_LEGACY_CLAUDE_TOKEN_FALLBACK: ${{ inputs.claude-code-oauth-token-fallback }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/lopu-credential-vault.mjs"

    - name: Validate the Lopu backend
      id: config
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        CODEX_MODEL: ${{ inputs.codex-model }}
        CODEX_REASONING_EFFORT: ${{ inputs.codex-reasoning-effort }}
        CODEX_SANDBOX: ${{ inputs.sandbox }}
        CODEX_SAFETY_STRATEGY: ${{ inputs.safety-strategy }}
      run: |
        set -euo pipefail
        case "$BACKEND" in
          claude)
            [ "${LOPU_CLAUDE_CREDENTIAL_COUNT:-0}" -ge 1 ] || { echo "::error::Lopu's Claude backend requires an enabled Thingtime vault credential."; exit 1; }
            for slot in $(seq 1 8); do
              token_var="LOPU_CLAUDE_TOKEN_$slot"
              available=false
              [ -n "${!token_var:-}" ] && available=true
              echo "claude_${slot}_available=$available" >>"$GITHUB_OUTPUT"
            done
            backend_label="Claude Code"
            ;;
          codex)
            [ -n "${OPENAI_API_KEY:-}" ] || {
              echo "::error::Lopu's Codex backend requires an OpenAI Platform project key in OPENAI_API_KEY."
              exit 1
            }
            case "$CODEX_MODEL" in
              gpt-5.6-terra) model_label="GPT-5.6 Terra" ;;
              gpt-5.6-sol) model_label="GPT-5.6 Sol" ;;
              *) echo "::error::Unsupported Lopu Codex model: $CODEX_MODEL"; exit 1 ;;
            esac
            case "$CODEX_REASONING_EFFORT" in
              medium) effort_label="Medium" ;;
              high) effort_label="High" ;;
              xhigh) effort_label="Extra High" ;;
              max) effort_label="Maximum" ;;
              *) echo "::error::Unsupported Lopu Codex reasoning effort: $CODEX_REASONING_EFFORT"; exit 1 ;;
            esac
            case "$CODEX_SANDBOX" in
              read-only|workspace-write|danger-full-access) ;;
              *) echo "::error::Unsupported Lopu Codex sandbox: $CODEX_SANDBOX"; exit 1 ;;
            esac
            [ "$CODEX_SAFETY_STRATEGY" = drop-sudo ] || {
              echo "::error::Lopu Codex must use the drop-sudo runner strategy."
              exit 1
            }
            backend_label="OpenAI API $model_label $effort_label"
            ;;
          *)
            echo "::error::Unsupported Lopu backend: $BACKEND"
            exit 1
            ;;
        esac
        echo "Lopu backend: $BACKEND ($backend_label)"
        echo "backend=$BACKEND" >>"$GITHUB_OUTPUT"
        echo "backend_label=$backend_label" >>"$GITHUB_OUTPUT"

    - name: Install cooperative review checkpoints
      id: handoff
      if: inputs.cooperative-review == 'true'
      shell: bash
      env:
        LOPU_PROMPT: ${{ inputs.prompt }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/lopu-cooperative-review.mjs" initialize

    - name: Run Lopu with Claude credential 1
      id: claude_1
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_1_available == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_1 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 1 failure
      id: claude_1_failure
      if: >-
        steps.config.outputs.backend == 'claude'
        && steps.claude_1.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_1.outputs.execution_file }}
      run: |
        set -euo pipefail
        execution_file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
        node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" \
          "$execution_file" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 2
      id: claude_2
      if: >-
        steps.config.outputs.backend == 'claude'
        && steps.config.outputs.claude_2_available == 'true'
        && steps.claude_1.outcome == 'failure'
        && steps.claude_1_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_2 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 2 failure
      id: claude_2_failure
      if: >-
        steps.config.outputs.backend == 'claude'
        && steps.claude_2.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_2.outputs.execution_file }}
      run: |
        set -euo pipefail
        execution_file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
        node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" \
          "$execution_file" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 3
      id: claude_3
      if: >-
        steps.config.outputs.backend == 'claude'
        && steps.config.outputs.claude_3_available == 'true'
        && steps.claude_2.outcome == 'failure'
        && steps.claude_2_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_3 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 3 failure
      id: claude_3_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_3.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_3.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 4
      id: claude_4
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_4_available == 'true' && steps.claude_3.outcome == 'failure' && steps.claude_3_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_4 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 4 failure
      id: claude_4_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_4.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_4.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 5
      id: claude_5
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_5_available == 'true' && steps.claude_4.outcome == 'failure' && steps.claude_4_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_5 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 5 failure
      id: claude_5_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_5.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_5.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 6
      id: claude_6
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_6_available == 'true' && steps.claude_5.outcome == 'failure' && steps.claude_5_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_6 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 6 failure
      id: claude_6_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_6.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_6.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 7
      id: claude_7
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_7_available == 'true' && steps.claude_6.outcome == 'failure' && steps.claude_6_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_7 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 7 failure
      id: claude_7_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_7.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_7.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Run Lopu with Claude credential 8
      id: claude_8
      if: steps.config.outputs.backend == 'claude' && steps.config.outputs.claude_8_available == 'true' && steps.claude_7.outcome == 'failure' && steps.claude_7_failure.outputs.retryable == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1
      with:
        claude_code_oauth_token: ${{ env.LOPU_CLAUDE_TOKEN_8 }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
        settings: ${{ steps.handoff.outputs.settings || '' }}
        claude_args: ${{ inputs.claude-args }}

    - name: Classify Claude credential 8 failure
      id: claude_8_failure
      if: steps.config.outputs.backend == 'claude' && steps.claude_8.outcome == 'failure'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_8.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/classify-claude-credential-failure.mjs" "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" >>"$GITHUB_OUTPUT"

    - name: Record the Claude credential slot and outcome
      id: claude_result
      if: always() && steps.config.outputs.backend == 'claude'
      shell: bash
      env:
        OUTCOME_1: ${{ steps.claude_1.outcome }}
        OUTCOME_2: ${{ steps.claude_2.outcome }}
        OUTCOME_3: ${{ steps.claude_3.outcome }}
        OUTCOME_4: ${{ steps.claude_4.outcome }}
        OUTCOME_5: ${{ steps.claude_5.outcome }}
        OUTCOME_6: ${{ steps.claude_6.outcome }}
        OUTCOME_7: ${{ steps.claude_7.outcome }}
        OUTCOME_8: ${{ steps.claude_8.outcome }}
      run: |
        set -euo pipefail
        successful=false
        selected=0
        for slot in $(seq 1 8); do
          outcome_var="OUTCOME_$slot"
          outcome="${!outcome_var:-}"
          [ "$outcome" = failure ] && selected="$slot"
          if [ "$outcome" = success ]; then selected="$slot"; successful=true; break; fi
        done
        [ "$selected" -ge 1 ] || { echo '::error::No Claude credential attempt ran.'; exit 1; }
        credential_slot="vault-$selected"
        name_var="LOPU_CLAUDE_NAME_$selected"
        token_var="LOPU_CLAUDE_TOKEN_$selected"
        credential_name="${!name_var}"
        printf '%s\n' "$credential_slot" >"$RUNNER_TEMP/lopu-claude-credential-slot"
        printf '%s' "${!token_var}" >"$RUNNER_TEMP/lopu-claude-credential-token"
        chmod 600 "$RUNNER_TEMP/lopu-claude-credential-token"
        echo "credential_slot=$credential_slot" >>"$GITHUB_OUTPUT"
        echo "credential_name=$credential_name" >>"$GITHUB_OUTPUT"
        echo "successful=$successful" >>"$GITHUB_OUTPUT"
        echo "::notice::Lopu used Claude credential $selected ($credential_name)."

    - name: Require a successful Claude execution
      if: always() && steps.config.outputs.backend == 'claude'
      shell: bash
      env:
        SUCCESSFUL: ${{ steps.claude_result.outputs.successful }}
      run: |
        set -euo pipefail
        if [ "$SUCCESSFUL" != true ]; then
          echo "::error::Lopu's Claude execution did not complete with any enabled vault credential."
          exit 1
        fi

    - name: Run Lopu with Codex
      if: steps.config.outputs.backend == 'codex'
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        working-directory: ${{ inputs.working-directory }}
        sandbox: ${{ inputs.sandbox }}
        safety-strategy: ${{ inputs.safety-strategy }}
        model: ${{ inputs.codex-model }}
        effort: ${{ inputs.codex-reasoning-effort }}
        allow-bots: true
        allow-bot-users: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.handoff.outputs.prompt || inputs.prompt }}
