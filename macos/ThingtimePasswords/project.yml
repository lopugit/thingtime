name: ThingtimePasswords
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  ThingtimePasswordCore:
    path: ../../apple/Passwords
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_DEBUG_DYLIB: false
    MARKETING_VERSION: "1.0.10"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    THINGTIME_PASSWORD_HOST_BUNDLE_ID: com.thingtime.passwords
    THINGTIME_PASSWORD_PROVIDER_BUNDLE_ID: com.thingtime.passwords.provider
    THINGTIME_PASSWORD_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.thingtime.passwords
    THINGTIME_PASSWORD_URL_SCHEME: otpauth
    THINGTIME_PASSWORD_DEVELOPMENT_HOST: ""
    THINGTIME_WEB_URL: https://thingtime.com
targets:
  ThingtimePasswords:
    type: application
    platform: macOS
    sources:
      - PasswordApp.swift
      - PasswordHostIdentity.swift
      - PasswordSetupEditor.swift
      - path: ../../apple/Passwords/Host/AuthenticatorSetupBridge.swift
      - path: ../../apple/Passwords/Host/PasswordApplicationMenu.swift
      - path: Resources
        excludes: ["*.plist", "*.entitlements", "Thingtime.icns"]
        buildPhase: resources
    dependencies:
      - package: ThingtimePasswordCore
      - target: ThingtimePasswordProvider
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thingtime Passwords
        CFBundleName: Thingtime
        CFBundleIconFile: Thingtime.icns
        CFBundleIconName: Thingtime
        ThingtimePasswordKeychainGroup: $(THINGTIME_PASSWORD_KEYCHAIN_GROUP)
        ThingtimeWebURL: $(THINGTIME_WEB_URL)
        ThingtimePasswordNotificationName: $(THINGTIME_PASSWORD_HOST_BUNDLE_ID).destination-changed
        ThingtimePasswordDevelopmentHost: $(THINGTIME_PASSWORD_DEVELOPMENT_HOST)
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: $(THINGTIME_PASSWORD_HOST_BUNDLE_ID).authenticator
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [$(THINGTIME_PASSWORD_URL_SCHEME)]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Thingtime
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_PASSWORD_HOST_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_PASSWORD_HOST_PROFILE)
        PRODUCT_NAME: Thingtime Passwords
    entitlements:
      path: Resources/Host.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups: [$(THINGTIME_PASSWORD_KEYCHAIN_GROUP)]
  ThingtimePasswordProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: ../../apple/PasswordProvider/CredentialProviderViewController.swift
      - path: Resources/ThingtimeTree.png
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ThingtimePasswordCore
    info:
      path: Resources/Extension-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thingtime
        CFBundleName: Thingtime
        CFBundleIconFile: Thingtime.icns
        CFBundleIconName: Thingtime
        ThingtimePasswordKeychainGroup: $(THINGTIME_PASSWORD_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Thingtime
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_PASSWORD_PROVIDER_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(THINGTIME_PASSWORD_PROVIDER_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    entitlements:
      path: Resources/Provider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups: [$(THINGTIME_PASSWORD_KEYCHAIN_GROUP)]
  ThingtimePasswordFixture:
    type: application
    platform: macOS
    sources:
      - PasswordFixture.swift
    dependencies:
      - package: ThingtimePasswordCore
    info:
      path: build/Fixture-Info.plist
      properties:
        CFBundleDisplayName: Thingtime Password Fixture
        ThingtimePasswordDevelopmentFixture: true
        ThingtimePasswordDevelopmentHost: $(THINGTIME_PASSWORD_DEVELOPMENT_HOST)
        ThingtimePasswordKeychainGroup: $(THINGTIME_PASSWORD_KEYCHAIN_GROUP)
        ThingtimePasswordNotificationName: $(THINGTIME_PASSWORD_HOST_BUNDLE_ID).destination-changed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THINGTIME_PASSWORD_HOST_BUNDLE_ID).fixture
        PRODUCT_NAME: Thingtime Password Fixture
        SKIP_INSTALL: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(THINGTIME_PASSWORD_FIXTURE_CONDITION)
    entitlements:
      path: build/Fixture.entitlements
      properties:
        com.apple.security.app-sandbox: true
        keychain-access-groups: [$(THINGTIME_PASSWORD_KEYCHAIN_GROUP)]

schemes:
  ThingtimePasswords:
    build:
      targets:
        ThingtimePasswords: all

  ThingtimePasswordFixture:
    build:
      targets:
        ThingtimePasswordFixture: all
